<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Live build: syncs with TalentPortal_Data.xlsx + TalentPortal_Permissions.xlsx
     through ONE Power Automate flow. Paste FLOW_URL near the bottom of this file. -->
<title>Talent Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.2.0/tabler-icons.min.css">
<!-- The XLSX library (~900 KB) is only needed by the two import dialogues, so it
     is fetched on first use instead of blocking the initial render. It was also
     being requested twice; now it loads at most once. -->
<script>
window.ensureXLSX = (function(){
  var p = null;
  return function(){
    if(typeof XLSX !== "undefined") return Promise.resolve(true);
    if(p) return p;
    p = new Promise(function(res){
      var s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
      s.onload  = function(){ res(true); };
      s.onerror = function(){ p = null; res(false); };
      document.head.appendChild(s);
    });
    return p;
  };
})();
</script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* Altudo brand palette — Brand Identity Guide 2024-25
     Primary:  Altudo Yellow #FFCA07 · Altudo Grey #343132
     Secondary greys / orange / blue / blue-green / green / purple are used only
     to differentiate data, per the guide. Link Blue #0909FF is links only. */
  --yellow:#FFCA07;--yellow-d:#E0AF00;--yellowbg:#FFF6D9;
  --ink:#343132;--ink2:#4A4749;--paper:#F5F5F4;--card:#FFFFFF;
  --line:#E4E4E2;--line2:#D1D3D4;--text:#343132;--t2:#58595B;--t3:#808285;
  --link:#0909FF;
  --jade:#006837;--jadebg:#E6F2EB;          /* Altudo Green      */
  --amber:#D18700;--amberbg:#FFF3DE;        /* Altudo Orange     */
  --rust:#D18700;--rustbg:#FFF3DE;
  --violet:#6B3293;--violetbg:#F0EAF5;      /* Altudo Purple     */
  --blue:#055C9D;--bluebg:#E4EFF8;          /* Altudo Blue       */
  --teal:#0A758F;--tealbg:#E4F1F5;          /* Altudo Blue Green */
  --r:9px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',system-ui,sans-serif;background:var(--paper);color:var(--text);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
/* Bebas Kai is the brand headline face; Bebas Neue is its freely hosted twin */
.serif{font-family:'Bebas Neue','Bebas Kai',Impact,sans-serif;letter-spacing:.055em}
.shell{display:flex;min-height:100vh}

/* sidebar */
.side{width:208px;flex:0 0 208px;background:var(--ink);color:#DDE2EA;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.09)}
.brand .mk{font-family:'Bebas Neue','Bebas Kai',sans-serif;font-size:21px;font-weight:400;letter-spacing:.075em;color:#fff;display:flex;align-items:center;gap:9px}
.brand .dot{width:8px;height:8px;border-radius:50%;background:var(--yellow)}
.brand .sb{font-size:10px;color:#7C899C;margin-top:5px;letter-spacing:.08em;text-transform:uppercase}

.rolepick{padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.09)}
.rolepick label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#6F7C90;display:block;margin-bottom:8px}
.rolerow{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.rolebtn{background:var(--ink2);border:1px solid rgba(255,255,255,.12);color:#C3CCDA;font-family:inherit;font-size:11.5px;
  padding:8px 6px;border-radius:7px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:.15s}
.rolebtn .ti{font-size:16px}
.rolebtn:hover{background:#26374F;color:#fff}
.rolebtn.on{background:var(--yellow);border-color:var(--yellow);color:#343132;font-weight:500}
.aswho{padding:12px 18px;border-bottom:1px solid rgba(255,255,255,.09)}
.aswho label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#6F7C90;display:block;margin-bottom:7px}
.aswho select{width:100%;background:var(--ink2);color:#EDF1F6;border:1px solid rgba(255,255,255,.14);border-radius:7px;padding:8px 9px;font-family:inherit;font-size:12.5px;cursor:pointer}
.aswho .m{margin-top:9px;font-size:11.5px;color:#8F9BAD;line-height:1.5}
.aswho .m b{color:#DDE2EA;font-weight:500}
.idcard{background:var(--ink2);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:11px 12px}
.idtop{display:flex;align-items:center;gap:11px}
.idav{width:38px;height:38px;flex:0 0 38px;border-radius:50%;background:var(--yellow);color:#343132;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600}
.idmeta{min-width:0;line-height:1.35;flex:1}
.idname{font-size:13.5px;font-weight:600;color:#fff;line-height:1.3;overflow-wrap:anywhere}
.idrole{font-size:11.5px;color:#B9C3D1;line-height:1.35;overflow-wrap:anywhere}
.idsub{font-size:10.5px;color:#7E8DA3;line-height:1.45;margin-top:9px;padding-top:8px;
  border-top:1px solid rgba(255,255,255,.07);overflow-wrap:anywhere}

nav{padding:12px 10px;flex:1;overflow-y:auto}
.navlab{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#5F6C80;padding:8px 8px 6px}
.idav.alt{background:rgba(255,255,255,.1);color:#DDE2EA}
.tab{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 11px;margin-bottom:2px;border:0;border-radius:7px;
  background:transparent;color:#B9C3D1;font-family:inherit;font-size:13px;cursor:pointer;transition:.15s}
.tab:hover:not(:disabled){background:rgba(255,255,255,.06);color:#fff}
.tab.on{background:#4A4749;color:#fff;font-weight:500}
.tab.on .ic{color:var(--yellow)}
.tab:disabled{opacity:.3;cursor:not-allowed}
.tab .ic{width:17px;flex:0 0 17px;text-align:center;font-size:15px;color:#7E8DA3}
.tab .lk{margin-left:auto;font-size:9px;letter-spacing:.05em;text-transform:uppercase;color:#6F7C90}
.sfoot{padding:12px 18px;border-top:1px solid rgba(255,255,255,.09);font-size:10.5px;color:#6B778A;line-height:1.5}

/* main */
main{flex:1;min-width:0;padding:clamp(14px,2.4vw,28px) clamp(14px,3vw,36px) 60px;max-width:1680px}
.lp-split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,300px);gap:18px;align-items:start}
.lp-main{min-width:0}
.lp-rail{position:sticky;top:8px;max-height:calc(100vh - 26px);overflow-y:auto;
  scrollbar-width:thin;padding-right:2px}
.lp-rail::-webkit-scrollbar{width:6px}
.lp-rail::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}
@media(max-width:1080px){.lp-split{grid-template-columns:1fr}
  .lp-rail{order:-1;position:static;max-height:none;overflow:visible}}
.impstep{display:flex;gap:12px;align-items:flex-start;margin:14px 0;padding:13px 14px;
  border:1px solid var(--line);border-radius:10px;background:#FBFBF9}
.impnum{flex:none;width:22px;height:22px;border-radius:50%;background:var(--yellow);color:var(--ink);
  font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center}
.impstep b{font-size:13px}
.impstep p{font-size:12px;color:var(--t2);margin:4px 0 9px;line-height:1.5}
.impmsg{font-size:12.5px;line-height:1.55;padding:11px 13px;border-radius:9px;margin-top:6px}
.impmsg.m-jade{background:var(--jadebg);color:var(--jade)}
.impmsg.m-amber{background:#FFF4E0;color:#8A5A12}
.impmsg.m-rust{background:var(--rustbg);color:var(--rust)}
.imperr,.impok{margin:8px 0 0;padding-left:18px;font-size:12px;line-height:1.7;
  max-height:190px;overflow-y:auto}
.imperr li{color:var(--rust)}
.impok li{color:var(--t2)}
.evprows{display:flex;flex-direction:column;gap:5px;margin-top:11px}
.evprow{display:grid;grid-template-columns:22px 1fr 46px 18px;gap:7px;align-items:center;font-size:11px}
.evprank{color:var(--t3);font-weight:600}
.evpname{color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evpbar{height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.evpbar i{display:block;height:100%;border-radius:3px}
.evpnum{text-align:right;font-weight:600;color:var(--t2);font-variant-numeric:tabular-nums}
.ibtn{width:17px;height:17px;flex:none;border-radius:50%;border:1px solid var(--line2);
  background:#fff;color:var(--t2);font-family:inherit;font-size:10.5px;font-weight:700;
  font-style:italic;line-height:1;cursor:pointer;padding:0;transition:.15s}
.ibtn:hover{border-color:var(--yellow);color:var(--ink);background:var(--yellowbg)}
.abt{padding:13px 0;border-top:1px solid var(--line)}
.abt:first-of-type{border-top:0;padding-top:6px}
.abth{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;
  color:var(--text);margin-bottom:6px}
.abth .ti{font-size:15px;color:var(--jade)}
.abt p{font-size:12.5px;color:var(--t2);line-height:1.6;margin:0 0 7px}
.abt p:last-child{margin-bottom:0}
.abtnote{color:var(--t3)!important;font-style:italic}
.evppri{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
  border-radius:50%;background:var(--jadebg);color:var(--jade);font-size:12px;font-weight:600}
.evpconcern td{background:#FDF6F3}
.evpconcern .evppri{background:var(--rustbg);color:var(--rust)}
.evpflagrow{padding:10px 0;border-top:1px solid #E9D5CD;font-size:13px}
.evpflagrow b{color:var(--text)}
.briefbody{font-size:13px;color:var(--t2);line-height:1.65;margin-top:4px;
  max-height:132px;overflow-y:auto;padding-right:4px;white-space:pre-wrap}
.briefempty{font-size:12.5px;color:var(--t3);line-height:1.6;margin-top:4px}
.evpchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.evpflaghead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.evpflag{display:flex;align-items:center;gap:6px;margin-top:9px;font-size:11px;
  color:var(--rust);background:var(--rustbg);padding:6px 9px;border-radius:7px}
/* the check-in form needs more room than a standard modal */
.prichip{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:99px;
  background:var(--violetbg);color:var(--violet);font-size:10.5px;font-weight:600;
  text-transform:none;letter-spacing:0}
.evphintwrap{display:flex;align-items:center}
.evphint{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--rust)}
.modal textarea.lowscore{border-color:#E3B4A8;background:#FDF6F3}
.evpsat{margin-top:11px}
.evpnote{font-size:11.5px;color:var(--t2);line-height:1.5;margin-top:6px}
.evpmeta{font-size:11px;color:var(--t3);margin-top:6px;line-height:1.45}
.certlist{display:flex;flex-direction:column;gap:7px;margin-top:11px}
.certrow{background:#FBFBF9;border:1px solid var(--line);border-radius:10px;padding:9px 11px;transition:.15s}
.certrow:hover{border-color:var(--yellow)}
.certrow .ctop{display:flex;align-items:flex-start;gap:9px}
.certrow .ci{font-size:16px;color:var(--jade);flex:none;margin-top:1px}
.certrow .cmeta{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.certrow .cmeta b{font-size:12.5px;font-weight:600;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.certrow .cmeta small{font-size:11px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.certrow .cact{display:flex;align-items:center;gap:6px;margin-top:7px;padding-left:25px}
.clink{display:flex;align-items:center;gap:5px;flex:1;min-width:0;font-family:inherit;font-size:11px;font-weight:500;
  background:#fff;border:1px solid var(--line);border-radius:6px;padding:4px 7px;cursor:pointer;
  color:var(--jade);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:.15s}
.clink:hover{background:var(--yellowbg);border-color:var(--yellow)}
.clink .ti{font-size:12px;flex:none}
.cnofile{display:flex;align-items:center;gap:5px;flex:1;font-size:11px;color:var(--t3)}
.cnofile .ti{font-size:12px}
.cedit{flex:none;background:#fff;border:1px solid var(--line2);border-radius:6px;padding:4px 9px;
  cursor:pointer;color:var(--t2);font-family:inherit;font-size:11px;font-weight:600;
  line-height:1.5;transition:.15s}
.cedit:hover{border-color:var(--yellow);color:var(--ink);background:var(--yellowbg)}
.ccount{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;
  padding:0 5px;border-radius:9px;background:var(--jadebg);color:var(--jade);
  font-size:11px;font-weight:600;vertical-align:middle}
.replist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.rep{display:flex;align-items:center;gap:11px;width:100%;text-align:left;cursor:pointer;
  background:#FBFBF9;border:1px solid var(--line);border-radius:10px;padding:11px 12px;
  font-family:inherit;color:var(--text);transition:.15s}
.rep:hover{border-color:var(--yellow);background:var(--yellowbg)}
.rep.off{cursor:not-allowed;opacity:.55;background:#F7F7F5}
.rep.off:hover{border-color:var(--line);background:#F7F7F5}
.rep .ri{font-size:17px;color:var(--jade);flex:none}
.rep.off .ri{color:var(--t3)}
.rep .rt{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.rep .rt b{font-size:13px;font-weight:600}
.rep .rt small{font-size:11.5px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rep .rx{font-size:14px;color:var(--t3);flex:none}
.phead{position:sticky;top:0;z-index:30;display:flex;align-items:flex-start;
  justify-content:space-between;gap:20px;flex-wrap:wrap;
  margin:calc(clamp(14px,2.4vw,28px) * -1) calc(clamp(14px,3vw,36px) * -1) 22px;
  padding:clamp(14px,2.4vw,28px) clamp(14px,3vw,36px) 14px;
  background:var(--paper);border-bottom:1px solid transparent;transition:border-color .15s,box-shadow .15s}
.phead.stuck{border-bottom-color:var(--line);box-shadow:0 6px 16px -12px rgba(15,27,45,.4)}
/* Back and Sign out are the two ends of one line: same height, same top edge */
.phead-left{display:flex;align-items:flex-start;gap:12px;min-width:0}
.phead-right{display:flex;align-items:flex-start;gap:10px;flex:none}
.phead-act{height:30px;padding:0 12px;align-self:flex-start;flex:none}
.phead .hatswitch{align-self:flex-start}
@media(max-width:900px){.phead{position:static;margin:0 0 22px;padding:0}}
.phead h1{font-family:'Bebas Neue','Bebas Kai',sans-serif;font-size:34px;font-weight:400;letter-spacing:.055em;line-height:1.1}
.phead p{color:var(--t2);font-size:13px;margin-top:4px}
.chip{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--t2);border:1px solid var(--line2);border-radius:999px;padding:5px 12px;background:#fff;white-space:nowrap}
.view{display:none}.view.on{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* cards & bits */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 16px;margin-bottom:13px}
.card h2{font-size:14px;font-weight:600;margin-bottom:3px}
.card .hint{font-size:12.5px;color:var(--t3);margin-bottom:15px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:13px;margin-bottom:13px}
.grid2 .card{margin-bottom:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:13px;margin-bottom:15px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 17px}
.kpi .l{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--t3)}
.kpi .v{font-size:27px;font-weight:600;letter-spacing:-.03em;margin:5px 0 2px}
.kpi .s{font-size:11.5px;color:var(--t3)}
.rail{height:5px;background:#EDEFEB;border-radius:3px;overflow:hidden;margin-top:10px}
.rail i{display:block;height:100%;border-radius:3px;transition:width .5s cubic-bezier(.3,1,.4,1)}
.f-jade{background:var(--jade)}.f-amber{background:var(--amber)}.f-rust{background:var(--rust)}.f-blue{background:var(--blue)}.f-violet{background:var(--violet)}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:500;letter-spacing:.02em;padding:3px 10px;border-radius:999px;white-space:nowrap}
.p-jade{background:var(--jadebg);color:#006837}.p-amber{background:var(--amberbg);color:#8A5A00}
.p-rust{background:var(--rustbg);color:#8A5A00}.p-violet{background:var(--violetbg);color:#51087E}
.p-blue{background:var(--bluebg);color:#003060}.p-grey{background:#EEEEEC;color:var(--t2)}
.p-teal{background:var(--tealbg);color:#075264}
/* Link Blue is reserved for links, per the brand guide */
a{color:var(--link)}

.kline{display:flex;align-items:center;gap:13px;padding:11px 0;border-bottom:1px solid var(--line)}
.kline:last-child{border-bottom:0}
.kline .nm{flex:1;font-size:13.5px}.kline .nm small{display:block;color:var(--t3);font-size:11.5px;margin-top:1px}
.kline .bar{flex:1 1 110px;min-width:70px;max-width:200px}
.kline .pc{flex:0 0 auto;min-width:46px;text-align:right;font-size:13px;font-weight:500;white-space:nowrap}

table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--t3);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line)}
table.tbl td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.tbl tr:last-child td{border-bottom:0}
table.tbl tr.clk{cursor:pointer}table.tbl tr.clk:hover{background:#FAFBF9}
.av{width:30px;height:30px;border-radius:50%;background:var(--violetbg);color:#3F3376;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex:0 0 30px}
.who{display:flex;align-items:center;gap:9px}

.btn{font-family:inherit;font-size:13px;padding:8px 14px;border-radius:8px;border:1px solid var(--line2);background:#fff;color:var(--text);cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:6px}
/* shared filter control — matches .btn metrics so toolbars line up */
.inp{font-family:inherit;font-size:13px;padding:8px 11px;border-radius:8px;border:1px solid var(--line2);background:#fff;color:var(--text);outline:none;transition:.15s}
.inp:focus{border-color:var(--yellow-d);box-shadow:0 0 0 3px rgba(255,202,7,.22)}
.inp::placeholder{color:var(--t3)}
.btn:hover{background:#FAFBF9;border-color:var(--t3)}
.btn.pri{background:var(--yellow);color:var(--ink);border-color:var(--yellow);font-weight:500}
.btn.pri:hover{background:var(--yellow-d);border-color:var(--yellow-d)}
.btn.jade{background:var(--jade);color:#fff;border-color:var(--jade)}.btn.jade:hover{opacity:.9}
.btn.rust{background:#fff;color:var(--rust);border-color:var(--rust)}.btn.rust:hover{background:var(--rustbg)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{font-size:12px;padding:5px 10px}

.empty{text-align:center;padding:46px 24px;border:1px dashed var(--line2);border-radius:12px;background:#FBFBF9}
.empty .ei{font-size:24px;color:var(--t3);margin-bottom:10px}
.empty h3{font-size:15px;font-weight:600;margin-bottom:5px}.empty p{font-size:13px;color:var(--t2);max-width:400px;margin:0 auto}

.note{font-size:12.5px;color:var(--t2);background:#FBFBF9;border:1px solid var(--line);border-radius:8px;padding:11px 13px;line-height:1.55}
.note.warn{background:var(--amberbg);border-color:#EAD9A8;color:#6B4A08}
.dl{display:grid;grid-template-columns:150px 1fr;gap:8px 16px;font-size:13.5px}
.dl dt{color:var(--t3);font-size:12.5px}.dl dd{font-weight:500}

/* 9box */
.box9{display:grid;grid-template-columns:24px repeat(3,1fr);grid-template-rows:repeat(3,minmax(60px,74px)) 24px;gap:5px;max-width:520px;width:100%}
.b9{border-radius:7px;padding:8px 9px;display:flex;flex-direction:column;justify-content:space-between;font-size:11px;line-height:1.3;border:1px solid transparent}
.b9 .t{font-weight:500}.b9 .c{font-size:10px;color:var(--t3)}
.b9.hit{border-color:var(--ink);background:var(--ink)!important}.b9.hit .t{color:#fff}.b9.hit .c{color:#8FD9CA}
.axl{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);display:flex;align-items:center;justify-content:center;grid-row:1/4}
.axb{grid-column:2/5;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);display:flex;align-items:center;justify-content:center}

/* swot */
.swot{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.sq{border-radius:10px;padding:14px 16px;border:1px solid var(--line)}
.sq h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:9px;font-weight:600}
.sq ul{list-style:none}.sq li{font-size:12.5px;padding:4px 0 4px 14px;position:relative;line-height:1.45}
.sq li:before{content:"";position:absolute;left:0;top:10px;width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.5}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(15,27,45,.45);display:none;z-index:50;
  padding:24px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal-bg.on{display:flex}
.modal{background:#fff;border-radius:14px;width:100%;max-width:520px;padding:22px 24px;margin:auto;
  box-shadow:0 18px 44px rgba(15,27,45,.18);animation:pop .18s ease}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.modal h3{font-size:16px;font-weight:600;margin-bottom:4px}
.modal .sub{font-size:12.5px;color:var(--t3);margin-bottom:16px}
.modal label{font-size:12px;color:var(--t2);display:block;margin:12px 0 5px;font-weight:500}
.modal input[type=range]{width:100%}
.modal textarea,.modal input[type=text]{width:100%;font-family:inherit;font-size:13px;padding:9px 11px;border:1px solid var(--line2);border-radius:8px;resize:vertical}
.modal textarea:focus,.modal input:focus{outline:2px solid var(--jade);outline-offset:1px;border-color:var(--jade)}
.modal .foot{display:flex;gap:9px;justify-content:flex-end;margin-top:20px}

.timeline{list-style:none;margin-top:6px}
.timeline li{position:relative;padding:0 0 14px 20px;border-left:2px solid var(--line);margin-left:5px}
.timeline li:last-child{border-left-color:transparent;padding-bottom:0}
.timeline li:before{content:"";position:absolute;left:-6px;top:2px;width:10px;height:10px;border-radius:50%;background:var(--jade);border:2px solid #fff}
.timeline .tt{font-size:12.5px;font-weight:500}
.timeline .td{font-size:11.5px;color:var(--t3);margin-top:1px}
.timeline .tx{font-size:12.5px;color:var(--t2);margin-top:3px;line-height:1.5}

.flag{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#7A4E06;background:var(--amberbg);padding:3px 9px;border-radius:6px}
.badge-n{display:inline-block;min-width:18px;text-align:center;font-size:10px;font-weight:600;background:var(--rust);color:#fff;border-radius:9px;padding:1px 6px;margin-left:6px}
:focus-visible{outline:2px solid var(--jade);outline-offset:2px}

/* login screen */
.loginwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ink);padding:24px}
.loginbox{background:#fff;border-radius:16px;width:100%;max-width:400px;padding:32px 30px;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.lb-brand{font-family:'Bebas Neue','Bebas Kai',sans-serif;font-size:27px;font-weight:400;letter-spacing:.075em;color:var(--ink);display:flex;align-items:center;gap:9px}
.lb-brand .dot{width:9px;height:9px;border-radius:50%;background:var(--yellow)}
.lb-sub{font-size:13px;color:var(--t2);margin:5px 0 24px}
.lb-lab{font-size:12px;color:var(--t2);font-weight:500;display:block;margin-bottom:6px}
.lb-input{width:100%;font-family:inherit;font-size:14px;padding:11px 13px;border:1px solid var(--line2);border-radius:9px}
.lb-input:focus{outline:2px solid var(--jade);outline-offset:1px;border-color:var(--jade)}
.lb-btn{width:100%;margin-top:16px;font-family:inherit;font-size:14px;font-weight:500;padding:11px;border:0;border-radius:9px;background:var(--yellow);color:var(--ink);cursor:pointer;transition:.15s}
.lb-btn:hover{background:var(--yellow-d)}
.lb-err{color:var(--rust);font-size:12.5px;margin-top:10px;min-height:16px}
.lb-demo{margin-top:22px;padding-top:20px;border-top:1px solid var(--line)}
.lb-demo-lab{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--t3);margin-bottom:10px}
.lb-chip{display:flex;align-items:center;gap:8px;width:100%;text-align:left;font-family:'IBM Plex Mono',monospace;font-size:12.5px;
  padding:9px 12px;margin-bottom:6px;border:1px solid var(--line);border-radius:8px;background:#FBFBF9;color:var(--text);cursor:pointer;transition:.15s}
.lb-chip:hover{background:var(--yellowbg);border-color:var(--yellow)}
.lb-chip .ti{font-size:15px;color:var(--jade)}
.lb-note{font-size:11.5px;color:var(--t3);margin-top:8px;font-style:italic}
/* sits in the light page header now, not the dark sidebar */
.signout{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line2);
  color:var(--t2);font-family:inherit;font-size:12px;padding:7px 12px;border-radius:7px;cursor:pointer;transition:.15s}
.signout:hover{border-color:var(--rust,#C8553D);color:var(--rust,#C8553D)}
#acctLine b{color:#DDE2EA;font-weight:500}

/* toggle switch */
.switch{position:relative;display:inline-block;width:42px;height:24px;flex:0 0 42px}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch .track{position:absolute;inset:0;background:#CBCFC8;border-radius:24px;transition:.2s;cursor:pointer}
.switch .track:before{content:"";position:absolute;height:18px;width:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked + .track{background:var(--jade)}
.switch input:checked + .track:before{transform:translateX(18px)}
.switch input:focus-visible + .track{outline:2px solid var(--jade);outline-offset:2px}

/* hover info tooltip */
.info{position:relative;display:inline-flex;cursor:help;color:var(--t3);margin-left:6px;vertical-align:0}
.info .ti{font-size:15px}
.info:hover,.info:focus{color:var(--jade)}
.info .tip{position:absolute;left:50%;top:calc(100% + 8px);transform:translateX(-50%);width:min(400px,calc(100vw - 34px));max-height:min(60vh,460px);overflow-y:auto;max-width:78vw;
  background:var(--ink);color:#E7ECF3;font-size:12px;line-height:1.6;font-weight:400;padding:14px 15px;border-radius:10px;
  box-shadow:0 12px 34px rgba(0,0,0,.28);opacity:0;visibility:hidden;transition:.15s;z-index:70;text-align:left}
.info .tip:before{content:"";position:absolute;left:50%;top:-6px;transform:translateX(-50%) rotate(45deg);width:12px;height:12px;background:var(--ink)}
.info .tip b{color:#fff}
.info:hover .tip,.info:focus .tip{opacity:1;visibility:visible}
.info-btn{border:1px solid var(--line2);border-radius:8px;padding:5px 10px;font-size:12px;color:var(--text);background:#fff;align-items:center;gap:5px;margin-left:0}
.info-btn:hover,.info-btn:focus{background:var(--yellowbg);border-color:var(--yellow);color:var(--ink)}
.info-btn .tip{font-size:12px;font-weight:400}
.modal input[type=date]{width:100%;font-family:inherit;font-size:13px;padding:9px 11px;border:1px solid var(--line2);border-radius:8px}
.iconbtn{border:1px solid var(--line2);background:#fff;border-radius:7px;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--t2);flex:0 0 30px;transition:.15s}
.iconbtn:hover{background:var(--yellowbg);border-color:var(--yellow);color:var(--ink)}
.iconbtn .ti{font-size:15px}

/* permission matrix rows */
.permhead{display:grid;grid-template-columns:1fr 84px 84px;gap:8px;padding:6px 0 8px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--t3);border-bottom:1px solid var(--line)}
.permhead span:not(:first-child){text-align:center}
.permrow{display:grid;grid-template-columns:1fr 84px 84px;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.permrow:last-child{border-bottom:0}
.permrow.sub{background:#FBFBF9}
.permlabel{font-size:13px;font-weight:500}
.permrow.sub .permlabel{font-size:12.5px;font-weight:400;color:var(--t2);padding-left:6px}
.subarrow{color:var(--t3);margin-right:6px}
.permtoggle{display:flex;flex-direction:column;align-items:center;gap:3px}
.permcap{font-size:9px;letter-spacing:.04em;text-transform:uppercase;color:var(--t3)}
@media(max-width:600px){.permhead,.permrow{grid-template-columns:1fr 64px 64px}}
/* 4-toggle rows (employee + mentor) */
.permhead4{display:grid;grid-template-columns:1fr 70px 70px 70px 70px;gap:6px;padding:6px 0 6px;font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--t3)}
.permhead4 span:not(:first-child){text-align:center}
.permhead4 .colgrp{color:var(--jade);font-weight:600;border-bottom:1px solid var(--line);padding-bottom:4px}
.permhead4.sub2{border-bottom:1px solid var(--line);padding-bottom:8px}
.permrow4{display:grid;grid-template-columns:1fr 70px 70px 70px 70px;gap:6px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.permrow4:last-child{border-bottom:0}
.permrow4.sub{background:#FBFBF9}
.permrow4.sub .permlabel{font-size:12.5px;font-weight:400;color:var(--t2);padding-left:6px}
.permrow4 .permtoggle{align-items:center}
@media(max-width:640px){.permhead4,.permrow4{grid-template-columns:1fr 48px 48px 48px 48px;gap:3px}}
.req{color:var(--rust);font-weight:600;margin-left:2px}
.lberr{color:var(--rust);font-size:12.5px;margin-top:10px;min-height:16px}
/* top-right "Logged in as" hat switcher */
.hatswitch{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line2);border-radius:10px;padding:7px 12px}
.hatswitch .hatlab{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--t3);white-space:nowrap}
.hatswitch select{font-family:inherit;font-size:13px;font-weight:500;padding:5px 8px;border:1px solid var(--line2);border-radius:7px;background:var(--jadebg);color:#0A5648;cursor:pointer}
.hatswitch select:focus{outline:2px solid var(--jade);outline-offset:1px}
.toast{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;padding:10px 18px;border-radius:8px;opacity:0;pointer-events:none;transition:.3s;z-index:60}
.toast.on{opacity:1}

@media(max-width:900px){
  .shell{flex-direction:column}.side{width:100%;flex:none;height:auto;position:static}
  nav{display:flex;overflow-x:auto;gap:4px;padding:10px}.navlab,.sfoot{display:none}
  .tab{white-space:nowrap;margin-bottom:0}.tab .lk{display:none}
  main{padding:20px 16px 44px}.swot{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===========================================================================
   Holding up under zoom. Browser zoom shrinks the viewport in CSS pixels, so
   everything below is the same set of rules that make the portal work on a
   small screen — they just fire earlier when someone zooms in.
   =========================================================================== */

/* long unbroken strings (URLs, credential ids, pasted titles) must never
   push a container wider than its parent */
.card, .tbl td, .tbl th, .certrow, .rep, .note, .impmsg{overflow-wrap:anywhere}

/* every data table scrolls sideways inside its card rather than overflowing it */
.tblwrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tblwrap::-webkit-scrollbar{height:7px}
.tblwrap::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}
.tblwrap > table.tbl{min-width:560px}

/* modal two-up fields collapse to one column when there isn't room */
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px}
.modal select, .modal input[type=date], .modal input[type=number], .modal input[type=file]{
  width:100%;max-width:100%;font-family:inherit;font-size:13px;padding:9px 11px;
  border:1px solid var(--line2);border-radius:8px;background:#fff}

@media(max-width:1180px){
  .lp-split{grid-template-columns:minmax(0,1fr) minmax(0,260px)}
}

/* the rail stops being a rail before the plan gets unreadable */
@media(max-width:1080px){
  .lp-split{grid-template-columns:1fr}
  .lp-rail{order:-1;position:static;max-height:none;overflow:visible}
}

/* sidebar becomes a top bar; nothing is hidden, it just re-flows */
@media(max-width:900px){
  .shell{flex-direction:column}
  .side{width:100%;flex:1 1 auto;height:auto;position:static;
        display:grid;grid-template-columns:1fr;gap:0}
  .side .brand{border-bottom:1px solid rgba(255,255,255,.08)}
  #nav{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px}
  #nav .navlab{width:100%;margin:4px 0 2px}
  #nav .tab{width:auto;margin:0;padding:8px 12px}
  .aswho{padding:10px 14px}
  .sfoot{padding:10px 14px;border-top:1px solid rgba(255,255,255,.08)}
  main{max-width:none}
}

@media(max-width:680px){
  .phead h1{font-size:22px}
  .card{padding:15px 14px}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr))}
  .modal-bg{padding:16px 10px}
  .modal{padding:18px 16px}
  .certrow .cact{padding-left:0}
  .impstep{flex-direction:column}
}

@media(max-width:460px){
  .grid2{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr}
  .btn.sm{padding:6px 9px}
  .tblwrap > table.tbl{min-width:460px}
}

/* tighter, more predictable middle column */
.btn.nowrap{white-space:nowrap;display:inline-flex}
.modal input:disabled,.modal textarea:disabled,.modal select:disabled{
  background:#F4F4F1;color:var(--t2);cursor:not-allowed;border-color:var(--line)}
.fbtxt{font-size:12px;color:var(--t2);min-width:150px;max-width:230px;line-height:1.5}
.tlcell{width:96px}
.tlrange{font-size:11.5px;line-height:1.4;color:var(--t2);white-space:nowrap;
  font-variant-numeric:tabular-nums}
.tlrange .ar{color:var(--t3);margin:0 2px}
.tbl th{white-space:nowrap;vertical-align:bottom}
.tbl th div{line-height:1.3;margin-top:2px}
/* Altudo wordmark: black on light, white on dark, degree sign always #FFC90E.
   Sized by height so the clearspace either side stays proportional. */
.altudo-mark{height:26px;width:auto;display:block;flex:none}
.altudo-mark.sm{height:21px}
.lb-brand,.mk{display:flex;align-items:center;gap:9px}
.mk .ts-word{font-size:15px;letter-spacing:.01em}
.lb-brand .ts-word{font-size:17px}
/* one action group per card header, consistent everywhere */
.hdr-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 .btn{flex:none;white-space:nowrap}
/* the row-action lane: same width and alignment on every table */
.actcell{text-align:right;white-space:nowrap;width:64px}
.actcell .btn{margin:0}
/* buttons are the same height wherever they sit */
.btn.sm{padding:6px 11px;line-height:1.45}
.btn:hover{border-color:var(--yellow);background:var(--yellowbg)}
.btn.pri:hover{background:var(--yellow-d);border-color:var(--yellow-d)}
.hatswitch,.signout{align-self:flex-start}
@media(max-width:900px){.side{width:100%;flex:1 1 auto}}
</style>

</head>

  if(!r) return "amber";

  if(s.includes("ready now")) return "jade";
  if(s.includes("6")&&s.includes("12")) return "amber";
  if(s.includes("high potential")) return "rust";
  if(s.includes("3+")||s.includes("3 +")) return "rust";

function menteesOf(mid){return DB.pairings.filter(p=>p.mentor===mid&&p.status==="Active");}
function pairingsOfMentee(eid){return DB.pairings.filter(p=>p.mentee===eid);}
function targetsOf(eid){return DB.targets.filter(t=>t.emp===eid);}
function reviewQueueFor(mid){
  const mm=new Set(menteesOf(mid).map(p=>p.mentee));
  return DB.targets.filter(t=>t.status==="Submitted for review"&&t.approver===mid&&mm.has(t.emp));
}
function subtree(rootId){
  const out=[];const stack=[rootId];
  while(stack.length){const cur=stack.pop();
    Object.values(DB.employees).forEach(e=>{if(e.mgr===cur){out.push(e.id);stack.push(e.id);}});}
  return out;
}

    employee: employees,
    mentor:   mentors.length ? mentors : employees,

/* ============ ROLE / NAV WIRING ============ */
function setRole(r){
  // switching hats always leaves a mentee's record first, or the next nav click
  // would drag ROLE back to mentor and land on the wrong page
  if(typeof _mentorReturn!=="undefined" && _mentorReturn) _mentorReturn=null;
  ROLE=r;
  document.querySelectorAll(".rolebtn").forEach(b=>b.classList.toggle("on",b.dataset.role===r));
  // Admin impersonates via ROLE_ACTORS; a real logged-in person keeps their own identity across hats.
  if(IS_ADMIN){ ACTOR=ROLE_ACTORS[r][0]; }
  else if(typeof CURRENT_EMP!=="undefined" && CURRENT_EMP){ ACTOR=CURRENT_EMP; }
  else { ACTOR=ROLE_ACTORS[r][0]; }
  TAB=NAVS[r][0][0];
  const wrap=document.getElementById("asWhoWrap");
  wrap.style.display = (r==="hr") ? "none" : "block";
  const sel=document.getElementById("asWho");
  const card=document.getElementById("asWhoCard");
  if(IS_ADMIN){
    // admin: real identity switcher via dropdown
    sel.style.display="block"; card.style.display="none";
    sel.innerHTML="";
    ROLE_ACTORS[r].forEach(id=>{const o=document.createElement("option");o.value=id;o.textContent=nm(id)+" — "+E(id).desig;sel.appendChild(o);});
    if(ACTOR && !ROLE_ACTORS[r].includes(ACTOR) && E(ACTOR)){const o=document.createElement("option");o.value=ACTOR;o.textContent=nm(ACTOR)+" — "+E(ACTOR).desig;sel.appendChild(o);}
    sel.value=ACTOR; sel.disabled=false;
    document.getElementById("asWhoLabel").textContent =
      r==="employee"?"Inspect employee":r==="mentor"?"Inspect mentor":"Inspect leader";
  }else{
    // real person: clean identity card, no dropdown
    sel.style.display="none"; card.style.display="block";
    document.getElementById("asWhoLabel").textContent="Your record";
  }
  buildNav();updateMeta();render();
  if(typeof updateBackBtn==="function") updateBackBtn();
}
function setActor(id){
  if(typeof _mentorReturn!=="undefined" && _mentorReturn) _mentorReturn=null;
  ACTOR=id;TAB=NAVS[ROLE][0][0];buildNav();updateMeta();render();
  if(typeof updateBackBtn==="function") updateBackBtn();
}
function buildNav(){
  const nav=document.getElementById("nav");
  let h=`<div class="navlab">${ROLE==="hr"?"Administration":ROLE==="leader"?"Leadership view":ROLE==="mentor"?"Mentoring":"Your record"}</div>`;
  // Admin always sees all tabs; other roles only see sections HR left visible.
  const visTabs=NAVS[ROLE].filter(([id])=>ROLE==="hr"||isVisible(id));
  // if current TAB was hidden, fall back to first visible
  if(!visTabs.some(([id])=>id===TAB)) TAB=(visTabs[0]||NAVS[ROLE][0])[0];
  visTabs.forEach(([id,label,ic])=>{
    let dis=false,badge="";
    if(ROLE==="employee"&&id==="hipot"&&!E(ACTOR).hipot) dis=true;
    if(ROLE==="mentor"&&id==="queue"){const n=reviewQueueFor(ACTOR).length;if(n)badge=`<span class="badge-n">${n}</span>`;}
    h+=`<button class="tab ${id===TAB?"on":""}" ${dis?"disabled":""} onclick="go('${id}')">
      <span class="ic ti ${ic}"></span>${label}${badge}${dis?'<span class="lk">n/a</span>':""}</button>`;
  });
  nav.innerHTML=h;
}
function updateMeta(){
  if(ROLE==="hr"){return;}
  const e=E(ACTOR); if(!e) return;
  if(IS_ADMIN){
    // admin uses the dropdown; nothing extra to render
    return;
  }
  const card=document.getElementById("asWhoCard"); if(!card) return;
  let sub2="";
  if(ROLE==="mentor") sub2=`${menteesOf(ACTOR).length} mentees`;
  else if(ROLE==="leader"){const g=leaderGrant(ACTOR);sub2=`scope: ${g.fnScope}, L${g.minLvl}+`;}
  else sub2=`${e.fn}${e.sub&&e.sub!==e.fn?" · "+e.sub:""}`;
  card.innerHTML=`<div class="idcard">
    <div class="idtop">
      <div class="idav">${initials(e.name)}</div>
      <div class="idmeta">
        <div class="idname">${e.name}</div>

/* ---------------------------------------------------------------------------
   Back navigation. No history stack, on purpose — Back always moves one level
   up, so it can never loop:
       a mentee's page  ->  the page you opened it from
       any other tab    ->  your home tab
       home             ->  button hidden
   "Home" is whatever you land on for the hat you're wearing, so it follows a
   mentor who switches to their own record and back.
   --------------------------------------------------------------------------- */
function homeTab(){
  const first = NAVS[ROLE][0][0];
  const vis = NAVS[ROLE].filter(([id]) => ROLE === "hr" || isVisible(id));
  return vis.some(([id]) => id === first) ? first : (vis[0] || NAVS[ROLE][0])[0];
}
function atHome(){
  const inMentee = (typeof _mentorReturn !== "undefined" && _mentorReturn);
  const inSub    = (typeof _subPage !== "undefined" && _subPage);
  return !inMentee && !inSub && TAB === homeTab();
}
function updateBackBtn(){
  const b = document.getElementById("backBtn");
  if(b) b.style.display = atHome() ? "none" : "inline-flex";
}
function goBack(){
  if(typeof _subPage !== "undefined" && _subPage){
    const s = _subPage; _subPage = null;
    if(s.mentee){ openMenteeLearning(s.mentee); return; }   // back to their plan
    TAB = s.from;
    buildNav(); updateMeta(); render(); updateBackBtn();
    return;
  }
  if(typeof _mentorReturn !== "undefined" && _mentorReturn){
    closeMenteeLearning();          // step out to the list you came from
    return;
  }
  TAB = homeTab();
  buildNav(); updateMeta(); render(); updateBackBtn();
}

/* Any table rendered anywhere gets a scroll container, so a wide table
   scrolls inside its card instead of pushing the page sideways. */
function wrapTables(root){
  const host = root || document.getElementById("viewHost");
  if(!host) return;
  host.querySelectorAll("table.tbl").forEach(t=>{
    const par = t.parentElement;
    if(par && par.classList.contains("tblwrap")) return;
    if(par && par.style && par.style.overflowX === "auto"){ par.classList.add("tblwrap"); return; }
    const w = document.createElement("div");
    w.className = "tblwrap";
    par.insertBefore(w, t);
    w.appendChild(t);
  });
}

function go(t){
  if(typeof _subPage !== "undefined") _subPage = null;
  // clicking any nav item leaves a mentee's page and returns you to your own seat
  if(typeof _mentorReturn !== "undefined" && _mentorReturn){
    ROLE = _mentorReturn.role; ACTOR = _mentorReturn.actor; _mentorReturn = null;
  }
  TAB = t; buildNav(); updateMeta(); render(); updateBackBtn();
}

    compliance:vCompliance

  host.innerHTML=`<div class="view on">${fn?fn():"—"}</div>`;
  wrapTables(host);
}

/* ---------------------------------------------------------------------------
   Certifications. The mentee adds their own; the mentor sees the same list
   when they open the mentee's plan.
   --------------------------------------------------------------------------- */
function certList(eid){ return (DB.certs[eid]||[]).map(normCert); }
const CRED_TYPES = ["Certification","Course","Seminar","Workshop","Conference","Webinar"];
const CRED_ICON = {Certification:"ti-certificate",Course:"ti-school",Seminar:"ti-presentation",
                   Workshop:"ti-tools",Conference:"ti-users-group",Webinar:"ti-device-laptop"};
function normCert(c){
  return { id:c.id||"", type:c.type||"Certification", name:c.name||c.n||"Untitled",
           issuer:c.issuer||"", date:c.date||"", expires:c.expires||"", cred:c.cred||"",
           hours:c.hours||"", mode:c.mode||"", fileUrl:c.fileUrl||"", fileName:c.fileName||"" };
}
function canEditCerts(){
  return isEditable("learning.certs") &&
         (IS_ADMIN || ROLE==="mentor" || ACTOR===CURRENT_EMP);
}
function certsCard(){
  if(!isVisible("learning.certs")) return "";
  const list = certList(ACTOR);
  const canAdd = canEditCerts();
  const rows = list.length ? list.map(c=>{
    const meta = [c.issuer, c.date ? fmtCertDate(c.date) : "",
                  c.hours ? c.hours+"h" : ""].filter(Boolean).join(" \u00b7 ");
    return `<div class="certrow">
      <div class="ctop">
        <span class="ti ${CRED_ICON[c.type]||"ti-certificate"} ci" title="${c.type}"></span>
        <div class="cmeta"><b title="${c.name}">${c.name}</b><small>${meta||"No details"}</small></div>
      </div>
      <div class="cact">
        ${c.fileUrl
          ? `<button class="clink" onclick="openCertFile('${c.id}')"><span class="ti ti-file-text"></span>${c.fileName||"Open file"}</button>`
          : `<span class="cnofile"><span class="ti ti-file-off"></span>No file attached</span>`}
        ${canAdd?`<button class="cedit" onclick="certForm('${c.id}')">Edit</button>`:""}
      </div>
    </div>`;}).join("")
    : `<div class="note" style="font-size:12px">Nothing recorded yet.${canAdd?" Use <b>Add</b> for a certification, course, seminar or workshop.":""}</div>`;
  return `<div class="card" style="margin-top:14px">
    <h2 style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0">
      <span style="min-width:0;overflow-wrap:anywhere">Learning &amp; credentials${list.length?` <span class="ccount">${list.length}</span>`:""}</span>
      ${canAdd?`<button class="btn sm pri nowrap" onclick="certForm(null)"><span class="ti ti-plus" style="font-size:13px"></span>Add</button>`:""}
    </h2>
    <p class="hint">Visible to your mentor.</p>
    <div class="certlist">${rows}</div></div>`;
}
function fmtCertDate(d){
  const M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const m=/^(\d{4})-(\d{2})/.exec(d);
  return m ? (M[+m[2]-1]+" "+m[1]) : d;
}
function openCertFile(id){
  const c = certList(ACTOR).find(x=>x.id===id);
  if(!c || !c.fileUrl){ toast("No file attached."); return; }
  window.open(c.fileUrl, "_blank", "noopener");
}

let CERT_FILE = null;   // File chosen in the modal, uploaded on save

      c&&c.fileName ? "Currently attached: <b>"+c.fileName+"</b>. Choosing a new file replaces it."

    <label style="margin-top:12px">\u2026or paste a link instead</label>
    <input id="ctUrl" type="text" placeholder="https://\u2026" value="${c?c.fileUrl:""}">
    <div class="foot">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn pri" id="ctSave" onclick="saveCert('${c?c.id:""}')">Save</button>
    </div>`;

function tid_label(c){ return c ? "Edit entry" : "Add to learning & credentials"; }
/* only a certification carries an expiry and a credential id */
function certTypeChanged(){
  const t = document.getElementById("ctType").value;
  const isCert = (t === "Certification");
  const show = (id,on) => { const el=document.getElementById(id); if(el) el.style.display = on?"":"none"; };
  show("ctExpWrap", isCert); show("ctCredWrap", isCert);
  const nameLab = {Certification:"Certification name",Course:"Course title",Seminar:"Seminar title",
                   Workshop:"Workshop title",Conference:"Conference name",Webinar:"Webinar title"}[t];
  const issLab  = {Certification:"Issuing body",Course:"Provider",Seminar:"Host / organiser",
                   Workshop:"Facilitator / provider",Conference:"Organiser",Webinar:"Host"}[t];
  document.getElementById("ctNameLab").textContent = nameLab;
  document.getElementById("ctIssuerLab").textContent = issLab;
  document.getElementById("ctFileLab").textContent = isCert ? "Certificate file" : "Certificate or proof of attendance";
}
function pickCertFile(inp){
  const f = inp.files && inp.files[0];
  const note = document.getElementById("ctFileNote");
  if(!f){ CERT_FILE = null; return; }
  if(f.size > 4*1024*1024){
    inp.value = ""; CERT_FILE = null;
    note.innerHTML = "That file is over 4 MB. Choose a smaller one, or paste a link instead.";
    return;
  }
  CERT_FILE = f;
  note.innerHTML = "Ready to upload: <b>"+f.name+"</b> ("+Math.round(f.size/1024)+" KB)";
}
function fileToBase64(f){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(",")[1]);
    r.onerror = rej;
    r.readAsDataURL(f);
  });
}
async function saveCert(id){
  const name = (document.getElementById("ctName").value||"").trim();
  if(!name){ toast("Give the certification a name."); return; }
  const btn = document.getElementById("ctSave");
  btn.disabled = true; btn.textContent = "Saving\u2026";
  try{
    let fileUrl  = (document.getElementById("ctUrl").value||"").trim();
    let fileName = CERT_FILE ? CERT_FILE.name : "";

    if(CERT_FILE){
      if(!SYNC_ON()){
        toast("No flow connected \u2014 saved without the file. Paste a link instead.");
        fileName = "";
      }else{
        btn.textContent = "Uploading\u2026";
        const r = await callFlow({ table:"CERT_FILE", key:ACTOR,
          fields:{ fileName:CERT_FILE.name, fileContent: await fileToBase64(CERT_FILE) } });
        if(!r || !r.url) throw new Error("upload returned no url");
        fileUrl = r.url;
      }
    }

    const rec = { id: id || ("CT-" + Date.now().toString(36).slice(-5)
                     + Math.floor(Math.random()*1296).toString(36).padStart(2,"0")),
      type:document.getElementById("ctType").value||"Certification",
      name, issuer:(document.getElementById("ctIssuer").value||"").trim(),
      date:document.getElementById("ctDate").value||"",
      expires:(document.getElementById("ctExp")||{}).value||"",
      cred:((document.getElementById("ctCred")||{}).value||"").trim(),
      hours:(document.getElementById("ctHours").value||"").trim(),
      mode:document.getElementById("ctMode").value||"",
      fileUrl, fileName };

    if(!DB.certs[ACTOR]) DB.certs[ACTOR] = [];
    const list = DB.certs[ACTOR];
    const at = list.findIndex(x=>x.id===rec.id);
    if(at>=0) list[at] = rec; else list.push(rec);

    laLog(ACTOR, ACTOR, id?"edited":"created", rec.id, (id?"Updated":"Added")+" certification: "+name);
    saveToExcel(id ? "Certifications" : "CertificationsNew", rec.id, {
      CertID:rec.id, EmployeeID:ACTOR, EntryType:rec.type, CertName:rec.name, Issuer:rec.issuer,
      CompletedOn:rec.date, ExpiresOn:rec.expires, CredentialID:rec.cred,
      DurationHours:rec.hours, Mode:rec.mode,
      FileURL:rec.fileUrl, FileName:rec.fileName,
      AddedBy:CURRENT_EMP||ACTOR, AddedOn:today()
    }, {changeType: id?"Updated":"Created"});

    closeModal(); render(); toast("Saved");
  }catch(e){
    console.error("[cert] save failed", e);
    toast("Couldn't upload the file. Try again, or paste a link.");
  }finally{
    btn.disabled = false; btn.textContent = "Save";
  }
}

/* A comment is mandatory whenever satisfaction is 6 or below, whatever the rank. */
const evpNeedsComment = sat => sat !== undefined && sat !== null && sat !== 0 && sat <= 6;
/* "Worth a conversation": important to them AND rated low. */
const evpIsConcern = (rank, sat) => rank >= 1 && rank <= 4 && sat <= 6;

function evpDue(){
  const c = DB.evpCycle; if(!c) return null;
  const due = new Date(c.nextDue + "T00:00:00");
  const days = Math.round((due - new Date()) / 86400000);
  return { due, days, overdue: days < 0 };
}
function evpConcerns(r){
  if(!r || !r.ranks) return [];
  return EVP_PILLARS.filter(p => evpIsConcern(r.ranks[p.k], r.sat[p.k]));
}

    </div>`;

/* A score of 6 or below makes the comment mandatory — flag it as they pick,
   without redrawing the form and losing what they were typing. */
function evpSatChanged(k){
  const s   = Number(document.getElementById("evS_"+k).value);
  const low = evpNeedsComment(s);
  const hint = document.getElementById("evH_"+k);
  const ta   = document.getElementById("evC_"+k);
  if(hint) hint.style.display = low ? "" : "none";
  if(ta){
    ta.classList.toggle("lowscore", low);
    ta.placeholder = low ? "What's going on here? What would help?" : "Comment (optional)";
  }
}

function saveEvp(){
  const prev = (DB.evpResponse||{})[ACTOR] || {ranks:{},sat:{},comments:{}};
  const sat={}, comments={}, errs=[];
  EVP_PILLARS.forEach(p=>{
    const v = Number((document.getElementById("evS_"+p.k)||{}).value);
    if(v) sat[p.k]=v;
    const c = String((document.getElementById("evC_"+p.k)||{}).value||"").trim();
    if(c) comments[p.k]=c;
  });
  EVP_PILLARS.forEach(p=>{ if(sat[p.k]===undefined) errs.push("Set a satisfaction score for "+p.name+"."); });
  EVP_PILLARS.forEach(p=>{
    if(evpNeedsComment(sat[p.k]) && !comments[p.k])
      errs.push("A comment is required for "+p.name+" \u2014 the score is 6 or below.");
  });
  if(errs.length){
    document.getElementById("evErr").innerHTML = errs.map(e=>`<div>${e}</div>`).join("");
    return;
  }

  /* rank is never touched here — it comes from the survey */
  const rec = { ranks:Object.assign({},prev.ranks), sat, comments, on: today() };

  let touched = 0;
  EVP_PILLARS.forEach(p=>{
    const os = prev.sat[p.k], ns = sat[p.k];
    if(os !== ns){
      evpLog(ACTOR, "edited", p.name, `Satisfaction: ${os===undefined?"\u2014":os+"/10"} \u2192 ${ns}/10`);
      touched++;
    }
    const oc = String(prev.comments[p.k]||""), nc = String(comments[p.k]||"");
    if(oc !== nc){
      evpLog(ACTOR, "edited", p.name,
        nc ? (oc?`Comment updated: "${nc}"`:`Comment added: "${nc}"`) : "Comment removed");
      touched++;
    }
  });
  if(!touched) evpLog(ACTOR, "submitted", DB.evpCycle.name, "Saved with no changes");
  if(!DB.evpResponse) DB.evpResponse = {};
  DB.evpResponse[ACTOR] = rec;

  /* Only satisfaction and comments are written back \u2014 rank stays as the
     survey recorded it, and identity columns are never overwritten. */
  const e = DB.employees[ACTOR] || {};
  const fields = { "Email": e.email || "", "Submitted at": today() };
  EVP_PILLARS.forEach(p=>{
    fields[p.col+" sat"]     = rec.sat[p.k];
    fields[p.col+" comment"] = rec.comments[p.k] || "";
  });
  saveToExcel("EvpResponse", e.email || ACTOR, fields, {changeType:"Updated", field:"EVP satisfaction"});

  closeModal();
  if(typeof _subPage !== "undefined" && _subPage) openEvpPage(); else render();
  toast("Saved");
}

/* The AI summary is a coaching aid for the mentor. The person it describes
   doesn't see it on their own record. */
function canSeeMentorOnly(){
  if(IS_ADMIN) return true;
  return ROLE === "mentor" && ACTOR !== CURRENT_EMP;
}
function hasAiSummary(name){ return !!((DB.docs||{})[docKey(name)]||{}).ai; }

function reportsRail(){
  const emp = DB.employees[ACTOR] || {};
  const available = REPORTS
    .filter(r => !r.mentorOnly || canSeeMentorOnly())
    .filter(r => !!String(emp[r.field]||"").trim()
              || (r.field === "f360Url"   && hasEmbedded(emp.name))
              || (r.field === "aiSummary" && hasAiSummary(emp.name)));
  /* nothing on file -> no card at all, rather than a list of locked rows */
  if(!available.length) return "";
  const rows = available.map(r => `<button class="rep" onclick="openDoc('${r.field}')">
      <span class="ti ${r.icon} ri"></span>
      <span class="rt"><b>${r.label}</b><small>${r.note}</small></span>
      <span class="ti ti-external-link rx"></span></button>`).join("");
  return `<div class="card">
    <h2 style="margin:0">Reports</h2>

  </div>`;

function openDoc(field){
  const e   = DB.employees[ACTOR] || {};
  const k   = docKey(e.name);
  const doc = (DB.docs||{})[k];

  /* Reports are plain PDFs in the docs/ folder beside this page. DB.docs is now
     just a manifest, so we already know whether a file exists — no HEAD probe,
     no base64 decode, and the window opens on the click itself so pop-up
     blockers stay happy. */
  if(field === "f360Url" && doc && doc.f360){
    openReport(k + ".pdf", "360 Feedback Report \u2014 " + e.name);
    return;
  }

  if(field === "aiSummary"){
    if(!canSeeMentorOnly()){ toast("That summary is for mentors only."); return; }
    if(doc && doc.ai){
      openReport(k + "-ai.pdf", "360 Feedback Summary \u2014 " + e.name);
      return;
    }
    toast("No AI summary on file for " + e.name + ".");
    return;
  }

  const url = String(e[field]||"").trim();
  if(!url){ toast("No report on file yet."); return; }
  window.open(url, "_blank", "noopener");
}

function openReport(file, label){
  const win = window.open("docs/" + file, "_blank", "noopener");
  if(!win) toast("Allow pop-ups to open " + label);
}

/* Reports stored inside the file rather than linked. Browsers block navigating
   straight to a data: URL, so hand the bytes over as a Blob instead. */
function openEmbedded(b64, label, mime, filename){
  try{
    const bin = atob(b64);
    const arr = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([arr], {type: mime || "application/pdf"}));
    if(filename){
      /* Word files can't render in a tab, so hand them over as a download */
      const a = document.createElement("a");
      a.href = url; a.download = filename; a.click();
      toast("Downloading " + filename);
    }else{
      const win = window.open(url, "_blank", "noopener");
      if(!win) toast("Allow pop-ups to open " + label);
    }
    setTimeout(()=>URL.revokeObjectURL(url), 120000);
  }catch(err){
    console.error("[docs] couldn't open", label, err);
    toast("Couldn't open that document.");
  }
}
/* the archive is keyed on the person's name as it appears on the file */
function docKey(name){ return String(name||"").toLowerCase().replace(/[^a-z]/g,""); }
function hasEmbedded(name){ return !!((DB.docs||{})[docKey(name)]||{}).f360; }

/* "Aug \u2013 Dec 26" inside one year, "Aug 26 \u2013 Mar 27" across two.
   Drops the repeated year in the common case. */
function fmtRange(s,e){
  if(!s) return "\u2014";
  const ys=String(s).slice(0,4), ye=String(e||"").slice(0,4);
  const ms=fmtLAMonth(s), me=e?fmtLAMonth(e):"";
  if(!e) return `${ms} ${ys.slice(2)}`;
  return ys===ye ? `${ms} <span class="ar">\u2013</span> ${me} ${ye.slice(2)}`
                 : `${ms} ${ys.slice(2)} <span class="ar">\u2013</span> ${me} ${ye.slice(2)}`;
}
function fmtLAMonth(d){
  const p=String(d).split("-"); if(p.length!==3) return d;
  const M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return M[parseInt(p[1],10)-1]||p[1];
}
function fmtLADate(d){
  if(!d) return "";
  const p=String(d).split("-"); if(p.length!==3) return d;
  const M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const mi=parseInt(p[1],10)-1;
  return `${M[mi]||p[1]} ${p[0].slice(2)}`;
}
function sweepArchived(lp){
  /* the active plan must never hold an action whose status is "Archived" —
     wherever the row came from (Excel reload, import, direct edit), move it
     into the archive before rendering */
  if(!lp) return;
  lp.archive = lp.archive || [];
  for(let i=lp.actions.length-1;i>=0;i--){
    const a=lp.actions[i];
    const st=String(a.update||"").trim().toLowerCase();
    if(st==="deleted" || st==="archived"){
      lp.actions.splice(i,1);
      a.update="Deleted";
      if(!a._archivedOn) a._archivedOn = new Date().toISOString().slice(0,16).replace("T"," ");
      lp.archive.push(a);
    }
  }
}

function dl(blob, name){
  const u = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = u; a.download = name; a.click(); URL.revokeObjectURL(u);
}

const IMP_STATUS = ["Not started","Ongoing","Achieved","On Hold"];
/* older files / rows may still say "Not relevant" — treat it as On Hold */
const normLAStatus = v => { v = String(v||"").trim(); const l=v.toLowerCase();
  if(l==="not relevant") return "On Hold";
  if(l==="completed")    return "Achieved";
  if(l==="archived")     return "Deleted";
  return v; };
const isDate = v => /^\d{4}-\d{2}-\d{2}$/.test(v) && !isNaN(Date.parse(v));

/* Excel hands dates back as serial numbers unless they were typed as text,
   so normalise both shapes before validating. */
function cellDate(v){
  if(v === undefined || v === null || v === "") return "";
  if(typeof v === "number"){
    const d = new Date(Math.round((v - 25569) * 86400 * 1000));
    return isNaN(d) ? String(v) : d.toISOString().slice(0,10);
  }
  if(v instanceof Date) return v.toISOString().slice(0,10);
  return String(v).trim();
}

async function validateImport(inp){
  const f = inp.files && inp.files[0];
  const box = document.getElementById("impResult");
  IMPORT_ROWS = null; impReady(false);
  if(!f) { box.innerHTML = ""; return; }
  if(!await ensureXLSX()){
    box.innerHTML = impMsg("rust","The Excel library didn't load. Check your connection and reopen this dialogue.");
    return;
  }
  const fr = new FileReader();
  fr.onload = e => {
    let aoa;
    try{
      const wb = XLSX.read(new Uint8Array(e.target.result), {type:"array"});
      const ws = wb.Sheets[wb.SheetNames[0]];
      aoa = XLSX.utils.sheet_to_json(ws, {header:1, defval:""});
    }catch(err){
      box.innerHTML = impMsg("rust","Couldn't read that file. Use the template, saved as .xlsx or .csv.");
      return;
    }
    const errs = [], rows = [];
    if(!aoa.length){ box.innerHTML = impMsg("rust","The file is empty."); return; }

    const head = (aoa[0]||[]).map(x=>String(x).trim());
    const missing = IMPORT_COLS.filter(c => !head.includes(c));
    if(missing.length){
      box.innerHTML = impMsg("rust","These columns are missing or renamed: <b>"+missing.join(", ")+"</b>. Download the template again.");
      return;
    }
    const ix = c => head.indexOf(c);

    for(let r=1; r<aoa.length; r++){
      const row = aoa[r]; if(!row || row.every(c=>String(c).trim()==="")) continue;
      const ln = r+1;
      const title = String(row[ix("Action title")]||"").trim();
      const band  = String(row[ix("Band")]||"").trim().replace(/[^0-9]/g,"");
      const start = cellDate(row[ix("Start date")]);
      const end   = cellDate(row[ix("End date")]);
      let   upd   = String(row[ix("Status update")]||"").trim();
      const note  = String(row[ix("Comment")]||"").trim();

      if(!title)                    errs.push(`Row ${ln}: Action title is empty.`);
      if(!["70","20","10"].includes(band)) errs.push(`Row ${ln}: Band is "${row[ix("Band")]}" — must be 70, 20 or 10.`);
      if(!isDate(start))            errs.push(`Row ${ln}: Start date "${start||"(blank)"}" isn't yyyy-mm-dd.`);
      if(!isDate(end))              errs.push(`Row ${ln}: End date "${end||"(blank)"}" isn't yyyy-mm-dd.`);
      if(isDate(start)&&isDate(end)&&end<start) errs.push(`Row ${ln}: End date is before the start date.`);
      if(!upd) upd = "Not started";
      else{
        upd = normLAStatus(upd);
        const m = IMP_STATUS.find(s=>s.toLowerCase()===upd.toLowerCase());
        if(!m) errs.push(`Row ${ln}: Status update "${upd}" isn't one of ${IMP_STATUS.join(", ")}.`);
        else upd = m;
      }
      rows.push({title, band, start, end, update:upd, comment:note});
    }

    if(!rows.length && !errs.length){
      box.innerHTML = impMsg("amber","No data rows found — did you delete the examples without adding your own?");
      return;
    }
    if(errs.length){
      box.innerHTML = impMsg("rust",
        `<b>File rejected — ${errs.length} problem${errs.length>1?"s":""} found.</b> Nothing has been imported.`) +
        `<ul class="imperr">${errs.slice(0,12).map(x=>`<li>${x}</li>`).join("")}
         ${errs.length>12?`<li>\u2026and ${errs.length-12} more.</li>`:""}</ul>`;
      return;
    }
    IMPORT_ROWS = rows;
    box.innerHTML = impMsg("jade",`<b>${rows.length} action${rows.length>1?"s":""} ready to import.</b> Nothing is saved until you press Import.`) +
      `<ul class="impok">${rows.slice(0,6).map(r=>`<li><b>${r.title}</b> \u00b7 band ${r.band} \u00b7 ${r.start} \u2192 ${r.end}</li>`).join("")}
       ${rows.length>6?`<li>\u2026and ${rows.length-6} more.</li>`:""}</ul>`;
    impReady(true);
  };
  fr.readAsArrayBuffer(f);
}

function saveTarget(eid, tid){
  const mine = canEditOwnTarget(eid), mfb = canEditMentorFb(eid);
  const prev = tid ? targetsOf(eid).map(normTarget).find(x=>x.id===tid) : normTarget({});
  const g = id => (document.getElementById(id).value||"").trim();
  const rec = {
    id: tid || ("HT-" + Date.now().toString(36).slice(-5) + Math.floor(Math.random()*1296).toString(36).padStart(2,"0")),
    emp: eid,
    initiative: mine ? g("tgInit")   : prev.initiative,
    focus:      mine ? g("tgFocus")  : prev.focus,
    target:     mine ? g("tgTarget") : prev.target,
    timeline:   mine ? g("tgTime")   : prev.timeline,
    comments:   mine ? g("tgComm")   : prev.comments,
    status:     mine ? g("tgStat")   : prev.status,
    selfFb:     mine ? g("tgSelf")   : prev.selfFb,
    mentorFb:   mfb  ? g("tgMfb")    : prev.mentorFb
  };
  if(!rec.initiative){
    const e=document.getElementById("tgErr");
    if(e) e.textContent="Give the initiative a name.";
    else toast("Give the initiative a name.");
    return;
  }

  const at = DB.targets.findIndex(x=>x.id===rec.id);
  if(at>=0) DB.targets[at] = rec; else DB.targets.push(rec);

  saveToExcel(tid ? "HipotTargets" : "HipotTargetsNew", rec.id, {
    TargetID:rec.id, EmployeeID:eid, Initiative:rec.initiative, FocusArea:rec.focus,
    Target:rec.target, Timeline:rec.timeline, Comments:rec.comments, Status:rec.status,
    SelfFeedback:rec.selfFb, MentorFeedback:rec.mentorFb,
    UpdatedBy:CURRENT_EMP||ACTOR, UpdatedOn:today()
  }, {changeType: tid?"Updated":"Created"});

  closeModal();
  if(typeof _mentorReturn!=="undefined" && _mentorReturn) openMenteeHipot(eid); else render();
  toast("Saved");
}

function laLog(eid,by,act,target,note){
  const lp=DB.learningPlans[eid];if(!lp)return;
  const ts=new Date().toISOString().slice(0,16).replace("T"," ");
  // record who actually made the change: the logged-in person (mentor when editing a mentee), else the passed id
  const actor=(typeof CURRENT_EMP!=="undefined"&&CURRENT_EMP&&!IS_ADMIN)?CURRENT_EMP:by;
  lp.changelog.push({ts,by:actor,act,target,note});
  if(lp.changelog.length>100) lp.changelog=lp.changelog.slice(-100); // keep last 100
  /* persist the log entry to the Comments sheet (AuthorRole "log:<act>") so the
     change log survives refreshes. Plain comments are filed separately by the
     save hook, so skip those here to avoid duplicates. */
  if(act!=="comment" && typeof saveToExcel==="function"){
    saveToExcel("Comments","",{ActionID:target||"", EmployeeID:eid, AuthorID:actor,
      AuthorRole:"log:"+act, CommentText:note||"", VisibleToMentee:"TRUE",
      VisibleToLeadership:"TRUE", CreatedOn:ts}, {changeType:"Comment"});
  }
}

    <label>Comment <span style="color:var(--t3);font-weight:400;text-transform:none;letter-spacing:0">(optional — logged, no approval needed)</span></label>
    <textarea id="laComment" rows="2" placeholder="Any note or context on this action...">${(a.comment||"").replace(/</g,"&lt;")}</textarea>
    <div class="lberr" id="laErr"></div>

      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn pri" onclick="saveLA('${id||""}')">Save</button>

  openModal();
}
function saveLA(id){
  const lp=DB.learningPlans[ACTOR];
  const title=document.getElementById("laTitle").value.trim();
  const band=document.getElementById("laBand").value;
  const start=document.getElementById("laStart").value;
  const end=document.getElementById("laEnd").value;
  const statusUpd=document.getElementById("laStatus").value.trim();
  const comment=(document.getElementById("laComment")?document.getElementById("laComment").value.trim():"");
  const priority=(document.getElementById("laPriority")?document.getElementById("laPriority").value:"");
  const outcome=(document.getElementById("laOutcome")?document.getElementById("laOutcome").value.trim():"");
  // all fields mandatory
  const missing=[];
  if(!title) missing.push("Action");
  if(!band) missing.push("70:20:10 band");
  if(!start) missing.push("Start date");
  if(!end) missing.push("End date");
  if(!statusUpd) missing.push("Status");
  if(start&&end&&end<start) missing.push("End date must be after start date");
  if(missing.length){
    const el=document.getElementById("laErr");
    if(el) el.textContent="Please complete: "+missing.join(", ");
    return;
  }
  const editorIsMentor = ROLE==="mentor";
  if(id){
    const a=lp.actions.find(x=>x.id===id);
    // did the approval-relevant fields change?
    const changed = a.title!==title || a.band!==band || (a.timeline.start||"")!==start || (a.timeline.end||"")!==end;
    const statusChanged = (a.update||"")!==statusUpd;
    const commentChanged = (a.comment||"")!==comment;
    const priorityChanged = (a.priority||"")!==priority;
    const outcomeChanged  = (a.outcome||"")!==outcome;
    a.title=title;a.band=band;a.timeline={start,end};a.comment=comment;
    a.priority=priority;a.outcome=outcome;
    if(priorityChanged){ laLog(ACTOR, ACTOR, "edited", id, priority?`Priority set to P${priority}`:"Priority cleared"); }
    if(outcomeChanged){ laLog(ACTOR, ACTOR, "edited", id, outcome?`Expected outcome: "${outcome.slice(0,120)}"`:"Expected outcome cleared"); }
    if(statusChanged){ a.update=statusUpd; laLog(ACTOR, ACTOR, "status update", id, statusUpd?`Status: "${statusUpd}"`:"Cleared status update"); }
    if(commentChanged){ laLog(ACTOR, ACTOR, "comment", id, comment?`Comment: "${comment}"`:"Cleared comment"); }
    if(changed){
      if(approvalsPaused() && !editorIsMentor){
        // approvals frozen: keep prior status, don't route to Pending
        laLog(ACTOR, ACTOR, "edited", id, `Updated action while approvals paused; not routed. band ${band}; ${start||"?"}→${end||"?"}`);
        closeModal();render();buildNav();
        toast("Saved — approvals are paused, so this wasn't sent for review");
        return;
      }
      a.status = "Approved";   // direct change, no review step
      laLog(ACTOR, ACTOR, "edited", id, `Updated action; band ${band}; ${start||"?"}→${end||"?"}`);
    }
    closeModal();render();buildNav();
    toast(changed ? "Saved" : ((statusChanged||commentChanged||priorityChanged||outcomeChanged)?"Saved & logged":"No changes"));
  }else{
    if(approvalsPaused() && !editorIsMentor){
      lp.actions.push({id:"LA-"+(lp.actions.length+1+Math.floor(Math.random()*90)),title,band,timeline:{start,end},update:statusUpd,comment,priority,outcome,status:"Draft"});
      laLog(ACTOR, ACTOR, "created", lp.actions[lp.actions.length-1].id, `Added action while approvals paused; kept as draft`);
      closeModal();render();buildNav();
      toast("Saved as draft — approvals are paused");
      return;
    }
    const newId="LA-"+(lp.actions.length+1+Math.floor(Math.random()*90));
    lp.actions.push({id:newId,title,band,timeline:{start,end},update:statusUpd,comment,priority,outcome,status:"Approved"});
    laLog(ACTOR, ACTOR, "created", newId, `Added action; band ${band}`);
    if(statusUpd) laLog(ACTOR, ACTOR, "status update", newId, `Status: "${statusUpd}"`);
    if(comment) laLog(ACTOR, ACTOR, "comment", newId, `Comment: "${comment}"`);
    closeModal();render();buildNav();
    toast("Saved");
  }
}
function approveLA(eid,id,ok){
  if(approvalsPaused()){toast("Approvals are paused by HR");return;}
  const lp=DB.learningPlans[eid];const a=lp.actions.find(x=>x.id===id);
  a.status=ok?"Approved":"Draft";
  laLog(eid, ACTOR, ok?"approved":"returned", id, ok?"Approved":"Returned for revision");
  closeModal();render();buildNav();toast(ok?"Action approved":"Returned to mentee");
}
function showLog(){
  const lp=DB.learningPlans[ACTOR];
  /* two shapes end up in this list: edits written by laLog, and comments
     pulled in from tblComments. Normalise before rendering either. */
  const norm = x => ({
    act:   x.act  || "comment",
    target:x.target|| x.tt || "\u2014",
    ts:    x.ts   || x.d  || "",
    by:    x.by   || "",
    note:  x.note || x.tx || ""
  });
  const log=(lp?lp.changelog:[]).map(norm).slice().reverse();
  const icon={created:"ti-plus",edited:"ti-pencil","edited+approved":"ti-check",
              approved:"ti-check",returned:"ti-arrow-back-up",comment:"ti-message",
              deleted:"ti-trash",archived:"ti-archive",restored:"ti-restore"};
  document.getElementById("modalBody").innerHTML=`
    <h3>Change &amp; approval log</h3>
    <div class="sub">Every edit, comment and approval on this learning plan \u2014 newest first.</div>
    ${log.length?`<ul class="timeline" style="margin-top:10px">${log.map(x=>`
      <li><div class="tt"><span class="ti ${icon[x.act]||"ti-point"}" style="font-size:13px;vertical-align:-1px"></span>
        ${x.act} \u00b7 ${x.target}
        <span style="color:var(--t3);font-weight:400">${x.ts?"\u00b7 "+x.ts+" ":""}${x.by?"\u00b7 "+nm(x.by):""}</span></div>
        <div class="tx">${String(x.note||"").replace(/</g,"&lt;")}</div></li>`).join("")}</ul>`
      :'<div class="note">No changes logged yet.</div>'}
    <div class="foot"><button class="btn" onclick="closeModal()">Close</button></div>`;
  openModal();
}
/* ---- delete → archive → restore. Every step is written to the change log. ---- */
function deleteLA(id){ doDeleteLA(id); }
/* re-render the plan without losing context: a mentor inside a mentee's plan
   stays on the mentee's page instead of being dumped back onto their own */
function refreshPlanView(){
  if(typeof _mentorReturn!=="undefined" && _mentorReturn && typeof openMenteeLearning==="function"){
    openMenteeLearning(ACTOR);
  } else {
    render(); buildNav();
  }
}
function doDeleteLA(id){
  const lp=DB.learningPlans[ACTOR]; if(!lp) return;
  const i=lp.actions.findIndex(x=>x.id===id); if(i<0) return;
  const a=lp.actions.splice(i,1)[0];
  lp.archive=lp.archive||[];
  a._archivedOn=new Date().toISOString().slice(0,16).replace("T"," ");
  a._archivedBy=(typeof CURRENT_EMP!=="undefined"&&CURRENT_EMP&&!IS_ADMIN)?CURRENT_EMP:ACTOR;
  /* archiving also changes the status: remember the old one so restore can bring it back */
  a._prevUpdate = a.update || "";
  a.update = "Deleted";
  lp.archive.push(a);
  laLog(ACTOR, ACTOR, "deleted", id, `Deleted "${a.title}" \u2014 status set to Deleted${a._prevUpdate?` (was "${a._prevUpdate}")`:""}`);
  /* goes to Power Automate as a plain status update ("Updated"), so the
     existing flow writes StatusUpdate = "Archived" with no flow changes */
  if(typeof saveToExcel==="function"&&typeof actionRow==="function")
    saveToExcel("Actions", id, actionRow(a, ACTOR, lp.mentor),
      {changeType:"Updated", field:"StatusUpdate", oldValue:a._prevUpdate, newValue:"Deleted"});
  closeModal();refreshPlanView();
  toast(`"${a.title}" deleted \u2014 moved to the archive & logged`);
}
function restoreLA(id){
  const lp=DB.learningPlans[ACTOR]; if(!lp||!lp.archive) return;
  const i=lp.archive.findIndex(x=>x.id===id); if(i<0) return;
  const a=lp.archive.splice(i,1)[0];
  delete a._archivedOn; delete a._archivedBy; delete a._deletedOn; delete a._deletedBy;
  const prev = a._prevUpdate || ""; delete a._prevUpdate;
  a.update = prev;
  lp.actions.push(a);
  laLog(ACTOR, ACTOR, "restored", id, `Restored "${a.title}" from the archive${prev?` \u2014 status back to "${prev}"`:""}`);
  if(typeof saveToExcel==="function"&&typeof actionRow==="function")
    saveToExcel("Actions", id, actionRow(a, ACTOR, lp.mentor),
      {changeType:"Updated", field:"StatusUpdate", oldValue:"Deleted", newValue:prev});
  refreshPlanView();showArchiveLA();
  toast("Action restored to the plan \u2014 logged");
}
function showArchiveLA(){
  const lp=DB.learningPlans[ACTOR];
  sweepArchived(lp);
  const menteesMentor = lp && (lp.mentor===ACTOR || (typeof CURRENT_EMP!=="undefined" && lp.mentor===CURRENT_EMP));
  const canEdit = (ROLE==="employee" || (ROLE==="mentor" && menteesMentor) || IS_ADMIN) && isEditable("learning.actions");
  const arch=(lp&&lp.archive)?lp.archive.slice().reverse():[];
  const rows=arch.length?arch.map(a=>{
    const b=BANDS[a.band]||{};
    const tl=a.timeline&&a.timeline.start?fmtRange(a.timeline.start,a.timeline.end):"\u2014";
    return `<tr>
      <td><div style="font-weight:500">${a.title}</div>
        <div style="font-size:12px;color:var(--t2);margin-top:4px"><span class="pill ${b.cls||'p-grey'}" style="margin-right:6px">${b.short||a.band}</span><span class="tlrange">${tl}</span> \u00b7 <span class="pill p-grey">Deleted</span>${a._prevUpdate?` <span style="color:var(--t3)">was ${a._prevUpdate}</span>`:""}</div>
        <div style="font-size:11px;color:var(--t3);margin-top:4px">Deleted ${a._archivedOn||a._deletedOn||"\u2014"}${(a._archivedBy||a._deletedBy)?" \u00b7 by "+nm(a._archivedBy||a._deletedBy):""}</div></td>
      <td style="text-align:right;vertical-align:middle;white-space:nowrap;width:90px">${canEdit?`<button class="btn sm" onclick="restoreLA('${a.id}')">Restore</button>`:""}</td></tr>`;
  }).join(""):`<tr><td colspan="2"><div class="note">Nothing in the archive. Deleted actions land here and can be restored to the plan.</div></td></tr>`;
  document.getElementById("modalBody").innerHTML=`
    <h3>Deleted actions</h3>
    <div class="sub">${nm(ACTOR)} \u00b7 deleted development actions \u2014 every delete and restore is in the change log.</div>
    <table class="tbl" style="margin-top:10px"><thead><tr><th>Action</th><th style="width:90px"></th></tr></thead><tbody>${rows}</tbody></table>
    <div class="foot"><button class="btn" onclick="closeModal()">Close</button></div>`;
  openModal();
}
