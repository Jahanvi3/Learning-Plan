function vIntegrity(){
  const problems=[];
  DB.pairings.forEach(p=>{if(!E(p.mentee))problems.push(`Pairing ${p.id}: mentee ${p.mentee} not in Employees`);if(!E(p.mentor))problems.push(`Pairing ${p.id}: mentor ${p.mentor} not in Employees`);});
  DB.targets.forEach(t=>{if(!E(t.emp))problems.push(`Target ${t.id}: owner ${t.emp} missing`);if(!E(t.approver))problems.push(`Target ${t.id}: approver ${t.approver} missing`);});
  DB.succession.forEach((s,i)=>{if(!E(s.incumbent))problems.push(`Succession ${i}: incumbent missing`);if(!E(s.successor))problems.push(`Succession ${i}: successor ${s.successor} missing`);});
  // reconciliation: hipot flagged but low 9-box
  const recon=[];
  Object.values(DB.employees).forEach(e=>{const nb=DB.ninebox[e.id];if(e.hipot&&nb&&nb.pot<2)recon.push(`${e.name}: flagged HiPot but 9-box potential is low`);});
  const okCount=DB.pairings.length+DB.targets.length+DB.succession.length;
  return `<div class="kpis">
      <div class="kpi"><div class="l">Links checked</div><div class="v mono">${okCount}</div></div>
      <div class="kpi"><div class="l">Broken references</div><div class="v mono" style="color:${problems.length?'var(--rust)':'var(--jade)'}">${problems.length}</div></div>
      <div class="kpi"><div class="l">Reconciliation flags</div><div class="v mono" style="color:${recon.length?'var(--amber)':'var(--jade)'}">${recon.length}</div></div>
    </div>
    <div class="card"><h2>Referential integrity</h2><p class="hint">Every ID reference cross-checked against the Employees master.</p>
      ${problems.length?problems.map(p=>`<div class="kline"><div class="nm" style="color:var(--rust)"><span class="ti ti-alert-circle"></span> ${p}</div></div>`).join(""):'<div class="note"><span class="ti ti-check" style="color:var(--jade)"></span> All references resolve. No orphaned IDs.</div>'}</div>
    <div class="card"><h2>HiPot ↔ 9-box reconciliation</h2><p class="hint">Under "Independent" policy, contradictions are surfaced, not hidden.</p>
      ${recon.length?recon.map(r=>`<div class="kline"><div class="nm"><span class="flag"><span class="ti ti-flag"></span> ${r}</span></div></div>`).join(""):'<div class="note"><span class="ti ti-check" style="color:var(--jade)"></span> No contradictions in sample data.</div>'}</div>`;
}

/* ============ 360 FEEDBACK DASHBOARD ============
   Replaces the PDF. Scores are 1-5: 5 Role Model, 4 Strong, 3 Moderate,
   2 Limited, 1 No Demonstration. "Others" is the Overall figure from the
   report, which already blends every responder group. Gap = others minus
   self: positive means people rate you above your own read (hidden strength),
   negative means you rate yourself above them (blind spot). */
function f360For(eid){
  const e = DB.employees[eid] || {};
  const r = (DB.f360||{})[docKey(e.name||"")];
  if(!r) return null;
  if(r.rows) return r;                       // already expanded (loaded from Excel)
  /* expand the compact embedded form against the shared attribute list */
  return { name:r.n, cycle:r.cycle||F360_CYCLE, reviewers:r.r||"",
    rows:(r.s||[]).map((t,i)=>{
      const a = F360_ATTRS[i] || [0,""];
      return { cat:F360_CATS[a[0]]||"Other", attr:a[1], idx:i,
               overall:t[0], self:t[1], peer:t[2], team:t[3],
               lo:t[4], hi:t[5], mode:t[6]||[] };
    }),
    cats:(r.c||[]).map((c,i)=>({ cat:F360_CATS[i]||"Other",
               overall:c[0], self:c[1], peer:c[2], team:c[3] })),
    sg:r.sg||{}, dg:r.dg||{}, cm:r.cm||{} };
}
const F360_GROUPS = ["Self","Peer","Team","Manager","Reportee"];
function f360AttrText(i){ return (F360_ATTRS[i]||[0,""])[1]; }
function f360AttrCat(i){ return F360_CATS[(F360_ATTRS[i]||[0])[0]]||""; }
function has360(eid){ return !!f360For(eid); }

const F360_SCALE = {5:"Role Model",4:"Strong",3:"Moderate",2:"Limited",1:"No Demonstration"};
const f360Tone = v => v==null ? "rust" : v>=4.25 ? "jade" : v>=3.5 ? "amber" : "rust";
const f360Pct  = v => v==null ? 0 : Math.max(0, Math.min(100, ((v-1)/4)*100));

function f360Bar(v){ return bar(f360Pct(v), f360Tone(v)); }

function f360Body(eid){
  const r = f360For(eid);
  if(!r) return `<div class="note">No 360 feedback on file for ${escH(nm(eid))} yet.</div>`;

  const rows   = r.rows.slice();
  const scored = rows.filter(x=>x.overall!=null);
  const avg    = scored.length ? scored.reduce((s,x)=>s+x.overall,0)/scored.length : null;
  const selfR  = rows.filter(x=>x.self!=null);
  const selfAvg= selfR.length ? selfR.reduce((s,x)=>s+x.self,0)/selfR.length : null;
  const gapOf  = x => (x.overall!=null && x.self!=null) ? x.overall - x.self : null;
  const hasPeer= rows.some(x=>x.peer!=null);
  const cats   = {};
  rows.forEach(x=>{ (cats[x.cat] = cats[x.cat] || []).push(x); });
  const SRC = "the 360 feedback report";

  /* The comparison track runs 2-5, not 1-5. Nothing in the set scores below 2
     and 99% sits above 3, so a full-scale axis would squeeze every marker into
     the last quarter and hide the differences that matter. Ticks are labelled
     so the compression is stated rather than implied. The hero ruler below
     still shows the full 1-5 scale. */
  const AX0 = 2, AX1 = 5;
  const pos = v => v==null ? 0 : Math.max(0, Math.min(100, ((v-AX0)/(AX1-AX0))*100));
  const axisHead = `<div class="pline paxis">
      <div></div>
      <div class="ptrack">${[2,3,4,5].map((n,k)=>
        `<span class="tk" style="left:${k*100/3}%"></span>
         <b style="left:${k*100/3}%">${n}</b>`).join("")}</div>
      <div></div></div>`;

  /* ---- the glyph: Self ring, Others dot, the gap between them ---- */
  function pRow(label, sub, self, other, num){
    const a = pos(self), b = pos(other);
    const gap = (self!=null && other!=null) ? other - self : null;
    const dir = gap==null ? "var(--line2)" : gap >= 0 ? "var(--jade)" : "var(--violet)";
    const seg = (self!=null && other!=null)
      ? `<span class="pseg" style="left:${Math.min(a,b)}%;width:${Math.abs(b-a)}%;background:${dir}"></span>` : "";
    return `<div class="pline">
      <div class="plab">${escH(label)}${sub?`<span>${escH(sub)}</span>`:""}</div>
      <div class="ptrack"><span class="ax"></span>
        ${[0,33.33,66.67,100].map(t=>`<span class="tk" style="left:${t}%"></span>`).join("")}
        ${seg}
        ${self!=null?`<span class="pring" style="left:${a}%" title="Self ${self.toFixed(1)}"></span>`:""}
        ${other!=null?`<span class="pdot" style="left:${b}%" title="Others ${other.toFixed(2)}"></span>`:""}
      </div>
      <div class="pnum">${num}</div></div>`;
  }
  const legend = `<div class="plegend">
      <span><i class="ls"></i>Own score</span>
      <span><i class="lo"></i>Average of everyone else</span>
      <span><i style="background:var(--jade)"></i>Others scored it higher</span>
      <span><i style="background:var(--violet)"></i>Own score was higher</span>
    </div>`;

  /* ---- signed gap, drawn out from a centre line ---- */
  const maxGap = Math.max(0.5, ...rows.map(x=>Math.abs(gapOf(x)||0)));
  function dRow(x){
    const g = gapOf(x), w = Math.abs(g)/maxGap*50;
    const up = g>=0;
    return `<div class="dvrow">
      <div class="dvlab">${escH(x.attr)}<span>${escH(x.cat)}</span></div>
      <div class="dvtrack"><span class="mid"></span>
        <span class="dvbar" style="${up?`left:50%`:`right:50%`};width:${w}%;
          background:${up?"var(--jade)":"var(--violet)"}"></span></div>
      <div class="dvnum" style="color:${up?"var(--jade)":"var(--violet)"}">${(g>0?"+":"")+g.toFixed(2)}</div>
    </div>`;
  }

  /* ---- hero ---- */
  const delta = (avg!=null && selfAvg!=null) ? avg - selfAvg : null;
  const readout = delta==null ? "" :
    Math.abs(delta) < 0.1
      ? `Your own scores and everyone else's line up almost exactly.`
      : delta > 0
        ? `Other people scored you <b>${delta.toFixed(2)} higher</b> than you scored yourself.`
        : `You scored yourself <b>${Math.abs(delta).toFixed(2)} higher</b> than other people did.`;
  const hero = `<div class="f360hero">
      <div class="sc"><div class="big">${avg==null?"\u2014":avg.toFixed(2)}</div>
        <div class="of">Average score \u00b7 out of 5</div></div>
      <div class="rd">
        <p>${readout} Scored on <b>${rows.length} behaviours</b> out of 5, where 5 is the best.
          This number is the average of every score given.</p>
        <div class="f360chips">
          ${r.cycle?`<span>${escH(r.cycle)}</span>`:""}
          ${r.reviewers?`<span>${escH(r.reviewers)}</span>`:""}
          <span>Own score ${selfAvg==null?"\u2014":selfAvg.toFixed(2)}</span>
        </div>
      </div></div>`;

  /* ---- ordered highlights ---- */
  const byScore  = scored.slice().sort((a,b)=>b.overall-a.overall);
  const strengths= byScore.slice(0,5);
  const devs     = byScore.slice(-5).reverse();
  const gapped   = rows.filter(x=>gapOf(x)!=null);
  const hidden   = gapped.filter(x=>gapOf(x) >=  0.25).sort((a,b)=>gapOf(b)-gapOf(a));
  const blind    = gapped.filter(x=>gapOf(x) <= -0.25).sort((a,b)=>gapOf(a)-gapOf(b));

  /* stacked, because these two cards sit side by side and a three-column row
     collapses the behaviour text to one word per line */
  const hi = (x, act) => `<div class="hirow">
      <div class="plab">${escH(x.attr)}<span>${escH(x.cat)}</span></div>
      <div class="himeter">
        <div class="ptrack"><span class="ax"></span>
          ${[0,33.33,66.67,100].map(t=>`<span class="tk" style="left:${t}%"></span>`).join("")}
          <span class="pseg" style="left:0;width:${pos(x.overall)}%;background:var(--yellow)"></span>
          <span class="pdot" style="left:${pos(x.overall)}%"></span></div>
        <div class="pnum">${x.overall.toFixed(2)}</div>
        ${act?actionBtn(eid, x.attr, SRC):""}</div></div>`;

  /* ---- category glyph rows ---- */
  const catRows = (r.cats||[]).filter(c=>c.overall!=null)
    .slice().sort((a,b)=>b.overall-a.overall)
    .map(c=>pRow(c.cat, (cats[c.cat]||[]).length+" behaviours", c.self, c.overall, c.overall.toFixed(1)));

  /* Each group ranks its own top three, and the same behaviour often appears in
     more than one list. Three separate lists buried that: the useful signal is
     which behaviours the groups agree on. So rank is shown as a numeral, and
     every row carries a Self / Peer / Team mark with the groups that named it
     filled in - agreement becomes something you can see at a glance. */
  const groupBlock = (map, empty) => {
    const gs = F360_GROUPS.filter(g=>map[g]&&map[g].length);
    if(!gs.length) return `<div class="note">${empty}</div>`;
    const named = i => gs.filter(g=>(map[g]||[]).indexOf(i) !== -1);
    const marks = i => {
      const on = named(i);
      return `<span class="agree">${gs.map(g=>
        `<i class="${on.indexOf(g)!==-1?"on":""}" title="${g}">${g[0]}</i>`).join("")}</span>`;
    };
    return gs.map(g=>`<div class="gsec"><div class="geyebrow">${g}</div>
      ${map[g].map((i,n)=>{
        const agree = named(i).length;
        return `<div class="grow">
          <div class="gno">${n+1}</div>
          <div class="gbd"><div class="gtx">${escH(f360AttrText(i))}</div>
            <div class="gct">${escH(f360AttrCat(i))}${agree>1?` \u00b7 named by ${agree} groups`:""}</div></div>
          ${marks(i)}</div>`;}).join("")}
    </div>`).join("");
  };

  /* ---- comments ---- */
  const cmGroups = F360_GROUPS.filter(g=>r.cm[g]&&r.cm[g].length);
  const cmTotal  = cmGroups.reduce((n,g)=>n+r.cm[g].length,0);
  const comments = !cmGroups.length ? "" : `<div class="card"><h2>Written comments</h2>
      <p class="hint">${cmTotal} comment${cmTotal===1?"":"s"} reviewers typed in, word for word. Nothing has been edited or summarised.</p>
      ${cmGroups.map(g=>`<div class="gsec"><div class="geyebrow">${g}</div>
        <div class="qgrid" style="margin-top:11px">
          ${r.cm[g].map(t=>`<blockquote class="qcard"><p>${escH(t)}</p></blockquote>`).join("")}
        </div></div>`).join("")}</div>`;

  /* ---- full table ---- */
  const strip = x => {
    if(x.lo==null) return '<span style="color:var(--t3)">\u2014</span>';
    return `<span class="spread" title="Rated ${x.lo} to ${x.hi}">${[1,2,3,4,5].map(n=>
      `<i class="${(x.mode||[]).indexOf(n)>=0?"md":(n>=x.lo&&n<=x.hi?"in":"")}"></i>`).join("")}</span>`;
  };
  const attrTable = Object.keys(cats).sort().map(c=>`
    <tr><td colspan="${hasPeer?6:5}" class="cgrp">${escH(c)}</td></tr>
    ${cats[c].map(x=>{
      const g = gapOf(x);
      return `<tr>
        <td style="font-size:12.5px">${escH(x.attr)}</td>
        <td class="mono" style="width:60px;text-align:center;font-weight:600">${x.overall==null?"\u2014":x.overall.toFixed(2)}</td>
        <td class="mono" style="width:50px;text-align:center;color:var(--t2)">${x.self==null?"\u2014":x.self.toFixed(1)}</td>
        ${hasPeer?`<td class="mono" style="width:50px;text-align:center;color:var(--t2)">${x.peer==null?"\u2014":x.peer.toFixed(1)}</td>`:""}
        <td class="mono" style="width:50px;text-align:center;color:var(--t2)">${x.team==null?"\u2014":x.team.toFixed(1)}</td>
        <td class="mono" style="width:62px;text-align:center;color:${g==null?"var(--t3)":g>=0.25?"var(--jade)":g<=-0.25?"var(--violet)":"var(--t3)"}">${g==null?"\u2014":(g>0?"+":"")+g.toFixed(2)}</td>
      </tr>`;}).join("")}`).join("");

  /* The document plots every behaviour three times - once for the overall
     average, once for peers, once for the team. Same numbers, one chart per
     group, each sorted highest first, exactly as the pages are laid out. */
  const groupChart = (title, pick, note) => {
    const list = rows.filter(x=>pick(x)!=null).sort((a,b)=>pick(b)-pick(a));
    if(!list.length) return "";
    return `<div class="card"><h2>${title}</h2>
      <p class="hint">${note}</p>
      ${axisHead}
      ${list.map(x=>`<div class="pline">
        <div class="plab">${escH(x.attr)}<span>${escH(x.cat)}</span></div>
        <div class="ptrack"><span class="ax"></span>
          ${[0,33.33,66.67,100].map(t=>`<span class="tk" style="left:${t}%"></span>`).join("")}
          <span class="pseg" style="left:0;width:${pos(pick(x))}%;background:var(--yellow)"></span>
          <span class="pdot" style="left:${pos(pick(x))}%"></span></div>
        <div class="pnum">${pick(x).toFixed(2)}</div>
      </div>`).join("")}
    </div>`;
  };

  /* Greatest strengths, hidden strengths and blind spots are tables in the
     document, with the category alongside each attribute. */
  const attrTableSimple = (list, withSelf) => `<table class="tbl"><thead><tr>
      <th>Attribute</th>
      ${withSelf?'<th style="width:64px;text-align:center">Self</th>':""}
      <th style="width:84px;text-align:center">Avg. score</th>
      <th style="width:210px">Category</th>
    </tr></thead><tbody>${list.map(x=>`<tr>
      <td style="font-size:12.5px">${escH(x.attr)}</td>
      ${withSelf?`<td class="mono" style="text-align:center;color:var(--t2)">${x.self==null?"\u2014":x.self.toFixed(1)}</td>`:""}
      <td class="mono" style="text-align:center;font-weight:600">${x.overall==null?"\u2014":x.overall.toFixed(2)}</td>
      <td style="font-size:12px;color:var(--t2)">${escH(x.cat)}</td>
    </tr>`).join("")}</tbody></table>`;

  return `${hero}
    ${stickyActionBar(eid, "the 360 feedback report", "360 feedback report")}

    <div class="card"><h2>Greatest strengths</h2>
      <p class="hint">Top strengths based on cumulative ratings.</p>
      ${strengths.length?attrTableSimple(strengths,false):'<div class="note">Not enough data.</div>'}
    </div>

    <div class="grid2">
      <div class="card"><h2>Hidden strengths</h2>
        <p class="hint">Others scored these higher than ${eid===CURRENT_EMP?"you":"they"} did.</p>
        ${hidden.length?attrTableSimple(hidden,true):'<div class="note">None identified.</div>'}
      </div>
      <div class="card"><h2>Blind spots</h2>
        <p class="hint">${eid===CURRENT_EMP?"You":"They"} scored these higher than others did \u2014 where to focus for specific improvement.</p>
        ${blind.length?attrTableSimple(blind,true):'<div class="note">None identified.</div>'}
        ${blind.length?`<div style="margin-top:12px">${sectionActionBtn(eid, "Blind spots", SRC)}</div>`:""}
      </div>
    </div>

    ${groupChart("Overall assessment", x=>x.overall, "Every behaviour, averaged across everyone who reviewed " + (eid===CURRENT_EMP?"you":"them") + ".")}
    ${hasPeer?groupChart("Peer assessment", x=>x.peer, "The same behaviours, scored by peers only."):""}
    ${groupChart("Team assessment", x=>x.team, "The same behaviours, scored by the team only.")}

    ${(r.cats||[]).filter(c=>c.overall!=null).length ? `<div class="card">
      <h2>Category wise summary</h2>
      <p class="hint">Each category as scored by each group, out of 5 \u2014 as it appears in the report.</p>
      <table class="tbl"><thead><tr>
        <th>Category</th>
        <th style="width:74px;text-align:center">Peer</th>
        <th style="width:74px;text-align:center">Self</th>
        <th style="width:74px;text-align:center">Team</th>
        <th style="width:88px;text-align:center">Overall</th>
      </tr></thead><tbody>${(r.cats||[]).filter(c=>c.overall!=null).map(c=>{
        const n1 = v => v==null ? '<span style="color:var(--t3)">\u2014</span>' : Number(v).toFixed(1);
        return `<tr>
          <td>${escH(c.cat)}</td>
          <td class="mono" style="text-align:center;color:var(--t2)">${n1(c.peer)}</td>

/* Opens where the PDF used to open — straight off the reports rail — but as a
   full page rather than a pop-up, so the Back button returns you to where you
   were. If a mentor is inside a mentee's record, Back goes to their plan. */
function openReportPage(eid, kind){
  /* Deliberately does NOT touch TAB or call buildNav(). These pages have no nav
     entry, and buildNav() snaps TAB back to the first visible tab whenever the
     current one isn't in the list — which would bounce you straight out. Same
     approach openEvpPage() uses. */
  const inMentee = (typeof _mentorReturn !== "undefined" && _mentorReturn) ? eid : null;
  _subPage = inMentee ? { from:"learning", mentee:inMentee } : { from:TAB };
  ACTOR = eid;
  const [t, sub] = TITLES[kind] || ["\u2014", "\u2014"];
  document.getElementById("pgTitle").textContent = t;
  document.getElementById("pgSub").textContent  = sub;
  const host = document.getElementById("viewHost");
  host.innerHTML = `<div class="view on">${kind === "aisum" ? vAiSummary() : f360Body(eid)}</div>`;
  wrapTables(host);
  updateBackBtn();
  if(window.scrollTo) try{ window.scrollTo(0,0); }catch(e){}
}
function open360(eid){ openReportPage(eid, "f360"); }
function openAiSummary(eid){ openReportPage(eid, "aisum"); }

/* whoever may edit the plan may raise an action off a finding */
function canRaiseAction(eid){
  const lp = DB.learningPlans[eid];
  const isTheirMentor = !!(lp && typeof CURRENT_EMP!=="undefined" && lp.mentor===CURRENT_EMP);
  return isEditable("learning.actions") && (IS_ADMIN || isTheirMentor || eid===CURRENT_EMP);
}
function raiseAction(eid, label, src){
  if(!DB.learningPlans[eid]){
    const pair = (DB.pairings||[]).find(x=>x.mentee===eid && x.status==="Active");
    DB.learningPlans[eid] = { mentor: pair?pair.mentor:null, actions:[], changelog:[], archive:[] };
  }
  ACTOR = eid;                       // the action belongs to them, not the viewer
  _evpActionFrom = label; _evpActionSrc = src; _pendingOrigin = originOf(src);
  laForm(null, { _from: label, _src: src, _origin: originOf(src) });
}

/* Where a development action came from, for the Compliance breakdown.
   Kept to three buckets so the numbers stay readable. */
function originOf(src){
  const t = String(src||"").toLowerCase();
  if(t.indexOf("evp") >= 0) return "EVP";
  if(t.indexOf("360") >= 0 || t.indexOf("summary") >= 0 || t.indexOf("feedback") >= 0) return "360";
  return "General";
}
/* The same recommendation shows up in more than one place on the summary -
   "what to work on first" and "start doing" often say the same thing. Offer
   the button on the first occurrence only, so nobody raises it twice without
   noticing. Reset per render. */
let _actionSeen = {};
function resetActionBtns(){ _actionSeen = {}; }

/* One button per section. It opens the action form with the section as the
   context line, and the mentor writes the action from what they've just read -
   rather than a button on every line, which invited raising six near-identical
   actions off one summary. */
function sectionActionBtn(eid, section, src){
  if(!canRaiseAction(eid)) return "";
  const safe = String(section).replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/"/g,"&quot;");
  return `<button class="btn sm pri nowrap" onclick="raiseAction('${eid}','${safe}','${src}')">
    <span class="ti ti-plus" style="font-size:13px"></span>Create action</button>`;
}

/* Reports run several screens long and the Create action buttons live inside
   individual sections, so by the time you've read to the bottom there's nothing
   to press. This bar sticks to the top of the report and raises an action for
   the report as a whole. */
function stickyActionBar(eid, src, label){
  if(!canRaiseAction(eid)) return "";
  const safe = String(label).replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/"/g,"&quot;");
  return `<div class="stickybar">
    <div class="sbtxt">Anything here worth acting on?
      <span>Raise it into ${escH(nm(eid))}'s development plan.</span></div>
    <button class="btn sm pri nowrap" onclick="raiseAction('${eid}','${safe}','${src}')">
      <span class="ti ti-plus" style="font-size:13px"></span>Add development action</button>
  </div>`;
}

function actionBtn(eid, label, src){
  if(!canRaiseAction(eid)) return "";
  const fp = String(label).toLowerCase().replace(/[^a-z0-9]+/g," ").trim().slice(0,90);
  if(_actionSeen[fp]) return "";
  _actionSeen[fp] = true;
  const safe = String(label).replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/"/g,"&quot;");
  return `<button class="btn sm pri nowrap" onclick="raiseAction('${eid}','${safe}','${src}')">
    <span class="ti ti-plus" style="font-size:13px"></span>Create action</button>`;
}


/* ============ AI 360 SUMMARY (mentor only) ============ */
function aiFor(eid){
  const e = DB.employees[eid] || {};
  return ((DB.aiSummary||{})[docKey(e.name||"")]) || null;
}
function hasAi(eid){ return !!aiFor(eid); }

/* The source document repeats itself: "What people recommend" restates the top
   three priorities almost word for word, and "Key strengths" re-states much of
   "What people appreciate". Merge each pair, keeping the first wording and
   dropping anything already said. */
function aiKey(t){
  const m = String(t).match(/^([^.]{3,70})\./);
  return (m ? m[1] : String(t).slice(0,45)).toLowerCase().replace(/[^a-z0-9]/g,"");
}
function aiMerge(){
  const seen = new Set(), out = [];
  [].slice.call(arguments).forEach(list=>(list||[]).forEach(t=>{
    const k = aiKey(t);
    if(k && seen.has(k)) return;
    seen.add(k); out.push(t);
  }));
  return out;
}

function aiList(eid, items, src, withAction){
  if(!items || !items.length) return '<div class="note">Nothing recorded.</div>';
  return `<ul class="ailist">${items.map(t=>{
    /* Bullets usually read "Heading. Detail sentence." — the heading becomes the
       action title. When there's no heading the whole bullet is the body, and
       the button label falls back to the opening words. Nothing on screen is
       ever cut short. */
    const full = String(t).replace(/\s+/g," ").trim();
    const m    = full.match(/^([^.]{3,70})\.\s+(.+)$/);
    const head = m ? m[1] : "";
    const body = m ? m[2] : full;
    const label= head || full.split(" ").slice(0,9).join(" ");
    return `<li class="airow">
      <div class="atx">${head?`<b>${escH(head)}.</b> `:""}${escH(body)}</div>
      ${withAction?`<div class="abtn">${actionBtn(eid, label, src)}</div>`:""}
    </li>`;}).join("")}</ul>`;
}

/* The brief is written in the third person and names its subject throughout, so
   if none of the employee's name parts appear in it, the file on record belongs
   to someone else. Showing one person's feedback under another's name is the
   worst thing this page could do, so it stops rather than guesses. */
function aiSubjectMatches(eid, a){
  const parts = String(nm(eid)||"").toLowerCase().split(/\s+/).filter(x=>x.length>2);
  if(!parts.length || !a || !a.exec) return true;
  const t = String(a.exec).toLowerCase();
  return parts.some(x=>t.indexOf(x) !== -1);
}

  const apprCard = (a.appr&&a.appr.length) ? `<div class="card">

/* ============ HR: HI-POT PLANS ============

function planBlock(key, p){

/* ============ HR: DEVELOPMENT ACTION COMPLIANCE ============ */
/* Compliant = the person has at least one live development action, any band.
   Archived/deleted rows don't count — only what's on the active plan. */
let COMP_Q = "", COMP_FN = "all", COMP_ST = "all";

const escH = s => String(s==null?"":s).replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));

function complianceRows(){
  return Object.values(DB.employees).map(e=>{
    const lp   = DB.learningPlans[e.id] || {};
    const acts = lp.actions || [];
    const by   = {"70":0,"20":0,"10":0};
    const src  = {"360":0, EVP:0, General:0};   // where each action was raised from
    let last = "";
    acts.forEach(a=>{
      const b = String(a.band);
      if(b in by) by[b]++;
      const o = (a.origin in src) ? a.origin : "General";
      src[o]++;
      const d = String(a._createdOn||"");
      if(d > last) last = d;
    });
    const mentorId = lp.mentor || e.mentorId || "";
    return {
      id:e.id, name:e.name||e.id, fn:e.fn||"\u2014", sub:e.sub||"",
      desig:e.desig||"", lvl:e.lvl||0,
      mentor: mentorId ? nm(mentorId) : "",
      n:acts.length, by:by, src:src, last:last, ok:acts.length>0
    };
  });
}

function complianceFiltered(){
  const q = COMP_Q.trim().toLowerCase();
  return complianceRows().filter(r=>{
    if(COMP_FN !== "all" && r.fn !== COMP_FN) return false;
    if(COMP_ST === "yes" && !r.ok) return false;
    if(COMP_ST === "no"  &&  r.ok) return false;
    if(q && (r.name+" "+r.id+" "+r.desig+" "+r.mentor).toLowerCase().indexOf(q) === -1) return false;
    return true;
  }).sort((a,b)=> a.n - b.n || a.name.localeCompare(b.name));   // gaps first
}

function compTableHTML(){
  const rows = complianceFiltered();
  if(!rows.length) return '<div class="note">Nobody matches those filters.</div>';
  const body = rows.map(r=>`<tr>
      <td><b>${escH(r.name)}</b><div style="font-size:11px;color:var(--t3)">${escH(r.id)}${r.desig?" \u00b7 "+escH(r.desig):""}</div></td>

function exportCompliance(){

                "Mentor","ActionsAdded","Band70","Band20","Band10",

   LIVE SYNC — Excel (SharePoint) through ONE Power Automate flow
   ----------------------------------------------------------------------------
   Paste the single flow URL below and the portal goes live. Leave it blank and
   everything here is inert — the portal keeps running on its built-in demo data.

   The flow is one "When an HTTP request is received" (POST) trigger with a
   Switch on the "table" value in the body:
       {"table":"READ"}                                    -> returns every table
       {"table":"Career","key":"CR-001","fields":{...}}     -> writes one row
   Build steps: TalentPortal_PowerAutomate_Setup.md
   ========================================================================== */
const FLOW_URL = "https://defaultb9d69197ce1f49079545b307af2335.e9.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/23/workflows/9f111d096b67499199d839ab5c6d7afa/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=WnkLtJAaJG8DqY8ZtRARdlZx4vcghAIfsVAMWGWNLnE";   // <-- paste the HTTP POST URL of your one flow

const SYNC_ON   = () => !!FLOW_URL;
const truthy    = v => String(v).trim().toUpperCase() === "TRUE";
let   LAST_SYNC = null;
let   SYNC_STATE = "off";   // off | loading | live | error

/* every call to Power Automate goes through here — one URL, one method */
window.SYNC_LOG = [];
function syncLogAdd(entry){
  SYNC_LOG.push(Object.assign({t:new Date().toTimeString().slice(0,8)}, entry));
  if(SYNC_LOG.length>40) SYNC_LOG.shift();
}
function callFlow(payload){
  const tag = {table:payload.table||"", key:payload.key||"", changeType:payload.changeType||"",
               field:payload.field||"", newValue:payload.newValue||""};
  return fetch(FLOW_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(Object.assign({
      actor: (typeof CURRENT_EMP !== "undefined" && CURRENT_EMP) ? CURRENT_EMP : ACTOR,
      source: "Dashboard"
    }, payload))
  }).then(async r=>{
    const txt = await r.text();
    if(!r.ok){
      console.error("[sync] flow returned " + r.status + ":", txt);
      syncLogAdd(Object.assign({ok:false, err:"HTTP "+r.status+" "+txt.slice(0,160)}, tag));
      throw new Error("HTTP " + r.status + " " + txt.slice(0, 300));
    }
    if(!txt){
      syncLogAdd(Object.assign({ok:false, err:"Empty body — Response action missing in the flow"}, tag));
      throw new Error("Flow returned an empty body - is the Response action missing?");
    }
    syncLogAdd(Object.assign({ok:true}, tag));
    return JSON.parse(txt);
  }).catch(e=>{
    if(!SYNC_LOG.length || SYNC_LOG[SYNC_LOG.length-1].err !== String(e.message).slice(0,160))
      syncLogAdd(Object.assign({ok:false, err:String(e.message).slice(0,160)}, tag));
    throw e;
  });
}
function showSyncLog(){
  const rows = SYNC_LOG.slice().reverse().map(x=>`
    <tr>
      <td class="mono" style="white-space:nowrap;font-size:11px;color:var(--t3)">${x.t}</td>
      <td style="font-size:12px"><b>${x.table}</b>${x.key?" \u00b7 "+x.key:""}${x.changeType?" \u00b7 "+x.changeType:""}${x.field?"<div style='font-size:11px;color:var(--t3)'>"+x.field+" \u2192 "+String(x.newValue)+"</div>":""}</td>
      <td>${x.ok?'<span class="pill p-jade">OK</span>':'<span class="pill p-rust">FAILED</span>'}${x.err?"<div style='font-size:11px;color:var(--t2);margin-top:3px'>"+String(x.err).replace(/</g,"&lt;")+"</div>":""}</td>
    </tr>`).join("");
  const counts = READ_COUNTS
    ? `<div class="note" style="margin-bottom:12px"><b>Last READ took ${
        LAST_READ_MS==null?"\u2014":(LAST_READ_MS/1000).toFixed(1)+" seconds"} and returned:</b> ${
        Object.keys(READ_COUNTS).map(k=>`${k} <b>${READ_COUNTS[k]}</b>`).join(" \u00b7 ")
      }<div style="margin-top:7px;color:var(--t2)">A table showing 0 is empty in the workbook \u2014 that page will look blank, and that's the workbook, not the sync.</div></div>`
    : '<div class="note" style="margin-bottom:12px">No READ has completed yet.</div>';
  document.getElementById("modalBody").innerHTML = `
    <h3>Excel sync log</h3>
    ${counts}
    <div class="sub">Every write this session sent to the Power Automate flow, newest first. FAILED rows show the flow's error.</div>
    ${SYNC_LOG.length?`<table class="tbl" style="margin-top:10px"><thead><tr><th style="width:70px">Time</th><th>Write</th><th style="width:200px">Result</th></tr></thead><tbody>${rows}</tbody></table>`
      :'<div class="note" style="margin-top:10px">No writes yet this session. Make a change (edit a status, archive an action), then reopen this log.</div>'}
    <div class="foot"><button class="btn" onclick="closeModal()">Close</button></div>`;
  openModal();
}

      + "box-shadow:0 2px 10px rgba(0,0,0,.07);cursor:pointer;display:flex;align-items:center;gap:7px";
    el.onclick = (e) => { if(e.shiftKey){ showSyncLog(); return; } if(SYNC_ON()) loadFromExcel(true); };
    el.title = "Click to refresh \u00b7 Shift+click for the sync log";
    document.body.appendChild(el);
  }
  const dot = c => '<span style="width:7px;height:7px;border-radius:50%;background:'+c+';display:inline-block"></span>';
  if(SYNC_STATE==="off")          el.innerHTML = dot("#A7A9AC") + "Demo data — not connected to Excel";
  else if(SYNC_STATE==="loading") el.innerHTML = dot("#D18700") + "Syncing with Excel\u2026";
  else if(SYNC_STATE==="stale")   el.innerHTML = dot("#D18700") + "Showing last saved \u00b7 refreshing\u2026";
  else if(SYNC_STATE==="empty")   el.innerHTML = dot("#D18700") + "Connected, but Excel returned no rows";
  else if(SYNC_STATE==="error")   el.innerHTML = dot("#8A5A00") + "Sync failed — click to retry";
  else el.innerHTML = dot("#006837") + "Live \u00b7 synced " + LAST_SYNC + " \u00b7 click to refresh";
}

/* ---------- READ: one POST with table:"READ" pulls every table ---------- */
let _READ_CACHE = null, _READ_AT = 0;
/* ---------------------------------------------------------------------------
   Last good READ payload, kept between sessions so the page can render
   immediately on the next visit instead of waiting on the flow. Held in memory
   for this tab and mirrored to sessionStorage where that's available; a browser
   that blocks it just falls back to the old behaviour of waiting. Anything
   older than a day is thrown away rather than shown.
   --------------------------------------------------------------------------- */
const SNAP_KEY = "tp.read.snapshot";
const SNAP_MAX_AGE = 7*24*60*60*1000;
/* localStorage, not sessionStorage: sessionStorage is wiped when the tab
   closes, so every fresh visit paid the full round-trip again. This keeps the
   last good read across restarts, and it's refreshed behind the user anyway. */
const SNAP_STORE = (function(){
  try{ const t="tp.t"; window.localStorage.setItem(t,"1"); window.localStorage.removeItem(t);
       return window.localStorage; }
  catch(e){ try{ return window.sessionStorage; }catch(e2){ return null; } }
})();
let _SNAP_MEM = null;

function readStoredSnapshot(){
  if(_SNAP_MEM && (Date.now() - _SNAP_MEM.at) < SNAP_MAX_AGE) return _SNAP_MEM;
  try{
    const raw = SNAP_STORE && SNAP_STORE.getItem(SNAP_KEY);
    if(!raw) return null;
    const snap = JSON.parse(raw);
    if(!snap || !snap.payload || (Date.now() - snap.at) > SNAP_MAX_AGE) return null;
    _SNAP_MEM = snap;
    return snap;
  }catch(e){ return null; }
}
function writeStoredSnapshot(payload){
  const snap = { at: Date.now(), payload: payload };
  _SNAP_MEM = snap;
  try{ if(SNAP_STORE) SNAP_STORE.setItem(SNAP_KEY, JSON.stringify(snap)); }
  catch(e){
    /* over quota - drop the two biggest history tables and retry, since a
       partial snapshot still beats a blank page */
    try{
      const slim = Object.assign({}, payload, {comments:[], actions:[]});
      SNAP_STORE.setItem(SNAP_KEY, JSON.stringify({at:snap.at, payload:slim, slim:true}));
    }catch(e2){ /* in-memory copy still helps this tab */ }
  }
}

/* Row counts from the last READ, so "nothing on this page" can be told apart
   from "the sync failed". Surfaced on the pill and in the sync log. */
let READ_COUNTS = null, LAST_READ_MS = null;

async function loadFromExcel(manual){
  if(!SYNC_ON()){ SYNC_STATE="off"; syncPill(); return; }
  /* the full READ is the slow call (one Power Automate round-trip for the whole
     workbook). Reuse the payload from the last 45 seconds unless the user
     explicitly refreshed via the pill — sign-in right after page load then
     re-maps the already-fetched data instantly instead of fetching twice. */
  const fresh = _READ_CACHE && (Date.now() - _READ_AT < 300000);
  if(fresh && !manual){
    try{ applyReadPayload(_READ_CACHE); }catch(e){ console.error("[sync] cached apply failed", e); }
    return;
  }

  /* Show last session's data straight away, then refresh behind it. The READ is
     one Power Automate round-trip for the whole workbook, so without this the
     page sits empty for as long as that takes. Skipped on a manual refresh -
     if someone pressed the pill they want to see it actually go and fetch. */
  if(!manual && !_READ_CACHE){
    const stored = readStoredSnapshot();
    if(stored){
      try{
        applyReadPayload(stored.payload);
        SYNC_STATE = "stale"; syncPill();
        /* the directory is the only thing sign-in needs, and it's in the
           snapshot - so open the form now rather than after the round-trip */
        if(Object.keys(DB.employees||{}).length){
          DIRECTORY_READY = true;
          if(typeof dirNote==="function") dirNote("Use the work email on your HR record.");
          if(typeof dirSync==="function") dirSync("refreshing");
        }
      }catch(e){ console.error("[sync] stored apply failed", e); }
    }
  }

  SYNC_STATE = (SYNC_STATE === "stale") ? "stale" : "loading"; syncPill();
  const _t0 = Date.now();
  /* count up while we wait - a pill that never changes reads as hung */
  clearInterval(window._syncTick);
  window._syncTick = setInterval(()=>{
    if(SYNC_STATE!=="loading" && SYNC_STATE!=="stale"){ clearInterval(window._syncTick); return; }
    const el = document.getElementById("syncPill"); if(!el) return;
    const secs = Math.round((Date.now()-_t0)/1000);
    if(typeof dirSync==="function" && !DIRECTORY_READY) dirSync("waiting", secs);
    if(secs < 2) return;
    const d7 = '<span style="width:7px;height:7px;border-radius:50%;background:#D18700;display:inline-block"></span>';
    el.innerHTML = d7 + (SYNC_STATE==="stale"
      ? "Showing last saved \u00b7 refreshing\u2026 " + secs + "s"
      : "Syncing with Excel\u2026 " + secs + "s");
  }, 1000);
  try{
    const d = await callFlow({ table:"READ" });
    LAST_READ_MS = Date.now() - _t0;
    clearInterval(window._syncTick);
    _READ_CACHE = d; _READ_AT = Date.now();
    applyReadPayload(d);
    writeStoredSnapshot(d);

    /* Record what actually came back. A sync that succeeds but returns an empty
       table looks exactly like a broken one from the page - both are blank -
       so the counts go in the log where they can be read. */
    READ_COUNTS = {};
    ["employees","pairings","career","actions","comments","targets",
     "certifications","permissions","config","evpCycles","evpResponses"]
      .forEach(k => READ_COUNTS[k] = Array.isArray(d[k]) ? d[k].length : 0);
    SYNC_LOG.push({ t:new Date().toTimeString().slice(0,8), table:"READ", ok:true,
      key:(LAST_READ_MS/1000).toFixed(1)+"s \u00b7 "+Object.keys(READ_COUNTS).map(k=>k+" "+READ_COUNTS[k]).join(", ") });
    if(SYNC_LOG.length > 100) SYNC_LOG.shift();

    const anyRows = Object.keys(READ_COUNTS).some(k=>READ_COUNTS[k] > 0);
    if(!anyRows){
      SYNC_STATE = "empty"; syncPill();
      if(manual) toast("The flow replied, but every table was empty");
      return;
    }
    if(typeof dirSync==="function") dirSync("done");
    if(manual) toast("Refreshed from Excel");
    return;
  }catch(err){
    console.error("[sync] read failed", err);
    SYNC_STATE = "error"; syncPill();
    if(manual) toast("Couldn't reach Excel \u2014 check the flow and try again");
    return;
  }
}
function applyReadPayload(d){
  {

    /* -- 2. employees -------------------------------------------------- */
    if(Array.isArray(d.employees) && d.employees.length){
      const seeded = DB.employees;            // keep seeded email/role as a fallback
      DB.employees = {};
      d.employees.filter(e=>e.EmployeeID && String(e.RecordStatus||"Active")!=="Inactive").forEach(e=>{
        DB.employees[e.EmployeeID] = {
          id:e.EmployeeID, name:e.FullName,
          email:e.WorkEmail || (seeded[e.EmployeeID]||{}).email || "",
          fn:e.Function, sub:e.SubFunction, desig:e.Designation,
          lvl:Number(e.Level)||0, mgr:e.ManagerID||null,
          hipot:truthy(e.HiPot), hcat:e.HiPotCategory||"", loc:e.Location||"\u2014",
          mentorId:e.MentorID||"",
          f360Url:e.Feedback360URL || (seeded[e.EmployeeID]||{}).f360Url || "",
          insightUrl:e.ExpertInsightsURL || (seeded[e.EmployeeID]||{}).insightUrl || "",
          evpUrl:e.EVPURL || (seeded[e.EmployeeID]||{}).evpUrl || "",
          projUrl:e.ProjectFeedbackURL || (seeded[e.EmployeeID]||{}).projUrl || "",
          role:e.PortalRole || (seeded[e.EmployeeID]||{}).role || "Employee"
        };
      });
    }

    /* -- pairings (drives mentor access) -------------------------------- */
    if(Array.isArray(d.pairings)){
      DB.pairings = d.pairings.filter(p=>p.PairingID).map(p=>({
        id:p.PairingID, mentee:p.MenteeID, mentor:p.MentorID,
        type:p.PairingType||"Career", status:p.Status||"Active"
      }));
    }

    /* -- 4. next role + readiness tenure -------------------------------- */
    if(Array.isArray(d.career)){
      DB.career = {};
      d.career.filter(c=>c.EmployeeID).forEach(c=>{
        const ladder = String(c.CareerLadder||"").split("|").map(s=>s.trim()).filter(Boolean);
        const at = Number(c.CurrentRungIndex);
        DB.career[c.EmployeeID] = { selectedPath:0, paths:[{
          name: c.PathName || "Career path",
          ladder: ladder,
          atIdx: isNaN(at) ? Math.max(0, ladder.indexOf(c.CurrentRole)) : at,
          next: c.NextRole || "",
          readiness: c.Readiness || "",
          brief: c.FocusBrief || "",
          _rowId: c.CareerID,
          _setBy: c.ReadinessSetBy || "",
          _review: c.ReadinessReviewDate || "",
          _approval: c.ApprovalStatus || "Approved" 
        }]};
      });
    }

    /* -- 3. tasks + comments -------------------------------------------- */
    /* index the active pairings once, rather than re-scanning the whole
       pairings array for every employee (that was employees x pairings) */
    DB.learningPlans = {};
    const mentorOf = {};
    DB.pairings.forEach(x=>{
      if(x.status==="Active" && !(x.mentee in mentorOf)) mentorOf[x.mentee] = x.mentor;
    });
    Object.keys(DB.employees).forEach(id=>{
      DB.learningPlans[id] = { mentor: mentorOf[id] || null, actions:[], changelog:[], archive:[] };
    });
    (d.actions||[]).filter(a=>a.ActionID).forEach(a=>{
      const lp = DB.learningPlans[a.EmployeeID]; if(!lp) return;
      if(!truthy(a.VisibleToMentee) && !IS_ADMIN && ROLE==="employee") return;   // row-level visibility
      const o = {
        id:a.ActionID, title:a.ActionTitle, band:String(a.Band),
        timeline:{start:a.StartDate||"", end:a.EndDate||""},
        status:a.ApprovalStatus||"Approved", update:normLAStatus(a.StatusUpdate||""),
        comment:a.LatestComment||"",
        priority:a.Priority?String(a.Priority).replace(/^P/i,""):"", outcome:a.ExpectedOutcome||"",
        origin:a.Origin||"General",
        _visMentee: truthy(a.VisibleToMentee) ? "TRUE" : "FALSE",
        _visLead:   truthy(a.VisibleToLeadership) ? "TRUE" : "FALSE",
        _createdBy: a.CreatedBy||"", _createdOn: a.CreatedOn||""
      };
      /* rows whose status was set to "Archived" stay in the archive across
         reloads instead of reappearing in the active plan */
      if(String(o.update).trim().toLowerCase()==="deleted"){
        o.update = "Deleted";
        lp.archive = lp.archive || [];
        lp.archive.push(o);
      } else {
        lp.actions.push(o);
      }
      if(a.MentorID && !lp.mentor) lp.mentor = a.MentorID;
    });
    (d.comments||[]).filter(c=>c.CommentID).forEach(c=>{
      const lp = DB.learningPlans[c.EmployeeID]; if(!lp) return;
      if(!truthy(c.VisibleToMentee) && !IS_ADMIN && ROLE==="employee") return;
      const role = String(c.AuthorRole||"");
      if(role.slice(0,4).toLowerCase()==="log:"){
        /* a persisted change-log entry — restore it with its original act */
        lp.changelog.push({ ts:c.CreatedOn||"", by:c.AuthorID,
          act:role.slice(4)||"edited", target:c.ActionID||"\u2014", note:c.CommentText||"" });
      } else {
        lp.changelog.push({ d:c.CreatedOn||"", by:c.AuthorID,
          tt:(role||"Comment")+" \u00b7 "+(c.ActionID||""), tx:c.CommentText||"" });
      }
    });

    /* -- hipot targets ---------------------------------------------------- */
    if(Array.isArray(d.targets)){
      DB.targets = d.targets.filter(t=>t.TargetID).map(t=>({
        id:t.TargetID, emp:t.EmployeeID, initiative:t.Initiative||"", focus:t.FocusArea||"",
        okr:t.Target||"", target:t.Target||"", timeline:t.Timeline||"", comments:t.Comments||"",
        status:t.Status||"Not Started", selfFb:t.SelfFeedback||"", mentorFb:t.MentorFeedback||""
      }));
    }
    /* OKR comment threads ride the Comments sheet, keyed by the HP- initiative
       id they were filed against. Rebuilt on every read so they survive a refresh. */
    if(Array.isArray(d.comments)){
      DB.hipotThreads = {};
      d.comments.filter(c=>{ const a=String(c.ActionID||""); return a.indexOf("HP-")===0 || a.indexOf("okr:")===0; })
        .sort((a,b)=>String(a.CreatedOn||"").localeCompare(String(b.CreatedOn||"")))
        .forEach(c=>{
          const a = c.ActionID;
          (DB.hipotThreads[a] = DB.hipotThreads[a] || [])
            .push({ by:c.AuthorID||"", at:String(c.CreatedOn||"").slice(0,16), text:c.CommentText||"" });
        });
    }

    /* top the table up from the hardcoded plans for anything Excel doesn't
       have yet - runs after employees are in, so the names can be matched */
    try{ seedPlanTargets(); }catch(e){ console.error("[plans] seeding failed", e); }

    /* -- 360 feedback ------------------------------------------------------
       One row per person per attribute, from the Feedback360 table. Joined on
       DocKey, the same flattened-name key the PDFs used, so it works whether or
       not the person has a work email. Peer is blank for anyone whose cycle had
       no peer group — Self and Team only. */
    if(Array.isArray(d.feedback360)){
      DB.f360 = {};
      const num = v => { const n = Number(v); return (v===""||v==null||isNaN(n)) ? null : n; };
      d.feedback360.forEach(x=>{
        const key = String(x.DocKey||"").trim().toLowerCase();
        if(!key || !x.Attribute) return;
        const rec = DB.f360[key] = DB.f360[key] ||
          { name:x.FullName||"", cycle:x.Cycle||"", reviewers:x.Reviewers||"", rows:[] };
        rec.rows.push({ cat:String(x.Category||"Other"), attr:String(x.Attribute),
                        overall:num(x.Overall), self:num(x.Self),
                        peer:num(x.Peer), team:num(x.Team) });
      });
    }

    /* -- EVP cycle + responses ------------------------------------------- */
    if(Array.isArray(d.evpCycles) && d.evpCycles.length){
      const cur = d.evpCycles.filter(c=>c.CycleID)
        .sort((a,b)=>String(b.ConductedOn||"").localeCompare(String(a.ConductedOn||"")))[0];
      if(cur) DB.evpCycle = { id:cur.CycleID, name:cur.CycleName,
                              conducted:cur.ConductedOn, nextDue:cur.NextDueOn||"" };
    }
    if(Array.isArray(d.evpResponses)){
      /* Columns come straight from the EVP survey export:
         Submitted at | Email | Name | Role | Mentor | <Pillar> rank/sat/comment
         Rows are matched to people by work email. */
      const byEmail = {};
      Object.keys(DB.employees).forEach(id=>{
        const e = String(DB.employees[id].email||"").trim().toLowerCase();
        if(e) byEmail[e] = id;
      });
      DB.evpResponse = {};
      d.evpResponses.forEach(x=>{
        const id = byEmail[String(x["Email"]||"").trim().toLowerCase()];
        if(!id) return;
        const ranks={}, sat={}, comments={};
        EVP_PILLARS.forEach(pl=>{
          const c = pl.col;
          const rk = Number(x[c+" rank"]), st = Number(x[c+" sat"]);
          if(!isNaN(rk) && rk) ranks[pl.k] = rk;
          if(!isNaN(st) && st) sat[pl.k] = st;
          const cm = x[c+" comment"];
          if(cm) comments[pl.k] = String(cm);
        });
        DB.evpResponse[id] = { ranks, sat, comments,
          on: String(x["Submitted at"]||"").slice(0,10) };
      });
    }

    /* -- certifications -------------------------------------------------- */
    if(Array.isArray(d.certifications)){
      DB.certs = {};
      d.certifications.filter(c=>c.CertID).forEach(c=>{
        (DB.certs[c.EmployeeID] = DB.certs[c.EmployeeID] || []).push({
          id:c.CertID, type:c.EntryType||"Certification", name:c.CertName, issuer:c.Issuer||"",
          date:c.CompletedOn||"", expires:c.ExpiresOn||"", cred:c.CredentialID||"",
          hours:c.DurationHours||"", mode:c.Mode||"",
          fileUrl:c.FileURL||"", fileName:c.FileName||""
        });
      });
    }

    /* -- 1. visibility + editor toggles --------------------------------- */
    (d.permissions||[]).filter(p=>p.PermissionKey).forEach(p=>{
      DB.perms[p.PermissionKey] = { vis:truthy(p.MenteeVisible), edit:truthy(p.MenteeEdit) };
      if(String(p.MentorVisible).toLowerCase() !== "n/a")
        DB.permsMentor[p.PermissionKey] = { vis:truthy(p.MentorVisible), edit:truthy(p.MentorEdit) };
    });
    (d.config||[]).filter(c=>c.SettingKey).forEach(c=>{
      const v = String(c.Value).trim().toUpperCase();
      DB.config[c.SettingKey] = v==="TRUE" ? true : v==="FALSE" ? false : c.Value;
    });

    if(typeof rebuildRoleActors==="function") rebuildRoleActors();
    LAST_SYNC = new Date().toTimeString().slice(0,5);
    SYNC_STATE = "live"; syncPill();
    if(CURRENT_EMP){ buildNav(); updateMeta(); render(); }
  }
}

/* ---------- WRITE: same URL, the table name picks the Switch case ---------- */
function saveToExcel(table, key, fields, meta){
  if(!SYNC_ON()) return Promise.resolve();
  return callFlow(Object.assign({
    table: table, key: key || "", fields: fields || {}
  }, meta || {})).then(()=>{
    LAST_SYNC = new Date().toTimeString().slice(0,5);
    SYNC_STATE = "live"; syncPill();
    return true;
  }).catch(err=>{
    console.error("[sync] write failed", table, key, err);
    SYNC_STATE = "error"; syncPill();
    toast("Saved on screen, but Excel didn't confirm \u2014 refresh to check");
    return false;
  });
}
const today = () => new Date().toISOString().slice(0,10);

/* ============================================================================
   HOOKS — the existing save functions are wrapped, not rewritten
   ========================================================================== */

/* 1. toggles ---------------------------------------------------------------- */
const _togglePerm = togglePerm;
togglePerm = function(reg, key, field, on){
  _togglePerm(reg, key, field, on);
  const col = (reg==="mentor" ? "Mentor" : "Mentee") + (field==="vis" ? "Visible" : "Edit");
  const B  = v => v!==false ? "TRUE" : "FALSE";
  const pe = DB.perms[key] || {vis:true, edit:true};
  const pm = DB.permsMentor[key];               // absent on leadership-only keys
  saveToExcel("Permissions", key, {
    PermissionKey: key,
    MenteeVisible: B(pe.vis),          MenteeEdit: B(pe.edit),
    MentorVisible: pm ? B(pm.vis) : "n/a",
    MentorEdit:    pm ? B(pm.edit) : "n/a",
    LastChangedBy: CURRENT_EMP || ACTOR, LastChangedOn: today()
  }, {field:col, oldValue:String(!on).toUpperCase(), newValue:String(on).toUpperCase(), changeType:"Updated"});
};

/* 2. employees -------------------------------------------------------------- */
function empRow(e, id, status){
  return {
    EmployeeID:id, FullName:e.name, WorkEmail:e.email||"", Function:e.fn, SubFunction:e.sub,
    Designation:e.desig, Level:e.lvl, ManagerID:e.mgr||"", MentorID:e.mentorId||"",
    HiPot:e.hipot?"TRUE":"FALSE", HiPotCategory:e.hcat||"", Location:e.loc||"",
    PortalRole:e.role||"Employee", RecordStatus:status,
    Feedback360URL:e.f360Url||"", ExpertInsightsURL:e.insightUrl||"", EVPURL:e.evpUrl||"",
    ProjectFeedbackURL:e.projUrl||"",
    LastUpdatedBy:CURRENT_EMP||ACTOR, LastUpdatedOn:today()
  };
}
const _saveEmp = saveEmp;
saveEmp = function(id){
  const before = new Set(Object.keys(DB.employees));
  _saveEmp(id);
  const targetId = id || Object.keys(DB.employees).find(k=>!before.has(k));
  const e = DB.employees[targetId]; if(!e) return;
  saveToExcel(id ? "Employees" : "EmployeesNew", targetId, empRow(e, targetId, "Active"),
    {changeType: id ? "Updated" : "Created"});
};

function deactivate(id, orig){
  const snap = DB.employees[id];
  if(!snap) return;
  const row = empRow(snap, id, "Inactive");
  orig(id);
  if(!DB.employees[id])
    saveToExcel("Employees", id, row,
      {changeType:"Deactivated", field:"RecordStatus", oldValue:"Active", newValue:"Inactive"});
}
const _quickDeleteEmp = quickDeleteEmp;
quickDeleteEmp = function(id){ deactivate(id, _quickDeleteEmp); };
const _deleteEmp = deleteEmp;
deleteEmp = function(id){ deactivate(id, _deleteEmp); };

/* 3. tasks, status and comments --------------------------------------------- */
function newActionId(){
  const used = new Set();
  Object.values(DB.learningPlans).forEach(p => (p.actions||[]).forEach(x => used.add(x.id)));
  let id;
  do {
    id = "LA-" + Date.now().toString(36).slice(-5)
       + Math.floor(Math.random()*46656).toString(36).padStart(3, "0");
  } while(used.has(id));
  return id;
}
function actionRow(a, eid, mentorId){
  /* Origin rides in the Outcome-adjacent columns via its own field; if the
     sheet has no column for it the value simply won't come back and the action
     counts as General, which is the safe default. */
  return {
    ActionID:a.id, EmployeeID:eid, Band:String(a.band), ActionTitle:a.title,
    StartDate:(a.timeline&&a.timeline.start)||"", EndDate:(a.timeline&&a.timeline.end)||"",
    ApprovalStatus:a.status||"Approved", StatusUpdate:a.update||"", LatestComment:a.comment||"",
    Priority:a.priority||"", ExpectedOutcome:a.outcome||"",
    VisibleToMentee:a._visMentee||"TRUE", VisibleToLeadership:a._visLead||"TRUE",
    MentorID:mentorId||"", Origin:a.origin||"General",
    CreatedBy:a._createdBy||(CURRENT_EMP||ACTOR), CreatedOn:a._createdOn||today(),
    LastUpdatedBy:CURRENT_EMP||ACTOR, LastUpdatedOn:today()
  };
}
const _saveLA = saveLA;
saveLA = function(id){
  const fromEvp = _evpActionFrom;
  const lp = DB.learningPlans[ACTOR];
  const snap = {};
  if(lp) lp.actions.forEach(a => snap[a.id] = JSON.stringify(a));
  _saveLA(id);
  if(!lp) return;
  lp.actions.forEach(a=>{
    const was = snap[a.id];
    if(was === JSON.stringify(a)) return;          // untouched
    const isNew = was === undefined;
    if(isNew){
      // the prototype's id is "LA-" + a number under ~95, which collides across
      // employees. ActionID is the key column, so give it a table-wide unique one.
      const oldId = a.id;
      a.id = newActionId();
      lp.changelog.forEach(l => { if(l.target === oldId) l.target = a.id; });
      a._createdBy = CURRENT_EMP||ACTOR; a._createdOn = today();
    }
    saveToExcel(isNew ? "ActionsNew" : "Actions", a.id,
      actionRow(a, ACTOR, lp.mentor), {changeType: isNew ? "Created" : "Updated"});

    if(_evpActionFrom && isNew) laLog(ACTOR, ACTOR, "created", a.id,
      "Raised from " + (_evpActionSrc||"the EVP check-in") + " \u2014 " + _evpActionFrom);

    // a changed comment is also filed as its own threaded comment row
    const prev = was ? (JSON.parse(was).comment||"") : "";

/* ============================================================================
   SIGN IN — employee ID, access taken from PortalRole on the Employees sheet
   ========================================================================== */
const ROLE_FROM_SHEET = { "HR Admin":"hr", "Leadership":"leader", "Mentor":"mentor", "Employee":"employee" };
let DIRECTORY_READY = false;

function dirNote(txt){
  const el = document.getElementById("dirNote");
  if(el) el.textContent = txt;
}

/* The first sync takes a while against Excel, so say so plainly rather than
   leaving people looking at a form that rejects them. Hidden once data is in. */
function dirSync(state, secs){
  const box = document.getElementById("dirSync");
  const txt = document.getElementById("dirSyncTxt");
  if(!box || !txt) return;
  if(state === "done"){ box.classList.add("done"); return; }
  box.classList.remove("done");
  txt.textContent = state === "refreshing"
    ? "You can sign in now \u2014 still refreshing in the background."
    : "Please wait a few seconds while the database syncs\u2026"
      + (secs > 3 ? " (" + secs + "s)" : "");
  if(state === "refreshing"){
    const sp = box.querySelector(".sp");
    if(sp) sp.style.borderTopColor = "var(--jade)";
  }
}

/* match on WorkEmail from the Employees sheet, case- and space-insensitive */
function findByEmail(raw){
  const e = String(raw||"").trim().toLowerCase();
  if(!e) return "";
  const hit = Object.keys(DB.employees).find(id =>
    String(DB.employees[id].email||"").trim().toLowerCase() === e);
  return hit || "";
}
/* fallback so an employee ID typed into the box still works: "5102" -> "E-5102" */
function normaliseId(raw){
  const s = String(raw||"").trim().toUpperCase().replace(/\s+/g, "");
  if(!s) return "";
  return /^E-/.test(s) ? s : "E-" + s.replace(/^E/, "");
}

doLogin = function(){
  const err = document.getElementById("loginErr");
  const raw = (document.getElementById("loginEmail").value || "").trim();
  if(!raw){ err.textContent = "Enter your work email."; return; }

  const id = findByEmail(raw) || (raw.indexOf("@") === -1 ? normaliseId(raw) : "");
  const emp = id ? DB.employees[id] : null;
  if(!emp){
    err.textContent = (SYNC_ON() && !DIRECTORY_READY)
      ? "Still loading the directory \u2014 try again in a moment."
      : "No active account for " + raw + ".";
    return;
  }
  err.textContent = "";

  /* one-time verification code, emailed via the flow. Demo mode (no flow URL)
     can't send email, so it signs straight in. */
  if(SYNC_ON() && !otpBypassed(id, emp)){ startOtp(id, emp); return; }
  completeLogin(id, emp);
};

/* ---------------------------------------------------------------------------
   OTP bypass. Driven by an OTPBypass row on the Config sheet — a comma
   separated list of work emails and/or EmployeeIDs. Anyone on it signs in on
   their email alone, with no code. That means whoever knows the address can
   sign in as them, so it is meant for a demo seat or a test account, not for
   a real person and never for an HR Admin. Blank or missing = everyone gets
   a code, which is the default.
   --------------------------------------------------------------------------- */
function otpBypassList(){
  const raw = (DB.config||{})["OTPBypass"];
  if(raw === true || raw === false || raw == null) return [];   // TRUE/FALSE isn't a list
  return String(raw).split(/[,;\s]+/).map(s=>s.trim().toLowerCase()).filter(Boolean);
}
function otpBypassed(id, emp){
  const list = otpBypassList();
  if(!list.length) return false;
  const email = String((emp||{}).email||"").trim().toLowerCase();
  return list.indexOf(String(id||"").toLowerCase()) !== -1
      || (!!email && list.indexOf(email) !== -1);
}

let _OTP = null;
function startOtp(id, emp){
  const email = emp.email || "";
  if(!email){ completeLogin(id, emp); return; }   // no email on record — nothing to send a code to
  const code = String(Math.floor(100000 + Math.random()*900000));
  _OTP = { id, emp, code, expires: Date.now()+5*60000, tries:0, lastSent: Date.now() };
  callFlow({ table:"OTP", key:id, fields:{ Email:email, Name:emp.name||id, Code:code } })
    .catch(()=>{ const el=document.getElementById("otpErr");
      if(el) el.textContent="Couldn't send the code \u2014 use Resend, or check the flow's OTP case."; });
  document.getElementById("emailStep").style.display="none";
  document.getElementById("otpStep").style.display="block";
  const masked = email.replace(/^(.).*(@.*)$/, "$1***$2");
  document.getElementById("otpNote").textContent = "We emailed a 6-digit code to "+masked+". It expires in 5 minutes.";
  document.getElementById("otpErr").textContent = "";
  const inp=document.getElementById("otpCode"); inp.value=""; inp.focus();
}
function verifyOtp(){
  const err=document.getElementById("otpErr");
  if(!_OTP){ otpBack(); return; }
  if(Date.now() > _OTP.expires){ err.textContent="That code has expired \u2014 press Resend for a new one."; return; }
  _OTP.tries++;
  if(_OTP.tries > 5){ err.textContent="Too many attempts \u2014 press Resend for a new code."; return; }
  const v=(document.getElementById("otpCode").value||"").trim();
  if(v !== _OTP.code){ err.textContent="That code doesn't match \u2014 check the email and try again."; return; }
  const {id, emp} = _OTP; _OTP = null;
  otpBack(true);
  completeLogin(id, emp);
}
function resendOtp(){
  if(!_OTP){ otpBack(); return; }
  if(Date.now() - _OTP.lastSent < 30000){
    document.getElementById("otpErr").textContent="Just sent \u2014 give it a few seconds before resending."; return;
  }
  startOtp(_OTP.id, _OTP.emp);
  document.getElementById("otpNote").textContent += "  (new code sent)";
}
function otpBack(silent){
  _OTP = null;
  document.getElementById("otpStep").style.display="none";
  document.getElementById("emailStep").style.display="block";
  if(!silent){ const e=document.getElementById("loginErr"); if(e) e.textContent=""; }
}

function completeLogin(id, emp){
  const sheetRole = emp.role || (id === "E-0001" ? "HR Admin" : "Employee");
  CURRENT_ACCOUNT = emp.email || id;
  CURRENT_EMP = id;
  IS_ADMIN = (sheetRole === "HR Admin");

  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("appShell").style.display = "flex";
  document.getElementById("rolePick").style.display = IS_ADMIN ? "block" : "none";
  document.getElementById("acctLine").innerHTML =
    "Signed in as<br><b>" + emp.name + "</b>"
    + '<br><span style="opacity:.65">' + id + " \u00b7 " + sheetRole + "</span>";

  const land = ROLE_FROM_SHEET[sheetRole] || "employee";
  const hats = Array.from(new Set([land].concat(availableRoles(id))))
                    .filter(r => r !== "leader" && r !== "hr");
  buildHatSwitcher(hats);
  if(!IS_ADMIN) ACTOR = id;
  setRole(land);
  updateBackBtn();
  /* Row-level visibility is applied client-side from data we already hold, so
     re-reading the whole workbook here was a second full round-trip for nothing.
     Re-apply what's cached; only go back to Excel if there's genuinely nothing. */
  if(_READ_CACHE){
    try{ applyReadPayload(_READ_CACHE); render(); }
    catch(e){ console.error("[sync] re-apply failed", e); loadFromExcel(false); }
  } else {
    loadFromExcel(false);
  }
}

/* the directory has to exist before anyone can sign in, so pull it up front */
syncPill();

/* the sticky page header only grows a border once it's actually stuck,
   so it stays flat at the very top of the page */
(function(){
  const ph = document.querySelector(".phead");
  if(!ph) return;
  const mark = () => ph.classList.toggle("stuck", window.scrollY > 4);
  window.addEventListener("scroll", mark, {passive:true});
  /* publish the header's real height so anything else that sticks can clear it
     rather than guessing - it changes with viewport width and wrapping */
  /* measured once at boot came back 0, because the login overlay is up and the
     header has no height yet - watch it instead so it stays right after login,
     on resize, and whenever the title wraps to two lines */
  const measure = () => {
    const h = Math.round(ph.getBoundingClientRect().height);
    if(h > 0) document.documentElement.style.setProperty("--pheadH", h + "px");
  };
  window.addEventListener("resize", measure, {passive:true});
  if(window.ResizeObserver){ new ResizeObserver(measure).observe(ph); }
  measure();
  mark();
})();
if(SYNC_ON()){

} else {

}

rove leadership effectiveness through better planning, alignment, and feedback balance. While weekend work is not excessively enforced, delivery expectations—especially toward the later stages of projects—often become compressed, which impacts quality and team confidence. Strategic planning, role clarity, and proactive handling of client-side dependencies could be strengthened to reduce last-minute pressure and ensure more predictable outcomes. Additionally, feedback tends to be more outcome-focused, where a single issue toward the end can outweigh sustained effort and consistent contributions across the project lifecycle. Providing more balanced and timely feedback, recognizing ongoing performance, and aligning expectations with complexity would help foster trust, motivation, and long-term engagement, while still meeting business and client objectives.","Sartaj manages the team very well, and I am happy to work with him."]}},

"ankitsethi":{"role":"Senior Vice President - Client Engagement","mgr":"Rahul Khosla","period":"February 2026","resp":"8 Peers, 3 Team members, and Self","exec":"Ankit is a trusted, client-facing leader whose credibility is recognised equally by his team and his peers — unusually, this review draws mostly on peers (eight of eleven respondents). Client focus is his standout strength: prioritising client satisfaction and proactively addressing client challenges both score 4.58, and every respondent group named these among his top three. A peer captures why: he \"works incredibly hard to balance what is fair between us and client,\" is \"often in the line of fire when things are going wrong,\" and navigates those leadership-level conversations well — noting that \"our clients respect him a great deal and so do our internal teams.\" The same peer praises how deeply he listens, recalling that he quoted something from their first day. His team calls him \"a kind and strong leader who manages his team well and focuses intently on customer objectives and well-being.\" His calibration is notably modest: five hidden strengths where others rate him well above his own steady 4.0, against five blind spots with small gaps. The expert analysis confirms others generally rate his impact equal to or stronger than he does. The development theme is forward-looking: sharper future readiness, strategic articulation, and proactive insight-sharing — translating market trends and client objectives into clear guidance, with tighter ownership and role-fit definition.","appr":["Client focus & partnership. Prioritises client satisfaction and proactively addresses client challenges — joint top-rated areas (both 4.58).","Values-aligned leadership. Models behaviours that reinforce the company's culture and core values (4.42).","Team engagement & psychological safety. Engages the team around shared goals and creates a safe environment (both 4.33).","Calm credibility under pressure. Balances fairnes e talent and role alignment through periodic reviews, with clearer ownership and outcome-based expectations."],"cap":[["Strategic Thinking",4.1],["Communication",4.0],["Collaboration",4.1],["Execution",3.9],["Innovation",4.0],["Coaching",4.0],["Accountability",3.9],["Overall Leadership Effectiveness",4.1]],"dim":[["Client Focus",4.5,4.6,4.7,4.6],["Engage the Team & Drive Cultural Alignment",4.0,4.2,4.5,4.2],["Set the Direction",4.0,4.1,4.0,4.1],["Establish Ways of Working",4.0,3.9,3.8,3.9],["Get the Right People in the Right Place",4.0,3.9,4.0,3.9],["Measure & Align Performance to Objectives",4.0,3.8,4.0,3.9]],"cont":["Leading with exceptional client focus and proactive client partnership.","Balancing stakeholder interests fairly and staying composed under pressure.","Listening deeply, modelling company values, and sustaining psychological safety."],"start":["Translating market trends and client objectives into clear, actionable guidance for teams.","Surfacing client intel proactively for account and sales teams to act on.","Reviewing talent and role fit periodically, with clearer outcome-based expectations."],"stop":["Letting strong operational and client leadership crowd out anticipatory, forward-looking work.","Underrating genuine strengths — client partnership, cultural leadership, engagement, and psychological safety."]},
"ankurchaudhary":{"role":"Senior Manager - Project Management","mgr":"Pankaj Kumar","period":"February 2026","resp":"5 Peers, 13 Team members, and Self","exec":"Ankur is a steady, client-focused, approachable leader whose peers regard him as a strong leader and role model — particularly in client-centricity, cultural alignment, and execution. His team describes him as doing \"an excellent job of organizing and managing tasks while keeping the team aligned with overall objectives,\" approachable, listening carefully to concerns and ideas, and offering strong support, with guidance and clarity that make day-to-day work smoother. His strongest areas are client focus (4.26), team engagement, and psychological safety (both 4.21). A defining pattern is that he underrates himself: he rates a uniform 4.0 across every attribute, giving five hidden strengths and just one blind spot, with peers consistently rating him highest (4.2-4.6). Alongside this genuinely strong base, his team — the largest group here — identifies specific execution-level growth areas, echoed by the expert analysis: greater proactiveness in anticipating issues rather than responding after they arise, deeper analysis of impact and root cause before making commitments, sharper market anticipation, and more openness to colleagues' perspectives. The development theme is to pair his trusted, values-aligned leadership with more forward-looking planning and inclusive decision-making.","appr":["Client focus. Consistently prioritises client satisfaction — his top-rated area (4.26).","Team engagement & psychological safety. Engages the team around shared goals and creates a safe environment (both 4.21).","Client partnership & active listening. Anticipates client challenges and listens carefully to concerns and ideas (both 4.16).","Organised, approachable, supportive. Keeps the team aligned with objectives; guidance and clarity make daily work smoother (Team comment)."],"rec":["Introduce deliberate planning checkpo "jatinrelan":{"role":"Manager - Project Management","mgr":"Pradeep Patel","period":"February 2026","resp":"7 Peers, 14 Team members, and Self","exec":"Jatin is a calm, composed, and deeply trusted people-centric leader whose team and peers speak of him in glowing terms — \"one of the best managers I have ever worked with,\" calm and easy even in hard situations, and someone who builds strong relationships, empowers ownership, and creates a positive, collaborative environment. His strengths are clearly interpersonal and delivery-focused: client focus, values-aligned leadership, psychological safety, prioritisation, active listening, and steady support under pressure. His feedback shows a thoughtful calibration pattern: he is notably humble on future readiness and talent development — rating himself lower than others do — while rating himself a little higher than others on process consistency, ownership, strategy communication, and objective-setting. The development theme, which he himself acknowledges and the expert analysis reinforces, is forward-looking capability building: anticipating future challenges, developing talent more intentionally, and consistently translating strategy into long-term action — layered on top of genuinely strong, warm people leadership.","appr":["Client focus & values. Strong customer-centric mindset and values-aligned leadership (both 4.00).","Client partnership & team engagement. Proactively addresses client challenges and engages the team around shared goals (both 3.91).","Psychological safety & composure. Creates a safe space and stays calm and supportive even in hard situations (3.91; Team comments).","Relationships & empowerment. Builds strong relationships across teams and empowers ownership — \"one of the best managers\" (Peer/Team comments)."],"rec":["Increase future readiness by regularly sharing market trends, risks, and forward-looking insights.","Adopt a structured approach to developing high-potential talent — stretch assignm "jonathanlane":{"role":"Architect - Frontend","mgr":"Una Verhoeven","period":"February 2026","resp":"2 Peers, 1 Team member, and Self","exec":"Jonathan is an adaptable, values-driven leader with strong interpersonal capability — excellent listening, responsiveness to feedback, a customer-centric mindset, and the ability to create a psychologically safe environment. Peers experience this most strongly, rating him highly across collaboration, adaptability, ownership, and quality of work. The clearest theme in his feedback is the gap between that strong peer perception and his team's day-to-day experience: his team sees more room in consistent engagement, everyday listening, role clarity, and deliberate talent development. Encouragingly, he already recognises several of these people-execution areas as growth areas himself, rating them modestly where the wider group rates him higher. His development focus is translating strong personal and interpersonal capability into a consistent team experience — through regular check-ins, clearer role alignment, and active development of team members. (These findings rest on a small set of four responses, including a single team member, so the team signal reflects one direct report's view.)","appr":["Active listening. Excellent listener who values input and responds well to feedback — a top-rated area (4.5).","Client focus. Strong customer-centric mindset and client satisfaction (4.5).","Adaptability. Confidently adjusts strategy to evolving needs (4.25).","Collaboration & psychological safety. Peers value his supportive environment, ownership, and consistently high-quality work (Peer / expert analysis)."],"rec":["Hold regular team check-ins to clarify goals, priorities, and individual responsibilities.","Review and align roles so team members are matched to their strengths.","Invest in developing team members through coaching, mentoring, and growth opportunities.","Bring more consistency to day-to-day engagement and everyday listen "kalaivanir":{"role":"Manager - Operation Excellence","mgr":"Abhinaya Srinivasan","period":"February 2026","resp":"3 Team members and Self (no peers)","exec":"Kalaivani is a beloved, people-centric leader whose team experiences her leadership as inclusive, empathetic, and deeply supportive. In one team member's words, the team runs smoothly as a direct result of her dedication — she provides individual support, ensures everyone has the resources to thrive, and has built an inclusive environment. Her standout strengths are role-model values-aligned leadership and active listening (both a perfect 5.0), alongside strong talent development, consistent processes, and customer focus. This review is based on her team and self only (no peer respondents), and the two views align closely and warmly. Notably, she is a modest underrater — she rates herself 4.0 on several areas her team rates 4.67, giving her five hidden strengths and only two calibration blind spots where the team still rates her a very high 4.67. The one growth theme both she and her team converge on, per the expert analysis, is elevating strategic visibility: communicating strategy and future direction more frequently and clearly, and linking day-to-day priorities to long-term goals — additive to already strong people leadership and execution. (This review is based on 3 team members and self; no peer respondents were included.)","appr":["Values-aligned leadership & active listening. Models the company's values and listens intentionally — both perfect, role-model areas (5.0).","Talent development & consistent processes. Develops people and runs reliable, aligned processes (both 4.75).","Inclusive, supportive leadership. Provides individual support and resources for the team to thrive, in an inclusive environment (Team comment).","Psychological safety & engagement. Creates a safe space and actively engages the team around shared goals (4.50)."],"rec":["Communicate strategy more frequently and clearly, linking daily priorities to long-term business goals.","Create regular touchpoints to discuss market trends, risks, and future opportunities.","Increase visibility into strategic decision-making so the team feels prepared for growth and change.","Seek targeted feedback on strategic clarity to keep refining leadership impact."],"str":["Values-aligned leadership. Models behaviours that reinforce the company's culture and core values — a perfect, role-model score (5.0).","Active listening. Values team input and responds constructively — also a perfect 5.0.","Talent development. Develops and promotes people through meaningful opportunities (4.75).","Consistent processes. Aligns work to goals and tracks performance reliably (4.75).","Inclusive, supportive leadership. Individual support and an inclusive environment where the team thrives (Team comment)."],"dev":["Strategic articulation & communication. Communicating clear strategy and direction more explicitly — the shared growth theme (4.25).","Future readiness. Sharpening future-oriented thinking and market foresight (self-identified; expert analysis).","Strategic visibility. Making strategic decision-making more visible so the team feels prepared for change (expert analysis).","Proactive client challenge-handling. Anticipating and addressing client challenges (4.25).","Recognising her own strengths. She underrates several areas her team rates 4.67 (hidden strengths)."],"gaps":"Kalaivani's profile is that of a modest, well-calibrated leader who slightly underrates herself. Because this is a team-and-self review with no peers, \"others\" here means her three team members — and they consistently rate her at or above her own self-view. She has five hidden strengths, rating herself 4.0 on client focus, adaptability, team engagement, psychological safety, and objective-setting while her team rates all of these 4.67. Her two \"blind spots\" — talent development and consistent processes — are areas she rates a role-model 5.0, but her t orking style."],"start":["Building regular, visible appreciation and recognition into team routines.","Strengthening technical knowledge relevant to data and project management.","Reinforcing cultural values through visible daily actions and seeking regular feedback."],"stop":["Assuming appreciation is felt without being expressed explicitly and routinely.","Letting talent development and future readiness sit behind day-to-day delivery."]},

nd guiding the team with clarity and confidence.","Bringing deep technical credibility and stepping in to solve difficult problems.","Mentoring others generously and supporting new joiners."],"start":["Engaging peers proactively to communicate strategic intent and long-term thinking.","Sharing technical expertise through broader organisational and strategic forums.","Making long-term planning and future-readiness initiatives visible."],"stop":["Assuming a confident self-view and strong team perception fully match how peers experience his strategic breadth.","Letting hands-on support crowd out visible long-term planning and influence."]},
