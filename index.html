"vikasmishra":{"role":"Director - Delivery","mgr":"Zoran Miuca","period":"February 2026","resp":"5 Peers, 7 Team members, and Self","exec":"Vikas is a confident, results-oriented delivery leader with strong client focus and a track record of turning around complex, high-risk programs. Peers and clients value his proactivity, clear communication, and willingness to step into critical roles — one peer notes he took on a dual Delivery Director and Project Manager role exactly when the project needed it, and clients appreciate his clear, concise responses. His self-view and peers' align closely on delivery ownership and client confidence. The key development theme, raised by the team and reinforced by the expert analysis, is people-leadership during execution-intensive phases: greater openness to constructive team feedback, more empathy for team constraints under pressure, stronger psychological safety and active listening, more intentional talent development, and clearer internal communication. His self-ratings run above the team's on the people dimensions, so calibration matters too. The strengths in delivery and client relationships are consistently recognised; the opportunity is to balance them with internal team enablement and morale.","appr":["Client focus. Strong customer-centric mindset and client satisfaction — his top-rated area (3.85).","Proactive delivery leadership. Results-oriented and proactive, stepping up in critical situations to keep programs on track (Peer comments).","Clear client communication. Puts points forward clearly and concisely — valued by clients (Peer comment).","Clear strategy & high morale. Communicates clear strategy and keeps morale high through proactivity (3.77; Peer)."],"rec":["Actively seek and reflect on constructive team feedback in 1:1s and retrospectives, responding visibly.","Practise empathetic communication — acknowledge team workload pressures before setting or adjusting priorities.","Schedule structured talent-development discussions and provide meaningful stretch assignments.","Strengthen psychological safety and active listening; use brief pulse checks to gauge team alignment."],"str":["Client focus. Consistently prioritises client satisfaction — his top-rated area (3.85).","Proactive client partnership. Anticipates and addresses client challenges to strengthen relationships (3.77).","Clear strategy communication. Develops and communicates clear, actionable strategy (3.77).","Values-aligned leadership & clear ownership. Models the company's values and assigns clear responsibility for outcomes (both 3.69).","Steps up under pressure. Takes on critical roles, communicates clearly with clients, and keeps morale high (Peer comments)."],"dev":["Talent development. Identifying, developing, and promoting talent — the lowest-rated area by a clear margin (3.15; a blind spot).","Openness & empathy under pressure. Absorbing team feedback and acknowledging constraints during high-pressure delivery — the central theme (team comment; expert analysis).","Psychological safety & active listening. Reinforcing a safe, open environment and intentional listening (both 3.54; blind spots).","Team engagement. Engaging the team around culture and shared goals more consistently (3.54).","Market foresight. Staying ahead of market trends and preparing the team for the future (3.38)."],"gaps":"Vikas rates himself a consistent 4.0, at or above others on every attribute, so no hidden strengths appear — and five blind spots do, all on the people-leadership side: talent development (self 4.0 vs others 3.08, the widest gap), market foresight, team engagement, psychological safety, and active listening. The underlying pattern is a clear split by responder group: his self-view and peers' align on delivery ownership and client confidence, while his team — especially during high-pressure delivery — experiences less openness, empathy, and psychological safety than he perceives. The expert analysis frames this as a recurring people-leadership theme rather than a delivery gap: the strengths that make him effective with clients and peers need to be matched by greater openness to team feedback, empathy for constraints, and intentional talent development. Closing that gap is the core of his growth.","gapt":[["Identifies, develops & promotes talent",4.0,3.08],["Stays ahead of market trends",4.0,3.33],["Actively engages the team",4.0,3.5],["Creates a psychologically safe workplace",4.0,3.5],["Active & intentional listener",4.0,3.5]],"top":["Actively seek and reflect on constructive team feedback in regular 1:1s and retrospectives, responding visibly to show follow-through.","Practise empathetic communication — acknowledge team workload pressures before setting or adjusting priorities, especially in high-stakes deliveries.","Invest in intentional talent development through structured growth discussions and stretch assignments, and strengthen psychological safety."],"cap":[["Strategic Thinking",3.7],["Communication",3.7],["Collaboration",3.6],["Execution",3.6],["Innovation",3.5],["Coaching",3.3],["Accountability",3.6],["Overall Leadership Effectiveness",3.6]],"dim":[["Client Focus",4.0,3.7,3.9,3.8],["Set the Direction",4.0,3.4,3.9,3.7],["Engage the Team & Drive Cultural Alignment",4.0,3.6,3.5,3.6],["Measure & Align Performance to Objectives",4.0,3.8,3.4,3.6],["Establish Ways of Working",4.0,3.3,3.5,3.5],["Get the Right People in the Right Place",4.0,3.3,3.3,3.3]],"cont":["Leading with strong client focus and clear, concise client communication.","Stepping up in critical situations and keeping morale high through proactivity.","Adapting strategy to business needs and delivering complex programs."],"start":["Seeking and visibly acting on constructive team feedback in 1:1s and retrospectives.","Acknowledging team workload pressures before setting or adjusting priorities.","Scheduling structured talent-development discussions and providing stretch assignments."],"stop":["Assuming the strong client and peer view of his leadership matches the team's experience under pressure.","Letting execution intensity crowd out openness, empathy, and psychological safety within the team."]},
"vishwabhushan":{"role":"Senior Manager - Project Management","mgr":"Ankush Bansal","period":"February 2026","resp":"4 Peers, 8 Team members, and Self","exec":"Vishwa is a capable, delivery-focused leader whose team values his technical understanding and supportive nature. Team members describe him as \"very developer friendly,\" with good knowledge and skills and a helpful manner; another notes good leadership qualities — listening to the team, finding solutions, a positive mindset, supporting the team, and managing customers well. His strongest areas are proactive client partnership and psychological safety (both 3.69), followed by client focus, talent development, and consistent processes (all 3.62). An important piece of context: two of the thirteen respondents stated they had not worked with him — one peer and one team member, the latter explicitly asking that their feedback be set aside — which contributes to the notably lower peer ratings. The clearest pattern is a responder split the expert analysis highlights: his team's experience is moderate to strong (3.5-3.9), while peers rate lower (2.8-3.5), indicating reduced leadership visibility beyond the immediate team. His self-view sits above both, producing no hidden strengths and five blind spots. The development theme is therefore visibility and consistency: making leadership behaviours more observable in peer and cross-functional settings, sustaining people-leadership consistently under pressure, and using structured feedback to align intent with how it is experienced.","appr":["Proactive client partnership & psychological safety. Anticipates client challenges and creates a safe space — joint top-rated areas (both 3.69).","Client focus & consistent execution. Customer-centric mindset and consistent processes aligned to business goals (both 3.62; team 3.9).","Talent development. Develops and promotes people through meaningful opportunities — his strongest area with peers (3.62).","Developer-friendly & knowledgeable. Strong technical understanding, helpful nature, clear communication, and commitment to outcomes (Team comments)."],"rec":["Increase visibility of leadership behaviours in peer and cross-functional interactions.","Reinforce consistency in people-leadership behaviours across all situations, including high-pressure moments.","Offer support while maintaining shared ownership, so the team retains accountability under pressure.","Use structured feedback mechanisms to periodically validate alignment between self-perception and others' experience."],"str":["Proactive client partnership. Anticipates and addresses client challenges — a joint top-rated area (3.69; team 3.9).","Psychological safety. Creates a space where the team feels comfortable raising ideas and concerns (3.69).","Client focus. Consistently prioritises client satisfaction and manages customers well (3.62; team 3.9).","Talent development & consistent execution. Develops people and aligns work to business goals with reliable tracking (both 3.62).","Technical credibility & support. Developer-friendly, knowledgeable, and helpful; communicates clearly and commits to outcomes (Team comments)."],"dev":["Leadership visibility beyond the team. Making leadership behaviours observable in peer and cross-functional settings — the central theme (peers 2.8-3.5; expert).","Clear ownership & expectations. Assigning responsibility and setting outcome expectations consistently — tied lowest-rated area (3.38).","Values-aligned leadership. Reinforcing cultural and values-based behaviours consistently (3.38; a blind spot).","Shared ownership under pressure. Offering support while keeping accountability with the team in high-pressure moments (team comment; expert).","Listening as others experience it. Making listening and responsiveness visible day to day (3.46; a blind spot)."],"gaps":"No hidden strengths were identified — on every attribute Vishwa rated himself at or above how others rated him. His five blind spots are active listening and psychological safety (self 5.0 versus 3.33 and 3.58), and clear ownership, values-aligned leadership, and adaptability (self 4.0 versus 3.33-3.50). Two pieces of context matter in reading these. First, the responder split: his team rates him moderately to strongly (3.5-3.9), while peers rate lower (2.8-3.5), and the expert reads this as reduced leadership visibility beyond the immediate team rather than a difference of view about capability. Second, exposure: two respondents said they had not worked with him directly, and ratings on every attribute span the full 1-5 range, so part of the lower end reflects limited familiarity. Alongside this, the team's qualitative feedback is genuinely positive — clear communication, commitment to outcomes, technical understanding, and support — with one thoughtful observation that during high-pressure moments he can step in more actively, and that offering support while maintaining shared ownership would build trust and efficiency. So the growth theme is consistency and visibility: sustaining people-leadership behaviours evenly across situations, extending leadership presence into peer and cross-functional contexts, and using structured feedback to keep intent and experience aligned.","gapt":[["Active & intentional listener",5.0,3.33],["Creates a psychologically safe workplace",5.0,3.58],["Clearly assigns responsibility; outcomes over tasks",4.0,3.33],["Demonstrates leadership aligned with company values",4.0,3.33],["Confidently adapts strategies",4.0,3.5]],"top":["Increase visibility of leadership behaviours in peer and cross-functional interactions to extend impact beyond the immediate team.","Reinforce consistency in people-leadership behaviours across all situations — offering support while maintaining shared ownership under pressure.","Use structured feedback mechanisms to periodically validate alignment between self-perception and others' experience."],"cap":[["Strategic Thinking",3.5],["Communication",3.5],["Collaboration",3.5],["Execution",3.5],["Innovation",3.5],["Coaching",3.5],["Accountability",3.5],["Overall Leadership Effectiveness",3.6]],"dim":[["Client Focus",4.0,3.1,3.9,3.7],["Get the Right People in the Right Place",4.0,3.2,3.7,3.6],["Engage the Team & Drive Cultural Alignment",4.5,3.0,3.7,3.5],["Establish Ways of Working",4.0,3.0,3.8,3.5],["Measure & Align Performance to Objectives",4.0,2.9,3.8,3.5],["Set the Direction",4.0,3.0,3.8,3.5]],"cont":["Leading with strong client focus and proactive client partnership.","Bringing technical understanding, clear communication, and a supportive, developer-friendly approach.","Developing talent and keeping execution consistent and aligned to business goals."],"start":["Making leadership behaviours visible in peer and cross-functional interactions.","Offering support while maintaining shared ownership during high-pressure moments.","Using structured feedback to validate alignment between intent and experience."],"stop":["Stepping in and absorbing accountability under pressure rather than keeping ownership shared.","Assuming self-assessment matches external perception — calibrate with feedback regularly."]},
"yashkumar":{"role":"Vice President - Rainmakers","mgr":"Rahul Khosla","period":"February 2026","resp":"3 Peers, 16 Team members, and Self","exec":"Yash is a client-focused, people-first leader whose team speaks about him in exceptional terms. Drawing on 20 responses — including a large 16-member team — one team member writes that he is \"an exceptional leader and a true pillar of support,\" creating an environment where people feel \"empowered, trusted, and motivated,\" and singles out his ability to balance results with people-first leadership: a clear vision and high standards alongside a team that feels heard, with growth encouraged \"without micromanaging.\" Another says the team \"truly look up to\" him. Peers are equally positive, calling him an excellent seller and capable leader. His strongest areas are client focus (4.42) and proactive client partnership (4.37), followed by shared objective-setting and strategy communication (both 4.26). His calibration is balanced — five hidden strengths where others rate him above his own 4.0, and five blind spots where a role-model 5.0 self-view sits above still-strong external scores of 4.06-4.33. The one clear exception, and the central development signal, is active listening: his lowest-rated attribute at 3.89, with his team at 3.7 against his own 5.0 — the widest gap in the report. Paired with a team request for more regular connects on the bigger business picture and clearer career pathways, the theme is structure: complementing an approachable, supportive style with more deliberate listening mechanisms and development conversations across a large team.","appr":["Client focus & partnership. Prioritises client satisfaction and proactively addresses client challenges — top-rated areas (4.42 and 4.37).","Shared objective-setting & strategy communication. Sets clear objectives with the team and communicates actionable strategy (both 4.26).","Values-aligned leadership & right-people placement. Models company values and puts the right people in the right roles (both 4.21).","People-first leadership. Approachable and supportive; empowers the team and drives growth without micromanaging (Team comments)."],"rec":["Establish regular team-level and cross-team forums to share the broader business context, priorities, and progress.","Introduce clearer career pathways and skill-development conversations to strengthen long-term engagement.","Build more structured listening and feedback mechanisms to complement a supportive, approachable style.","Continue leveraging strong client and strategic strengths while consciously delegating and developing future leaders."],"str":["Client focus. Consistently prioritises client satisfaction — his top-rated area, named first by every group (4.42; peers 4.7).","Proactive client partnership. Anticipates and addresses client challenges to build long-term relationships (4.37).","Shared objective-setting. Works closely with the team to set clear objectives and secure commitment (4.26).","Strategy communication. Communicates clear, actionable strategy across the team and organisation (4.26; peers 4.7).","Empowering, motivating leadership. Creates an environment where people feel empowered, trusted, and motivated (Team comments)."],"dev":["Active listening & receiving feedback. Making receptiveness evident across a large team — the lowest-rated area and widest gap (3.89; team 3.7 vs self 5.0).","Broader business context. Regular connects on overall goals and the larger picture the team is working toward (team comment; expert).","Career pathways & skill development. Clearer growth guidance and structured development conversations (team comment; expert).","Process consistency & clear ownership. Aligning objectives to goals with reliable tracking (4.05 and 4.11; blind spots).","Delegating and developing future leaders. Building leadership depth within a large team (expert analysis)."],"gaps":"Yash's calibration is balanced — five hidden strengths and five blind spots. His hidden strengths show modesty: he rates himself 4.0 on strategy communication, right-people placement, adaptability, team engagement, and psychological safety, while others rate all five higher (4.11-4.28); peers put strategy communication at 4.7. Four of his five blind spots are narrow — clear ownership, values-aligned leadership, objective-setting, and client-challenge handling, where a role-model 5.0 self-view meets still-strong external scores of 4.06-4.33. The fifth is the exception and carries the real signal: active listening, where he rates himself 5.0 and his team rates 3.7, the widest gap in the report and his only attribute below 4.0. This sits in interesting tension with the qualitative feedback, which is genuinely outstanding — an approachable, supportive leader who makes people feel heard and empowered, who leads by example and grows the team without micromanaging. With 16 team members, the most useful reading is one of consistency and structure rather than intent: a supportive style that lands strongly for many may not reach everyone equally without deliberate mechanisms. The expert points in the same direction, pairing listening and feedback reception with a team request for more regular connects on the bigger business picture and clearer career pathways. So the growth theme is to add structure to a style that is already working: structured listening and feedback channels, regular business-context forums, and explicit development conversations.","gapt":[["Develops & communicates clear strategies",4.0,4.28],["Ensures the right people are in the right roles",4.0,4.22],["Confidently adapts strategies",4.0,4.17],["Actively engages the team",4.0,4.11],["Creates a psychologically safe workplace",4.0,4.11],["Active & intentional listener",5.0,3.83],["Clearly assigns responsibility; outcomes over tasks",5.0,4.06],["Demonstrates leadership aligned with company values",5.0,4.17],["Works closely with the team to set objectives",5.0,4.22],["Proactively addresses client challenges",5.0,4.33]],"top":["Build more structured listening and feedback mechanisms so receptiveness reaches every member of a large team, not only those closest to him.","Establish regular team-level and cross-team forums to share the broader business context, priorities, and progress.","Introduce clearer career pathways and skill-development conversations, while delegating to develop future leaders within the team."],"cap":[["Strategic Thinking",4.2],["Communication",4.1],["Collaboration",4.2],["Execution",4.2],["Innovation",4.1],["Coaching",4.0],["Accountability",4.1],["Overall Leadership Effectiveness",4.2]],"dim":[["Client Focus",5.0,4.5,4.3,4.4],["Establish Ways of Working",4.5,4.2,4.2,4.2],["Get the Right People in the Right Place",4.0,4.3,4.1,4.2],["Set the Direction",4.0,4.5,4.2,4.2],["Engage the Team & Drive Cultural Alignment",4.5,4.3,4.0,4.1],["Measure & Align Performance to Objectives",4.5,4.3,4.0,4.1]],"cont":["Leading with strong client focus and proactive client partnership.","Balancing results with people-first leadership — empowering and motivating the team.","Setting clear vision and objectives, and growing the team without micromanaging."],"start":["Building structured listening and feedback mechanisms across the full team.","Holding regular forums on broader business context, priorities, and progress.","Creating clear career pathways and structured skill-development conversations."],"stop":["Assuming an approachable style alone ensures every team member feels heard.","Underrating his own strategy communication, adaptability, and engagement strengths."]}
