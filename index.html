function saveEmp(id){
  const name=document.getElementById("emName").value.trim();
  const desig=document.getElementById("emDesig").value.trim();
  const lvl=+document.getElementById("emLvl").value;
  if(!name||!desig){document.getElementById("emErr").textContent="Name and designation are required.";return;}
  const fn=document.getElementById("emFn").value;
  const sub=document.getElementById("emSub").value.trim()||fn;
  const mentorId=document.getElementById("emMentor").value||"";
  const ladder=(document.getElementById("emLadder").value||"").split("|").map(x=>x.trim()).filter(Boolean);
  const atIdx=Math.max(0,+document.getElementById("emAtIdx").value||0);
  const nextRole=(document.getElementById("emNext").value||"").trim();
  const brief=(document.getElementById("emBrief").value||"").trim();
  const loc=document.getElementById("emLoc").value.trim();
  const hipot=document.getElementById("emHipot").checked;
  if(id){
    const e=DB.employees[id];
    Object.assign(e,{name,desig,lvl,fn,sub,loc,hipot,hcat:hipot?(e.hcat||"—"):"",mentorId});
    applyEmpExtras(id, mentorId, ladder, atIdx, nextRole, brief);
  }else{
    // generate a new Employee ID
    let n=5100; while(DB.employees["E-"+n]) n++;
    const newId="E-"+n;
    DB.employees[newId]={id:newId,name,fn,sub,desig,lvl,hipot,hcat:hipot?"—":"",loc,mentorId};
    applyEmpExtras(newId, mentorId, ladder, atIdx, nextRole, brief);
  }
  closeModal();render();toast(id?"Employee updated":"Employee added");
}
/* mentor pairing + career path/brief written from the employee editor */
function applyEmpExtras(eid, mentorId, ladder, atIdx, nextRole, brief){
  // --- mentor: keep Pairings as the single source of truth ---
  DB.pairings = DB.pairings || [];
  const existing = DB.pairings.find(p=>p.mentee===eid && p.status==="Active");
  if(mentorId){
    if(existing && existing.mentor!==mentorId){
      existing.mentor = mentorId;
      saveToExcel("Pairings", existing.id||"", pairingRowOf(existing), {changeType:"Updated"});
    } else if(!existing){
      const pid = "P-"+String(eid).replace(/^E-/,"")+"-1";
      const p = {id:pid, mentee:eid, mentor:mentorId, type:"Career", status:"Active", since:today()};
      DB.pairings.push(p);
      saveToExcel("PairingsNew", pid, pairingRowOf(p), {changeType:"Created"});
    }
    const lp = DB.learningPlans[eid]; if(lp) lp.mentor = mentorId;
  } else if(existing){
    existing.status = "Ended";
    saveToExcel("Pairings", existing.id||"", pairingRowOf(existing), {changeType:"Updated"});
  }
  // --- career path / next role / focus brief ---
  if(ladder.length || nextRole || brief){
    const cur = (DB.career[eid] && DB.career[eid].paths && DB.career[eid].paths[0]) || {};
    const path = Object.assign({}, cur, {
      name: cur.name || "Career path",
      ladder: ladder.length ? ladder : (cur.ladder||[]),
      atIdx: Math.min(atIdx, Math.max(0,(ladder.length?ladder:(cur.ladder||[])).length-1)),
      next: nextRole || cur.next || "",
      brief: brief || cur.brief || ""
    });
    if(!path._rowId) path._rowId = "CR-"+String(eid).replace(/^E-/,"");
    const isNew = !(cur && cur._rowId);
    DB.career[eid] = { selectedPath:0, paths:[path] };
    const keep = ACTOR; ACTOR = eid;
    saveToExcel(isNew?"CareerNew":"Career", path._rowId, careerRow(), {changeType:isNew?"Created":"Updated"});
    ACTOR = keep;
  }
}
function pairingRowOf(p){
  return { PairingID:p.id||"", MenteeID:p.mentee, MentorID:p.mentor,
           PairingType:p.type||"Career", Status:p.status||"Active",
           StartDate:p.since||today(), LastUpdatedBy:CURRENT_EMP||ACTOR, LastUpdatedOn:today() };
}
function deleteEmp(id){
  // guard: don't delete someone still referenced as a manager/mentor/etc.
  const refs=[];
  Object.values(DB.employees).forEach(e=>{if(e.mgr===id)refs.push(e.name+" (reports to them)");});
  DB.pairings.forEach(p=>{if(p.mentor===id||p.mentee===id)refs.push("a mentoring pairing");});
  if(refs.length){toast("Can't delete — still referenced by "+refs.length+" record(s)");return;}
  delete DB.employees[id];
  closeModal();render();toast("Employee removed");
}
function quickDeleteEmp(id){
  const refs=[];
  Object.values(DB.employees).forEach(e=>{if(e.mgr===id)refs.push(e.name);});
  DB.pairings.forEach(p=>{if(p.mentor===id||p.mentee===id)refs.push("pairing");});
  if(refs.length){toast("Can't delete — still referenced by "+refs.length+" record(s)");return;}
  delete DB.employees[id];render();toast("Employee removed");
}

async function downloadEmpTemplate(){
  if(!await ensureXLSX()){ toast("Spreadsheet library unavailable \u2014 check your connection and try again"); return; }
  const wb = XLSX.utils.book_new();
  BULK_SHEETS.forEach(s=>{
    const ws = XLSX.utils.aoa_to_sheet([s.cols].concat(s.sample));
    ws["!cols"] = s.cols.map(c=>({wch:Math.max(13, Math.min(46, c.length+4))}));
    XLSX.utils.book_append_sheet(wb, ws, s.key);
  });
  const wn = XLSX.utils.aoa_to_sheet(BULK_NOTES);
  wn["!cols"]=[{wch:18},{wch:30},{wch:10},{wch:72}];
  XLSX.utils.book_append_sheet(wb, wn, "How to fill this in");
  XLSX.writeFile(wb, "Talent_Portal_Bulk_Upload_Template.xlsx");
}

const BULK_READY = ["Ready now","6 to 12 Months","1 to 2 Year","2 to 3 Year","3+ Years"];
const BULK_ROLES = ["Employee","Mentor","Leadership","HR Admin"];

async function parseBulkFile(ev){
  const file = ev.target.files && ev.target.files[0];
  const box  = document.getElementById("bulkErr");
  _bulkParsed = null; bulkReady(false);
  if(!file){ box.innerHTML=""; return; }
  if(!await ensureXLSX()){ box.innerHTML = impMsg("rust","The spreadsheet library didn't load. Reopen this dialogue once you're online."); return; }

  const fr = new FileReader();
  fr.onload = e => {
    let wb;
    try{ wb = XLSX.read(new Uint8Array(e.target.result), {type:"array"}); }
    catch(err){ box.innerHTML = impMsg("rust","Couldn't read that file. Use the template, saved as .xlsx."); return; }

    const errs = [], out = {}, newIds = new Set();

    BULK_SHEETS.forEach(s=>{
      out[s.key] = [];
      const ws = wb.Sheets[s.key];
      if(!ws) return;                                   // sheet simply absent
      const aoa = XLSX.utils.sheet_to_json(ws, {header:1, defval:""});
      if(!aoa.length) return;
      const head = (aoa[0]||[]).map(x=>String(x).trim());
      const ix = c => head.findIndex(x=>x.toLowerCase()===c.toLowerCase()
                                     || x.toLowerCase().split(" (")[0]===c.toLowerCase().split(" (")[0]);
      const missing = s.cols.filter(c=>ix(c)<0);
      if(missing.length){
        errs.push(`${s.key}: these columns are missing or renamed \u2014 ${missing.join(", ")}`);
        return;
      }
      const get = (row,c) => String(row[ix(c)]==null?"":row[ix(c)]).trim();

      for(let r=1;r<aoa.length;r++){
        const row = aoa[r];
        if(!row || row.every(c=>String(c).trim()==="")) continue;
        const ln = r+1, at = `${s.key} row ${ln}`;
        const o = {};
        s.cols.forEach(c=>o[c]=get(row,c));

        if(s.key==="Employees"){
          if(!o.FullName)    errs.push(`${at}: FullName is empty.`);
          if(!o.Designation) errs.push(`${at}: Designation is empty.`);
          if(o.Level==="" || isNaN(Number(o.Level))) errs.push(`${at}: Level must be a number.`);
          if(o["HiPot (Y/N)"] && !/^[yn]$/i.test(o["HiPot (Y/N)"])) errs.push(`${at}: HiPot must be Y or N.`);
          if(o.PortalRole && !BULK_ROLES.includes(o.PortalRole)) errs.push(`${at}: PortalRole "${o.PortalRole}" isn't one of ${BULK_ROLES.join(", ")}.`);
          if(o.RecordStatus && !["Active","Inactive"].includes(o.RecordStatus)) errs.push(`${at}: RecordStatus must be Active or Inactive.`);
          if(!o.EmployeeID) o.EmployeeID = nextEmpId(newIds);
          o._new = !DB.employees[o.EmployeeID];
          newIds.add(o.EmployeeID);
        } else {
          const idCol = s.key==="Pairings" ? "MenteeID" : "EmployeeID";
          if(!o[idCol]) errs.push(`${at}: ${idCol} is empty.`);
          else if(!DB.employees[o[idCol]] && !newIds.has(o[idCol]))
            errs.push(`${at}: ${idCol} "${o[idCol]}" isn't a known employee.`);
        }

        if(s.key==="Career"){
          if(o.Readiness && !BULK_READY.includes(o.Readiness))
            errs.push(`${at}: Readiness "${o.Readiness}" isn't one of ${BULK_READY.join(", ")}.`);
          if(o["CurrentRungIndex"]!=="" && isNaN(Number(o["CurrentRungIndex"])))
            errs.push(`${at}: CurrentRungIndex must be a number.`);
        }
        if(s.key==="LearningActions"){
          const band = o["Band (70/20/10)"].replace(/[^0-9]/g,"");
          if(!["70","20","10"].includes(band)) errs.push(`${at}: Band must be 70, 20 or 10.`);
          o._band = band;
          if(!o.ActionTitle) errs.push(`${at}: ActionTitle is empty.`);
          const sd = cellDate(row[ix("StartDate")]), ed = cellDate(row[ix("EndDate")]);
          if(!isDate(sd)) errs.push(`${at}: StartDate "${sd||"(blank)"}" isn't yyyy-mm-dd.`);
          if(!isDate(ed)) errs.push(`${at}: EndDate "${ed||"(blank)"}" isn't yyyy-mm-dd.`);
          if(isDate(sd)&&isDate(ed)&&ed<sd) errs.push(`${at}: EndDate is before StartDate.`);
          o._start=sd; o._end=ed;
          if(o.StatusUpdate){
            o.StatusUpdate = normLAStatus(o.StatusUpdate);
            const m = IMP_STATUS.find(x=>x.toLowerCase()===o.StatusUpdate.toLowerCase());
            if(!m) errs.push(`${at}: StatusUpdate "${o.StatusUpdate}" isn't one of ${IMP_STATUS.join(", ")}.`);
            else o.StatusUpdate = m;
          } else o.StatusUpdate = "Not started";
        }
        if(s.key==="HipotTargets"){
          if(!o.Initiative) errs.push(`${at}: Initiative is empty.`);
          if(o.Timeline && !HP_QUARTERS.includes(o.Timeline))
            errs.push(`${at}: Timeline "${o.Timeline}" isn't one of ${HP_QUARTERS.join(", ")}.`);
          if(o.Status && !HP_STATUS.includes(o.Status))
            errs.push(`${at}: Status "${o.Status}" isn't one of ${HP_STATUS.join(", ")}.`);
        }
        if(s.key==="Certifications"){
          if(!o.Name) errs.push(`${at}: Name is empty.`);
          if(o.EntryType && !CRED_TYPES.includes(o.EntryType))
            errs.push(`${at}: EntryType "${o.EntryType}" isn't one of ${CRED_TYPES.join(", ")}.`);
          ["CompletedOn","ExpiresOn"].forEach(c=>{
            const v = cellDate(row[ix(c)]);
            if(v && !isDate(v)) errs.push(`${at}: ${c} "${v}" isn't yyyy-mm-dd.`);
            o["_"+c] = v;
          });
        }
        if(s.key==="Pairings"){
          if(!o.MentorID) errs.push(`${at}: MentorID is empty.`);
          else if(!DB.employees[o.MentorID] && !newIds.has(o.MentorID))
            errs.push(`${at}: MentorID "${o.MentorID}" isn't a known employee.`);
        }
        if(s.key==="Employees" && o.MentorID){
          if(!DB.employees[o.MentorID] && !newIds.has(o.MentorID))
            errs.push(`${at}: MentorID "${o.MentorID}" isn't a known employee \u2014 add them on this sheet or use an existing ID.`);
          else if(o.EmployeeID && o.MentorID===o.EmployeeID)
            errs.push(`${at}: MentorID is the same person \u2014 someone can't mentor themselves.`);
        }
        out[s.key].push(o);
      }
    });

    const total = BULK_SHEETS.reduce((a,s)=>a+out[s.key].length,0);
    if(!total && !errs.length){ box.innerHTML = impMsg("amber","No data rows found on any sheet."); return; }
    if(errs.length){
      box.innerHTML = impMsg("rust",`<b>File rejected \u2014 ${errs.length} problem${errs.length>1?"s":""} found.</b> Nothing has been imported.`)
        + `<ul class="imperr">${errs.slice(0,14).map(x=>`<li>${x}</li>`).join("")}
           ${errs.length>14?`<li>\u2026and ${errs.length-14} more.</li>`:""}</ul>`;
      return;
    }
    _bulkParsed = out;
    const lines = BULK_SHEETS.filter(s=>out[s.key].length)
      .map(s=>`<li><b>${out[s.key].length}</b> \u00b7 ${s.label}</li>`).join("");
    box.innerHTML = impMsg("jade",`<b>${total} row${total>1?"s":""} ready.</b> Nothing is saved until you press Import.`)
      + `<ul class="impok">${lines}</ul>`;
    bulkReady(true);
  };
  fr.readAsArrayBuffer(file);
}

function bulkReady(on){
  const b = document.getElementById("bulkCommitBtn");
  if(!b) return;
  b.disabled = !on; b.style.opacity = on ? "1" : ".5";
}
function nextEmpId(taken){
  let n = 5100;
  while(DB.employees["E-"+n] || taken.has("E-"+n)) n++;
  return "E-"+n;
}
function ensurePlan(eid){
  if(!DB.learningPlans[eid]){
    const p = (DB.pairings||[]).find(x=>x.mentee===eid && x.status==="Active");
    DB.learningPlans[eid] = { mentor: p?p.mentor:null, actions:[], changelog:[], archive:[] };
  }
  return DB.learningPlans[eid];
}

async function commitBulk(){
  if(!_bulkParsed) return;
  const btn = document.getElementById("bulkCommitBtn");
  const box = document.getElementById("bulkErr");
  if(btn){ btn.disabled = true; btn.textContent = "Importing\u2026"; }

  /* Fire one row at a time. Sent together, Power Automate throttles the
     later ones and the failures are easy to miss. */
  const queue = [], failed = [];
  const push = (table, key, fields, meta, label) => queue.push({table,key,fields,meta,label});
  const d = _bulkParsed, who = CURRENT_EMP||ACTOR, on = today();
  let count = 0;

  (d.Employees||[]).forEach(o=>{
    const id = o.EmployeeID;
    const rec = Object.assign(DB.employees[id]||{}, {
      id, name:o.FullName, email:o.WorkEmail||"", fn:o.Function, sub:o.SubFunction,
      desig:o.Designation, lvl:Number(o.Level)||0, mgr:o.ManagerID||null,
      mentorId:o.MentorID||"", hipot:/^y$/i.test(o["HiPot (Y/N)"]||""),
      hcat:o.HiPotCategory||"", loc:o.Location||"", role:o.PortalRole||"Employee",
      f360Url:o.Feedback360URL||"", insightUrl:o.ExpertInsightsURL||"",
      evpUrl:o.EVPURL||"", projUrl:o.ProjectFeedbackURL||""
    });
    DB.employees[id] = rec;
    push(o._new ? "EmployeesNew" : "Employees", id,
      empRow(rec, id, o.RecordStatus||"Active"), {changeType:o._new?"Created":"Updated"},
      "Employee " + rec.name);

    /* MentorID on the People sheet is enough — the pairing is created/updated
       automatically, so nobody has to fill the Pairings sheet by hand. */
    if(rec.mentorId && rec.mentorId!==id){
      const ex = DB.pairings.find(x=>x.mentee===id);
      if(ex){
        if(ex.mentor!==rec.mentorId || ex.status!=="Active"){
          ex.mentor = rec.mentorId; ex.status = "Active";
          push("Pairings", ex.id, {PairingID:ex.id, MenteeID:id, MentorID:ex.mentor,
            PairingType:ex.type||"Career", Status:"Active", LastUpdatedBy:who, LastUpdatedOn:on},
            {changeType:"Imported"}, "Pairing " + rec.name);
        }
      }else{
        const pid = "P-"+String(id).replace(/^E-/,"")+"-1";
        DB.pairings.push({id:pid, mentee:id, mentor:rec.mentorId, type:"Career", status:"Active"});
        push("PairingsNew", pid, {PairingID:pid, MenteeID:id, MentorID:rec.mentorId,
          PairingType:"Career", Status:"Active", LastUpdatedBy:who, LastUpdatedOn:on},
          {changeType:"Imported"}, "Pairing " + rec.name);
      }
      if(DB.learningPlans[id]) DB.learningPlans[id].mentor = rec.mentorId;
    }

    /* Next role / Focus Brief live on the People sheet now — write them straight
       into the person's career record so the Career page and Focus Brief card fill in. */
    const nextRole = String(o["Next role"]||"").trim();
    const briefTxt = String(o["Focus Brief"]||"").trim();
    if(nextRole || briefTxt){
      const cur0 = DB.career[id] && DB.career[id].paths && DB.career[id].paths[0];
      const path0 = Object.assign({}, cur0||{}, {
        name:(cur0&&cur0.name)||"Career path",
        ladder:(cur0&&cur0.ladder)||[],
        atIdx:(cur0&&cur0.atIdx)||0,
        next: nextRole || (cur0?cur0.next:"") || "",
        brief: briefTxt || (cur0?cur0.brief:"") || ""
      });
      if(!path0._rowId) path0._rowId = "CR-"+String(id).replace(/^E-/,"");
      DB.career[id] = { selectedPath:0, paths:[path0] };
      const keep0 = ACTOR; ACTOR = id;
      push(cur0 && cur0._rowId ? "Career" : "CareerNew", path0._rowId, careerRow(),
        {changeType:"Imported"}, "Career " + rec.name);
      ACTOR = keep0;
    }
  });

  (d.Career||[]).forEach(o=>{
    const eid = o.EmployeeID;
    const ladder = String(o["CareerLadder (a|b|c)"]||"").split("|").map(x=>x.trim()).filter(Boolean);
    const cur = DB.career[eid] && DB.career[eid].paths && DB.career[eid].paths[0];
    const path = Object.assign(cur||{}, {
      name:o.PathName||"Career path", ladder: ladder.length?ladder:(cur?cur.ladder:[]),
      atIdx:Number(o.CurrentRungIndex)||0, next:o.NextRole||"",
      readiness:o.Readiness||(cur?cur.readiness:""), brief:o.FocusBrief||(cur?cur.brief:"")
    });
    if(!path._rowId) path._rowId = "CR-"+String(eid).replace(/^E-/,"");
    DB.career[eid] = { selectedPath:0, paths:[path] };
    const keep = ACTOR; ACTOR = eid;
    push(cur && cur._rowId ? "Career" : "CareerNew", path._rowId, careerRow(), {changeType:"Imported"},
      "Career " + nm(eid));
    ACTOR = keep;
  });

  (d.LearningActions||[]).forEach(o=>{
    const eid = o.EmployeeID, lp = ensurePlan(eid);
    const a = { id:newActionId(), title:o.ActionTitle, band:o._band,
                timeline:{start:o._start, end:o._end}, status:"Approved",
                update:o.StatusUpdate, comment:o.Comment||"",
                _visMentee:"TRUE", _visLead:"TRUE", _createdBy:who, _createdOn:on };
    lp.actions.push(a);
    laLog(eid, eid, "created", a.id, "Bulk uploaded by HR");
    push("ActionsNew", a.id, actionRow(a, eid, lp.mentor), {changeType:"Imported"},
      "Action \u201c" + a.title + "\u201d");
  });

  (d.HipotTargets||[]).forEach(o=>{
    const rec = { id:"HT-"+Date.now().toString(36).slice(-5)+Math.floor(Math.random()*1296).toString(36).padStart(2,"0"),
      emp:o.EmployeeID, initiative:o.Initiative, focus:o.FocusArea||"", target:o.Target||"",
      timeline:o.Timeline||"", comments:o.Comments||"", status:o.Status||"Not Started",
      selfFb:o.SelfFeedback||"", mentorFb:o.MentorFeedback||"" };
    DB.targets.push(rec);
    push("HipotTargetsNew", rec.id, {
      TargetID:rec.id, EmployeeID:rec.emp, Initiative:rec.initiative, FocusArea:rec.focus,
      Target:rec.target, Timeline:rec.timeline, Comments:rec.comments, Status:rec.status,
      SelfFeedback:rec.selfFb, MentorFeedback:rec.mentorFb, UpdatedBy:who, UpdatedOn:on
    }, {changeType:"Imported"}, "HiPot \u201c" + rec.initiative + "\u201d");
  });

  (d.Certifications||[]).forEach(o=>{
    const eid = o.EmployeeID;
    const rec = { id:"CT-"+Date.now().toString(36).slice(-5)+Math.floor(Math.random()*1296).toString(36).padStart(2,"0"),
      type:o.EntryType||"Certification", name:o.Name, issuer:o.Issuer||"",
      date:o._CompletedOn||"", expires:o._ExpiresOn||"", cred:o.CredentialID||"",
      hours:o.DurationHours||"", mode:o.Mode||"", fileUrl:o.FileURL||"", fileName:"" };
    (DB.certs[eid] = DB.certs[eid]||[]).push(rec);
    push("CertificationsNew", rec.id, {
      CertID:rec.id, EmployeeID:eid, EntryType:rec.type, CertName:rec.name, Issuer:rec.issuer,
      CompletedOn:rec.date, ExpiresOn:rec.expires, CredentialID:rec.cred,
      DurationHours:rec.hours, Mode:rec.mode, FileURL:rec.fileUrl, FileName:"",
      AddedBy:who, AddedOn:on }, {changeType:"Imported"}, "Credential \u201c" + rec.name + "\u201d");
  });

  (d.Pairings||[]).forEach(o=>{
    const existing = DB.pairings.find(x=>x.mentee===o.MenteeID);
    const rec = { id: existing?existing.id:("P-"+Date.now().toString(36).slice(-5)),
      mentee:o.MenteeID, mentor:o.MentorID,
      type:o.PairingType||"Career", status:o.Status||"Active" };
    if(existing) Object.assign(existing, rec); else DB.pairings.push(rec);
    if(DB.learningPlans[o.MenteeID]) DB.learningPlans[o.MenteeID].mentor = o.MentorID;
    push(existing ? "Pairings" : "PairingsNew", rec.id, {
      PairingID:rec.id, MenteeID:rec.mentee, MentorID:rec.mentor,
      PairingType:rec.type, Status:rec.status, LastUpdatedBy:who, LastUpdatedOn:on
    }, {changeType:"Imported"}, "Pairing " + nm(rec.mentee));
  });

  let done = 0;
  for(const q of queue){
    if(btn) btn.textContent = "Importing " + (done+1) + " of " + queue.length + "\u2026";
    const ok = await saveToExcel(q.table, q.key, q.fields, q.meta);
    if(ok === false) failed.push(q.label); else done++;
    await new Promise(r=>setTimeout(r, 120));      // don't out-run the flow
  }

  _bulkParsed = null;
  if(btn){ btn.disabled = false; btn.textContent = "Import"; }

  if(failed.length){
    box.innerHTML = impMsg("rust",
      `<b>${done} of ${queue.length} written.</b> ${failed.length} didn't reach Excel \u2014 they're on screen but not saved.`)
      + `<ul class="imperr">${failed.slice(0,10).map(x=>`<li>${x}</li>`).join("")}
         ${failed.length>10?`<li>\u2026and ${failed.length-10} more.</li>`:""}</ul>`;
    render();
    return;                                        // leave the dialogue open
  }
  if(!SYNC_ON()){
    box.innerHTML = impMsg("amber",
      "<b>Loaded on screen only.</b> No flow is connected, so nothing was written to Excel.");
    render();
    return;
  }
  closeModal(); render();
  toast(done + " record" + (done>1?"s":"") + " imported");
}

function vIntegrity(){
  const problems=[];
  DB.pairings.forEach(p=>{if(!E(p.mentee))problems.push(`Pairing ${p.id}: mentee ${p.mentee} not in Employees`);if(!E(p.mentor))problems.push(`Pairing ${p.id}: mentor ${p.mentor} not in Employees`);});
  DB.targets.forEach(t=>{if(!E(t.emp))problems.push(`Target ${t.id}: owner ${t.emp} missing`);if(!E(t.approver))problems.push(`Target ${t.id}: approver ${t.approver} missing`);});
  DB.succession.forEach((s,i)=>{if(!E(s.incumbent))problems.push(`Succession ${i}: incumbent missing`);if(!E(s.successor))problems.push(`Succession ${i}: successor ${s.successor} missing`);});
  // reconciliation: hipot flagged but low 9-box
  const recon=[];
  Object.values(DB.employees).forEach(e=>{const nb=DB.ninebox[e.id];if(e.hipot&&nb&&nb.pot<2)recon.push(`${e.name}: flagged HiPot but 9-box potential is low`);});
  const okCount=DB.pairings.length+DB.targets.length+DB.succession.length;
  return `<div class="kpis">
      <div class="kpi"><div class="l">Links checked</div><div class="v mono">${okCount}</div></div>
      <div class="kpi"><div class="l">Broken references</div><div class="v mono" style="color:${problems.length?'var(--rust)':'var(--jade)'}">${problems.length}</div></div>
      <div class="kpi"><div class="l">Reconciliation flags</div><div class="v mono" style="color:${recon.length?'var(--amber)':'var(--jade)'}">${recon.length}</div></div>
    </div>
    <div class="card"><h2>Referential integrity</h2><p class="hint">Every ID reference cross-checked against the Employees master.</p>
      ${problems.length?problems.map(p=>`<div class="kline"><div class="nm" style="color:var(--rust)"><span class="ti ti-alert-circle"></span> ${p}</div></div>`).join(""):'<div class="note"><span class="ti ti-check" style="color:var(--jade)"></span> All references resolve. No orphaned IDs.</div>'}</div>
    <div class="card"><h2>HiPot ↔ 9-box reconciliation</h2><p class="hint">Under "Independent" policy, contradictions are surfaced, not hidden.</p>
      ${recon.length?recon.map(r=>`<div class="kline"><div class="nm"><span class="flag"><span class="ti ti-flag"></span> ${r}</span></div></div>`).join(""):'<div class="note"><span class="ti ti-check" style="color:var(--jade)"></span> No contradictions in sample data.</div>'}</div>`;
}

/* ============ HR: DEVELOPMENT ACTION COMPLIANCE ============ */
/* Compliant = the person has at least one live development action, any band.
   Archived/deleted rows don't count — only what's on the active plan. */
let COMP_Q = "", COMP_FN = "all", COMP_ST = "all";

const escH = s => String(s==null?"":s).replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));

function complianceRows(){
  return Object.values(DB.employees).map(e=>{
    const lp   = DB.learningPlans[e.id] || {};
    const acts = lp.actions || [];
    const by   = {"70":0,"20":0,"10":0};
    let last = "";
    acts.forEach(a=>{
      const b = String(a.band);
      if(b in by) by[b]++;
      const d = String(a._createdOn||"");
      if(d > last) last = d;
    });
    const mentorId = lp.mentor || e.mentorId || "";
    return {
      id:e.id, name:e.name||e.id, fn:e.fn||"\u2014", sub:e.sub||"",
      desig:e.desig||"", lvl:e.lvl||0,
      mentor: mentorId ? nm(mentorId) : "",
      n:acts.length, by:by, last:last, ok:acts.length>0
    };
  });
}

function complianceFiltered(){
  const q = COMP_Q.trim().toLowerCase();
  return complianceRows().filter(r=>{
    if(COMP_FN !== "all" && r.fn !== COMP_FN) return false;
    if(COMP_ST === "yes" && !r.ok) return false;
    if(COMP_ST === "no"  &&  r.ok) return false;
    if(q && (r.name+" "+r.id+" "+r.desig+" "+r.mentor).toLowerCase().indexOf(q) === -1) return false;
    return true;
  }).sort((a,b)=> a.n - b.n || a.name.localeCompare(b.name));   // gaps first
}

function compTableHTML(){
  const rows = complianceFiltered();
  if(!rows.length) return '<div class="note">Nobody matches those filters.</div>';
  const body = rows.map(r=>`<tr>
      <td><b>${escH(r.name)}</b><div style="font-size:11px;color:var(--t3)">${escH(r.id)}${r.desig?" \u00b7 "+escH(r.desig):""}</div></td>
      <td>${escH(r.fn)}${r.sub && r.sub!==r.fn?`<div style="font-size:11px;color:var(--t3)">${escH(r.sub)}</div>`:""}</td>
      <td>${r.mentor?escH(r.mentor):'<span style="color:var(--t3)">\u2014</span>'}</td>
      <td class="mono" style="text-align:center;font-weight:600;color:${r.n?"var(--text)":"var(--rust)"}">${r.n}</td>
      <td class="mono" style="text-align:center;color:var(--t2)">${r.by["70"]} / ${r.by["20"]} / ${r.by["10"]}</td>
      <td class="mono" style="font-size:11.5px;color:var(--t3)">${r.last||"\u2014"}</td>
      <td>${r.ok?'<span class="pill p-jade">Compliant</span>':'<span class="pill p-rust">No actions</span>'}</td>
    </tr>`).join("");
  return `<table class="tbl"><thead><tr>
      <th>Employee</th><th style="width:150px">Function</th><th style="width:140px">Mentor</th>
      <th style="width:70px;text-align:center">Actions</th>
      <th style="width:96px;text-align:center">70/20/10</th>
      <th style="width:96px">Last added</th>
      <th style="width:112px">Status</th>
    </tr></thead><tbody>${body}</tbody></table>`;
}

/* filters repaint just the table, so the search box keeps focus while typing */
function compApply(){
  const q  = document.getElementById("compQ");
  const fn = document.getElementById("compFn");
  const st = document.getElementById("compSt");
  if(q)  COMP_Q  = q.value;
  if(fn) COMP_FN = fn.value;
  if(st) COMP_ST = st.value;
  const host = document.getElementById("compBody");
  if(host){ host.innerHTML = compTableHTML(); wrapTables(host); }
  const c = document.getElementById("compCount");
  if(c) c.textContent = complianceFiltered().length + " of " + complianceRows().length + " shown";
}
function compReset(){
  COMP_Q=""; COMP_FN="all"; COMP_ST="all"; render();
}

function exportCompliance(){
  const rows = complianceFiltered();
  const head = ["EmployeeID","Name","Designation","Function","SubFunction","Level",
                "Mentor","ActionsAdded","Band70","Band20","Band10","LastActionAdded","Compliant"];
  const csv  = [head.join(",")].concat(rows.map(r=>[
      r.id, r.name, r.desig, r.fn, r.sub, r.lvl, r.mentor,
      r.n, r.by["70"], r.by["20"], r.by["10"], r.last, r.ok?"Yes":"No"
    ].map(v=>`"${String(v==null?"":v).replace(/"/g,'""')}"`).join(","))).join("\n");
  dl(new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"}),
     "development-action-compliance-"+today()+".csv");
  toast("Exported "+rows.length+" rows");
}

function vCompliance(){
  const all   = complianceRows();
  const total = all.length;
  const done  = all.filter(r=>r.ok).length;
  const gap   = total - done;
  const pc    = total ? Math.round(done/total*100) : 0;
  const acts  = all.reduce((s,r)=>s+r.n,0);
  const avg   = done ? (acts/done).toFixed(1) : "0";

  /* by function, so you can see which teams are behind */
  const fns = {};
  all.forEach(r=>{
    const f = fns[r.fn] = fns[r.fn] || {t:0,d:0,a:0};
    f.t++; if(r.ok) f.d++; f.a += r.n;
  });
  const fnRows = Object.keys(fns).sort().map(f=>{
    const x = fns[f], p = x.t ? Math.round(x.d/x.t*100) : 0;
    return `<div class="kline">
      <div class="nm">${escH(f)}<small>${x.d} of ${x.t} people \u00b7 ${x.a} actions</small></div>
      <div class="bar">${bar(p, p>=80?"jade":p>=50?"amber":"rust")}</div>
      <div class="pc mono">${p}%</div></div>`;
  }).join("");

  const fnOpts = ['<option value="all">All functions</option>']
    .concat(Object.keys(fns).sort().map(f=>
      `<option value="${escH(f)}" ${COMP_FN===f?"selected":""}>${escH(f)}</option>`)).join("");

  const distTotals = all.reduce((s,r)=>{
    s["70"]+=r.by["70"]; s["20"]+=r.by["20"]; s["10"]+=r.by["10"]; return s;
  }, {"70":0,"20":0,"10":0});

  return `<div class="kpis">
      <div class="kpi"><div class="l">People in scope</div><div class="v mono">${total}</div></div>
      <div class="kpi"><div class="l">Added at least one action</div>
        <div class="v mono" style="color:${pc>=80?'var(--jade)':pc>=50?'var(--amber)':'var(--rust)'}">${done}</div>
        ${bar(pc, pc>=80?"jade":pc>=50?"amber":"rust")}
        <div style="font-size:11px;color:var(--t3);margin-top:6px">${pc}% compliant</div></div>
      <div class="kpi"><div class="l">Nothing added yet</div>
        <div class="v mono" style="color:${gap?'var(--rust)':'var(--jade)'}">${gap}</div></div>
      <div class="kpi"><div class="l">Total actions logged</div><div class="v mono">${acts}</div>
        <div style="font-size:11px;color:var(--t3);margin-top:6px">${avg} avg per active plan</div></div>
    </div>

    <div class="card"><h2>Compliance by function</h2>
      <p class="hint">Share of each function that has logged at least one development action.</p>
      ${fnRows||'<div class="note">No employee data loaded yet.</div>'}
      <div class="note" style="margin-top:12px">Across everyone: <b>${distTotals["70"]}</b> actions in the 70 band,
        <b>${distTotals["20"]}</b> in the 20, <b>${distTotals["10"]}</b> in the 10.</div>
    </div>

    <div class="card">
      <h2>Action count per person</h2>
      <p class="hint">Sorted with the gaps at the top. <span id="compCount">${total} of ${total} shown</span>.</p>
      <div style="display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:13px">
        <input id="compQ" class="inp" style="flex:1;min-width:170px" placeholder="Search name, ID, mentor\u2026"
               value="${escH(COMP_Q)}" oninput="compApply()">
        <select id="compFn" class="inp" style="width:auto" onchange="compApply()">${fnOpts}</select>
        <select id="compSt" class="inp" style="width:auto" onchange="compApply()">
          <option value="all" ${COMP_ST==="all"?"selected":""}>Everyone</option>
          <option value="no"  ${COMP_ST==="no" ?"selected":""}>No actions only</option>
          <option value="yes" ${COMP_ST==="yes"?"selected":""}>Compliant only</option>
        </select>
        <button class="btn" onclick="compReset()">Reset</button>
        <button class="btn pri" onclick="exportCompliance()"><span class="ti ti-download"></span> Export CSV</button>
      </div>
      <div id="compBody">${compTableHTML()}</div>
    </div>`;
}

function togglePerm(reg,key,field,on){
  const R = reg==="mentor" ? DB.permsMentor : DB.perms;
  if(!R[key]) R[key]={vis:true,edit:true};
  R[key][field]=on;

function vSections(){
  const swBox=(reg,key,field,val)=>`<label class="switch"><input type="checkbox" ${val?"checked":""} onchange="togglePerm('${reg}','${key}','${field}',this.checked)"><span class="track"></span></label>`;
  // Employee modules — shown to both employee (own view) and mentor (mentee view): 4 toggles
  const empGroup=(()=>{
    const items=PERM_GROUPS[0][2];
    const rows=items.map(([key,label,sub])=>{
      const pe=DB.perms[key]||{vis:true,edit:true};

      <div class="permhead4 sub2"><span></span><span>Visible</span><span>Editable</span><span>Visible</span><span>Editable</span></div>

    ${single(2,"emp")}`;
}

const ACCOUNTS={
  // each demo account is a real person; their available "hats" are computed from the data
  "employee@altudo.co":{empId:"E-5102",label:"Employee",land:"employee"},   // Ayushi Taneja
  "mentor@altudo.co":{empId:"E-5101",label:"Mentor",land:"mentor"},         // Rajat Babbar — mentors Ayushi & Jahanvi
  "leadership@altudo.co":{empId:"E-5104",label:"Leadership",land:"leader"}, // Manisha Naik
  "admin@altudo.co":{empId:"E-0001",label:"HR admin",land:"hr"}             // HR admin
};
let CURRENT_ACCOUNT=null;
let CURRENT_EMP=null;
let IS_ADMIN=false;

/* which roles is this person tagged for, from the data */
function availableRoles(empId){
  if(empId==="E-0001") return ["hr"];
  const roles=["employee"];                                  // everyone is an employee/mentee
  if(menteesOf(empId).length>0) roles.push("mentor");        // mentors someone
  // Leadership view is not offered as a switchable hat for now.
  return roles;
}
const ROLE_LABEL={employee:"Mentee",mentor:"Mentor",leader:"Leadership",hr:"HR admin"};

function fill(id){document.getElementById("loginEmail").value=id;document.getElementById("loginErr").textContent="";}
function doLogin(){
  const email=(document.getElementById("loginEmail").value||"").trim().toLowerCase();
  const acct=ACCOUNTS[email];
  if(!acct){document.getElementById("loginErr").textContent="No account for that email. Try a demo account below.";return;}
  CURRENT_ACCOUNT=email;
  CURRENT_EMP=acct.empId;
  IS_ADMIN=(acct.empId==="E-0001");
  document.getElementById("loginScreen").style.display="none";
  document.getElementById("appShell").style.display="flex";
  // admin keeps the full View-as switcher; multi-hat users get the "Logged in as" role switcher
  document.getElementById("rolePick").style.display=IS_ADMIN?"block":"none";
  document.getElementById("acctLine").innerHTML=`Signed in as<br><b>${email}</b>`;
  const auto=availableRoles(acct.empId);
  // start on the account's declared landing role
  const land=acct.land||auto[0];
  // switchable hats = computed hats + landing role, minus leadership (not offered as a hat for now)
  let hats=Array.from(new Set([land,...auto])).filter(r=>r!=="leader"&&r!=="hr");
  buildHatSwitcher(hats);
  // lock the actor to this person for non-admin
  if(!IS_ADMIN){ ACTOR=acct.empId; }
  setRole(land);
}
/* top-right "Logged in as" switcher — only the hats this person holds */
function buildHatSwitcher(roles){
  const host=document.getElementById("hatSwitch");
  if(!host) return;
  if(IS_ADMIN || roles.length<2){ host.style.display="none"; host.innerHTML=""; return; }
  host.style.display="flex";
  host.innerHTML=`<span class="hatlab">Logged in as</span>
    <select id="hatSelect" onchange="switchHat(this.value)">
      ${roles.map(r=>`<option value="${r}">${ROLE_LABEL[r]}</option>`).join("")}
    </select>`;
}
function switchHat(role){
  // switch the person's active view without signing out; keep their identity
  ACTOR=CURRENT_EMP;
  setRole(role);
  const sel=document.getElementById("hatSelect"); if(sel) sel.value=role;
  toast("Now viewing as "+ROLE_LABEL[role]);
}
function signOut(){
  CURRENT_ACCOUNT=null;CURRENT_EMP=null;IS_ADMIN=false;
  document.getElementById("appShell").style.display="none";
  document.getElementById("loginScreen").style.display="flex";
  document.getElementById("loginEmail").value="";
  document.getElementById("loginErr").textContent="";
}

   The flow is one "When an HTTP request is received" (POST) trigger with a
   Switch on the "table" value in the body:
       {"table":"READ"}                                    -> returns every table
       {"table":"Career","key":"CR-001","fields":{...}}     -> writes one row
   Build steps: TalentPortal_PowerAutomate_Setup.md
   ========================================================================== */
const FLOW_URL = "https://defaultb9d69197ce1f49079545b307af2335.e9.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/15/workflows/7ecf97401826423c86f275364ed91c21/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=rWJgwxv91JZfS_eedf18bA82tXUnqNaLaxMA2Wkubag";   // <-- paste the HTTP POST URL of your one flow

const SYNC_ON   = () => !!FLOW_URL;
const truthy    = v => String(v).trim().toUpperCase() === "TRUE";
let   LAST_SYNC = null;
let   SYNC_STATE = "off";   // off | loading | live | error

/* every call to Power Automate goes through here — one URL, one method */
window.SYNC_LOG = [];
function syncLogAdd(entry){
  SYNC_LOG.push(Object.assign({t:new Date().toTimeString().slice(0,8)}, entry));
  if(SYNC_LOG.length>40) SYNC_LOG.shift();
}
function callFlow(payload){
  const tag = {table:payload.table||"", key:payload.key||"", changeType:payload.changeType||"",
               field:payload.field||"", newValue:payload.newValue||""};
  return fetch(FLOW_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(Object.assign({
      actor: (typeof CURRENT_EMP !== "undefined" && CURRENT_EMP) ? CURRENT_EMP : ACTOR,
      source: "Dashboard"
    }, payload))
  }).then(async r=>{
    const txt = await r.text();
    if(!r.ok){
      console.error("[sync] flow returned " + r.status + ":", txt);
      syncLogAdd(Object.assign({ok:false, err:"HTTP "+r.status+" "+txt.slice(0,160)}, tag));
      throw new Error("HTTP " + r.status + " " + txt.slice(0, 300));
    }
    if(!txt){
      syncLogAdd(Object.assign({ok:false, err:"Empty body — Response action missing in the flow"}, tag));
      throw new Error("Flow returned an empty body - is the Response action missing?");
    }
    syncLogAdd(Object.assign({ok:true}, tag));
    return JSON.parse(txt);
  }).catch(e=>{
    if(!SYNC_LOG.length || SYNC_LOG[SYNC_LOG.length-1].err !== String(e.message).slice(0,160))
      syncLogAdd(Object.assign({ok:false, err:String(e.message).slice(0,160)}, tag));
    throw e;
  });
}
function showSyncLog(){
  const rows = SYNC_LOG.slice().reverse().map(x=>`
    <tr>
      <td class="mono" style="white-space:nowrap;font-size:11px;color:var(--t3)">${x.t}</td>
      <td style="font-size:12px"><b>${x.table}</b>${x.key?" \u00b7 "+x.key:""}${x.changeType?" \u00b7 "+x.changeType:""}${x.field?"<div style='font-size:11px;color:var(--t3)'>"+x.field+" \u2192 "+String(x.newValue)+"</div>":""}</td>
      <td>${x.ok?'<span class="pill p-jade">OK</span>':'<span class="pill p-rust">FAILED</span>'}${x.err?"<div style='font-size:11px;color:var(--t2);margin-top:3px'>"+String(x.err).replace(/</g,"&lt;")+"</div>":""}</td>
    </tr>`).join("");
  document.getElementById("modalBody").innerHTML = `
    <h3>Excel sync log</h3>
    <div class="sub">Every write this session sent to the Power Automate flow, newest first. FAILED rows show the flow's error.</div>
    ${SYNC_LOG.length?`<table class="tbl" style="margin-top:10px"><thead><tr><th style="width:70px">Time</th><th>Write</th><th style="width:200px">Result</th></tr></thead><tbody>${rows}</tbody></table>`
      :'<div class="note" style="margin-top:10px">No writes yet this session. Make a change (edit a status, archive an action), then reopen this log.</div>'}
    <div class="foot"><button class="btn" onclick="closeModal()">Close</button></div>`;
  openModal();
}

/* ---------- status pill (bottom-left) ---------- */
function syncPill(){
  let el = document.getElementById("syncPill");
  if(!el){
    el = document.createElement("div");
    el.id = "syncPill";
    el.style.cssText = "position:fixed;left:14px;bottom:14px;z-index:60;font:500 11.5px/1 Poppins,system-ui,sans-serif;"
      + "padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--t2);"
      + "box-shadow:0 2px 10px rgba(0,0,0,.07);cursor:pointer;display:flex;align-items:center;gap:7px";
    el.onclick = (e) => { if(e.shiftKey){ showSyncLog(); return; } if(SYNC_ON()) loadFromExcel(true); };
    el.title = "Click to refresh \u00b7 Shift+click for the sync log";
    document.body.appendChild(el);
  }
  const dot = c => '<span style="width:7px;height:7px;border-radius:50%;background:'+c+';display:inline-block"></span>';
  if(SYNC_STATE==="off")          el.innerHTML = dot("#A7A9AC") + "Demo data — not connected to Excel";
  else if(SYNC_STATE==="loading") el.innerHTML = dot("#D18700") + "Syncing with Excel\u2026";
  else if(SYNC_STATE==="error")   el.innerHTML = dot("#8A5A00") + "Sync failed — click to retry";
  else el.innerHTML = dot("#006837") + "Live \u00b7 synced " + LAST_SYNC + " \u00b7 click to refresh";
}

/* ---------- READ: one POST with table:"READ" pulls every table ---------- */
let _READ_CACHE = null, _READ_AT = 0;
async function loadFromExcel(manual){
  if(!SYNC_ON()){ SYNC_STATE="off"; syncPill(); return; }
  /* the full READ is the slow call (one Power Automate round-trip for the whole
     workbook). Reuse the payload from the last 45 seconds unless the user
     explicitly refreshed via the pill — sign-in right after page load then
     re-maps the already-fetched data instantly instead of fetching twice. */
  const fresh = _READ_CACHE && (Date.now() - _READ_AT < 45000);
  if(fresh && !manual){
    try{ applyReadPayload(_READ_CACHE); }catch(e){ console.error("[sync] cached apply failed", e); }
    return;
  }
  SYNC_STATE="loading"; syncPill();
  try{
    const d = await callFlow({ table:"READ" });
    _READ_CACHE = d; _READ_AT = Date.now();
    applyReadPayload(d);
    if(manual) toast("Refreshed from Excel");
    return;
  }catch(err){
    console.error("[sync] read failed", err);
    SYNC_STATE = "error"; syncPill();
    if(manual) toast("Couldn't reach Excel \u2014 check the flow and try again");
    return;
  }
}
function applyReadPayload(d){
  {

    /* -- 2. employees -------------------------------------------------- */
    if(Array.isArray(d.employees) && d.employees.length){
      const seeded = DB.employees;            // keep seeded email/role as a fallback
      DB.employees = {};
      d.employees.filter(e=>e.EmployeeID && String(e.RecordStatus||"Active")!=="Inactive").forEach(e=>{
        DB.employees[e.EmployeeID] = {
          id:e.EmployeeID, name:e.FullName,
          email:e.WorkEmail || (seeded[e.EmployeeID]||{}).email || "",
          fn:e.Function, sub:e.SubFunction, desig:e.Designation,
          lvl:Number(e.Level)||0, mgr:e.ManagerID||null,
          hipot:truthy(e.HiPot), hcat:e.HiPotCategory||"", loc:e.Location||"\u2014",
          mentorId:e.MentorID||"",
          f360Url:e.Feedback360URL || (seeded[e.EmployeeID]||{}).f360Url || "",
          insightUrl:e.ExpertInsightsURL || (seeded[e.EmployeeID]||{}).insightUrl || "",
          evpUrl:e.EVPURL || (seeded[e.EmployeeID]||{}).evpUrl || "",
          projUrl:e.ProjectFeedbackURL || (seeded[e.EmployeeID]||{}).projUrl || "",
          role:e.PortalRole || (seeded[e.EmployeeID]||{}).role || "Employee"
        };
      });
    }

    /* -- pairings (drives mentor access) -------------------------------- */
    if(Array.isArray(d.pairings)){
      DB.pairings = d.pairings.filter(p=>p.PairingID).map(p=>({
        id:p.PairingID, mentee:p.MenteeID, mentor:p.MentorID,
        type:p.PairingType||"Career", status:p.Status||"Active"
      }));
    }

    /* -- 4. next role + readiness tenure -------------------------------- */
    if(Array.isArray(d.career)){
      DB.career = {};
      d.career.filter(c=>c.EmployeeID).forEach(c=>{
        const ladder = String(c.CareerLadder||"").split("|").map(s=>s.trim()).filter(Boolean);
        const at = Number(c.CurrentRungIndex);
        DB.career[c.EmployeeID] = { selectedPath:0, paths:[{
          name: c.PathName || "Career path",
          ladder: ladder,
          atIdx: isNaN(at) ? Math.max(0, ladder.indexOf(c.CurrentRole)) : at,
          next: c.NextRole || "",
          readiness: c.Readiness || "",
          brief: c.FocusBrief || "",
          _rowId: c.CareerID,
          _setBy: c.ReadinessSetBy || "",
          _review: c.ReadinessReviewDate || "",
          _approval: c.ApprovalStatus || "Approved" 
        }]};
      });
    }

    /* -- 3. tasks + comments -------------------------------------------- */
    /* index the active pairings once, rather than re-scanning the whole
       pairings array for every employee (that was employees x pairings) */
    DB.learningPlans = {};
    const mentorOf = {};
    DB.pairings.forEach(x=>{
      if(x.status==="Active" && !(x.mentee in mentorOf)) mentorOf[x.mentee] = x.mentor;
    });
    Object.keys(DB.employees).forEach(id=>{
      DB.learningPlans[id] = { mentor: mentorOf[id] || null, actions:[], changelog:[], archive:[] };
    });
    (d.actions||[]).filter(a=>a.ActionID).forEach(a=>{
      const lp = DB.learningPlans[a.EmployeeID]; if(!lp) return;
      if(!truthy(a.VisibleToMentee) && !IS_ADMIN && ROLE==="employee") return;   // row-level visibility
      const o = {
        id:a.ActionID, title:a.ActionTitle, band:String(a.Band),
        timeline:{start:a.StartDate||"", end:a.EndDate||""},
        status:a.ApprovalStatus||"Approved", update:normLAStatus(a.StatusUpdate||""),
        comment:a.LatestComment||"",
        priority:a.Priority?String(a.Priority).replace(/^P/i,""):"", outcome:a.ExpectedOutcome||"",
        _visMentee: truthy(a.VisibleToMentee) ? "TRUE" : "FALSE",
        _visLead:   truthy(a.VisibleToLeadership) ? "TRUE" : "FALSE",
        _createdBy: a.CreatedBy||"", _createdOn: a.CreatedOn||""
      };
      /* rows whose status was set to "Archived" stay in the archive across
         reloads instead of reappearing in the active plan */
      if(String(o.update).trim().toLowerCase()==="deleted"){
        o.update = "Deleted";
        lp.archive = lp.archive || [];
        lp.archive.push(o);
      } else {
        lp.actions.push(o);
      }
      if(a.MentorID && !lp.mentor) lp.mentor = a.MentorID;
    });
    (d.comments||[]).filter(c=>c.CommentID).forEach(c=>{
      const lp = DB.learningPlans[c.EmployeeID]; if(!lp) return;
      if(!truthy(c.VisibleToMentee) && !IS_ADMIN && ROLE==="employee") return;
      const role = String(c.AuthorRole||"");
      if(role.slice(0,4).toLowerCase()==="log:"){
        /* a persisted change-log entry — restore it with its original act */
        lp.changelog.push({ ts:c.CreatedOn||"", by:c.AuthorID,
          act:role.slice(4)||"edited", target:c.ActionID||"\u2014", note:c.CommentText||"" });
      } else {
        lp.changelog.push({ d:c.CreatedOn||"", by:c.AuthorID,
          tt:(role||"Comment")+" \u00b7 "+(c.ActionID||""), tx:c.CommentText||"" });
      }
    });

    /* -- hipot targets ---------------------------------------------------- */
    if(Array.isArray(d.targets)){
      DB.targets = d.targets.filter(t=>t.TargetID).map(t=>({
        id:t.TargetID, emp:t.EmployeeID, initiative:t.Initiative||"", focus:t.FocusArea||"",
        target:t.Target||"", timeline:t.Timeline||"", comments:t.Comments||"",
        status:t.Status||"Not Started", selfFb:t.SelfFeedback||"", mentorFb:t.MentorFeedback||""
      }));
    }

    /* -- EVP cycle + responses ------------------------------------------- */
    if(Array.isArray(d.evpCycles) && d.evpCycles.length){
      const cur = d.evpCycles.filter(c=>c.CycleID)
        .sort((a,b)=>String(b.ConductedOn||"").localeCompare(String(a.ConductedOn||"")))[0];
      if(cur) DB.evpCycle = { id:cur.CycleID, name:cur.CycleName,
                              conducted:cur.ConductedOn, nextDue:cur.NextDueOn||"" };
    }
    if(Array.isArray(d.evpResponses)){
      /* Columns come straight from the EVP survey export:
         Submitted at | Email | Name | Role | Mentor | <Pillar> rank/sat/comment
         Rows are matched to people by work email. */
      const byEmail = {};
      Object.keys(DB.employees).forEach(id=>{
        const e = String(DB.employees[id].email||"").trim().toLowerCase();
        if(e) byEmail[e] = id;
      });
      DB.evpResponse = {};
      d.evpResponses.forEach(x=>{
        const id = byEmail[String(x["Email"]||"").trim().toLowerCase()];
        if(!id) return;
        const ranks={}, sat={}, comments={};
        EVP_PILLARS.forEach(pl=>{
          const c = pl.col;
          const rk = Number(x[c+" rank"]), st = Number(x[c+" sat"]);
          if(!isNaN(rk) && rk) ranks[pl.k] = rk;
          if(!isNaN(st) && st) sat[pl.k] = st;
          const cm = x[c+" comment"];
          if(cm) comments[pl.k] = String(cm);
        });
        DB.evpResponse[id] = { ranks, sat, comments,
          on: String(x["Submitted at"]||"").slice(0,10) };
      });
    }

    /* -- certifications -------------------------------------------------- */
    if(Array.isArray(d.certifications)){
      DB.certs = {};
      d.certifications.filter(c=>c.CertID).forEach(c=>{
        (DB.certs[c.EmployeeID] = DB.certs[c.EmployeeID] || []).push({
          id:c.CertID, type:c.EntryType||"Certification", name:c.CertName, issuer:c.Issuer||"",
          date:c.CompletedOn||"", expires:c.ExpiresOn||"", cred:c.CredentialID||"",
          hours:c.DurationHours||"", mode:c.Mode||"",
          fileUrl:c.FileURL||"", fileName:c.FileName||""
        });
      });
    }

    /* -- 1. visibility + editor toggles --------------------------------- */
    (d.permissions||[]).filter(p=>p.PermissionKey).forEach(p=>{
      DB.perms[p.PermissionKey] = { vis:truthy(p.MenteeVisible), edit:truthy(p.MenteeEdit) };
      if(String(p.MentorVisible).toLowerCase() !== "n/a")
        DB.permsMentor[p.PermissionKey] = { vis:truthy(p.MentorVisible), edit:truthy(p.MentorEdit) };
    });
    (d.config||[]).filter(c=>c.SettingKey).forEach(c=>{
      const v = String(c.Value).trim().toUpperCase();
      DB.config[c.SettingKey] = v==="TRUE" ? true : v==="FALSE" ? false : c.Value;
    });

    if(typeof rebuildRoleActors==="function") rebuildRoleActors();
    LAST_SYNC = new Date().toTimeString().slice(0,5);
    SYNC_STATE = "live"; syncPill();
    if(CURRENT_EMP){ buildNav(); updateMeta(); render(); }
  }
}

/* ---------- WRITE: same URL, the table name picks the Switch case ---------- */
function saveToExcel(table, key, fields, meta){
  if(!SYNC_ON()) return Promise.resolve();
  return callFlow(Object.assign({
    table: table, key: key || "", fields: fields || {}
  }, meta || {})).then(()=>{
    LAST_SYNC = new Date().toTimeString().slice(0,5);
    SYNC_STATE = "live"; syncPill();
    return true;
  }).catch(err=>{
    console.error("[sync] write failed", table, key, err);
    SYNC_STATE = "error"; syncPill();
    toast("Saved on screen, but Excel didn't confirm \u2014 refresh to check");
    return false;
  });
}
const today = () => new Date().toISOString().slice(0,10);

/* ============================================================================
   HOOKS — the existing save functions are wrapped, not rewritten
   ========================================================================== */

/* 1. toggles ---------------------------------------------------------------- */
const _togglePerm = togglePerm;
togglePerm = function(reg, key, field, on){
  _togglePerm(reg, key, field, on);
  const col = (reg==="mentor" ? "Mentor" : "Mentee") + (field==="vis" ? "Visible" : "Edit");
  const B  = v => v!==false ? "TRUE" : "FALSE";
  const pe = DB.perms[key] || {vis:true, edit:true};
  const pm = DB.permsMentor[key];               // absent on leadership-only keys
  saveToExcel("Permissions", key, {
    PermissionKey: key,
    MenteeVisible: B(pe.vis),          MenteeEdit: B(pe.edit),
    MentorVisible: pm ? B(pm.vis) : "n/a",
    MentorEdit:    pm ? B(pm.edit) : "n/a",
    LastChangedBy: CURRENT_EMP || ACTOR, LastChangedOn: today()
  }, {field:col, oldValue:String(!on).toUpperCase(), newValue:String(on).toUpperCase(), changeType:"Updated"});
};

/* 2. employees -------------------------------------------------------------- */

const _saveEmp = saveEmp;
saveEmp = function(id){
  const before = new Set(Object.keys(DB.employees));
  _saveEmp(id);
  const targetId = id || Object.keys(DB.employees).find(k=>!before.has(k));
  const e = DB.employees[targetId]; if(!e) return;

    {changeType: id ? "Updated" : "Created"});

function deactivate(id, orig){
  const snap = DB.employees[id];
  if(!snap) return;
  const row = empRow(snap, id, "Inactive");
  orig(id);
  if(!DB.employees[id])
    saveToExcel("Employees", id, row,
      {changeType:"Deactivated", field:"RecordStatus", oldValue:"Active", newValue:"Inactive"});
}

const _deleteEmp = deleteEmp;

/* 3. tasks, status and comments --------------------------------------------- */
function newActionId(){
  const used = new Set();
  Object.values(DB.learningPlans).forEach(p => (p.actions||[]).forEach(x => used.add(x.id)));
  let id;
  do {
    id = "LA-" + Date.now().toString(36).slice(-5)
       + Math.floor(Math.random()*46656).toString(36).padStart(3, "0");
  } while(used.has(id));
  return id;
}
function actionRow(a, eid, mentorId){
  return {
    ActionID:a.id, EmployeeID:eid, Band:String(a.band), ActionTitle:a.title,
    StartDate:(a.timeline&&a.timeline.start)||"", EndDate:(a.timeline&&a.timeline.end)||"",
    ApprovalStatus:a.status||"Approved", StatusUpdate:a.update||"", LatestComment:a.comment||"",
    Priority:a.priority||"", ExpectedOutcome:a.outcome||"",
    VisibleToMentee:a._visMentee||"TRUE", VisibleToLeadership:a._visLead||"TRUE",
    MentorID:mentorId||"",
    CreatedBy:a._createdBy||(CURRENT_EMP||ACTOR), CreatedOn:a._createdOn||today(),
    LastUpdatedBy:CURRENT_EMP||ACTOR, LastUpdatedOn:today()
  };
}
const _saveLA = saveLA;
saveLA = function(id){
  const fromEvp = _evpActionFrom;
  const lp = DB.learningPlans[ACTOR];
  const snap = {};
  if(lp) lp.actions.forEach(a => snap[a.id] = JSON.stringify(a));
  _saveLA(id);
  if(!lp) return;
  lp.actions.forEach(a=>{
    const was = snap[a.id];
    if(was === JSON.stringify(a)) return;          // untouched
    const isNew = was === undefined;
    if(isNew){
      // the prototype's id is "LA-" + a number under ~95, which collides across
      // employees. ActionID is the key column, so give it a table-wide unique one.
      const oldId = a.id;
      a.id = newActionId();
      lp.changelog.forEach(l => { if(l.target === oldId) l.target = a.id; });
      a._createdBy = CURRENT_EMP||ACTOR; a._createdOn = today();
    }
    saveToExcel(isNew ? "ActionsNew" : "Actions", a.id,
      actionRow(a, ACTOR, lp.mentor), {changeType: isNew ? "Created" : "Updated"});

    if(_evpActionFrom && isNew) laLog(ACTOR, ACTOR, "created", a.id,
      "Raised from the EVP check-in \u2014 " + _evpActionFrom);

    // a changed comment is also filed as its own threaded comment row
    const prev = was ? (JSON.parse(was).comment||"") : "";
    if((a.comment||"") && (a.comment||"") !== prev){
      saveToExcel("Comments", "", {
        ActionID:a.id, EmployeeID:ACTOR, AuthorID:CURRENT_EMP||ACTOR,
        AuthorRole: ROLE==="mentor" ? "Mentor" : IS_ADMIN ? "HR Admin" : "Employee",
        CommentText:a.comment, VisibleToMentee:"TRUE", VisibleToLeadership:"FALSE",
        CreatedOn:today()
      }, {changeType:"Comment"});
    }
  });

  /* raised from a finding -> show them the plan it landed in */
  if(fromEvp){
    _evpActionFrom = null;
    const eid = ACTOR;
    if(typeof _mentorReturn !== "undefined" && _mentorReturn) openMenteeLearning(eid);
    else { if(typeof _subPage !== "undefined") _subPage = null; go("learning"); }
    toast("Action added to the learning plan");
  }
};

const _approveLA = approveLA;
approveLA = function(eid, id, ok){
  _approveLA(eid, id, ok);
  const lp = DB.learningPlans[eid]; if(!lp) return;
  const a = lp.actions.find(x=>x.id===id); if(!a) return;
  saveToExcel("Actions", id, actionRow(a, eid, lp.mentor),
    {changeType: ok ? "Approved" : "Returned", field:"ApprovalStatus", newValue:a.status});
};

  if(c.readiness !== old) laLog(ACTOR, ACTOR, "edited", "readiness",
    `Readiness: ${old||"\u2014"} \u2192 ${c.readiness||"\u2014"}`);
  c._setBy = CURRENT_EMP||ACTOR;
  saveToExcel(_careerTable(), _careerRowId(), careerRow(),
    {changeType:"Updated", field:"Readiness", oldValue:old, newValue:c.readiness});
};

const _saveMilestone = saveMilestone;
saveMilestone = function(){
  const c0 = curPath(ACTOR); const old = c0 ? c0.next : "";
  _saveMilestone();
  const c = curPath(ACTOR); if(!c) return;
  if(c.next !== old) laLog(ACTOR, ACTOR, "edited", "next-milestone",
    `Next milestone: ${old||"\u2014"} \u2192 ${c.next||"\u2014"}`);
  saveToExcel(_careerTable(), _careerRowId(), careerRow(),
    {changeType:"Updated", field:"NextRole", oldValue:old, newValue:c.next});
};

const _selectPath = selectPath;
function selectPath(i){
  const old = (curPath(ACTOR)||{}).name || "";
  _selectPath(i);
  const c = curPath(ACTOR); if(!c) return;
  if(c.name !== old) laLog(ACTOR, ACTOR, "edited", "career-path",
    `Career path: ${old||"\u2014"} \u2192 ${c.name}`);
  saveToExcel(_careerTable(), _careerRowId(), careerRow(),
    {changeType:"Updated", field:"PathName", newValue:c.name});
};

/* ============================================================================
   SIGN IN — employee ID, access taken from PortalRole on the Employees sheet
   ========================================================================== */
const ROLE_FROM_SHEET = { "HR Admin":"hr", "Leadership":"leader", "Mentor":"mentor", "Employee":"employee" };
let DIRECTORY_READY = false;

function dirNote(txt){
  const el = document.getElementById("dirNote");
  if(el) el.textContent = txt;
}

/* match on WorkEmail from the Employees sheet, case- and space-insensitive */
function findByEmail(raw){
  const e = String(raw||"").trim().toLowerCase();
  if(!e) return "";
  const hit = Object.keys(DB.employees).find(id =>
    String(DB.employees[id].email||"").trim().toLowerCase() === e);
  return hit || "";
}
/* fallback so an employee ID typed into the box still works: "5102" -> "E-5102" */
function normaliseId(raw){
  const s = String(raw||"").trim().toUpperCase().replace(/\s+/g, "");
  if(!s) return "";
  return /^E-/.test(s) ? s : "E-" + s.replace(/^E/, "");
}

doLogin = function(){
  const err = document.getElementById("loginErr");
  const raw = (document.getElementById("loginEmail").value || "").trim();
  if(!raw){ err.textContent = "Enter your work email."; return; }

  const id = findByEmail(raw) || (raw.indexOf("@") === -1 ? normaliseId(raw) : "");
  const emp = id ? DB.employees[id] : null;
  if(!emp){
    err.textContent = (SYNC_ON() && !DIRECTORY_READY)
      ? "Still loading the directory \u2014 try again in a moment."
      : "No active account for " + raw + ".";
    return;
  }
  err.textContent = "";

  /* one-time verification code, emailed via the flow. Demo mode (no flow URL)
     can't send email, so it signs straight in. */
  if(SYNC_ON()){ startOtp(id, emp); return; }
  completeLogin(id, emp);
};

let _OTP = null;
function startOtp(id, emp){
  const email = emp.email || "";
  if(!email){ completeLogin(id, emp); return; }   // no email on record — nothing to send a code to
  const code = String(Math.floor(100000 + Math.random()*900000));
  _OTP = { id, emp, code, expires: Date.now()+5*60000, tries:0, lastSent: Date.now() };
  callFlow({ table:"OTP", key:id, fields:{ Email:email, Name:emp.name||id, Code:code } })
    .catch(()=>{ const el=document.getElementById("otpErr");
      if(el) el.textContent="Couldn't send the code \u2014 use Resend, or check the flow's OTP case."; });
  document.getElementById("emailStep").style.display="none";
  document.getElementById("otpStep").style.display="block";
  const masked = email.replace(/^(.).*(@.*)$/, "$1***$2");
  document.getElementById("otpNote").textContent = "We emailed a 6-digit code to "+masked+". It expires in 5 minutes.";
  document.getElementById("otpErr").textContent = "";
  const inp=document.getElementById("otpCode"); inp.value=""; inp.focus();
}
function verifyOtp(){
  const err=document.getElementById("otpErr");
  if(!_OTP){ otpBack(); return; }
  if(Date.now() > _OTP.expires){ err.textContent="That code has expired \u2014 press Resend for a new one."; return; }
  _OTP.tries++;
  if(_OTP.tries > 5){ err.textContent="Too many attempts \u2014 press Resend for a new code."; return; }
  const v=(document.getElementById("otpCode").value||"").trim();
  if(v !== _OTP.code){ err.textContent="That code doesn't match \u2014 check the email and try again."; return; }
  const {id, emp} = _OTP; _OTP = null;
  otpBack(true);
  completeLogin(id, emp);
}
function resendOtp(){
  if(!_OTP){ otpBack(); return; }
  if(Date.now() - _OTP.lastSent < 30000){
    document.getElementById("otpErr").textContent="Just sent \u2014 give it a few seconds before resending."; return;
  }
  startOtp(_OTP.id, _OTP.emp);
  document.getElementById("otpNote").textContent += "  (new code sent)";
}
function otpBack(silent){
  _OTP = null;
  document.getElementById("otpStep").style.display="none";
  document.getElementById("emailStep").style.display="block";
  if(!silent){ const e=document.getElementById("loginErr"); if(e) e.textContent=""; }
}

function completeLogin(id, emp){
  const sheetRole = emp.role || (id === "E-0001" ? "HR Admin" : "Employee");
  CURRENT_ACCOUNT = emp.email || id;
  CURRENT_EMP = id;
  IS_ADMIN = (sheetRole === "HR Admin");

  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("appShell").style.display = "flex";
  document.getElementById("rolePick").style.display = IS_ADMIN ? "block" : "none";
  document.getElementById("acctLine").innerHTML =
    "Signed in as<br><b>" + emp.name + "</b>"
    + '<br><span style="opacity:.65">' + id + " \u00b7 " + sheetRole + "</span>";

  const land = ROLE_FROM_SHEET[sheetRole] || "employee";
  const hats = Array.from(new Set([land].concat(availableRoles(id))))
                    .filter(r => r !== "leader" && r !== "hr");
  buildHatSwitcher(hats);
  if(!IS_ADMIN) ACTOR = id;
  setRole(land);
  updateBackBtn();
  loadFromExcel(false);   // reload so row-level visibility applies for this role
}

/* the directory has to exist before anyone can sign in, so pull it up front */
syncPill();

/* the sticky page header only grows a border once it's actually stuck,
   so it stays flat at the very top of the page */
(function(){
  const ph = document.querySelector(".phead");
  if(!ph) return;
  const mark = () => ph.classList.toggle("stuck", window.scrollY > 4);
  window.addEventListener("scroll", mark, {passive:true});
  mark();
})();
if(SYNC_ON()){
  loadFromExcel(false).then(() => {
    DIRECTORY_READY = (SYNC_STATE === "live");
    dirNote(DIRECTORY_READY
      ? "Use the work email on your HR record."
      : "Directory unavailable \u2014 check your connection and reload.");
  });
} else {
  DIRECTORY_READY = true;
  dirNote("Use the work email on your HR record.");
}
