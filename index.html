<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Altudo · EVP Insights</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Mulish:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --display: 'Fraunces', Georgia, serif;
    --body: 'Mulish', -apple-system, BlinkMacSystemFont, sans-serif;

    /* surfaces: three warm layers rather than one flat cream */
    --bg: #f2eee4;
    --bg-deep: #ebe5d8;
    --cream: #faf7f0;
    --surface: #ffffff;

    --ink: #16212e;
    --ink-soft: #4a5363;
    --ink-faint: #8a8f99;
    --line: #e6dfd1;
    --line-soft: #f0ebe0;

    --accent: #2f6350;
    --accent-deep: #1d4436;
    --accent-bright: #3f8a6d;
    --accent-tint: #e6efe9;
    --accent-line: #bcd4c5;

    --ok: #5a8a5e; --ok-ink: #3a6b3e; --ok-tint: #ecf2ec; --ok-line: #cbdccc;
    --warn: #c08a3e; --warn-ink: #8a6020; --warn-tint: #f6eddd; --warn-line: #ecd9ba;
    --flag: #b8623f; --flag-ink: #96482a; --flag-line: #e6c4b4; --flag-tint: #f8ebe4;

    --sh-1: 0 1px 2px rgba(22,33,46,.05), 0 1px 3px rgba(22,33,46,.04);
    --sh-2: 0 2px 6px rgba(22,33,46,.06), 0 8px 20px rgba(22,33,46,.05);
    --sh-3: 0 18px 48px rgba(22,33,46,.16);
    --r-sm: 9px; --r-md: 13px; --r-lg: 18px; --r-xl: 24px;
    --ease: cubic-bezier(.2,.7,.3,1);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 132px; }
  html, body { margin: 0; }
  body {
    background:
      radial-gradient(1200px 420px at 8% -8%, #fffdf7 0%, rgba(255,253,247,0) 62%),
      radial-gradient(900px 380px at 100% 0%, var(--accent-tint) 0%, rgba(230,239,233,0) 55%),
      var(--bg);
    background-attachment: fixed;
    font-family: var(--body); color: var(--ink-soft);
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  button { font-family: var(--body); cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible {
    outline: 2px solid var(--accent-bright); outline-offset: 2px; border-radius: 6px;
  }
  .hidden { display: none !important; }
  ::selection { background: var(--accent-tint); color: var(--accent-deep); }

  /* ---------- masthead ---------- */
  .pub-header {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px;
    padding: 13px clamp(16px, 4vw, 44px);
    background: linear-gradient(120deg, var(--accent-deep) 0%, var(--accent) 62%, #35705a 100%);
    position: sticky; top: 0; z-index: 40; border-bottom: 1px solid rgba(255,255,255,.10);
    box-shadow: 0 1px 0 rgba(22,33,46,.06), 0 10px 30px -18px rgba(22,33,46,.5);
  }
  .brand { display: flex; gap: 12px; align-items: center; min-width: 0; }
  .brand-mark {
    width: 36px; height: 36px; border-radius: 11px; background: rgba(255,255,255,.14);
    border: 1px solid rgba(255,255,255,.28); color: #fff; display: grid; place-items: center;
    font-family: var(--display); font-weight: 700; font-size: 18px; letter-spacing: -.02em;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.25);
  }
  .brand-name { font-family: var(--display); font-weight: 600; font-size: 16.5px; color: #fff; letter-spacing: -.01em; }
  .brand-sub { font-size: 11.5px; color: rgba(255,255,255,.62); letter-spacing: .01em; }
  .hdr-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  .btn {
    border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: var(--r-sm);
    padding: 8px 14px; font-size: 13px; font-weight: 700; letter-spacing: .005em;
    transition: transform .16s var(--ease), box-shadow .16s var(--ease), background .16s var(--ease), border-color .16s var(--ease);
    box-shadow: var(--sh-1);
  }
  .btn:hover { border-color: var(--accent-line); background: var(--accent-tint); transform: translateY(-1px); box-shadow: var(--sh-2); }
  .btn:active { transform: translateY(0); box-shadow: var(--sh-1); }
  .btn.primary { background: #fff; border-color: transparent; color: var(--accent-deep); }
  .btn.primary:hover { background: #fff; color: var(--accent-deep); }
  .btn.ghost { background: rgba(255,255,255,.10); border-color: rgba(255,255,255,.30); color: #fff; box-shadow: none; }
  .btn.ghost:hover { background: rgba(255,255,255,.20); border-color: rgba(255,255,255,.5); color: #fff; }
  .btn.small { padding: 5px 11px; font-size: 12px; border-radius: 8px; }
  /* buttons inside the page body / modals sit on light ground */
  main .btn.ghost, .modal .btn.ghost { background: transparent; border-color: var(--line); color: var(--ink); }
  main .btn.ghost:hover, .modal .btn.ghost:hover { background: var(--accent-tint); border-color: var(--accent-line); color: var(--ink); }
  main .btn.primary, .modal .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  main .btn.primary:hover, .modal .btn.primary:hover { background: var(--accent-deep); color: #fff; }

  .lnk { background: none; border: 0; padding: 0; font-size: 11.5px; font-weight: 800; color: var(--accent);
    letter-spacing: .02em; text-transform: uppercase; }
  .lnk:hover { color: var(--accent-deep); text-decoration: underline; text-underline-offset: 3px; }

  main { max-width: 1200px; margin: 0 auto; padding: clamp(20px, 3.4vw, 34px) clamp(16px, 4vw, 36px) 96px; }

  /* ---------- hero ---------- */
  .page-title {
    font-family: var(--display); font-size: clamp(30px, 4.6vw, 44px); color: var(--ink);
    font-weight: 600; margin: 0 0 10px; letter-spacing: -.022em; line-height: 1.08;
  }
  .page-lede { font-size: 15px; color: var(--ink-soft); max-width: none; line-height: 1.68; margin: 0 0 12px; }
  .data-meta {
    font-size: 12.5px; color: var(--ink-faint); margin: 0 0 26px; padding-top: 12px;
    border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center;
  }
  .data-meta b { color: var(--accent); font-weight: 800; }
  .data-meta a { color: var(--accent); font-weight: 700; text-decoration: none; border-bottom: 1px solid var(--accent-line); }
  .data-meta a:hover { border-bottom-color: var(--accent); }

  /* ---------- section rhythm ---------- */
  .section { margin-top: 52px; scroll-margin-top: 150px; }
  .section-eyebrow {
    font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; font-weight: 800;
    color: var(--accent); margin-bottom: 7px; display: flex; align-items: center; gap: 9px;
  }
  .section-eyebrow::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--accent-line), transparent); }
  .section-title { font-family: var(--display); font-size: clamp(20px, 2.4vw, 26px); color: var(--ink); font-weight: 600; margin: 0 0 6px; letter-spacing: -.015em; }
  .section-sub { font-size: 13.5px; color: var(--ink-faint); margin: 0 0 18px; max-width: none; line-height: 1.6; }
  .section-sub a { color: var(--accent); font-weight: 700; }

  /* ---------- KPI ---------- */
  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; margin-top: 24px; }
  .kpi {
    position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
    padding: 18px 20px 17px; box-shadow: var(--sh-1); overflow: hidden;
    transition: transform .2s var(--ease), box-shadow .2s var(--ease);
  }
  .kpi::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--accent); opacity: .85; }
  .kpi:hover { transform: translateY(-2px); box-shadow: var(--sh-2); }
  .kpi .k-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .kpi .k-label { font-size: 10.5px; letter-spacing: .13em; text-transform: uppercase; font-weight: 800; color: var(--ink-faint); }
  .k-verdict {
    font-size: 9.5px; font-weight: 800; letter-spacing: .11em; text-transform: uppercase;
    border-radius: 999px; padding: 3px 9px; white-space: nowrap; border: 1px solid transparent;
  }
  .k-verdict.good { background: var(--ok-tint); color: var(--ok-ink); border-color: var(--ok-line); }
  .k-verdict.watch { background: var(--warn-tint); color: var(--warn-ink); border-color: var(--warn-line); }
  .k-verdict.act { background: var(--flag-tint); color: var(--flag-ink); border-color: var(--flag-line); }
  .heat-key {
    display: flex; align-items: center; flex-wrap: wrap; gap: 6px 14px; margin-top: 12px;
    font-size: 11.5px; color: var(--ink-faint);
  }
  .heat-key .hk-scale { display: flex; align-items: center; gap: 0; border-radius: 4px; overflow: hidden; border: 1px solid var(--line); }
  .heat-key .hk-scale i { width: 26px; height: 11px; display: block; }
  .heat-key b { color: var(--ink-soft); font-weight: 700; }
  .kpi .k-value { font-family: var(--display); font-size: 38px; font-weight: 600; color: var(--ink); margin: 8px 0 4px; letter-spacing: -.02em; line-height: 1; font-variant-numeric: tabular-nums; }
  .kpi .k-value small { font-size: 15px; color: var(--ink-faint); font-family: var(--body); font-weight: 700; }
  .kpi .k-note { font-size: 12px; color: var(--ink-soft); line-height: 1.5; }
  .kpi.tone-ok { background: linear-gradient(170deg, var(--ok-tint), var(--surface) 62%); border-color: var(--ok-line); }
  .kpi.tone-ok::before { background: var(--ok); }
  .kpi.tone-warn { background: linear-gradient(170deg, var(--warn-tint), var(--surface) 62%); border-color: var(--warn-line); }
  .kpi.tone-warn::before { background: var(--warn); }
  .kpi.tone-flag { background: linear-gradient(170deg, var(--flag-tint), var(--surface) 62%); border-color: var(--flag-line); }
  .kpi.tone-flag::before { background: var(--flag); }

  /* ---------- cards ---------- */
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 22px;
    box-shadow: var(--sh-1);
  }
  .grid-2 { display: grid; grid-template-columns: 1.35fr 1fr; gap: 16px; }
  @media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }

  .pillar-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
  .pillar-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 17px 18px;
    box-shadow: var(--sh-1); transition: transform .2s var(--ease), box-shadow .2s var(--ease), border-color .2s var(--ease);
  }
  .pillar-card:hover { transform: translateY(-2px); box-shadow: var(--sh-2); border-color: var(--accent-line); }
  .pillar-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
  .pillar-name { font-family: var(--display); font-weight: 600; font-size: 17px; color: var(--ink); letter-spacing: -.01em; }
  .pillar-sat { font-family: var(--display); font-weight: 700; font-size: 25px; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .pillar-meta { font-size: 12px; color: var(--ink-faint); margin-bottom: 11px; }
  .bar-row { display: flex; align-items: center; gap: 9px; font-size: 11.5px; color: var(--ink-faint); margin-top: 6px; }
  .bar-track { flex: 1; height: 8px; border-radius: 5px; background: var(--bg-deep); overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 5px; transition: width .5s var(--ease); }
  .dist { display: flex; gap: 3px; align-items: flex-end; height: 36px; margin-top: 12px; }
  .dist span { flex: 1; background: var(--accent-line); border-radius: 3px 3px 0 0; min-height: 2px; transition: height .4s var(--ease); }
  .dist span.low { background: var(--flag-line); }
  .dist-x { display: flex; justify-content: space-between; font-size: 10px; color: var(--ink-faint); margin-top: 4px; }

  /* ---------- chips ---------- */
  .chip {
    display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700;
    border-radius: 999px; padding: 4px 11px; border: 1px solid var(--line); background: var(--cream); color: var(--ink-soft);
    transition: all .16s var(--ease);
  }
  .chip.flag { background: var(--flag-tint); border-color: var(--flag-line); color: var(--flag-ink); }
  .chip.warn { background: var(--warn-tint); border-color: var(--warn-line); color: var(--warn-ink); }
  .chip.ok { background: var(--ok-tint); border-color: var(--ok-line); color: var(--ok-ink); }

  /* ---------- executive control rail ---------- */
  .fbar {
    position: sticky; top: 62px; z-index: 30;
    display: flex; flex-wrap: wrap; align-items: center; gap: 7px;
    background: rgba(255,255,255,.94); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--line); border-radius: var(--r-lg);
    padding: 11px 14px; box-shadow: var(--sh-2);
  }
  @media (max-width: 700px) { .fbar { position: static; background: var(--surface); backdrop-filter: none; } }
  .fbar-label { font-size: 10px; letter-spacing: .17em; text-transform: uppercase; font-weight: 800; color: var(--ink-faint); margin-right: 3px; }
  .fsep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }
  .fwrap { position: relative; display: inline-block; }
  .fbtn {
    display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 700; color: var(--ink);
    background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 6px 11px;
    transition: all .15s var(--ease); white-space: nowrap;
  }
  .fbtn:hover { border-color: var(--accent-line); background: var(--accent-tint); }
  .fbtn.on { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 2px 8px -3px rgba(47,99,80,.6); }
  .fbtn .fn-n { font-size: 11px; font-weight: 800; color: var(--ink-faint); background: var(--bg-deep); border-radius: 999px; padding: 1px 7px; font-variant-numeric: tabular-nums; }
  .fbtn.on .fn-n { background: rgba(255,255,255,.22); color: #fff; }
  .fbtn .caret { font-size: 9px; opacity: .55; }
  .fbtn.hipo.on { background: var(--warn); border-color: var(--warn); color: #fff; }
  .fbtn.hipo.on .fn-n { background: rgba(255,255,255,.24); color: #fff; }
  .fpanel {
    position: absolute; top: calc(100% + 8px); left: 0; z-index: 55; background: var(--surface);
    border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--sh-3); width: 292px;
    max-height: 368px; display: flex; flex-direction: column; overflow: hidden;
  }
  .fpanel.right { left: auto; right: 0; }
  .fpanel-head { padding: 10px 11px 9px; border-bottom: 1px solid var(--line-soft); }
  .fpanel-head input { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font-size: 12.5px; font-family: var(--body); }
  .fpanel-list { flex: 1; overflow: auto; padding: 6px; }
  .frow { display: flex; align-items: center; gap: 9px; padding: 7px 9px; border-radius: 8px; cursor: pointer; font-size: 12.5px; color: var(--ink); }
  .frow:hover { background: var(--accent-tint); }
  .frow .flab { flex: 1; overflow-wrap: anywhere; }
  .frow .fn-n { color: var(--ink-faint); font-size: 11px; font-variant-numeric: tabular-nums; }
  .fpanel-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 9px 11px; border-top: 1px solid var(--line-soft); background: var(--cream); }
  .fchips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; width: 100%; margin-top: 3px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .fchip {
    display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700; cursor: pointer;
    background: var(--accent-tint); border: 1px solid var(--accent-line); color: var(--accent-deep);
    border-radius: 999px; padding: 3px 10px;
  }
  .fchip:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
  .fchip .fk { font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; opacity: .72; font-weight: 800; }
  .fsummary {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px;
    background: linear-gradient(120deg, var(--accent-tint), var(--cream));
    border: 1px solid var(--accent-line); border-radius: var(--r-md);
    padding: 11px 16px; margin: 10px 0 22px; font-size: 13px; color: var(--accent-deep);
  }
  .fsummary b { font-family: var(--display); font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
  .fsummary .fs-sub { color: var(--ink-faint); font-size: 12.5px; font-weight: 600; }

  /* ---------- filter bar ---------- */
  .filters {
    display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; align-items: center;
  }
  .filters select, .filters input[type=search] {
    font-family: var(--body); font-size: 13px; border: 1px solid var(--line);
    border-radius: 9px; padding: 8px 11px; background: var(--surface); color: var(--ink); box-shadow: var(--sh-1);
  }
  #ratingChips {
    background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 10px 15px;
    box-shadow: var(--sh-1);
  }
  #ratingChips .chip { cursor: pointer; user-select: none; background: var(--surface); }
  #ratingChips .chip:hover { border-color: var(--accent-line); background: var(--accent-tint); }
  #ratingChips .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 2px 8px -2px rgba(47,99,80,.5); }
  .theme-chips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; }
  .theme-chips .chip { cursor: pointer; user-select: none; }
  .theme-chips .chip:hover { border-color: var(--accent-line); }
  .theme-chips .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* ---------- tables ---------- */
  .heat-wrap { overflow-x: auto; border-radius: var(--r-md); }
  table.heat { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 700px; font-size: 12.5px; }
  table.heat th, table.heat td { padding: 9px 11px; text-align: center; border-bottom: 1px solid var(--line-soft); border-right: 1px solid var(--line-soft); }
  table.heat tr:last-child td { border-bottom: 0; }
  table.heat th:last-child, table.heat td:last-child { border-right: 0; }
  table.heat th {
    position: sticky; top: 0; z-index: 2; background: var(--cream); color: var(--ink); font-weight: 800;
    font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; border-bottom: 1px solid var(--line);
  }
  table.heat td.rowhead { text-align: left; background: var(--cream); font-weight: 700; color: var(--ink); white-space: nowrap; }
  table.heat td .hm-n { display: block; font-size: 10px; color: rgba(22,33,46,.55); font-weight: 600; }
  table.heat td .hm-sub { display: block; font-size: 10.5px; font-weight: 500; color: var(--ink-faint); white-space: normal; max-width: 260px; line-height: 1.35; margin-top: 1px; }

  table.data { border-collapse: collapse; width: 100%; font-size: 13px; }
  table.data th {
    text-align: left; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint);
    border-bottom: 1px solid var(--line); padding: 9px 11px; font-weight: 800;
    position: sticky; top: 0; background: var(--surface); z-index: 1;
  }
  table.data td { padding: 11px 11px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
  table.data tr:last-child td { border-bottom: 0; }
  table.data tbody tr, table.data tr { transition: background .14s var(--ease); }
  table.data tr:hover td { background: var(--cream); }
  table.data td b { color: var(--ink); font-weight: 700; }

  .cohort-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .cohort-tools input[type=search] { flex: 1; min-width: 180px; border: 1px solid var(--line); border-radius: 9px; padding: 8px 11px; font-size: 13px; font-family: var(--body); }
  .cohort-tools select { border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; font-size: 12.5px; font-family: var(--body); background: var(--surface); }
  .cohort-tools .chip { cursor: pointer; }
  .cohort-tools .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .cohort-count { font-size: 11.5px; color: var(--ink-faint); white-space: nowrap; }
  .cohort-scroll { max-height: 520px; overflow: auto; margin-top: 12px; }
  .cohort-table th.sortable { cursor: pointer; user-select: none; white-space: nowrap; }
  .cohort-table th.sortable:hover { color: var(--accent); }
  .cohort-table th.sorted { color: var(--accent); }
  .cohort-table .arw { font-size: 8px; margin-left: 4px; }
  .pill-cell { font-size: 12.5px; white-space: nowrap; }
  .pill-cell b { font-variant-numeric: tabular-nums; }
  .cohort-card > div:first-child {
    position: sticky; top: -22px; z-index: 3; background: var(--surface);
    padding: 4px 0 8px; margin-top: -4px;
  }

  /* ---------- narrative ---------- */
  .narrative {
    background: linear-gradient(165deg, var(--cream), var(--surface) 55%);

  .narrative ol { margin: 0; padding-left: 22px; display: grid; gap: 15px; }
  .narrative li { font-size: 14.5px; line-height: 1.68; color: var(--ink-soft); padding-left: 4px; }

  /* ---------- pillar table ---------- */

  /* ---------- mentor cohort detail ---------- */
  .cx-list { display: grid; gap: 2px; border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; }

  .cx-row:last-child { border-bottom: 0; }

  .cx-name b { font-size: 13.5px; color: var(--ink); }

  .cx-meta { display: block; font-size: 11px; color: var(--ink-faint); margin-top: 2px; }

  @media (max-width: 820px) { .cx-row { grid-template-columns: 1fr 1fr; row-gap: 8px; } }

  /* ---------- pillar drill-down ---------- */
  .pd-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 14px 0 4px; }
  .pd-kpis > div { background: var(--cream); border: 1px solid var(--line); border-radius: var(--r-md); padding: 10px 12px; }
  .pd-k { display: block; font-size: 9.5px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 4px; }
  .pd-kpis b { font-family: var(--display); font-size: 22px; font-weight: 600; color: var(--ink); display: block; }

  .read-head {
    display: flex; align-items: center; gap: 10px;
    margin: 26px 0 12px; font-size: 11px; font-weight: 800; letter-spacing: .12em;
    text-transform: uppercase; color: var(--ink-faint);
  }

  /* ---------- three insight boards ---------- */
  .insight-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; align-items: stretch; }
  .insight-row.two { grid-template-columns: repeat(2, 1fr); }

    display: flex; flex-direction: column; background: var(--surface);

  .insight:hover { transform: translateY(-2px); box-shadow: var(--sh-2); }
  .insight.fix { border-top-color: var(--flag); }
  .insight.watch { border-top-color: var(--warn); }
  .insight.protect { border-top-color: var(--ok); }
  .insight.act { border-top-color: var(--accent); }
  .insight-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
    padding-bottom: 12px; margin-bottom: 4px; border-bottom: 1px solid var(--line-soft); }
  .insight-title { font-family: var(--display); font-size: 19px; font-weight: 600; color: var(--ink);
    margin: 0; letter-spacing: -.015em; }

    color: var(--ink-faint); white-space: nowrap; }

  .insight.fix .insight-sub { color: var(--flag-ink); }

  .insight-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 13px; }
  .insight-list li {
    position: relative; padding-left: 19px; font-size: 13.5px; line-height: 1.62; color: var(--ink-soft);
  }
  .insight-list li::before {

  .insight.protect .insight-list li::before { background: var(--ok); }
  .insight.fix .insight-list li::before { background: var(--flag); }
  .insight.act .insight-list li::before { background: var(--accent); }

  /* ---------- modal ---------- */
  .modal-scrim {

  }
  @keyframes scrimIn { from { opacity: 0 } to { opacity: 1 } }
  .modal {
    background: var(--surface); border-radius: var(--r-xl); max-width: 660px; width: 100%; max-height: 88vh;
    overflow: auto; padding: 28px; box-shadow: var(--sh-3); border: 1px solid var(--line);
    animation: modalIn .22s var(--ease); animation-fill-mode: both;
  }
  /* facet repaints swap only the checklists — never fade the shell again */
  .ck-box, .ck-row, .ck-list { animation: none !important; }

  .modal h3 { font-family: var(--display); color: var(--ink); font-weight: 600; margin: 0 0 8px; font-size: 21px; letter-spacing: -.015em; }

  .modal textarea { width: 100%; min-height: 140px; border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px;

  /* ---------- access editor: steps + checklists ---------- */
  .step-head {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin: 20px 0 8px; font-size: 11px; font-weight: 800; letter-spacing: .12em;
    text-transform: uppercase; color: var(--ink-faint);
  }
  .step-head > span:first-child { display: flex; align-items: center; gap: 9px; }
  .step-head > span:first-child::after { content: ""; display: block; width: 26px; height: 1px; background: var(--accent-line); }
  .ck-box { border: 1px solid var(--line); border-radius: var(--r-md); padding: 11px 12px; min-width: 0; background: var(--cream); }
  .ck-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 22px; }
  .ck-title { font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--ink); overflow-wrap: anywhere; }
  .ck-count { font-size: 10.5px; font-weight: 700; color: var(--accent); background: var(--accent-tint); border-radius: 999px; padding: 2px 8px; white-space: nowrap; }

  .ck-find { flex: 1; min-width: 70px; border: 1px solid var(--line); border-radius: 7px; padding: 4px 8px; font-size: 11.5px; font-family: var(--body); background: var(--surface); }
  .ck-list { max-height: 190px; overflow-y: auto; overflow-x: hidden; margin: 0 -4px; padding: 0 4px; }
  .ck-row { display: flex; gap: 8px; align-items: center; font-size: 12.5px; padding: 4px 6px; cursor: pointer; border-radius: 7px; transition: background .12s var(--ease); }

  .foot-note { margin-top: 64px; padding-top: 22px; border-top: 1px solid var(--line); text-align: center; font-size: 12px; color: var(--ink-faint); }
  svg text { font-family: var(--body); }

  @media (max-width: 700px) {
    .brand-sub { display: none; }

  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    html { scroll-behavior: auto; }
  }
  @media print {
    .pub-header .hdr-actions, .filters, .load-more { display: none; }
    body { background: #fff; }
    .card, .kpi, .pillar-card, .comment { box-shadow: none; break-inside: avoid; }
    .section { margin-top: 28px; }
  }
</style>

   in state.rosterEdits and re-applied after every sync, so a re-import never

const ROSTER_FIELDS = ["name", "role", "grade", "country", "func", "mentor", "mentorEmail", "rating", "hipo", "empId", "doj"];
const ROSTER_BASE = Object.fromEntries(ROSTER.map(r => [r.email, Object.assign({}, r)]));
/* Three layers, lowest first: the embedded roster, whatever the Excel master
   sheet last said, then manual HR corrections. Rebuilding from the base each
   time means removing an override actually restores the original value. */
function applyRosterEdits() {
  for (const r of ROSTER) {
    const base = ROSTER_BASE[r.email];
    if (base) for (const f of ROSTER_FIELDS) r[f] = base[f];
  }
  for (const layer of [state.rosterSync, state.rosterEdits]) {
    for (const [em, patch] of Object.entries(layer || {})) {
      const key = String(em).toLowerCase();
      let r = ROSTER_BY_EMAIL[key];
      if (!r && patch && patch.name) {              // someone new joined via the Excel
        r = { email: key, name: patch.name, role: "", mentor: "", mentorEmail: "", rating: "", hipo: false,
              grade: "", country: "", func: "", doj: "", empId: "", status: "" };
        ROSTER.push(r); ROSTER_BY_EMAIL[key] = r; ROSTER_BASE[key] = Object.assign({}, r);
      }
      if (!r || !patch) continue;
      for (const f of ROSTER_FIELDS) if (f in patch && patch[f] !== "" && patch[f] != null) r[f] = patch[f];
    }
  }
}
function editPerson(email, patch) {
  const em = String(email || "").toLowerCase();

function sameMentorName(a, b) {
  const na = String(a || "").trim().toLowerCase().replace(/[.]/g, "");

function parseCSV(text) {
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(cell); cell = "";
      if (row.some(x => x.trim() !== "")) rows.push(row);
      row = [];
    } else cell += c;
  }
  row.push(cell);
  if (row.some(x => x.trim() !== "")) rows.push(row);
  return rows;
}

    else if (!map.mentorEmail && n.includes("mentoremail")) map.mentorEmail = i;
    else if (!map.mentor && (n === "mentor" || n === "mentorname")) map.mentor = i;
    for (const k of PKEYS) {

}

/* Power Automate style JSON: array of { email, name, ..., career:{rank,sat,comment}, ... }
   or flat { career_rank, career_sat, ... }. Accepts { value:[...] } / { rows:[...] } wrappers. */
function jsonToResponses(data) {
  let arr = Array.isArray(data) ? data : (data && (data.value || data.rows || data.responses));
  if (!Array.isArray(arr)) throw new Error("Expected a JSON array of responses (or { value: [...] }).");
  let added = 0;
  for (const o of arr) {
    if (!o) continue;
    const email = String(o.email || o.Email || "").trim().toLowerCase();
    if (!email.includes("@")) continue;
    const roster = ROSTER_BY_EMAIL[email];
    const sub = state.responses[email] || { ranks: {}, sat: {}, comments: {} };
    sub.email = email;
    sub.name = o.name || roster?.name || email.split("@")[0];
    sub.role = o.role || roster?.role || "";
    sub.mentor = o.mentor || roster?.mentor || "";
    sub.mentorEmail = o.mentorEmail || roster?.mentorEmail || "";
    const fv = o.function || o.practice || o.department || o.vertical;
    if (fv && String(fv).trim() && !(state.rosterEdits[email] || {}).func) state.fnMap[email] = String(fv).trim();
    const d = Date.parse(o.submittedAt || o.SubmittedAt || "");
    sub.submittedAt = isNaN(d) ? (sub.submittedAt || Date.now()) : d;
    for (const k of PKEYS) {
      const nested = o[k];
      if (nested && typeof nested === "object") {
        if (nested.sat != null) sub.sat[k] = +nested.sat;
        if (nested.rank != null) sub.ranks[k] = +nested.rank;
        if (nested.comment != null) sub.comments[k] = String(nested.comment);
      } else {
        if (o[k + "_sat"] != null) sub.sat[k] = +o[k + "_sat"];
        if (o[k + "_rank"] != null) sub.ranks[k] = +o[k + "_rank"];
        if (o[k + "_comment"] != null) sub.comments[k] = String(o[k + "_comment"]);
      }
    }
    if (Object.keys(sub.sat).length) { state.responses[email] = sub; added++; }
  }
  return added;
}

async function handleFile(file) {
  const name = (file.name || "").toLowerCase();
  if (name.endsWith(".json")) {
    return jsonToResponses(JSON.parse(await file.text()));
  }
  if (name.endsWith(".xlsx") || name.endsWith(".xls") || name.endsWith(".xlsm")) {
    if (typeof XLSX === "undefined") throw new Error("The Excel reader didn't load (no internet?). Save the file as CSV and import that instead.");
    const wb = XLSX.read(await file.arrayBuffer(), { type: "array" });
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: false, defval: "" });
    const rows = aoa.filter(r => r.some(c => String(c).trim() !== ""));
    return rowsToResponses(rows[0], rows.slice(1));
  }
  const rows = parseCSV(await file.text());
  if (rows.length < 2) throw new Error("The file has no data rows.");
  return rowsToResponses(rows[0], rows.slice(1));
}

/* ---------------- analytics ---------------- */
function mean(a) { return a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0; }
function fmt(n, d = 1) { return (Math.round(n * Math.pow(10, d)) / Math.pow(10, d)).toFixed(d); }
function esc(s) { return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }

function personIndex(sub) {
  // Importance-weighted satisfaction: weight = 7 − rank (rank 1 → weight 6).
  let num = 0, den = 0;
  for (const k of PKEYS) {
    const s = sub.sat[k]; if (s == null) continue;
    const w = sub.ranks[k] ? (7 - sub.ranks[k]) : 3.5;
    num += s * w; den += w;
  }
  return den ? num / den : null;
}

function buildStats() {
  const roster = rosterPool();
  const subs = respondentPool();
  const n = subs.length;
  const st = {
    n, rosterN: roster.length, participation: roster.length ? n / roster.length : 0,
    pillars: {}, bands: {}, mentors: {}, attention: [], indices: [],
    nonResponders: roster.filter(r => !state.responses[r.email]),
  };
  for (const k of PKEYS) st.pillars[k] = { sats: [], ranks: [], dist: Array(10).fill(0), low: 0, high: 0, comments: 0, top1: 0, top2: 0 };
  for (const sub of subs) {
    const band = bandOfPerson(sub.email, sub.role);
    const idx = personIndex(sub);
    if (idx != null) st.indices.push(idx);
    if (!st.bands[band]) st.bands[band] = { n: 0, pillars: Object.fromEntries(PKEYS.map(k => [k, []])), indices: [] };
    st.bands[band].n++; if (idx != null) st.bands[band].indices.push(idx);
    const mentor = sub.mentor || "(no mentor)";
    if (!st.mentors[mentor]) st.mentors[mentor] = { n: 0, indices: [], pillars: Object.fromEntries(PKEYS.map(k => [k, []])) };
    st.mentors[mentor].n++; if (idx != null) st.mentors[mentor].indices.push(idx);
    const fn = fnOfSub(sub);
    if (!st.fns) st.fns = {};
    if (!st.fns[fn]) st.fns[fn] = { n: 0, indices: [], pillars: Object.fromEntries(PKEYS.map(k => [k, []])) };
    st.fns[fn].n++; if (idx != null) st.fns[fn].indices.push(idx);
    let lowCount = 0;
    for (const k of PKEYS) {
      const s = sub.sat[k];
      if (s != null) {
        st.pillars[k].sats.push(s);
        st.pillars[k].dist[Math.max(0, Math.min(9, Math.round(s) - 1))]++;
        if (s <= 6) { st.pillars[k].low++; lowCount++; }
        if (s >= 7) st.pillars[k].high++;   // 7–10 counts as strong
        st.bands[band].pillars[k].push(s);
        st.mentors[mentor].pillars[k].push(s);
        st.fns[fn].pillars[k].push(s);
      }
      if (sub.ranks[k]) { st.pillars[k].ranks.push(sub.ranks[k]); if (sub.ranks[k] === 1) st.pillars[k].top1++; if (sub.ranks[k] <= 2) st.pillars[k].top2++; }
      if ((sub.comments[k] || "").trim()) st.pillars[k].comments++;
    }
    st.attention.push({ sub, idx: idx ?? 0, lowCount, band });
  }
  for (const k of PKEYS) {
    const p = st.pillars[k];
    p.meanSat = mean(p.sats);
    p.meanRank = mean(p.ranks);
    p.importance = p.ranks.length ? 7 - p.meanRank : 3.5;  // 1..6, higher = more important
    p.lowPct = p.sats.length ? p.low / p.sats.length : 0;
    p.highPct = p.sats.length ? p.high / p.sats.length : 0;
    p.top1Pct = p.ranks.length ? p.top1 / p.ranks.length : 0;
    p.top2Pct = p.ranks.length ? p.top2 / p.ranks.length : 0;
  }
  st.evpIndex = mean(st.indices);
  st.atRisk = st.attention.filter(a => a.lowCount >= 3).length;
  st.attention.sort((a, b) => (a.idx - b.idx) || (b.lowCount - a.lowCount));
  return st;
}

/* Below 7 is low, full stop. 7–8 is holding, 8+ is genuinely good. */
function satColor(v) {
  if (v == null || isNaN(v)) return "var(--bg)";
  if (v < 6)  return "#b8432c";   // low — deep red
  if (v < 7)  return "#d4763a";   // low — orange
  if (v < 8)  return "#c9a227";   // holding — amber
  if (v < 9)  return "#5a8a3e";   // good — green
  return "#2f6350";               // strong — deep green
}
/* Heatmap fills use the same 7.0 break: every cell under 7 lands in the
   red/orange half, so a glance at a table separates low from healthy. */
function heatBg(v) {
  if (v == null || isNaN(v)) return "#f5f1e8";
  const c = Math.max(4, Math.min(9.5, v));
  if (c < 7) return mix("#e8b4a0", "#f7ddc0", (c - 4) / 3);        // 4→7  deep red → light orange
  return mix("#e6edd2", "#8fbf9a", (Math.min(c, 9.5) - 7) / 2.5);  // 7→9.5 pale lime → green
}
function mix(a, b, t) {
  const pa = a.match(/\w\w/g).map(x => parseInt(x, 16));
  const pb = b.match(/\w\w/g).map(x => parseInt(x, 16));
  return "#" + pa.map((x, i) => Math.round(x + (pb[i] - x) * t).toString(16).padStart(2, "0")).join("");
}

/* ---------------- narrative ---------------- */
function buildInsightBoard(st) {
  /* Deliberately pillar-only: this sits under the pillar table and reads it.
     Function, grade and cohort cuts have their own sections below. */
  const good = [], risk = [];
  const pillars = PILLARS.map(p => ({ p, d: st.pillars[p.key] })).filter(x => x.d.sats.length);
  if (!pillars.length) return { good, risk };
  const byScore = pillars.slice().sort((a, b) => b.d.meanSat - a.d.meanSat);
  const byPriority = pillars.slice().sort((a, b) => b.d.top1Pct - a.d.top1Pct);
  const best = byScore[0], worst = byScore[byScore.length - 1];
  const gaps = pillars.filter(x => x.d.importance >= 3.5 && x.d.meanSat < 7)
    .sort((a, b) => (b.d.importance - b.d.meanSat) - (a.d.importance - a.d.meanSat));
  const pc = v => Math.round(v * 100);

  /* ---- what is working ---- */
  good.push(`<b>${best.p.label}</b> scores highest at <b>${fmt(best.d.meanSat)}</b>, with ${pc(best.d.highPct)}% of people giving it 7 or more.`);
  const strong = byScore.filter(x => x.d.meanSat >= 8);
  if (strong.length > 1) good.push(`<b>${strong.length} of the ${pillars.length} pillars</b> sit at 8 or better — ${strong.slice(0, 3).map(x => x.p.label).join(", ")}.`);
  const topPriority = byPriority[0];
  if (topPriority && topPriority.d.meanSat >= 7) good.push(`The thing most people care about — <b>${topPriority.p.label}</b>, picked first by ${pc(topPriority.d.top1Pct)}% — is also holding up at <b>${fmt(topPriority.d.meanSat)}</b>.`);
  const fewUnhappy = byScore.filter(x => x.d.lowPct <= 0.12);
  if (fewUnhappy.length) good.push(`Almost nobody is unhappy with <b>${fewUnhappy.slice(0, 3).map(x => x.p.label).join("</b>, <b>")}</b> — under 12% scoring 6 or less.`);
  const spread = best.d.meanSat - worst.d.meanSat;
  if (spread <= 1.5) good.push(`The six pillars sit within <b>${fmt(spread)}</b> of each other, so no single part of the experience is dragging far behind.`);
  const mostHappy = byScore.slice().sort((a, b) => b.d.highPct - a.d.highPct)[0];
  if (mostHappy && mostHappy !== best) good.push(`<b>${pc(mostHappy.d.highPct)}%</b> gave <b>${mostHappy.p.label}</b> a 7 or better — the widest agreement of the six.`);

  /* ---- what needs improvement ---- */
  if (gaps.length) {
    const g = gaps[0];
    risk.push(`<b>${g.p.label}</b> matters most but scores lowest: picked first by ${pc(g.d.top1Pct)}% and scoring only <b>${fmt(g.d.meanSat)}</b>, with ${pc(g.d.lowPct)}% at 6 or less.`);
  } else {
    risk.push(`<b>${worst.p.label}</b> is the weakest pillar at <b>${fmt(worst.d.meanSat)}</b> — nothing here is in crisis, so this is fine-tuning.`);
  }
  if (gaps[1]) risk.push(`<b>${gaps[1].p.label}</b> is the next one to look at, at <b>${fmt(gaps[1].d.meanSat)}</b>. Take it on after ${gaps[0].p.label} rather than doing both at once.`);
  const mostUnhappy = byScore.slice().sort((a, b) => b.d.lowPct - a.d.lowPct)[0];
  if (mostUnhappy && mostUnhappy.d.lowPct >= 0.2) risk.push(`<b>${pc(mostUnhappy.d.lowPct)}%</b> gave <b>${mostUnhappy.p.label}</b> a 6 or less — the widest pocket of unhappiness across the six.`);
  const ignored = byPriority.filter(x => x.d.top1Pct <= 0.08 && x.d.meanSat < 7);
  if (ignored.length) risk.push(`<b>${ignored[0].p.label}</b> scores <b>${fmt(ignored[0].d.meanSat)}</b> and few people rank it first — low-priority, but still a drag on the overall score.`);
  const avgAll = mean(pillars.map(x => x.d.meanSat));
  const caredButBelow = byPriority.filter(x => x.d.top1Pct >= 0.15 && x.d.meanSat < avgAll && x !== gaps[0] && x !== gaps[1]);
  if (caredButBelow.length) risk.push(`<b>${caredButBelow[0].p.label}</b> is a top priority for ${pc(caredButBelow[0].d.top1Pct)}% yet scores below the six-pillar average of ${fmt(avgAll)}.`);
  if (spread > 2) risk.push(`There is a <b>${fmt(spread)} point</b> gap between the best and worst pillar — the experience is uneven rather than uniformly good or bad.`);
  if (!risk.length) risk.push(`No pillar stands out as a problem — the six sit close together.`);

  return { good: good.slice(0, 4), risk: risk.slice(0, 4) };
}

   Suppressed when ratings are hidden or the HiPo group is too small to be anonymous. */
function hipoKpiHTML(st) {
  if (hideRatings()) return "";
  const pool = respondentPool();
  const hi = pool.filter(s => isHipo(s.email)).map(personIndex).filter(v => v != null);
  const rest = pool.filter(s => !isHipo(s.email)).map(personIndex).filter(v => v != null);
  if (hi.length < Math.max(3, minGroup()) || !rest.length) return "";
  const hiIdx = mean(hi), restIdx = mean(rest), gap = hiIdx - restIdx;
  const tone = hiIdx < 6.3 || gap <= -0.5 ? "flag" : gap < 0.2 ? "warn" : "ok";
  const dir = gap >= 0.05 ? "above" : gap <= -0.05 ? "below" : "the same as";
  return kpiCard({
    tone,
    label: "High-potential sentiment",
    value: `${fmt(hiIdx)}<small>/10</small>`,
    note: `${hi.length} HiPos — ${dir === "the same as" ? "the same as" : fmt(Math.abs(gap)) + " " + dir} everyone else (${fmt(restIdx)})`,
  });
}

/* Read-the-colour key so nobody has to guess what a shade means. */
function heatKeyHTML(extra) {
  const stops = [4.5, 5.5, 6.5, 7.5, 8.5];
  return `<div class="heat-key">
    <span><b>How to read it:</b> the greener, the happier</span>
    <span class="hk-scale">${stops.map(v => `<i style="background:${heatBg(v)}"></i>`).join("")}</span>
    ${extra ? `<span>${extra}</span>` : ""}
  </div>`;
}

/* One table beats six cards here: priority and satisfaction sit side by side,

  const topPriority = rows.slice().sort((a, b) => b.d.top1Pct - a.d.top1Pct)[0];
  const sorted = rows.slice().sort((a, b) => b.d.top1Pct - a.d.top1Pct);   // most-prioritised first
  const bar = (pct, colour) => `<span class="mini"><span style="width:${Math.round(pct * 100)}%;background:${colour}"></span></span>`;
  return `<table class="data pillar-table">
    <thead>
      <tr class="pt-group">

        <th colspan="2" class="grp">How much people care about it</th>

        <th rowspan="2">Comments</th><th rowspan="2"></th>
      </tr>
      <tr>
        <th>Top priority</th><th>In their top 2</th>
        <th class="scores">Average</th><th class="scores">Happy · 7–10</th><th class="scores">Unhappy · 6 or less</th>
      </tr>
    </thead><tbody>
    ${sorted.map(({ p, d }) => `<tr style="cursor:pointer" data-pillar="${p.key}" onclick="openPillarDetail('${p.key}')">
      <td><b>${p.label}</b>${p === topPriority.p ? `<span class="chip ok" style="margin-left:7px">Top priority</span>` : ""}
        <span class="pt-desc">${esc(p.desc)}</span></td>
      <td><b>${Math.round(d.top1Pct * 100)}%</b> ${bar(d.top1Pct, "var(--accent)")}</td>
      <td>${Math.round(d.top2Pct * 100)}% ${bar(d.top2Pct, "var(--accent-line)")}</td>
      <td class="scores"><b style="color:${satColor(d.meanSat)};font-size:15px">${fmt(d.meanSat)}</b><span class="pt-mut">/10</span></td>
      <td class="scores">${Math.round(d.highPct * 100)}% ${bar(d.highPct, "#5a8a3e")}</td>
      <td class="scores">${Math.round(d.lowPct * 100)}% ${bar(d.lowPct, "#b8432c")}</td>

    </tr>`).join("")}

}

function heatmapHTML(st) {
  const allBands = BAND_ORDER.filter(b => st.bands[b] && st.bands[b].n > 0);
  const bands = allBands.filter(b => !suppressed(st.bands[b].n));
  const hiddenBands = allBands.length - bands.length;
  let h = `<table class="heat"><tr><th style="text-align:left">Grade &amp; who it covers</th>${PILLARS.map(p => `<th>${p.label}</th>`).join("")}<th>Overall score</th></tr>`;
  for (const b of bands) {
    const bd = st.bands[b];
    h += `<tr><td class="rowhead">${b}<span class="hm-sub">${esc(GRADE_LABELS[b] || "")}</span><span class="hm-n" style="display:block;font-size:10px;color:var(--ink-faint)">n = ${bd.n}</span></td>`;
    for (const p of PILLARS) {
      const v = bd.pillars[p.key].length ? mean(bd.pillars[p.key]) : null;
      h += `<td style="background:${heatBg(v)};font-weight:700;color:#1e2a3a">${v == null ? "—" : fmt(v)}</td>`;
    }
    const idx = bd.indices.length ? mean(bd.indices) : null;
    h += `<td style="background:${heatBg(idx)};font-weight:800;color:#1e2a3a">${idx == null ? "—" : fmt(idx)}</td></tr>`;
  }
  // company row
  h += `<tr><td class="rowhead">All replies<span class="hm-n">n = ${st.n}</span></td>`;
  for (const p of PILLARS) h += `<td style="background:${heatBg(st.pillars[p.key].meanSat)};font-weight:800;color:#1e2a3a">${fmt(st.pillars[p.key].meanSat)}</td>`;
  h += `<td style="background:${heatBg(st.evpIndex)};font-weight:800;color:#1e2a3a">${fmt(st.evpIndex)}</td></tr></table>`;
  if (hiddenBands) h += `<p style="font-size:11.5px;color:var(--ink-faint);margin:8px 2px 0">🔒 ${hiddenBands} grade${hiddenBands > 1 ? "s" : ""} hidden — fewer than ${minGroup()} responses (anonymity threshold).</p>`;
  return h;
}

function fnHeatSectionHTML(st) {

    <p class="section-sub">Average satisfaction per pillar for each function or practice (Sitecore, Salesforce, and every other practice you assign), lowest overall score first — the fastest way to see whether a practice's pipeline pressure or bench time is showing up in how its people feel.${isAdmin() ? ` ${unassigned ? `<b>${unassigned}</b> people aren't assigned to a practice yet and are grouped by a rough read of their designation — ` : ""}<a href="#" onclick="openManageFunctions();return false" style="color:var(--accent);font-weight:700">Manage functions</a> to assign people to Sitecore, Salesforce and the rest.` : ""}</p>
    <div class="card heat-wrap">${h}${heatKeyHTML()}</div>
  </section>`;
}

function mentorTableHTML(st) {
  const all = Object.entries(st.mentors)
    .filter(([m, v]) => m !== "(no mentor)" && v.n >= Math.max(3, minGroup()))
    .map(([name, v]) => {
      const scored = PILLARS.map(p => ({ p, m: v.pillars[p.key].length ? mean(v.pillars[p.key]) : null }))
        .filter(x => x.m != null).sort((a, b) => a.m - b.m);
      const profile = MENTOR_PROFILES[name.trim().toLowerCase()];
      /* the mentor's own roster row: via a mentee's mentorEmail, then by name */
      const lc = name.trim().toLowerCase();
      const mentee = ROSTER.find(x => (x.mentor || "").trim().toLowerCase() === lc);
      const r = (mentee && ROSTER_BY_EMAIL[(mentee.mentorEmail || "").toLowerCase()]) || mentorRosterRecord(name);
      return {
        name, n: v.n, idx: v.indices.length ? mean(v.indices) : null,
        weakest: scored[0] || null, strongest: scored[scored.length - 1] || null,
        func: (profile && profile.func) || (r && fnOfPerson(r)) || "—",
        role: (profile && profile.role) || (r && r.role) || "—",
      };
    });
  if (!all.length) return `<p style="font-size:13px">No mentor cohort has ${Math.max(3, minGroup())}+ replies yet.</p>`;

  const q = (ui.cohortFind || "").toLowerCase().trim();
  const fnSet = ui.cohortFn || "";
  let rows = all;
  if (q) rows = rows.filter(r => r.name.toLowerCase().includes(q) || r.role.toLowerCase().includes(q) || r.func.toLowerCase().includes(q));
  if (fnSet) rows = rows.filter(r => r.func === fnSet);
  if (ui.cohortLow) rows = rows.filter(r => r.idx != null && +fmt(r.idx) < 7);  // match the number shown, not the raw mean

  const key = ui.cohortSort || "idx", dir = ui.cohortDir === "desc" ? -1 : 1;
  const val = r => key === "name" ? r.name.toLowerCase() : key === "func" ? r.func.toLowerCase()
    : key === "role" ? roleRank(r.role) : key === "n" ? r.n
    : key === "strongest" ? (r.strongest ? r.strongest.m : -1)
    : key === "weakest" ? (r.weakest ? r.weakest.m : -1) : (r.idx ?? 99);
  rows = rows.slice().sort((a, b) => { const x = val(a), y = val(b); return (x < y ? -1 : x > y ? 1 : 0) * dir; });

  const funcs = [...new Set(all.map(r => r.func))].filter(f => f !== "—").sort();
  const controls = `<div class="cohort-tools">
    <input type="search" id="cohortFind" placeholder="Find a mentor, function or designation…" autocomplete="off" value="${esc(ui.cohortFind || "")}">
    <select id="cohortFn"><option value="">All functions</option>${funcs.map(f => `<option ${fnSet === f ? "selected" : ""}>${esc(f)}</option>`).join("")}</select>
    <button type="button" class="chip ${ui.cohortLow ? "active" : ""}" id="cohortLow">Below 7 only</button>
    <span class="cohort-count">${rows.length === all.length ? `${all.length} cohorts` : `${rows.length} of ${all.length}`}</span>
    ${(q || fnSet || ui.cohortLow) ? `<button type="button" class="lnk" id="cohortFindClear">Reset</button>` : ""}
  </div>`;
  if (!rows.length) return controls + `<p style="font-size:13px;color:var(--ink-faint);text-align:center;padding:16px 0">No mentor matches those filters.</p>`;

  const th = (k, label, align) => `<th data-sort="${k}" class="sortable${key === k ? " sorted" : ""}"${align ? ` style="text-align:${align}"` : ""}>${label}${key === k ? `<span class="arw">${dir === 1 ? "▲" : "▼"}</span>` : ""}</th>`;
  const cell = x => x ? `<span class="pill-cell"><b style="color:${satColor(x.m)}">${fmt(x.m)}</b> ${esc(x.p.label)}</span>` : "—";

  return controls + `<div class="cohort-scroll"><table class="data cohort-table">
    <thead><tr>${th("name", "Mentor")}${th("func", "Function")}${th("role", "Designation")}${th("n", "Cohort")}${th("idx", "Index")}${th("strongest", "Strongest pillar")}${th("weakest", "Weakest pillar")}<th></th></tr></thead><tbody>` +
    rows.map(r => `<tr style="cursor:pointer" onclick="openMentorDetail(this.dataset.m)" data-m="${esc(r.name)}">
      <td><b>${esc(r.name)}</b></td>
      <td><span class="chip">${esc(r.func)}</span></td>
      <td style="font-size:12.5px;color:var(--ink-faint)">${esc(r.role)}</td>
      <td>${r.n}</td>
      <td><span class="chip" style="background:${heatBg(r.idx)};border-color:transparent;color:#1e2a3a;font-weight:800">${fmt(r.idx)}</span></td>
      <td>${cell(r.strongest)}</td>
      <td>${cell(r.weakest)}</td>
      <td style="text-align:right"><button class="btn small" onclick="event.stopPropagation();openMentorDetail(this.closest('tr').dataset.m)">Detail</button></td></tr>`).join("") +
    `</tbody></table></div>`;
}

/* A plain-English read of one pillar: what is going well and what is not,
   built from the scores plus the words people used in their comments. */
function pillarReadHTML(key, p, d, subs, cmts) {
  const happy = subs.filter(s => s.sat[key] >= 7), unhappy = subs.filter(s => s.sat[key] <= 6);
  const groupBest = (keyer) => {
    const g = {};
    for (const s of subs) { const k2 = keyer(s); if (!k2) continue; (g[k2] = g[k2] || []).push(s.sat[key]); }
    const rows = Object.entries(g).filter(([, v]) => v.length >= Math.max(3, minGroup()))
      .map(([name, v]) => ({ name, m: mean(v), n: v.length })).sort((a, b) => a.m - b.m);
    return rows.length > 1 ? { worst: rows[0], best: rows[rows.length - 1] } : null;
  };
  const byFn = groupBest(s => fnOfSub(s));
  const byGrade = groupBest(s => bandOfPerson(s.email, s.role));
  /* Use the pillar's own topic list; the generic one only fills in when the
     specific list finds nothing, so near-duplicates never sit side by side. */
  const count = (list, dict) => dict
    .map(([label, rx]) => [label, list.filter(c => rx.test(c.comments[key] || "")).length])
    .filter(x => x[1] >= 2).sort((a, b) => b[1] - a[1]);
  const themesIn = list => {
    const specific = count(list, PILLAR_THEMES[key] || []);
    return (specific.length ? specific : count(list, THEMES)).slice(0, 4);
  };
  const goodThemes = themesIn(happy.filter(s => (s.comments[key] || "").trim()));
  const badThemes = themesIn(unhappy.filter(s => (s.comments[key] || "").trim()));

  /* Topics first — the words people used, not the numbers already shown above. */
  const good = [], bad = [];
  const shownBad = new Set(badThemes.map(t => t[0]));
  const upThemes = goodThemes.filter(t => !shownBad.has(t[0]));

  if (upThemes.length) {
    upThemes.slice(0, 3).forEach(([label, n2], i) => good.push(
      `<b>${esc(label)}</b> — ${n2} of the people who rated this well wrote about it.${i === 0 ? " Whatever you are doing here, it is landing." : ""}`));
  } else if (happy.length) {
    good.push(`People who rated this well didn't write much about why — the score is the signal.`);
  }
  if (byFn && byFn.best.m >= 7) good.push(`<b>${esc(byFn.best.name)}</b> is the happiest team on this (<b>${fmt(byFn.best.m)}</b> out of 10). Worth asking what they do differently.`);
  if (byGrade && byGrade.best.m >= 7) good.push(`It lands best with <b>${esc(byGrade.best.name)}</b>${GRADE_LABELS[byGrade.best.name] ? ` — ${esc(GRADE_LABELS[byGrade.best.name])}` : ""}.`);

  if (badThemes.length) {
    badThemes.slice(0, 3).forEach(([label, n2], i) => bad.push(
      `<b>${esc(label)}</b> — ${n2} of the unhappy comments come back to this.${i === 0 ? " Start here." : ""}`));
  } else if (unhappy.length && cmts.length) {
    bad.push(`No single topic dominates the unhappy comments — read them below, the reasons look individual rather than systemic.`);
  }
  if (!cmts.length) bad.push(`Nobody wrote a comment about this one, so the scores are all you have to go on.`);
  if (byFn && byFn.worst.m < 7) bad.push(`<b>${esc(byFn.worst.name)}</b> is having the hardest time (<b>${fmt(byFn.worst.m)}</b> out of 10).`);
  if (byGrade && byGrade.worst.m < 7) bad.push(`<b>${esc(byGrade.worst.name)}</b>${GRADE_LABELS[byGrade.worst.name] ? ` — ${esc(GRADE_LABELS[byGrade.worst.name])}` : ""} rates it lowest.`);

  return `<div class="step-head"><span>What this says</span></div>
    <div class="insight-row two" style="margin-bottom:4px">
      ${insightBoxHTML("protect", "What's good", "Keep it going", good.slice(0, 5))}
      ${insightBoxHTML("fix", "What needs improvement", "Worth your time", bad.slice(0, 5))}
    </div>`;
}

/* ---- pillar drill-down: distribution, segments, lowest scorers, comments ---- */
function openPillarDetail(key) {
  const p = PILLARS.find(x => x.key === key);
  if (!p) return;
  const st = buildStats(), d = st.pillars[key];
  const root = document.getElementById("modalRoot");
  if (!d || !d.sats.length) {
    root.innerHTML = `<div class="modal-scrim" id="scrim"><div class="modal"><h3>${p.label}</h3>
      <p>No scores for this pillar in the current view.</p>
      <div class="modal-actions"><button class="btn" onclick="closeModal()">Close</button></div></div></div>`;
    document.getElementById("scrim").addEventListener("click", e => { if (e.target.id === "scrim") closeModal(); });
    return;
  }
  const subs = respondentPool().filter(s => s.sat[key] != null);
  const cmts = subs.filter(s => (s.comments[key] || "").trim())
    .sort((a, b) => a.sat[key] - b.sat[key]);
  const shown = cmts.slice(0, 25);
  const cHTML = !cmts.length ? `<p class="pt-mut">No comments written about ${p.label}.</p>`

        <div class="c-top"><b>${dispName(s.name, s.email)}</b>

        <div class="c-body">${esc(s.comments[key])}</div></div>`).join("")
      + (cmts.length > shown.length ? `<p class="pt-mut">+ ${cmts.length - shown.length} more comments in the Voices section.</p>` : "");

  root.innerHTML = `<div class="modal-scrim" id="scrim"><div class="modal" style="max-width:900px">
    <h3>${p.label}</h3>
    <p>${esc(p.desc)} · <b>${subs.length}</b> people scored it${d.ranks.length ? ` · <b>${Math.round(d.top1Pct * 100)}%</b> call it their top priority, <b>${Math.round(d.top2Pct * 100)}%</b> put it in their top 2` : ""}</p>

    <div class="pd-kpis">
      <div><span class="pd-k">Average score</span><b style="color:${satColor(d.meanSat)}">${fmt(d.meanSat)}<small>/10</small></b></div>
      <div class="ok"><span class="pd-k">Happy · 7–10</span><b style="color:#5a8a3e">${Math.round(d.highPct * 100)}%</b><span class="pd-sub">${subs.filter(s => s.sat[key] >= 7).length} people</span></div>
      <div class="bad"><span class="pd-k">Unhappy · 6 or less</span><b style="color:#b8432c">${Math.round(d.lowPct * 100)}%</b><span class="pd-sub">${subs.filter(s => s.sat[key] <= 6).length} people</span></div>
      <div><span class="pd-k">Comments</span><b>${cmts.length}</b><span class="pd-sub">${subs.length ? Math.round((cmts.length / subs.length) * 100) : 0}% wrote something</span></div>
    </div>

    ${pillarReadHTML(key, p, d, subs, cmts)}

    <div class="step-head"><span>What people wrote${cmts.length ? ` · ${cmts.length}` : ""}</span></div>
    <div class="pd-comments">${cHTML}</div>

    <div class="modal-actions"><button class="btn" onclick="closeModal()">Close</button></div>
  </div></div>`;
  document.getElementById("scrim").addEventListener("click", e => { if (e.target.id === "scrim") closeModal(); });
}

  const pendingRows = pending.map(r => `<tr style="opacity:.75"><td><b>${nm(r)}</b><br><span style="font-size:11px;color:var(--ink-faint)">${anon ? esc(bandOfPerson(r.email, r.role)) : esc(r.role)}</span></td>
      <td style="text-align:center"><span class="chip">pending</span></td>

  const root = document.getElementById("modalRoot");
  root.innerHTML = `<div class="modal-scrim" id="scrim"><div class="modal" style="max-width:900px">
    <h3 style="margin-bottom:4px">${anon ? "Mentor cohort" : esc(name)} — every mentee</h3>
    <p style="margin:0 0 12px"><b>${withSub.length}</b> replied${pending.length ? ` · ${pending.length} pending` : ""} · scores are out of 10, lowest overall first</p>
    <div style="max-height:56vh;overflow:auto;border:1px solid var(--line);border-radius:12px">
      <table class="data" style="min-width:720px"><thead><tr><th>Mentee</th><th style="text-align:center">Score</th>${PILLARS.map(p => `<th style="text-align:center;white-space:nowrap">${p.label}</th>`).join("")}<th style="text-align:center;white-space:nowrap">Comments</th><th></th></tr></thead>
      <tbody>${rows}${pendingRows}</tbody></table></div>
    <div class="modal-actions" style="display:flex;gap:8px;justify-content:space-between;margin-top:14px">

      <button class="btn primary" onclick="closeModal()">Close</button></div>
  </div></div>`;

function openMentorDetail(nameRaw, emailRaw) {
  const name = String(nameRaw || "").trim();
  const email = String(emailRaw || "").trim().toLowerCase();
  const me = whoAmI();
  const isSelf = !!me && (me.email === email || (me.name || "").trim().toLowerCase() === name.toLowerCase());
  if (!(isAdmin() || isSelf || (myGrant() && canView("cohorts")))) return;
  const lc = name.toLowerCase();
  let mentees = ROSTER.filter(r => (email && (r.mentorEmail || "").toLowerCase() === email) || sameMentorName(r.mentor, name));
  if (VIEW && VIEW.allow && !isSelf) mentees = mentees.filter(r => VIEW.allow.has(r.email));
  const root = document.getElementById("modalRoot");
  const shell = inner => {
    root.innerHTML = `<div class="modal-scrim" id="scrim"><div class="modal" style="max-width:880px">${inner}
      </div></div>`;
    document.getElementById("scrim").addEventListener("click", e => { if (e.target.id === "scrim") closeModal(); });
  };
  if (!mentees.length) {
    shell(`<h3>${esc(name)} — mentor cohort</h3><p>No mentees ${VIEW && VIEW.allow ? "within your access scope " : ""}are mapped to ${esc(name)} in the roster.</p>
      <div class="modal-actions"><button class="btn" onclick="closeModal()">Close</button></div>`);
    return;
  }
  const withSub = mentees.filter(r => state.responses[r.email]);
  const pending = mentees.filter(r => !state.responses[r.email]);
  if (VIEW && !isSelf && withSub.length && withSub.length < minGroup()) {
    shell(`<h3>Mentor cohort</h3><p>🔒 This cohort has only ${withSub.length} response${withSub.length === 1 ? "" : "s"} — below the anonymity threshold of ${minGroup()} set by HR, so its detail can't be shown.</p>
      <div class="modal-actions"><button class="btn" onclick="closeModal()">Close</button></div>`);
    return;
  }
  const anon = hideNames() && !isSelf;
  const nm = (person) => anon ? dispName(person.name, person.email) : esc(person.name);

  // company baseline: everything in the viewer's scope, ignoring page filters
  const base = (VIEW && VIEW.allow)
    ? Object.values(state.responses).filter(s => VIEW.allow.has(String(s.email || "").toLowerCase()))
    : Object.values(state.responses);
  const compIdx = mean(base.map(personIndex).filter(v => v != null));
  const comp = {}; for (const k of PKEYS) comp[k] = mean(base.map(s => s.sat[k]).filter(v => v != null));

  // cohort per-pillar stats
  const subs = withSub.map(r => state.responses[r.email]);
  const pil = PILLARS.map(p => {
    const sats = subs.map(s => s.sat[p.key]).filter(v => v != null);
    const ranks = subs.map(s => s.ranks[p.key]).filter(v => v != null);
    return { p, n: sats.length, avg: sats.length ? mean(sats) : null,
      hi: sats.filter(v => v >= 9).length, lo: sats.filter(v => v <= 6).length,
      rank: ranks.length ? mean(ranks) : null, comp: comp[p.key],
      delta: sats.length && comp[p.key] != null ? mean(sats) - comp[p.key] : null };
  }).sort((a, b) => (a.avg ?? 99) - (b.avg ?? 99));
  const worst = pil.find(x => x.avg != null), best = [...pil].reverse().find(x => x.avg != null);
  const idxs = subs.map(personIndex).filter(v => v != null);
  const cIdx = idxs.length ? mean(idxs) : null;
  const totalLow = pil.reduce((a, x) => a + x.lo, 0), totalHi = pil.reduce((a, x) => a + x.hi, 0);
  const dTxt = v => v == null ? "—" : (v >= 0 ? "+" : "−") + fmt(Math.abs(v));
  const dChip = v => v == null ? "" : `<span class="chip ${v <= -0.7 ? "flag" : v < -0.2 ? "warn" : v >= 0.3 ? "ok" : ""}">${dTxt(v)} vs company</span>`;

  /* pillar-by-pillar rows: score, how it compares, and what the cohort wrote */
  const cohortThemes = (pillarKey, low) => {
    const list = withSub.map(r => state.responses[r.email])
      .filter(s => (s.comments[pillarKey] || "").trim() && (low ? s.sat[pillarKey] <= 6 : s.sat[pillarKey] >= 7));
    return THEMES.map(([label, rx]) => [label, list.filter(s => rx.test(s.comments[pillarKey])).length])
      .filter(x => x[1] >= 1).sort((a, b) => b[1] - a[1]).slice(0, 2);
  };
  const pillarCards = pil.map(x => {
    const down = cohortThemes(x.p.key, true);
    const seen = new Set(down.map(t => t[0]));
    const up = cohortThemes(x.p.key, false).filter(t => !seen.has(t[0]));
    const topics = [
      ...down.slice(0, 2).map(t => `<span class="chip flag">▼ ${esc(t[0])}</span>`),
      ...up.slice(0, 1).map(t => `<span class="chip ok">▲ ${esc(t[0])}</span>`),
    ].join(" ");
    const pos = x.avg == null ? 0 : Math.max(2, Math.min(100, x.avg * 10));
    const cpos = x.comp == null ? null : Math.max(2, Math.min(100, x.comp * 10));
    return `<div class="cx-row">
      <div class="cx-name"><b>${x.p.label}</b>
        ${x === worst ? '<span class="chip flag">lowest</span>' : x === best && best !== worst ? '<span class="chip ok">highest</span>' : ""}
        <span class="cx-meta">${x.lo} unhappy · ${x.hi} very happy${x.rank != null ? ` · importance ${fmt(x.rank)} of 6` : ""}</span></div>
      <div class="cx-bar">
        <span class="cx-fill" style="width:${pos}%;background:${satColor(x.avg)}"></span>
        ${cpos != null ? `<i class="cx-comp" style="left:${cpos}%" title="Company average ${fmt(x.comp)}"></i>` : ""}
      </div>
      <div class="cx-score"><b style="color:${satColor(x.avg)}">${x.avg == null ? "—" : fmt(x.avg)}</b>
        <span class="cx-delta ${x.delta == null ? "" : x.delta < -0.2 ? "down" : x.delta >= 0.3 ? "up" : ""}">${x.delta == null ? "" : dTxt(x.delta) + " vs company"}</span></div>
      <div class="cx-topics">${topics || `<span class="pt-mut">no comments</span>`}</div>
    </div>`;
  }).join("");

  const comm = [];
  for (const r of withSub) { const sub = state.responses[r.email];
    for (const k of PKEYS) { const c = (sub.comments[k] || "").trim();
      if (c) comm.push({ r, sat: sub.sat[k], pillar: k, text: c }); } }
  comm.sort((a, b) => (a.sat ?? 99) - (b.sat ?? 99));
  const commHtml = comm.slice(0, 10).map(c => `<div class="comment" style="margin-bottom:8px">
      <div class="c-top"><b>${nm(c.r)}</b> <span class="chip">${PLABEL[c.pillar]}</span>
        ${c.sat != null ? `<span class="chip ${c.sat <= 4 ? "flag" : c.sat <= 6 ? "warn" : "ok"}">${c.sat}/10</span>` : ""}</div>
      <div class="c-body">${esc(c.text)}</div></div>`).join("");

  const canFilter = !hideNames() && (isAdmin() || myGrant());
  const mentorKeys = [...new Set(mentees.map(r => r.mentor).filter(Boolean))];

  const rec = ROSTER_BY_EMAIL[(mentees[0] || {}).mentorEmail || ""] || mentorRosterRecord(name);
  const prof = MENTOR_PROFILES[lc];
  const who = [(prof && prof.func) || (rec && fnOfPerson(rec)), (prof && prof.role) || (rec && rec.role)].filter(Boolean);
  const rate = mentees.length ? Math.round((withSub.length / mentees.length) * 100) : 0;
  const totalComments = comm.length;

  shell(`<h3 style="margin-bottom:4px">${anon ? "Mentor cohort" : esc(name)}</h3>
    <p style="margin:0 0 4px">${who.length ? who.map(x => `<span class="chip">${esc(x)}</span>`).join(" ") + " · " : ""}<b>${withSub.length}</b> of ${mentees.length} mentee${mentees.length === 1 ? "" : "s"} replied (${rate}%)${pending.length ? ` · ${pending.length} still pending` : ""}</p>

    <div class="pd-kpis" style="grid-template-columns:repeat(4,1fr)">
      <div><span class="pd-k">Cohort score</span><b style="color:${satColor(cIdx)}">${cIdx == null ? "—" : fmt(cIdx)}<small>/10</small></b><span class="pd-sub">${compIdx != null && cIdx != null ? `company ${fmt(compIdx)} · ${dTxt(cIdx - compIdx)}` : ""}</span></div>
      <div class="ok"><span class="pd-k">Happy · 7–10</span><b style="color:#5a8a3e">${(() => { let hi = 0, tot = 0; for (const r of withSub) { const s = state.responses[r.email]; for (const k of PKEYS) if (s.sat[k] != null) { tot++; if (s.sat[k] >= 7) hi++; } } return tot ? Math.round(hi / tot * 100) + "%" : "—"; })()}</b><span class="pd-sub">of all answers given</span></div>
      <div class="bad"><span class="pd-k">Unhappy · 6 or less</span><b style="color:#b8432c">${(() => { let lo = 0, tot = 0; for (const r of withSub) { const s = state.responses[r.email]; for (const k of PKEYS) if (s.sat[k] != null) { tot++; if (s.sat[k] <= 6) lo++; } } return tot ? Math.round(lo / tot * 100) + "%" : "—"; })()}</b><span class="pd-sub">${totalLow} answer${totalLow === 1 ? "" : "s"}</span></div>
      <div><span class="pd-k">Comments</span><b>${totalComments}</b><span class="pd-sub">${withSub.length ? Math.round(withSub.filter(r => PKEYS.some(k => (state.responses[r.email].comments[k] || "").trim())).length / withSub.length * 100) : 0}% wrote something</span></div>
    </div>

    <div class="step-head"><span>Pillar by pillar</span></div>
    <div class="cx-list">${pillarCards}</div>
    <p class="pt-mut" style="margin:8px 2px 0">The bar is this group's average; the small line on it is the company average. ▼ shows what their unhappy comments mention, ▲ what the happy ones do.</p>

    <button type="button" class="fold-open" onclick="openMenteeList(${esc(JSON.stringify(name))}, ${esc(JSON.stringify(email))})">
      <span>Every mentee${withSub.length ? ` · ${withSub.length}` : ""}${pending.length ? ` (+${pending.length} pending)` : ""}</span>
      <em>Open list ›</em>
    </button>

    ${comm.length ? `<div class="step-head"><span>What they wrote · lowest scores first${comm.length > 10 ? ` (10 of ${comm.length})` : ""}</span></div>${commHtml}` : ""}

    <div class="modal-actions" style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
      ${canFilter ? `<button class="btn" onclick='ui.mentorSel = ${esc(JSON.stringify(mentorKeys))}; closeModal(); render(); window.scrollTo(0, 0);'>See the whole dashboard for this cohort</button>` : ""}
      <button class="btn primary" onclick="closeModal()">Close</button></div>`);
}

  return `
    <div class="filters">
      <select id="fPillar"><option value="all">All pillars</option>${PILLARS.map(p => `<option value="${p.key}" ${ui.pillar === p.key ? "selected" : ""}>${p.label}</option>`).join("")}</select>

      <input type="search" id="fSearch" placeholder="Search comments…" value="${esc(ui.search)}">
    </div>
    <div class="theme-chips">${themeCounts.map(([t, n]) => `<span class="chip ${ui.theme === t ? "active" : ""}" data-theme="${esc(t)}">${t} · ${n}</span>`).join("")}</div>
    <div id="commentList">${renderCommentList(comments)}</div>`;
}

function filteredComments(comments) {
  return comments.filter(c => {
    if (ui.pillar !== "all" && c.pillar !== ui.pillar) return false;
    if (ui.band !== "all" && c.band !== ui.band) return false;
    if (ui.onlyLow && !(c.sat != null && c.sat <= 6)) return false;
    if (ui.theme) { const th = THEMES.find(t => t[0] === ui.theme); if (th && !th[1].test(c.text)) return false; }
    if (ui.search && !c.text.toLowerCase().includes(ui.search.toLowerCase())) return false;
    return true;
  });
}
function renderCommentList(comments) {
  const list = filteredComments(comments);
  if (VIEW && list.length) {
    const authors = new Set(list.map(c => c.sub.email));
    if (authors.size < minGroup()) return `<p style="font-size:13px;color:var(--ink-faint)">🔒 Comments hidden to protect anonymity — fewer than ${minGroup()} people match these filters. Broaden the filters to read verbatims.</p>`;
  }
  const shown = list.slice(0, ui.commentLimit);
  let h = shown.map(c => `<div class="comment">
    <div class="c-top"><b>${dispName(c.sub.name, c.sub.email)}</b> · ${hideNames() ? esc(bandOf(c.sub.role)) : esc(c.sub.role || "")}
      <span class="chip">${PLABEL[c.pillar]}</span>
      ${c.sat != null ? `<span class="chip ${c.sat <= 4 ? "flag" : c.sat <= 6 ? "warn" : "ok"}">${c.sat}/10</span>` : ""}</div>
    <div class="c-body">${esc(c.text)}</div></div>`).join("");
  if (!list.length) h = `<p style="font-size:13px;color:var(--ink-faint)">No comments match these filters.</p>`;
  if (list.length > shown.length) h += `<div class="load-more"><button class="btn small" id="btnMore">Show ${Math.min(20, list.length - shown.length)} more (${list.length - shown.length} left)</button></div>`;
  return h;
}
function wireFilters() {
  const rerenderComments = () => { document.getElementById("commentList").innerHTML = renderCommentList(allComments()); wireMore(); };
  const wireMore = () => { const b = document.getElementById("btnMore"); if (b) b.onclick = () => { ui.commentLimit += 20; rerenderComments(); }; };
  const on = (id, ev, fn) => { const el = document.getElementById(id); if (el) el.addEventListener(ev, fn); };
  on("fPillar", "change", e => { ui.pillar = e.target.value; ui.commentLimit = 12; rerenderComments(); });
  on("fBand", "change", e => { ui.band = e.target.value; ui.commentLimit = 12; rerenderComments(); });
  on("fLow", "change", e => { ui.onlyLow = e.target.checked; ui.commentLimit = 12; rerenderComments(); });
  on("fSearch", "input", e => { ui.search = e.target.value; ui.commentLimit = 12; rerenderComments(); });
  document.querySelectorAll(".theme-chips .chip").forEach(ch => ch.addEventListener("click", () => {
    ui.theme = ui.theme === ch.dataset.theme ? "" : ch.dataset.theme; ui.commentLimit = 12;
    document.querySelectorAll(".theme-chips .chip").forEach(c => c.classList.toggle("active", c.dataset.theme === ui.theme));
    rerenderComments();
  }));
  wireMore();
}


/* Accepts whatever the Power Automate "return responses" flow sends back:
   a raw array, or { value:[...] } / { rows:[...] } / { body:[...] } wrappers.
   Flat rows (Excel columns, any naming) go through the same header-guessing
   as file imports; nested { career:{rank,sat,comment} } payloads are handled
   directly. */
function autoImportJSON(data) {
  let arr = Array.isArray(data) ? data : (data && (data.value || data.rows || data.responses || data.body));
  if (arr && !Array.isArray(arr) && Array.isArray(arr.value)) arr = arr.value; // { body: { value: [...] } }
  if (!Array.isArray(arr) || !arr.length) throw new Error("The link returned no response rows.");
  const nested = arr.some(o => o && PKEYS.some(k => o[k] && typeof o[k] === "object"));
  if (nested) return jsonToResponses(arr);
  // flat objects -> table -> header guessing
  const headers = Object.keys(Object.assign({}, ...arr.map(o => o || {})));
  const rows = arr.map(o => headers.map(h => (o && o[h] != null) ? o[h] : ""));
  return rowsToResponses(headers, rows);
}

async function syncFromExcel(opts) {
  opts = opts || {};
  const url = (state.readUrl || "").trim();
  if (!url) { if (!opts.silent) openConnect(); return; }
  const btn = document.getElementById("btnSync");
  if (btn) { btn.disabled = true; btn.textContent = "Syncing…"; }
  try {
    const res = await fetch(url, { method: "GET" });
    const bodyText = await res.text();
    if (!res.ok) {
      let detail = "";
      try { const j = JSON.parse(bodyText); detail = j.error?.message || j.message || bodyText; } catch { detail = bodyText; }
      throw new Error("the flow returned status " + res.status + (detail ? " — " + String(detail).slice(0, 220) : ""));
    }
    if (!bodyText.trim()) {
      throw new Error("the flow replied with an EMPTY body (status " + res.status + "). This means the flow has no Response action, or its Body field is blank. Fix: add a Response action as the last step, Status 200, and set Body = the 'value' output from List rows present in a table.");
    }
    let payload;
    try { payload = JSON.parse(bodyText); }
    catch { throw new Error("the flow's reply isn't valid JSON. It starts with: \"" + bodyText.slice(0, 120) + "…\". Set the Response Body to the 'value' output of List rows (and header Content-Type: application/json)."); }
    // The Excel is the single source of truth: rebuild from scratch on every
    // sync so stale/demo/deleted rows can never linger and skew the numbers.
    const previous = state.responses;
    state.responses = {};
    let added;
    try { added = autoImportJSON(payload); }
    catch (err) { state.responses = previous; throw err; }   // keep old data if the payload was unusable
    if (state.rosterUrl) await syncRoster({ silent: true });   // refresh employee master data too
    applyRosterEdits();          // HR corrections survive every re-import
    state.isDemo = false;
    state.audit = LAST_AUDIT;
    state.source = "Power Automate Excel (synced " + new Date().toLocaleTimeString() + ")";
    state.lastSync = Date.now();
    save();
    if (state.taskReadUrl) await syncTasks({ silent: true, noRender: true });
    render();
    if (!opts.silent) flashNote("Synced — " + added + " responses updated from Excel.");
  } catch (err) {
    if (!opts.silent) alert("Sync failed: " + err.message + "\n\nMost common fixes:\n1) In the flow's trigger, set Method = GET (Advanced parameters). A blank method expects POST and returns 400.\n2) Leave the trigger's Request Body JSON Schema empty.\n3) Make sure the full URL was copied, including everything after ? (the sig= part).\n4) Response action needs headers Content-Type: application/json and Access-Control-Allow-Origin: *\n\nQuick test: paste the URL in a new browser tab — you should see your rows as JSON.");
  } finally {
    const b = document.getElementById("btnSync");
    if (b) { b.disabled = false; b.textContent = "Sync from Excel"; }
  }
}

let flashTimer = null;
function flashNote(msg) {
  let el = document.getElementById("flashNote");
  if (!el) {
    el = document.createElement("div"); el.id = "flashNote";
    el.style.cssText = "position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:700;z-index:80;box-shadow:0 8px 24px rgba(30,42,58,.25)";
    document.body.appendChild(el);
  }
  el.textContent = msg; el.style.display = "block";
  clearTimeout(flashTimer); flashTimer = setTimeout(() => { el.style.display = "none"; }, 3500);
}
