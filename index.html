/* ============================================================
   Shared tasks: write/read via Power Automate + "My tasks"
   ------------------------------------------------------------
   Event model (append-only, Excel-friendly):
     Task rows:    id,email,name,pillar,assignee,assigneeEmail,note,due,status,createdAt,score,comment
     Update rows:  taskId,by,text,status,at
   Write flow (POST): body is one of
     { type:"task", ...taskRow }  |  { type:"update", ...updateRow }
   Read flow (GET) returns { tasks:[rows], updates:[rows] } (or just an array of task rows).
   ============================================================ */
async function postTaskEvent(evt) {
  const url = (state.taskWriteUrl || "").trim();
  if (!url) return false;
  try {
    // No Content-Type header on purpose: a JSON header triggers a CORS preflight
    // that Power Automate's HTTP trigger won't answer. Sent as text/plain,
    // the flow still parses it with a Parse JSON action on triggerBody().
    const res = await fetch(url, { method: "POST", body: JSON.stringify(evt) });
    if (!res.ok) throw new Error("status " + res.status);
    return true;
  } catch (err) {
    flashNote("Saved on this device — couldn't reach the task flow (" + err.message + "). It will show for others after the flow is fixed and the task is re-sent.");
    return false;
  }
}

function applyUpdate(t, u) {
  if (!t.updates) t.updates = [];
  const at = +u.at || Date.parse(u.at) || Date.now();
  if (u.status && ["open", "progress", "done"].includes(String(u.status))) {
    t.status = u.status; if (u.status === "done") t.doneAt = at;
  }
  const text = String(u.text || "").trim();
  if (text) {
    const dup = t.updates.some(x => x.text === text && Math.abs(x.at - at) < 2000);
    if (!dup) t.updates.push({ by: u.by || "", text, at });
  }
  t.updates.sort((a, b) => a.at - b.at);
}

/* Excel column headers arrive however they were typed — "Id", "id", "AccessJson",
   "accessjson". Power Automate passes them through verbatim, so match on a
   lowercased copy of every key rather than assuming one spelling. */
const ROW_KEYS = ["id", "type", "accessjson", "fnmapjson", "rosterjson", "at", "email", "name", "pillar",
  "assignee", "assigneeemail", "note", "due", "status", "createdat", "score", "comment", "taskid", "by", "text"];
const ROW_CANON = { accessjson: "accessJson", fnmapjson: "fnMapJson", rosterjson: "rosterJson",
  assigneeemail: "assigneeEmail", createdat: "createdAt", taskid: "taskId" };
function normaliseRow(row) {
  if (!row || typeof row !== "object") return row;
  const out = Object.assign({}, row);
  for (const [k, v] of Object.entries(row)) {
    const lc = String(k).toLowerCase().replace(/[\s_]+/g, "");
    if (!ROW_KEYS.includes(lc)) continue;
    const canon = ROW_CANON[lc] || lc;
    if (out[canon] === undefined || out[canon] === "") out[canon] = v;
  }
  return out;
}

function mergeRemoteTasks(payload) {
  let tasks = payload, updates = [];
  if (payload && !Array.isArray(payload)) {
    tasks = payload.tasks || payload.value || payload.rows || payload.body || [];
    updates = payload.updates || [];
    if (tasks && !Array.isArray(tasks) && Array.isArray(tasks.value)) tasks = tasks.value;
    if (updates && !Array.isArray(updates) && Array.isArray(updates.value)) updates = updates.value;
  }
  if (!Array.isArray(tasks)) tasks = [];
  tasks = tasks.map(normaliseRow);
  updates = Array.isArray(updates) ? updates.map(normaliseRow) : [];
  state.accessRowsRead = tasks.length;
  const byId = Object.fromEntries(state.tasks.map(t => [t.id, t]));
  for (const row of tasks) {
    if (!row || !row.id) continue;
    if (row.accessJson || String(row.id).startsWith("access:") || row.type === "access") { applyAccessRow(row); continue; }
    if (row.fnMapJson || String(row.id).startsWith("functions:") || row.type === "functions") { applyFnRow(row); continue; }
    if (row.rosterJson || String(row.id).startsWith("roster:") || row.type === "roster") { applyRosterRow(row); continue; }
    let t = byId[row.id];
    if (!t) {
      t = { updates: [] , status: "open" };
      state.tasks.push(t); byId[row.id] = t;
    }
    for (const k of ["id","email","name","pillar","assignee","assigneeEmail","note","due","comment"]) if (row[k] != null && row[k] !== "") t[k] = String(row[k]);
    if (row.score != null && row.score !== "") t.score = +row.score;
    t.createdAt = +row.createdAt || Date.parse(row.createdAt) || t.createdAt || Date.now();
    if (row.status && ["open","progress","done"].includes(String(row.status))) t.status = t.status === "done" ? t.status : String(row.status);
  }
  for (const u of (Array.isArray(updates) ? updates : [])) {
    const t = byId[u.taskId]; if (t) applyUpdate(t, u);
  }
  const acc = payload && !Array.isArray(payload) && payload.access;
  if (Array.isArray(acc)) for (const row of acc) applyAccessRow(row.accessJson || row.type === "access" ? row : { accessJson: row });
  save();
}

async function syncTasks(opts) {
  opts = opts || {};
  const url = (state.taskReadUrl || "").trim();
  if (!url) return;
  try {
    const res = await fetch(url, { method: "GET" });
    const bodyText = await res.text();
    if (!res.ok) {
      let detail = ""; try { const j = JSON.parse(bodyText); detail = j.error?.message || j.message || bodyText; } catch { detail = bodyText; }
      throw new Error("status " + res.status + (detail ? " — " + String(detail).slice(0, 160) : ""));
    }
    if (!bodyText.trim()) throw new Error("empty reply — the task read flow is missing its Response action or the Body is blank.");
    let payload; try { payload = JSON.parse(bodyText); } catch { throw new Error("task flow reply isn't valid JSON: \"" + bodyText.slice(0, 100) + "…\""); }
    mergeRemoteTasks(payload);
    state.accessSyncError = "";
    state.accessSyncTried = Date.now();
    save();
    if (!opts.noRender) render();
  } catch (err) {
    /* Never swallow this: a person waiting on a grant sees nothing at all
       otherwise, and the admin has no way to tell why. */
    state.accessSyncError = err.message || String(err);
    state.accessSyncTried = Date.now();
    save();
    if (!opts.silent) flashNote("Access sync failed: " + err.message);
    if (!opts.noRender) render();
  }
}

/* ============================================================
   One-time code sign-in
   The dashboard has no server, so the code is generated here and emailed
   through a Power Automate flow. That proves the person can read the mailbox,
   which is the point — but it is a doorstep, not a lock: anyone who can open
   dev tools can bypass it, exactly like the email-only sign-in it replaces.
   Real protection needs SSO in front of the file.
   ============================================================ */
let otpState = null;   // { email, name, code, sentAt, tries }
const OTP_TTL_MS = 10 * 60 * 1000;
const OTP_TRUST_MS = 30 * 24 * 60 * 60 * 1000;

function otpEnabled() { return !!(state.otpUrl || "").trim(); }
function otpTrusted(email) {
  const t = (state.otpTrust || {})[String(email || "").toLowerCase()];
  return !!t && (Date.now() - t) < OTP_TRUST_MS;
}
function otpNewCode() { return String(Math.floor(1000 + Math.random() * 9000)); }

async function otpSend(email, name) {
  const code = otpNewCode();
  otpState = { email, name, code, sentAt: Date.now(), tries: 0 };
  render();
  try {
    const res = await fetch(state.otpUrl.trim(), {
      method: "POST", headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({ email, name, code, at: Date.now() }),
    });
    if (!res.ok) throw new Error("the flow returned status " + res.status);
    otpState.sent = true;
  } catch (err) {
    otpState.error = err.message || String(err);
  }
  render();
}

function otpVerify(entered) {
  if (!otpState) return;
  const code = String(entered || "").replace(/\D/g, "");
  if (Date.now() - otpState.sentAt > OTP_TTL_MS) { otpState.error = "That code has expired — send a new one."; render(); return; }
  if (code !== otpState.code) {
    otpState.tries++;
    otpState.error = otpState.tries >= 5 ? "Too many attempts. Start again." : "That code doesn't match. " + (5 - otpState.tries) + " attempts left.";
    if (otpState.tries >= 5) otpState = null;
    render(); return;
  }
  const { email, name } = otpState;
  otpState = null;
  state.otpTrust = Object.assign({}, state.otpTrust, { [email]: Date.now() });
  signInAs(email, name);
}

function wireOtp() {
  const el = id => document.getElementById(id);
  const inp = el("otpCode");
  if (!inp) return;
  inp.focus();
  inp.addEventListener("input", () => { if (inp.value.replace(/\D/g, "").length === 4) otpVerify(inp.value); });
  inp.addEventListener("keydown", e => { if (e.key === "Enter") otpVerify(inp.value); });
  if (el("otpGo")) el("otpGo").onclick = () => otpVerify(inp.value);
  if (el("otpResend")) el("otpResend").onclick = () => otpSend(otpState.email, otpState.name);

function myGrant() { const me = whoAmI(); return (me && !isAdmin()) ? accessOf(me.email) : null; }

function grantAllowSet(g) {
  const s = (g && g.scope) || {};
  if (!s.type || s.type === "all") return null;                       // null = whole roster
  if (s.type === "team") {
    const set = new Set();
    const direct = ROSTER.filter(r => (r.mentorEmail || "").toLowerCase() === g.email);
    direct.forEach(r => set.add(r.email));
    if (s.skip) for (const d of direct)
      ROSTER.filter(r => (r.mentorEmail || "").toLowerCase() === d.email).forEach(r => set.add(r.email));
    return set;
  }
  return new Set(ROSTER.filter(r => {
    if (s.functions && s.functions.length && !s.functions.includes(fnOfPerson(r))) return false;
    if (s.grades && s.grades.length && !s.grades.includes(r.grade)) return false;
    if (s.countries && s.countries.length && !s.countries.includes(r.country)) return false;
    if (s.bands && s.bands.length && !s.bands.includes(bandOfPerson(r.email, r.role))) return false;   // legacy grants
    if (s.roles && s.roles.length && !s.roles.includes(r.role)) return false;
    if (s.mentors && s.mentors.length && !s.mentors.includes(r.mentor)) return false;

}

            : `<span style="font-size:12.5px;color:var(--ink-faint)">No one assigned yet${derived.length ? ` — ${derived.length} people land here from their designation` : ""}. Use search or bulk above.</span>`}

  document.getElementById("scrim").addEventListener("click", e => { if (e.target.id === "scrim") { closeModal(); render(); } });
  wireFnModal();
}
function wireFnModal() {
  const el = id => document.getElementById(id);
  document.querySelectorAll("[data-fnsel]").forEach(x => x.addEventListener("click", e => {
    if (e.target.dataset && e.target.dataset.fndel) return;
    fnUi.sel = x.dataset.fnsel; fnUi.find = ""; renderFnModal();
  }));
  document.querySelectorAll("[data-fndel]").forEach(x => x.addEventListener("click", e => {
    e.stopPropagation();
    const f = x.dataset.fndel;
    const n = Object.values(state.fnMap).filter(v => v === f).length;
    if (!confirm(`Remove the function "${f}"${n ? ` and unassign its ${n} member${n > 1 ? "s" : ""}` : ""}?`)) return;
    state.fnList = state.fnList.filter(v => v !== f);
    for (const em of Object.keys(state.fnMap)) if (state.fnMap[em] === f) delete state.fnMap[em];
    if (fnUi.sel === f) fnUi.sel = state.fnList[0] || functionList()[0] || "";
    save(); pushFnMap(); renderFnModal();
  }));
  if (el("fnAdd")) el("fnAdd").onclick = () => {
    const v = (el("fnNew").value || "").trim();
    if (!v) return;
    if (!functionList().includes(v)) state.fnList.push(v);
    fnUi.sel = v; save(); pushFnMap(); renderFnModal();
  };
  if (el("fnNew")) el("fnNew").addEventListener("keydown", e => { if (e.key === "Enter") el("fnAdd").onclick(); });
  if (el("fnFind")) {
    el("fnFind").addEventListener("input", e => { fnUi.find = e.target.value; renderFnModal();
      const f2 = el("fnFind"); if (f2) { f2.focus(); const v = f2.value; f2.value = ""; f2.value = v; } });
  }
  document.querySelectorAll("[data-fnperson]").forEach(x => x.addEventListener("click", () => {
    const em = x.dataset.fnperson;
    if (state.fnMap[em] === fnUi.sel) delete state.fnMap[em]; else state.fnMap[em] = fnUi.sel;
    save(); pushFnMap(); renderFnModal();
    const f2 = el("fnFind"); if (f2) { f2.focus(); }
  }));
  document.querySelectorAll("[data-fnrm]").forEach(x => x.addEventListener("click", () => {
    delete state.fnMap[x.dataset.fnrm]; save(); pushFnMap(); renderFnModal();
  }));
  if (el("fnByMentor")) el("fnByMentor").addEventListener("change", e => {
    const m = e.target.value; if (!m) return;
    const group = ROSTER.filter(r => r.mentor === m);
    if (confirm(`Assign all ${group.length} people mentored by ${m} to ${fnUi.sel}?`)) setFunctions(group.map(r => r.email), fnUi.sel);
    renderFnModal();
  });
  if (el("fnByRole")) el("fnByRole").addEventListener("change", e => {
    const ro = e.target.value; if (!ro) return;
    const group = ROSTER.filter(r => r.role === ro);
    if (confirm(`Assign all ${group.length} ${ro}s to ${fnUi.sel}?`)) setFunctions(group.map(r => r.email), fnUi.sel);
    renderFnModal();
  });
}

function newDraft(existing) {
  if (existing) return JSON.parse(JSON.stringify(existing));
  return { email: "", name: "", scope: { type: "filters", functions: [], grades: [], countries: [], bands: [], roles: [], mentors: [], skip: true },
           features: {}, anonymity: Object.assign({}, ACCESS_DEFAULT_ANON),
           grantedBy: (whoAmI() || {}).name || "HR", grantedAt: Date.now() };
}

function accessSyncLine() {
  const w = (state.taskWriteUrl || "").trim(), r = (state.taskReadUrl || "").trim();
  if (!w || !r) return `<div class="md-sync"><span>⚠ Grants are saved on this device only — no sharing flow is connected, so nobody else will see them. Add both URLs under <a href="#" onclick="closeModal();openConnect();return false">Data settings</a>.</span></div>`;
  const read = state.accessRowsRead;
  const mismatch = read > 0 && !state.accessSyncAt;
  if (state.accessSyncError) {
    return `<div class="md-sync" style="background:var(--flag-tint);border-color:var(--flag-line);color:var(--flag-ink)">
      <span>⚠ The read flow could not be reached from this browser — ${esc(String(state.accessSyncError).slice(0, 200))}.
      Until it responds, nobody else will see their access. Check the read flow's Response has
      <code>Access-Control-Allow-Origin: *</code>.</span>
      <button type="button" class="btn small" id="agSyncNow">Try again</button></div>`;
  }
  return `<div class="md-sync"><span>Sharing is connected.${state.accessSyncAt
      ? ` Last read from the flow ${new Date(state.accessSyncAt).toLocaleString()} · ${state.accessSyncCount || 0} grant${state.accessSyncCount === 1 ? "" : "s"} came back${read ? ` from ${read} row${read === 1 ? "" : "s"}` : ""}.`
      : mismatch
        ? ` ⚠ The flow returned ${read} row${read === 1 ? "" : "s"} but none were readable as grants — check the Excel column names are id, type, accessJson, fnMapJson, rosterJson, at.`
        : " Nothing has been read back from the flow yet — if a colleague can't see their access, check the read flow returns rows."}</span>
    <button type="button" class="btn small" id="agSyncNow">Check now</button></div>`;
}

function renderAccessModal() {

    ${accessSyncLine()}

function wireAccessList() {
  const el = id => document.getElementById(id);
  if (el("agNew")) el("agNew").onclick = () => { accessDraft = newDraft(); renderAccessModal(); };
  document.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => {

  });
  document.querySelectorAll("[data-revoke]").forEach(b => b.onclick = () => {
    const g = state.accessGrants[b.dataset.revoke];
    if (g && confirm(`Revoke ${g.name || g.email}'s dashboard access?`)) { revokeGrant(b.dataset.revoke); renderAccessModal(); render(); }

let ckUi = { find: {}, scroll: {} };
function accessChecks(title, items, key, selected, counts, narrowed) {
  const q = (ckUi.find[key] || "").toLowerCase().trim();
  const shown = q ? items.filter(v => v.toLowerCase().includes(q)) : items;
  const boxes = shown.map(v => {
    const n = counts ? (counts[v] || 0) : null;
    const gone = counts && n === 0;
    return `
    <label class="ck-row${gone ? " ck-out" : ""}"${gone ? ' title="Not in your other selections — untick to tidy up"' : ""}>
      <input type="checkbox" data-scope="${key}" value="${esc(v)}" ${selected.includes(v) ? "checked" : ""}>
      <span class="ck-lab">${esc(v)}</span>${counts ? `<span class="ck-n">${n}</span>` : ""}</label>`;
  }).join("");
  const n = selected.length, all = items.length;
  return `<div class="ck-box" data-ckbox="${key}">
    <div class="ck-head">
      <span class="ck-title">${title}</span>
      <span class="ck-count" data-cksum="${key}">${n ? n + " of " + all : "all " + all}</span>
    </div>
    <div class="ck-tools">
      <button type="button" class="lnk" data-ckall="${key}">Select all</button>
      <span class="ck-dot">·</span>
      <button type="button" class="lnk" data-cknone="${key}">Clear</button>
      ${all > 8 ? `<input type="search" class="ck-find" data-ckfind="${key}" placeholder="Filter…" autocomplete="off" value="${esc(ckUi.find[key] || "")}">` : ""}
    </div>
    ${narrowed ? `<div class="ck-narrow">Matching your other choices</div>` : ""}
    <div class="ck-list">${boxes || `<div class="ck-empty">Nothing here matches your other choices.</div>`}</div></div>`;
}

/* Does this person match every part of the scope except one facet?
   Used to build faceted lists: tick Sitecore under Function and the Grade,
   Location, Designation and Mentor lists redraw to show only the people
   actually inside Sitecore — with their real counts. */
function scopeMatchesExcept(r, s, exceptKey) {
  const on = (key, val) => key === exceptKey || !s[key] || !s[key].length || s[key].includes(val);
  return on("functions", fnOfPerson(r)) && on("grades", r.grade) && on("countries", r.country)
      && on("bands", bandOfPerson(r.email, r.role)) && on("roles", r.role) && on("mentors", r.mentor);
}

/* The six scope checklists. Kept separate from the rest of the editor so a
   tick can repaint just this grid in place — rebuilding the whole modal made
   it flash. */
function scopeChecklistsHTML(s) {
  const facet = (exceptKey, valOf) => {
    const c = {};
    for (const r of ROSTER) { if (!scopeMatchesExcept(r, s, exceptKey)) continue; const v = valOf(r); if (v) c[v] = (c[v] || 0) + 1; }
    return c;
  };
  const fnCounts = facet("functions", r => fnOfPerson(r));
  const gradeCounts = facet("grades", r => r.grade || "—");
  const countryCounts = facet("countries", r => r.country || "—");
  const bandCounts = facet("bands", r => bandOfPerson(r.email, r.role));
  const roleCounts = facet("roles", r => r.role);
  const mentorCounts = facet("mentors", r => r.mentor || "(no mentor)");
  /* keep anything already ticked visible even if another facet excluded it */
  const keep = (obj, sel) => { for (const v of sel || []) if (!(v in obj)) obj[v] = 0; return obj; };
  keep(fnCounts, s.functions); keep(gradeCounts, s.grades); keep(countryCounts, s.countries);
  keep(bandCounts, s.bands); keep(roleCounts, s.roles); keep(mentorCounts, s.mentors);
  const narrowed = ["functions", "grades", "countries", "bands", "roles", "mentors"].filter(k => s[k] && s[k].length);
  const narrowedBy = key => narrowed.filter(k => k !== key).length > 0;
  const roles = Object.keys(roleCounts).sort();
  const mentors = Object.keys(mentorCounts).filter(m => m !== "(no mentor)").sort();
  return `
      ${accessChecks("Function / practice", Object.keys(fnCounts).sort((a, b) => fnCounts[b] - fnCounts[a] || a.localeCompare(b)), "functions", s.functions || [], fnCounts, narrowedBy("functions"))}
      ${accessChecks("Grade", GRADE_ORDER.filter(g => g in gradeCounts), "grades", s.grades || [], gradeCounts, narrowedBy("grades"))}
      ${accessChecks("Office country", COUNTRY_ORDER.filter(c => c in countryCounts), "countries", s.countries || [], countryCounts, narrowedBy("countries"))}
      ${accessChecks("Designation", roles, "roles", s.roles || [], roleCounts, narrowedBy("roles"))}
      ${accessChecks("Mentor cohort", mentors, "mentors", s.mentors || [], mentorCounts, narrowedBy("mentors"))}`;
}

function wireAccessEditor() {
  const d = accessDraft;
  const el = id => document.getElementById(id);
  const coverage = () => {
    const c = el("agCoverage"); if (!c) return;
    const allow = grantAllowSet(d);
    const n = allow ? allow.size : ROSTER.length;
    c.textContent = d.scope.type === "team" && d.email && d.outside
      ? "This person isn't on the roster, so nobody maps to them as a mentor — pick a filtered slice instead."
      : d.scope.type === "team" && !d.email
      ? "Pick the employee first — team scope depends on who they mentor."
      : `This grant covers ${n} of ${ROSTER.length} employees` + (d.scope.type === "team" && d.email && n === 0 ? " — no one maps to them as mentor." : ".");
  };
  // who picker
  const who = el("agWho"), sug = el("agWhoSuggest");
  if (who && sug) {
    who.addEventListener("input", () => {
      const q = who.value.toLowerCase().trim();
      if (!q) { sug.innerHTML = ""; return; }
      const m = ROSTER.filter(r => r.name.toLowerCase().includes(q) || r.email.includes(q)).slice(0, 8);
      /* Someone outside the roster — a new joiner not yet in the HR sheet, a
         consultant, a leader on a different domain — can still be granted
         access by typing their full email address. */
      const typed = who.value.trim();
      const isEmail = /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(typed);
      const known = isEmail && ROSTER_BY_EMAIL[typed.toLowerCase()];
      const guessName = typed.split("@")[0].replace(/[._-]+/g, " ").replace(/\b\w/g, c => c.toUpperCase());
      sug.innerHTML = m.map(r => `<div class="sg" data-email="${r.email}" data-name="${esc(r.name)}" style="cursor:pointer;padding:6px 8px;border-radius:8px"><b>${esc(r.name)}</b> <span style="font-size:11.5px;color:var(--ink-faint)">${esc(r.role)} · ${esc(r.email)}</span></div>`).join("")
        + (isEmail && !known ? `<div class="sg" data-email="${esc(typed.toLowerCase())}" data-name="${esc(guessName)}" data-outside="1" style="cursor:pointer;padding:6px 8px;border-radius:8px;border-top:1px solid var(--line-soft)"><b>${esc(guessName)}</b> <span style="font-size:11.5px;color:var(--ink-faint)">${esc(typed.toLowerCase())} · not on the roster — grant anyway</span></div>` : "")
        + (!m.length && !isEmail ? `<div style="padding:8px;font-size:12px;color:var(--ink-faint)">No one matches. Type a full email address to grant access to someone outside the roster.</div>` : "");
      sug.querySelectorAll("[data-email]").forEach(x => x.addEventListener("mousedown", () => {
        const r = ROSTER_BY_EMAIL[x.dataset.email];
        d.email = x.dataset.email; d.name = (r && r.name) || x.dataset.name || x.dataset.email;
        d.outside = !r;
        document.getElementById("agWhoWrap").innerHTML = `<span class="chip active" id="agClearWho" style="cursor:pointer">${esc(d.name)}${d.outside ? " · not on roster" : ""} ✕</span>`;
        document.getElementById("agClearWho").onclick = () => { d.email = ""; d.name = ""; d.outside = false; renderAccessModal(); };
        coverage();
      }));
    });
  }
  const clearChip = el("agWhoWrap") && document.querySelector("#agWhoWrap .chip");
  if (clearChip && d.email) clearChip.onclick = () => { d.email = ""; d.name = ""; renderAccessModal(); };
  // scope
  document.querySelectorAll("input[name=agScope]").forEach(r => r.addEventListener("change", () => {
    d.scope.type = r.value;
    const f = el("agFilters"), t = el("agTeam");
    if (f) { f.classList.toggle("hidden", d.scope.type !== "filters"); f.style.display = d.scope.type === "filters" ? "grid" : "none"; }
    if (t) t.classList.toggle("hidden", d.scope.type !== "team");
    coverage();
  }));
  /* Repaint ONLY the six checklists, in place. The modal itself is left
     alone, so nothing flashes and the page never jumps. */
  const redrawScope = focusKey => {
    const grid = el("agFilters");
    if (!grid) return;
    document.querySelectorAll(".ck-box").forEach(box => {
      const list = box.querySelector(".ck-list");
      if (list) ckUi.scroll[box.dataset.ckbox] = list.scrollTop;
    });
    const modal = document.querySelector(".modal");
    const keepScroll = modal ? modal.scrollTop : 0;
    grid.innerHTML = scopeChecklistsHTML(d.scope);
    if (modal) modal.scrollTop = keepScroll;
    document.querySelectorAll(".ck-box").forEach(box => {
      const list = box.querySelector(".ck-list");
      if (list && ckUi.scroll[box.dataset.ckbox]) list.scrollTop = ckUi.scroll[box.dataset.ckbox];
    });
    wireScopeChecks();
    coverage();
    if (focusKey) {
      const inp = document.querySelector(`[data-ckfind="${focusKey}"]`);
      if (inp) { inp.focus(); const v = inp.value; inp.value = ""; inp.value = v; }
    }
  };
  const setScope = (key, vals) => { d.scope[key] = vals; redrawScope(); };

  function wireScopeChecks() {
    document.querySelectorAll("input[data-scope]").forEach(cb => cb.addEventListener("change", () => {
      const key = cb.dataset.scope, v = cb.value, cur = d.scope[key] || [];
      setScope(key, cb.checked ? cur.concat([v]) : cur.filter(x => x !== v));
    }));
    document.querySelectorAll("[data-ckall]").forEach(b => b.addEventListener("click", e => {
      e.preventDefault();
      const key = b.dataset.ckall;                     // only what is on screen (respects the filter box)
      const visible = Array.from(document.querySelectorAll(`input[data-scope="${key}"]`)).map(x => x.value);
      setScope(key, Array.from(new Set((d.scope[key] || []).concat(visible))));
    }));
    document.querySelectorAll("[data-cknone]").forEach(b => b.addEventListener("click", e => {
      e.preventDefault(); setScope(b.dataset.cknone, []);
    }));
    document.querySelectorAll("[data-ckfind]").forEach(inp => inp.addEventListener("input", () => {
      ckUi.find[inp.dataset.ckfind] = inp.value;
      ckUi.scroll[inp.dataset.ckfind] = 0;
      redrawScope(inp.dataset.ckfind);
    }));
  }
  wireScopeChecks();
  if (el("agSkip")) el("agSkip").addEventListener("change", e => { d.scope.skip = e.target.checked; coverage(); });
  if (el("agFeatAll")) el("agFeatAll").onclick = e => { e.preventDefault(); document.querySelectorAll("input[data-feature]").forEach(cb => { cb.checked = true; }); };
  if (el("agFeatNone")) el("agFeatNone").onclick = e => { e.preventDefault(); document.querySelectorAll("input[data-feature]").forEach(cb => { cb.checked = false; }); };
  // features + anonymity read on save
  if (el("agBack")) el("agBack").onclick = () => { accessDraft = null; renderAccessModal(); };
  if (el("agSave")) el("agSave").onclick = () => {
    if (!d.email) { flashNote("Pick who gets access first."); return; }
    if (ADMIN_EMAILS.includes(d.email)) { flashNote((d.name || d.email) + " is an HR admin and already has the full dashboard."); return; }
    d.features = {};
    document.querySelectorAll("input[data-feature]").forEach(cb => { d.features[cb.dataset.feature] = cb.checked; });
    d.anonymity = {
      minGroup: Math.max(1, Math.min(25, +((el("agMinG") || {}).value) || 1)),
      hideNames: !!(el("agHideNames") && el("agHideNames").checked),
      hideRatings: !!(el("agHideRatings") && el("agHideRatings").checked),
    };
    d.grantedBy = (whoAmI() || {}).name || "HR"; d.grantedAt = Date.now();
    setGrant(d);
    flashNote(`Access saved — ${d.name || d.email} can now sign in and see their scoped dashboard.`);
    accessDraft = null; renderAccessModal(); render();
  };
  coverage();
}

/* ============================================================
   Executive control rail
   One labelled row of dropdowns instead of a wall of chips, so the
   question a leader is asking ("how does Sitecore in India feel?")
   is readable straight off the bar. Selections appear underneath as
   removable chips, with a plain-English summary of what the numbers
   below now cover.
   ============================================================ */
const NUMERIC_RATINGS = ["5", "4", "3", "2"];
const RATING_WORDS = { "5": "5 · Outstanding", "4": "4 · Exceeds", "3": "3 · Meets", "2": "2 · Below", "1": "1 · Well below", "Unrated": "Not yet rated" };

function filterDefs() {
  const base = rosterScopeBase();
  const tally = fn => { const c = {}; for (const r of base) { const v = fn(r); if (v) c[v] = (c[v] || 0) + 1; } return c; };

  const fnCounts = tally(r => fnOfPerson(r));
  const gradeCounts = tally(r => r.grade);
  const roleCounts = tally(r => r.role);
  const mentorCounts = tally(r => r.mentor);
  const countryCounts = tally(r => r.country);
  const ratingCounts = {}; for (const r of base) { const v = ratingBucket(r.email); ratingCounts[v] = (ratingCounts[v] || 0) + 1; }

  const seniority = roleRank;


  const defs = [
    { key: "fn", label: "Function", noun: "function", field: "fnSel", counts: fnCounts, search: true,
      items: functionList().filter(f => fnCounts[f]).sort((a, b) => fnCounts[b] - fnCounts[a] || a.localeCompare(b)),
      manage: isAdmin() },
    { key: "grade", label: "Grade", noun: "grade", field: "gradeSel", counts: gradeCounts, width: 210,
      items: GRADE_ORDER.filter(g => gradeCounts[g]) },
    { key: "role", label: "Designation", noun: "designation", field: "roleSel", counts: roleCounts, search: true, width: 310,
      items: Object.keys(roleCounts).sort((a, b) => seniority(a) - seniority(b) || a.localeCompare(b)) },
    { key: "mentor", label: "Mentor", noun: "mentor", field: "mentorSel", counts: mentorCounts, search: true, width: 320,
      items: Object.keys(mentorCounts).sort((a, b) => mentorCounts[b] - mentorCounts[a] || a.localeCompare(b)) },
    { key: "country", label: "Location", noun: "location", field: "countrySel", counts: countryCounts, width: 210,
      items: COUNTRY_ORDER.filter(c => countryCounts[c]) },
  ];
  if (!hideRatings()) {
    defs.push({ key: "rating", label: "Rating", noun: "rating", field: "ratingSel", counts: ratingCounts, width: 250,
      items: RATING_ORDER.filter(rt => ratingCounts[rt]), display: v => RATING_WORDS[v] || v });
  }
  return defs;
}

function wireRatingBar() {
  const defs = filterDefs();
  const byKey = Object.fromEntries(defs.map(d => [d.key, d]));
  const reset = () => { ui.peopleLimit = 15; ui.commentLimit = 12; };

  const hc = document.getElementById("hipoChip");
  if (hc) hc.addEventListener("click", () => { ui.hipoOnly = !ui.hipoOnly; reset(); render(); });

  document.querySelectorAll("[data-ftoggle]").forEach(b => b.addEventListener("click", e => {
    e.stopPropagation();
    const k = b.dataset.ftoggle;
    ui.openPanel = ui.openPanel === k ? null : k;
    ui.panelFind = "";
    render();
  }));

  const def = byKey[ui.openPanel];
  const panel = document.getElementById("fpanel");
  if (def && panel) {
    panel.addEventListener("click", e => e.stopPropagation());
    const list = document.getElementById("fpanelList");
    if (list) list.scrollTop = ui._panelScroll || 0;
    const remember = () => { ui._panelScroll = list ? list.scrollTop : 0; };

    const apply = vals => {
      const others = def.subset ? (ui[def.field] || []).filter(v => !def.subset.includes(v)) : [];
      ui[def.field] = others.concat(vals);
      reset(); render();
    };
    panel.querySelectorAll("input[data-fbox]").forEach(cb => cb.addEventListener("change", () => {
      remember();
      const cur = defSel(def);
      const v = cb.dataset.fbox;
      apply(cb.checked ? cur.concat(v) : cur.filter(x => x !== v));   // panel stays open
    }));
    const fa = document.getElementById("fpanelAll");
    if (fa) fa.addEventListener("click", e => {
      e.preventDefault(); remember();
      const q = (ui.panelFind || "").toLowerCase().trim();
      apply(q ? def.items.filter(v => v.toLowerCase().includes(q)) : def.items.slice());
    });
    const fn0 = document.getElementById("fpanelNone");
    if (fn0) fn0.addEventListener("click", e => { e.preventDefault(); remember(); apply([]); });
    const fd = document.getElementById("fpanelDone");
    if (fd) fd.addEventListener("click", () => { ui.openPanel = null; ui.panelFind = ""; render(); });
    const fm = document.getElementById("fnManage");
    if (fm) fm.addEventListener("click", () => { ui.openPanel = null; render(); openManageFunctions(); });
    const ff = document.getElementById("fpanelFind");
    if (ff) {
      ff.addEventListener("input", () => {
        ui.panelFind = ff.value; ui._panelScroll = 0; render();
        const again = document.getElementById("fpanelFind");
        if (again) { again.focus(); const v = again.value; again.value = ""; again.value = v; }
      });
      if (ui.panelFind) { ff.focus(); const v = ff.value; ff.value = ""; ff.value = v; }
    }
  }

  document.querySelectorAll(".fchip[data-fdrop]").forEach(ch => ch.addEventListener("click", () => {
    const k = ch.dataset.fdrop, v = ch.dataset.fval;
    if (k === "hipo") { ui.hipoOnly = false; }
    else {
      const d2 = byKey[k];
      if (d2) ui[d2.field] = (ui[d2.field] || []).filter(x => x !== v);
    }
    reset(); render();
  }));

  const rc = document.getElementById("ratingClear");
  if (rc) rc.addEventListener("click", e => {
    e.preventDefault();
    ui.ratingSel = []; ui.hipoOnly = false; ui.roleSel = []; ui.mentorSel = [];
    ui.fnSel = []; ui.gradeSel = []; ui.countrySel = [];
    ui.openPanel = null; ui.panelFind = ""; reset(); render();
  });
}

/* one document-level closer for whichever panel is open */
if (!window.__filterPanelCloser) {

    const panel = document.getElementById("fpanel");

/* ---- performance rating × EVP ---- */
function ratingStats() {
  const groups = {};
  for (const sub of respondentPool()) {
    const rt = ratingBucket(sub.email);
    if (!groups[rt]) groups[rt] = { n: 0, indices: [], pillars: Object.fromEntries(PKEYS.map(k => [k, []])) };
    const g = groups[rt]; g.n++;
    const idx = personIndex(sub); if (idx != null) g.indices.push(idx);
    for (const k of PKEYS) if (sub.sat[k] != null) g.pillars[k].push(sub.sat[k]);
  }
  return groups;
}
function ratingHeatHTML() {
  if (hideRatings()) return "";
  const groups = ratingStats();
  const order = RATING_ORDER.filter(rt => groups[rt] && groups[rt].n >= Math.max(3, minGroup()));
  if (!order.length) return "";
  let h = `<table class="heat"><tr><th style="text-align:left">Performance rating</th>${PILLARS.map(p => `<th>${p.label}</th>`).join("")}<th>Overall score</th></tr>`;
  for (const rt of order) {
    const g = groups[rt];
    h += `<tr><td class="rowhead">${esc(rt)}<span class="hm-n">n = ${g.n}</span></td>`;
    for (const p of PILLARS) {
      const v = g.pillars[p.key].length ? mean(g.pillars[p.key]) : null;
      h += `<td style="background:${heatBg(v)};font-weight:700;color:#1e2a3a">${v == null ? "—" : fmt(v)}</td>`;
    }
    const idx = g.indices.length ? mean(g.indices) : null;
    h += `<td style="background:${heatBg(idx)};font-weight:800;color:#1e2a3a">${idx == null ? "—" : fmt(idx)}</td></tr>`;
  }
  h += `</table>`;
  return `<section class="section">
    <div class="section-eyebrow">Performance × experience</div>
    <h2 class="section-title">Satisfaction by performance rating</h2>
    <p class="section-sub">Are your best-rated people happier than the rest? If the 4s and 5s score low on Rewards or Career, the people you most want to keep are the ones being let down.</p>
    <div class="card heat-wrap">${h}${heatKeyHTML()}</div>
  </section>`;
}
function topPerformersAtRisk() {
  return respondentPool().filter(sub => {
    const rt = ratingOf(sub.email);
    if (rt !== "4" && rt !== "5") return false;
    const idx = personIndex(sub);
    return idx != null && (idx < 6.5 || PKEYS.filter(k => sub.sat[k] != null && sub.sat[k] <= 6).length >= 2);
  });
}

function nudgeMailto(r) {

`Hi ${r.name.split(" ")[0]},

Your EVP Check-In hasn't come through yet — it takes about 5 minutes and directly shapes what we prioritise next (career paths, rewards, learning and more).

Could you complete it this week? Your mentor ${r.mentor || ""} can help if anything is unclear.

/* ---- person drill-down ---- */
function canViewPerson(email) {

  if (r && (r.mentorEmail || "").toLowerCase() === me.email) return true;      // my mentee

}
function openPerson(email) {

      </tr>` + ((sub.comments[p.key] || "").trim() ? `<tr><td colspan="3" style="border-bottom:1px solid var(--line);padding-top:0"><div class="c-body" style="font-size:12.5px;background:var(--cream);border-radius:8px;padding:8px 10px">“${esc(sub.comments[p.key])}”</div></td></tr>` : "");
    }).join("");
    body = `
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
        <span class="chip ${s.idx < 5.5 ? "flag" : s.idx < 7 ? "warn" : "ok"}">Overall score ${fmt(s.idx)}</span>
        ${isHipo(r.email) ? '<span class="chip" style="border-color:#e2c98a;background:#faf3df;color:#8a6020">★ HiPo</span>' : ""}
        <span class="chip ${ratingChipClass(ratingOf(r.email))}">Rating ${esc(ratingOf(r.email))}</span>
        <span class="chip">${esc(bandOf(sub.role || r.role))}</span>

      </div>

      </div>`;
  }
  root.innerHTML = `<div class="modal-scrim" id="scrim"><div class="modal" style="max-width:680px">
    <h3>${esc(r.name)}</h3>
    <p style="margin-top:0;color:var(--ink-faint);font-size:12.5px">${esc(r.role)} · mentor ${esc(r.mentor || "—")} ${r.mentorEmail ? "· " + esc(r.mentorEmail) : ""}</p>
    ${body}
    <div class="modal-actions"><button class="btn" onclick="closeModal()">Close</button></div>
  </div></div>`;
  document.getElementById("scrim").addEventListener("click", e => { if (e.target.id === "scrim") closeModal(); });
}
function closeModal() { document.getElementById("modalRoot").innerHTML = ""; }

function summaryMailto(sub, r) {
  const lows = PKEYS.filter(k => sub.sat[k] != null && sub.sat[k] <= 6);
  const lines = [
`Hi ${(r.mentor || "").split(" ")[0] || "there"},`,
``,
`Sharing ${sub.name}'s EVP Check-In summary so you can plan your next development conversation.`,
``,
`Scores (satisfaction /10, priority rank in brackets):`];
  for (const k of PKEYS) if (sub.sat[k] != null)
    lines.push(`  - ${PLABEL[k]}: ${sub.sat[k]}/10 (priority #${sub.ranks[k] ?? "-"})${sub.sat[k] <= 6 ? "  << needs attention" : ""}`);
  if (lows.length) {
    lines.push(``, `Comments on the low areas:`);
    for (const k of lows) if ((sub.comments[k] || "").trim()) lines.push(`  - ${PLABEL[k]}: "${sub.comments[k]}"`);
  }
  lines.push(``, `Suggested next step: a 1:1 within the next two weeks focused on ${lows.map(k => PLABEL[k]).join(", ") || "reinforcing what's working"}.`, ``, `Thanks!`);
  return `mailto:${r.mentorEmail || ""}?subject=${encodeURIComponent(`EVP check-in summary: ${sub.name}`)}&body=${encodeURIComponent(lines.join("\n"))}`;
}

    <h3>Assign a follow-up task</h3>

    <p style="margin-bottom:4px"><b>Pillar</b></p>
    <select id="tPillar" style="width:100%;border:1px solid var(--line);border-radius:8px;padding:8px">
      ${PILLARS.map(p => `<option value="${p.key}" ${(presetPillar ? presetPillar === p.key : lows[0] === p.key) ? "selected" : ""}>${p.label}${lows.includes(p.key) ? ` — scored ${s.sub.sat[p.key]}/10` : ""}</option>`).join("")}

    </div>
    <p style="margin-bottom:4px;margin-top:12px"><b>What should happen</b></p>
    <textarea id="tNote" style="min-height:90px;font-family:var(--body);font-size:13px" placeholder="e.g. Walk them through the promotion framework and agree 2–3 gaps to close this cycle. Confirm the next review date.">${esc(taskSuggestion(s, presetPillar || lows[0]))}</textarea>
    <p style="margin-bottom:4px"><b>Due</b></p>
    <input type="date" id="tDue" value="${new Date(Date.now() + 14 * 86400000).toISOString().slice(0, 10)}" style="border:1px solid var(--line);border-radius:8px;padding:8px">
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn" id="tSave">Save task</button>
      <button class="btn primary" id="tSaveSend">Save &amp; draft email</button>
    </div>
  </div></div>`;
  document.getElementById("scrim").addEventListener("click", e => { if (e.target.id === "scrim") closeModal(); });
  const build = () => ({
    id: "t" + Date.now() + Math.floor(Math.random() * 999),
    email, name: r.name,
    pillar: document.getElementById("tPillar").value,
    assignee: document.getElementById("tWho").value.trim(),
    assigneeEmail: document.getElementById("tWhoEmail").value.trim(),
    note: document.getElementById("tNote").value.trim(),
    due: document.getElementById("tDue").value,
    status: "open", createdAt: Date.now(),
    score: s.submitted ? s.sub.sat[document.getElementById("tPillar").value] : null,
    comment: s.submitted ? (s.sub.comments[document.getElementById("tPillar").value] || "") : "",
  });
  const persist = t => { state.tasks.push(t); save(); postTaskEvent({ type: "task", ...t, updates: undefined }); };
  document.getElementById("tSave").onclick = () => { persist(build()); closeModal(); render();
    flashNote(state.taskWriteUrl ? "Task saved and sent to the shared tracker." : "Task saved on this device."); };
  document.getElementById("tSaveSend").onclick = () => {
    const t = build(); persist(t); closeModal(); render();
    window.location.href = taskMailto(t);
  };
}
function taskSuggestion(s, pillar) {
  if (!s.submitted || !pillar) return "";
  const score = s.sub.sat[pillar], c = (s.sub.comments[pillar] || "").trim();
  const stems = {
    career: "Walk them through the promotion framework for their track, agree 2–3 concrete gaps to close this cycle, and put a date on the next career conversation.",
    learning: "Agree one certification or structured learning goal for this quarter and unblock the budget/approval for it.",
    people: "Have a 1:1 to understand the team friction, then align ownership with the other party involved.",
    culture: "Discuss where stated values and day-to-day experience diverge for them, and pick one visible fix.",
    rewards: "Share their compensation band positioning, explain how the last revision was decided, and confirm the next review date.",
    work: "Review their current staffing/scope, agree what changes (variety, estimation, load), and set a check-back date.",
  };
  let out = stems[pillar] || "";
  if (c) out += `\n\nTheir comment (${score}/10): "${c}"`;
  return out;
}
function taskMailto(t) {
  const dueTxt = t.due ? new Date(t.due + "T00:00:00").toLocaleDateString() : "in the next two weeks";
  const body =
`Hi ${(t.assignee || "").split(" ")[0] || "there"},

From ${t.name}'s EVP Check-In: ${PLABEL[t.pillar]} scored ${t.score != null ? t.score + "/10" : "low"}${t.comment ? `, with this comment:

  "${t.comment}"` : "."}

What we'd like you to own (due ${dueTxt}):
${t.note}

Please reply with what was agreed after you've spoken — I'll close the loop with ${t.name.split(" ")[0]} from our side too.

Thank you!`;
  return `mailto:${t.assigneeEmail}?subject=${encodeURIComponent(`Follow-up needed: ${t.name} — ${PLABEL[t.pillar]}`)}&body=${encodeURIComponent(body)}`;
}

  return `
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap">

function setTaskStatus(id, status) {
  const t = state.tasks.find(x => x.id === id); if (!t) return;

function deleteTask(id) { state.tasks = state.tasks.filter(t => t.id !== id); save(); render(); }
function exportTasks() {

function wirePeople() {
  const on = (id, ev, fn) => { const el = document.getElementById(id); if (el) el.addEventListener(ev, fn); };
  on("pSearch", "input", e => { ui.peopleSearch = e.target.value; ui.peopleLimit = 15;
    const wrap = document.getElementById("peopleWrap"); if (wrap) { wrap.innerHTML = directoryHTML(); wirePeople(); const s = document.getElementById("pSearch"); s.focus(); s.setSelectionRange(s.value.length, s.value.length); } });
  on("pFilter", "change", e => { ui.peopleFilter = e.target.value; ui.peopleLimit = 15;
    const wrap = document.getElementById("peopleWrap"); if (wrap) { wrap.innerHTML = directoryHTML(); wirePeople(); } });
  on("pMore", "click", () => { ui.peopleLimit = (ui.peopleLimit || 15) + 20;
    const wrap = document.getElementById("peopleWrap"); if (wrap) { wrap.innerHTML = directoryHTML(); wirePeople(); } });
}

/* ---------------- import modal ---------------- */
function openImport() {
  const root = document.getElementById("modalRoot");
  root.innerHTML = `<div class="modal-scrim" id="scrim"><div class="modal">
    <h3>Import check-in responses</h3>
    <p>Bring in the Excel/CSV file that Power Automate maintains, a CSV export, or the raw JSON payloads. Columns are auto-detected — headers just need to contain the pillar name plus <b>rank</b>, <b>sat</b>/<b>score</b>, or <b>comment</b> (e.g. <i>career_sat</i>, <i>Rewards rank</i>). Rows are matched to the roster by email; re-importing updates existing rows.</p>
    <div class="drop" id="drop">Drop a .xlsx / .csv / .json file here, or
      <label style="color:var(--accent);font-weight:700;cursor:pointer"> browse<input type="file" id="fileInput" accept=".csv,.xlsx,.xls,.xlsm,.json" style="display:none"></label></div>
    <p style="margin-bottom:6px"><b>Or paste JSON</b> (array of submissions, Power Automate shape supported):</p>
    <textarea id="jsonPaste" placeholder='[{"email":"a@altudo.co","career":{"rank":1,"sat":6,"comment":"..."}, ...}]'></textarea>
    <div class="modal-actions">
      <button class="btn" id="btnCancel">Cancel</button>
      <button class="btn primary" id="btnPaste">Import pasted JSON</button>
    </div>
  </div></div>`;
  const close = () => { root.innerHTML = ""; };
  document.getElementById("btnCancel").onclick = close;
  document.getElementById("scrim").addEventListener("click", e => { if (e.target.id === "scrim") close(); });
  if (state.isDemo) { state.responses = {}; state.isDemo = false; }   // real data must never mix with demo
  const finish = added => { state.source = `Imported responses (${Object.keys(state.responses).length} total)`; save(); close(); render(); alert(`Imported/updated ${added} responses.`); };
  document.getElementById("fileInput").addEventListener("change", async e => {
    const f = e.target.files[0]; if (!f) return;
    try { finish(await handleFile(f)); } catch (err) { alert("Import failed: " + err.message); }
  });
  const drop = document.getElementById("drop");
  drop.addEventListener("dragover", e => { e.preventDefault(); });
  drop.addEventListener("drop", async e => {
    e.preventDefault(); const f = e.dataTransfer.files[0]; if (!f) return;
    try { finish(await handleFile(f)); } catch (err) { alert("Import failed: " + err.message); }
  });
  document.getElementById("btnPaste").onclick = () => {
    try { finish(jsonToResponses(JSON.parse(document.getElementById("jsonPaste").value))); }
    catch (err) { alert("Import failed: " + err.message); }
  };
}

/* ---------------- global employee search ---------------- */
function wireGlobalSearch() {
  const input = document.getElementById("globalSearch");
  const box = document.getElementById("globalSuggest");
  if (!input || !box) return;
  let cursor = -1, matches = [];
  const close = () => { box.classList.add("hidden"); cursor = -1; };
  const show = () => {
    const q = input.value.toLowerCase().trim();
    if (q.length < 2) { close(); return; }
    matches = ROSTER.filter(r => r.name.toLowerCase().includes(q) || r.email.includes(q) ||
      (r.role || "").toLowerCase().includes(q)).slice(0, 8);
    if (!matches.length) { box.innerHTML = `<div class="sg"><span class="sg-sub">No match in the roster</span></div>`; box.classList.remove("hidden"); return; }
    box.innerHTML = matches.map((r, i) => {
      const s = personStatus(r.email);
      const badge = s.submitted
        ? `<span class="chip ${s.idx < 5.5 ? "flag" : s.idx < 7 ? "warn" : "ok"}">${fmt(s.idx)}</span>`
        : `<span class="chip">pending</span>`;
      return `<div class="sg ${i === cursor ? "active" : ""}" data-email="${r.email}">
        <span><span class="sg-name">${esc(r.name)}</span><br><span class="sg-sub">${esc(r.role)} · ${esc(r.mentor || "—")}</span></span>${badge}</div>`;
    }).join("");
    box.classList.remove("hidden");
    box.querySelectorAll(".sg[data-email]").forEach(el => el.addEventListener("mousedown", e => {
      e.preventDefault(); openPerson(el.dataset.email); input.value = ""; close();
    }));
  };
  input.addEventListener("input", () => { cursor = -1; show(); });
  input.addEventListener("focus", show);
  input.addEventListener("blur", () => setTimeout(close, 150));
  input.addEventListener("keydown", e => {
    if (e.key === "Escape") { input.value = ""; close(); return; }
    if (!matches.length) return;
    if (e.key === "ArrowDown") { e.preventDefault(); cursor = Math.min(cursor + 1, matches.length - 1); show(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); cursor = Math.max(cursor - 1, 0); show(); }
    else if (e.key === "Enter" && cursor >= 0) { e.preventDefault(); openPerson(matches[cursor].email); input.value = ""; close(); }
    else if (e.key === "Enter" && matches.length === 1) { e.preventDefault(); openPerson(matches[0].email); input.value = ""; close(); }
  });
}

function clearData() {

  state = { responses: {}, source: "", readUrl: state.readUrl || "", tasks: state.tasks || [] }; save(); closeModal(); render();
}

/* Live updates: the Excel keeps growing, so quietly re-sync every 60s while
   the tab is visible, and immediately when the user returns to the tab. */
let autoBusy = false;
async function autoRefresh() {
  if (autoBusy || document.hidden || !whoAmI()) return;
  autoBusy = true;
  try {
    if (state.readUrl) await syncFromExcel({ silent: true });
    if (state.taskReadUrl) await syncTasks({ silent: true, noRender: true });
  } finally { autoBusy = false; }
}
setInterval(autoRefresh, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) autoRefresh(); });
