<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Live build: syncs with TalentPortal_Data.xlsx + TalentPortal_Permissions.xlsx
     through ONE Power Automate flow. Paste FLOW_URL near the bottom of this file. -->
<title>Talent Studio — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.2.0/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0F1B2D;--ink2:#1B2A42;--paper:#F4F5F2;--card:#FFFFFF;
  --line:#E3E5E0;--line2:#CBCFC8;--text:#1A2231;--t2:#5D6675;--t3:#8A929E;
  --jade:#0F7B69;--jadebg:#E4F0EC;--amber:#B0710C;--amberbg:#FBF0DC;
  --rust:#9E3B33;--rustbg:#F8E8E5;--violet:#5B4B9E;--violetbg:#EDEAF7;
  --blue:#1F6FB2;--bluebg:#E4F0FA;--r:9px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:var(--paper);color:var(--text);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
.serif{font-family:'Fraunces',Georgia,serif}
.shell{display:flex;min-height:100vh}

/* sidebar */
.side{width:246px;flex:0 0 246px;background:var(--ink);color:#DDE2EA;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.09)}
.brand .mk{font-family:'Fraunces',serif;font-size:18px;font-weight:600;color:#fff;display:flex;align-items:center;gap:9px}
.brand .dot{width:8px;height:8px;border-radius:50%;background:#2FBFA5}
.brand .sb{font-size:10px;color:#7C899C;margin-top:5px;letter-spacing:.08em;text-transform:uppercase}

.rolepick{padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.09)}
.rolepick label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#6F7C90;display:block;margin-bottom:8px}
.rolerow{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.rolebtn{background:var(--ink2);border:1px solid rgba(255,255,255,.12);color:#C3CCDA;font-family:inherit;font-size:11.5px;
  padding:8px 6px;border-radius:7px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:.15s}
.rolebtn .ti{font-size:16px}
.rolebtn:hover{background:#26374F;color:#fff}
.rolebtn.on{background:#2FBFA5;border-color:#2FBFA5;color:#06281F;font-weight:500}
.aswho{padding:12px 18px;border-bottom:1px solid rgba(255,255,255,.09)}
.aswho label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#6F7C90;display:block;margin-bottom:7px}
.aswho select{width:100%;background:var(--ink2);color:#EDF1F6;border:1px solid rgba(255,255,255,.14);border-radius:7px;padding:8px 9px;font-family:inherit;font-size:12.5px;cursor:pointer}
.aswho .m{margin-top:9px;font-size:11.5px;color:#8F9BAD;line-height:1.5}
.aswho .m b{color:#DDE2EA;font-weight:500}
.idcard{display:flex;align-items:center;gap:11px;background:var(--ink2);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:11px 12px}
.idav{width:38px;height:38px;flex:0 0 38px;border-radius:50%;background:#2FBFA5;color:#06281F;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600}
.idmeta{min-width:0;line-height:1.35}
.idname{font-size:13.5px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.idrole{font-size:11.5px;color:#B9C3D1}
.idsub{font-size:10.5px;color:#7E8DA3;margin-top:1px}

nav{padding:12px 10px;flex:1;overflow-y:auto}
.navlab{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#5F6C80;padding:8px 8px 6px}
.tab{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 11px;margin-bottom:2px;border:0;border-radius:7px;
  background:transparent;color:#B9C3D1;font-family:inherit;font-size:13px;cursor:pointer;transition:.15s}
.tab:hover:not(:disabled){background:rgba(255,255,255,.06);color:#fff}
.tab.on{background:#22344F;color:#fff;font-weight:500}
.tab.on .ic{color:#2FBFA5}
.tab:disabled{opacity:.3;cursor:not-allowed}
.tab .ic{width:17px;flex:0 0 17px;text-align:center;font-size:15px;color:#7E8DA3}
.tab .lk{margin-left:auto;font-size:9px;letter-spacing:.05em;text-transform:uppercase;color:#6F7C90}
.sfoot{padding:12px 18px;border-top:1px solid rgba(255,255,255,.09);font-size:10.5px;color:#6B778A;line-height:1.5}

/* main */
main{flex:1;min-width:0;padding:28px 36px 60px;max-width:1200px}
.phead{margin-bottom:22px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.phead h1{font-family:'Fraunces',serif;font-size:27px;font-weight:600;letter-spacing:-.02em}
.phead p{color:var(--t2);font-size:13px;margin-top:4px}
.chip{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--t2);border:1px solid var(--line2);border-radius:999px;padding:5px 12px;background:#fff;white-space:nowrap}
.view{display:none}.view.on{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* cards & bits */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:15px}
.card h2{font-size:14px;font-weight:600;margin-bottom:3px}
.card .hint{font-size:12.5px;color:var(--t3);margin-bottom:15px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:15px}
.grid2 .card{margin-bottom:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:13px;margin-bottom:15px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 17px}
.kpi .l{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--t3)}
.kpi .v{font-size:27px;font-weight:600;letter-spacing:-.03em;margin:5px 0 2px}
.kpi .s{font-size:11.5px;color:var(--t3)}
.rail{height:5px;background:#EDEFEB;border-radius:3px;overflow:hidden;margin-top:10px}
.rail i{display:block;height:100%;border-radius:3px;transition:width .5s cubic-bezier(.3,1,.4,1)}
.f-jade{background:var(--jade)}.f-amber{background:var(--amber)}.f-rust{background:var(--rust)}.f-blue{background:var(--blue)}.f-violet{background:var(--violet)}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:500;letter-spacing:.02em;padding:3px 10px;border-radius:999px;white-space:nowrap}
.p-jade{background:var(--jadebg);color:#0A5648}.p-amber{background:var(--amberbg);color:#7A4E06}
.p-rust{background:var(--rustbg);color:#7A2B25}.p-violet{background:var(--violetbg);color:#3F3376}
.p-blue{background:var(--bluebg);color:#0C447C}.p-grey{background:#EDEFEB;color:#57606D}

.kline{display:flex;align-items:center;gap:13px;padding:11px 0;border-bottom:1px solid var(--line)}
.kline:last-child{border-bottom:0}
.kline .nm{flex:1;font-size:13.5px}.kline .nm small{display:block;color:var(--t3);font-size:11.5px;margin-top:1px}
.kline .bar{width:160px;flex:0 0 160px}.kline .pc{width:46px;flex:0 0 46px;text-align:right;font-size:13px;font-weight:500}

table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--t3);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line)}
table.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.tbl tr:last-child td{border-bottom:0}
table.tbl tr.clk{cursor:pointer}table.tbl tr.clk:hover{background:#FAFBF9}
.av{width:30px;height:30px;border-radius:50%;background:var(--violetbg);color:#3F3376;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex:0 0 30px}
.who{display:flex;align-items:center;gap:9px}

.btn{font-family:inherit;font-size:13px;padding:8px 14px;border-radius:8px;border:1px solid var(--line2);background:#fff;color:var(--text);cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:#FAFBF9;border-color:var(--t3)}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}.btn.pri:hover{background:#22344F}
.btn.jade{background:var(--jade);color:#fff;border-color:var(--jade)}.btn.jade:hover{opacity:.9}
.btn.rust{background:#fff;color:var(--rust);border-color:var(--rust)}.btn.rust:hover{background:var(--rustbg)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{font-size:12px;padding:5px 10px}

.empty{text-align:center;padding:46px 24px;border:1px dashed var(--line2);border-radius:12px;background:#FBFBF9}
.empty .ei{font-size:24px;color:var(--t3);margin-bottom:10px}
.empty h3{font-size:15px;font-weight:600;margin-bottom:5px}.empty p{font-size:13px;color:var(--t2);max-width:400px;margin:0 auto}

.note{font-size:12.5px;color:var(--t2);background:#FBFBF9;border:1px solid var(--line);border-radius:8px;padding:11px 13px;line-height:1.55}
.note.warn{background:var(--amberbg);border-color:#EAD9A8;color:#6B4A08}
.dl{display:grid;grid-template-columns:150px 1fr;gap:8px 16px;font-size:13.5px}
.dl dt{color:var(--t3);font-size:12.5px}.dl dd{font-weight:500}

/* 9box */
.box9{display:grid;grid-template-columns:24px repeat(3,1fr);grid-template-rows:repeat(3,74px) 24px;gap:5px;max-width:520px}
.b9{border-radius:7px;padding:8px 9px;display:flex;flex-direction:column;justify-content:space-between;font-size:11px;line-height:1.3;border:1px solid transparent}
.b9 .t{font-weight:500}.b9 .c{font-size:10px;color:var(--t3)}
.b9.hit{border-color:var(--ink);background:var(--ink)!important}.b9.hit .t{color:#fff}.b9.hit .c{color:#8FD9CA}
.axl{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);display:flex;align-items:center;justify-content:center;grid-row:1/4}
.axb{grid-column:2/5;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);display:flex;align-items:center;justify-content:center}

/* swot */
.swot{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.sq{border-radius:10px;padding:14px 16px;border:1px solid var(--line)}
.sq h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:9px;font-weight:600}
.sq ul{list-style:none}.sq li{font-size:12.5px;padding:4px 0 4px 14px;position:relative;line-height:1.45}
.sq li:before{content:"";position:absolute;left:0;top:10px;width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.5}

/* modal */
.modal-bg{position:absolute;inset:0;background:rgba(15,27,45,.45);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:40px 20px}
.modal-bg.on{display:flex}
.modal{background:#fff;border-radius:14px;width:100%;max-width:520px;padding:22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:pop .18s ease}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.modal h3{font-size:16px;font-weight:600;margin-bottom:4px}
.modal .sub{font-size:12.5px;color:var(--t3);margin-bottom:16px}
.modal label{font-size:12px;color:var(--t2);display:block;margin:12px 0 5px;font-weight:500}
.modal input[type=range]{width:100%}
.modal textarea,.modal input[type=text]{width:100%;font-family:inherit;font-size:13px;padding:9px 11px;border:1px solid var(--line2);border-radius:8px;resize:vertical}
.modal textarea:focus,.modal input:focus{outline:2px solid var(--jade);outline-offset:1px;border-color:var(--jade)}
.modal .foot{display:flex;gap:9px;justify-content:flex-end;margin-top:20px}

.timeline{list-style:none;margin-top:6px}
.timeline li{position:relative;padding:0 0 14px 20px;border-left:2px solid var(--line);margin-left:5px}
.timeline li:last-child{border-left-color:transparent;padding-bottom:0}
.timeline li:before{content:"";position:absolute;left:-6px;top:2px;width:10px;height:10px;border-radius:50%;background:var(--jade);border:2px solid #fff}
.timeline .tt{font-size:12.5px;font-weight:500}
.timeline .td{font-size:11.5px;color:var(--t3);margin-top:1px}
.timeline .tx{font-size:12.5px;color:var(--t2);margin-top:3px;line-height:1.5}

.flag{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#7A4E06;background:var(--amberbg);padding:3px 9px;border-radius:6px}
.badge-n{display:inline-block;min-width:18px;text-align:center;font-size:10px;font-weight:600;background:var(--rust);color:#fff;border-radius:9px;padding:1px 6px;margin-left:6px}
:focus-visible{outline:2px solid var(--jade);outline-offset:2px}

/* login screen */
.loginwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ink);padding:24px}
.loginbox{background:#fff;border-radius:16px;width:100%;max-width:400px;padding:32px 30px;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.lb-brand{font-family:'Fraunces',serif;font-size:22px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:9px}
.lb-brand .dot{width:9px;height:9px;border-radius:50%;background:#2FBFA5}
.lb-sub{font-size:13px;color:var(--t2);margin:5px 0 24px}
.lb-lab{font-size:12px;color:var(--t2);font-weight:500;display:block;margin-bottom:6px}
.lb-input{width:100%;font-family:inherit;font-size:14px;padding:11px 13px;border:1px solid var(--line2);border-radius:9px}
.lb-input:focus{outline:2px solid var(--jade);outline-offset:1px;border-color:var(--jade)}
.lb-btn{width:100%;margin-top:16px;font-family:inherit;font-size:14px;font-weight:500;padding:11px;border:0;border-radius:9px;background:var(--ink);color:#fff;cursor:pointer;transition:.15s}
.lb-btn:hover{background:#22344F}
.lb-err{color:var(--rust);font-size:12.5px;margin-top:10px;min-height:16px}
.lb-demo{margin-top:22px;padding-top:20px;border-top:1px solid var(--line)}
.lb-demo-lab{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--t3);margin-bottom:10px}
.lb-chip{display:flex;align-items:center;gap:8px;width:100%;text-align:left;font-family:'IBM Plex Mono',monospace;font-size:12.5px;
  padding:9px 12px;margin-bottom:6px;border:1px solid var(--line);border-radius:8px;background:#FBFBF9;color:var(--text);cursor:pointer;transition:.15s}
.lb-chip:hover{background:var(--jadebg);border-color:#9FE1CB}
.lb-chip .ti{font-size:15px;color:var(--jade)}
.lb-note{font-size:11.5px;color:var(--t3);margin-top:8px;font-style:italic}
.signout{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);
  color:#C3CCDA;font-family:inherit;font-size:12px;padding:7px 12px;border-radius:7px;cursor:pointer;transition:.15s}
.signout:hover{background:rgba(255,255,255,.14);color:#fff}
#acctLine b{color:#DDE2EA;font-weight:500}

/* toggle switch */
.switch{position:relative;display:inline-block;width:42px;height:24px;flex:0 0 42px}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch .track{position:absolute;inset:0;background:#CBCFC8;border-radius:24px;transition:.2s;cursor:pointer}
.switch .track:before{content:"";position:absolute;height:18px;width:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked + .track{background:var(--jade)}
.switch input:checked + .track:before{transform:translateX(18px)}
.switch input:focus-visible + .track{outline:2px solid var(--jade);outline-offset:2px}

/* hover info tooltip */
.info{position:relative;display:inline-flex;cursor:help;color:var(--t3);margin-left:6px;vertical-align:0}
.info .ti{font-size:15px}
.info:hover,.info:focus{color:var(--jade)}
.info .tip{position:absolute;left:50%;top:calc(100% + 8px);transform:translateX(-50%);width:320px;max-width:78vw;
  background:var(--ink);color:#E7ECF3;font-size:12px;line-height:1.6;font-weight:400;padding:14px 15px;border-radius:10px;
  box-shadow:0 12px 34px rgba(0,0,0,.28);opacity:0;visibility:hidden;transition:.15s;z-index:70;text-align:left}
.info .tip:before{content:"";position:absolute;left:50%;top:-6px;transform:translateX(-50%) rotate(45deg);width:12px;height:12px;background:var(--ink)}
.info .tip b{color:#fff}
.info:hover .tip,.info:focus .tip{opacity:1;visibility:visible}
.info-btn{border:1px solid var(--line2);border-radius:8px;padding:5px 10px;font-size:12px;color:var(--text);background:#fff;align-items:center;gap:5px;margin-left:0}
.info-btn:hover,.info-btn:focus{background:var(--jadebg);border-color:#9FE1CB;color:#0A5648}
.info-btn .tip{font-size:12px;font-weight:400}
.modal input[type=date]{width:100%;font-family:inherit;font-size:13px;padding:9px 11px;border:1px solid var(--line2);border-radius:8px}
.iconbtn{border:1px solid var(--line2);background:#fff;border-radius:7px;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--t2);flex:0 0 30px;transition:.15s}
.iconbtn:hover{background:var(--jadebg);border-color:#9FE1CB;color:var(--jade)}
.iconbtn .ti{font-size:15px}

/* permission matrix rows */
.permhead{display:grid;grid-template-columns:1fr 84px 84px;gap:8px;padding:6px 0 8px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--t3);border-bottom:1px solid var(--line)}
.permhead span:not(:first-child){text-align:center}
.permrow{display:grid;grid-template-columns:1fr 84px 84px;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.permrow:last-child{border-bottom:0}
.permrow.sub{background:#FBFBF9}
.permlabel{font-size:13px;font-weight:500}
.permrow.sub .permlabel{font-size:12.5px;font-weight:400;color:var(--t2);padding-left:6px}
.subarrow{color:var(--t3);margin-right:6px}
.permtoggle{display:flex;flex-direction:column;align-items:center;gap:3px}
.permcap{font-size:9px;letter-spacing:.04em;text-transform:uppercase;color:var(--t3)}
@media(max-width:600px){.permhead,.permrow{grid-template-columns:1fr 64px 64px}}
/* 4-toggle rows (employee + mentor) */
.permhead4{display:grid;grid-template-columns:1fr 70px 70px 70px 70px;gap:6px;padding:6px 0 6px;font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--t3)}
.permhead4 span:not(:first-child){text-align:center}
.permhead4 .colgrp{color:var(--jade);font-weight:600;border-bottom:1px solid var(--line);padding-bottom:4px}
.permhead4.sub2{border-bottom:1px solid var(--line);padding-bottom:8px}
.permrow4{display:grid;grid-template-columns:1fr 70px 70px 70px 70px;gap:6px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.permrow4:last-child{border-bottom:0}
.permrow4.sub{background:#FBFBF9}
.permrow4.sub .permlabel{font-size:12.5px;font-weight:400;color:var(--t2);padding-left:6px}
.permrow4 .permtoggle{align-items:center}
@media(max-width:640px){.permhead4,.permrow4{grid-template-columns:1fr 48px 48px 48px 48px;gap:3px}}
.req{color:var(--rust);font-weight:600;margin-left:2px}
.lberr{color:var(--rust);font-size:12.5px;margin-top:10px;min-height:16px}
/* top-right "Logged in as" hat switcher */
.hatswitch{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line2);border-radius:10px;padding:7px 12px}
.hatswitch .hatlab{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--t3);white-space:nowrap}
.hatswitch select{font-family:inherit;font-size:13px;font-weight:500;padding:5px 8px;border:1px solid var(--line2);border-radius:7px;background:var(--jadebg);color:#0A5648;cursor:pointer}
.hatswitch select:focus{outline:2px solid var(--jade);outline-offset:1px}
.toast{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;padding:10px 18px;border-radius:8px;opacity:0;pointer-events:none;transition:.3s;z-index:60}
.toast.on{opacity:1}

@media(max-width:900px){
  .shell{flex-direction:column}.side{width:100%;flex:none;height:auto;position:static}

<script>
/* ============ IN-MEMORY STORE (seeded sample data) ============ */
const DB = {
  employees: {
    "E-5101":{id:"E-5101",name:"Rajat Babbar",fn:"Enabling",sub:"Human Resources",desig:"Lead",lvl:4,mgr:null,hipot:true,hcat:"Below Managers",loc:"Gurugram"},
    "E-5102":{id:"E-5102",name:"Ayushi Taneja",fn:"Enabling",sub:"Human Resources",desig:"Senior Associate",lvl:3,mgr:"E-5101",hipot:false,hcat:"",loc:"Gurugram"},
    "E-5103":{id:"E-5103",name:"Jahanvi Batra",fn:"Enabling",sub:"Human Resources",desig:"Junior Associate",lvl:1,mgr:"E-5101",hipot:false,hcat:"",loc:"Gurugram"},
    "E-5104":{id:"E-5104",name:"Manisha Naik",fn:"Enabling",sub:"Finance",desig:"Associate Lead",lvl:4,mgr:null,hipot:false,hcat:"",loc:"Gurugram"},
    "E-5105":{id:"E-5105",name:"Krati Srivastava",fn:"Enabling",sub:"Finance",desig:"Junior Associate",lvl:1,mgr:"E-5104",hipot:false,hcat:"",loc:"Gurugram"},
    "E-0001":{id:"E-0001",name:"HR System Admin",fn:"HR",sub:"HR",desig:"HR Admin",lvl:0,mgr:null,hipot:false,hcat:"",loc:"—"}
  },

  /* typed pairings: Rajat mentors his two reports */
  pairings:[
    {id:"P-001",mentee:"E-5102",mentor:"E-5101",type:"Career",status:"Active"},
    {id:"P-002",mentee:"E-5103",mentor:"E-5101",type:"Career",status:"Active"}
  ],

  /* targets — empty; add in-app */
  targets:[],

  /* next role + action plan — empty; set in-app */
  career:{},

  /* succession bench — empty */
  succession:[],

  ninebox:{},

  f360:{},

  certs:{},

  projects:{},

  swot:{},

  /* interaction log per pairing id — empty */
  interactions:{},

  kpi:{},

  /* access grants — HR admin only for now */
  grants:{
    "E-5104":{login:"Leadership",fnScope:"All",minLvl:0,tree:false,seeRisk:true},
    "E-0001":{login:"HR Admin",fnScope:"All",minLvl:0,tree:false,seeRisk:true}
  },

  config:{
    hipotDef:"Independent",
    empSeeBox:false,
    empSeeHipot:false,
    menteeSeeNotes:false,
    readinessSrc:"Manual",
    defaultApprover:"Line Manager",
    careerPathSelectable:true,
    approvalsPaused:false
  },

  /* ===== component permission registry =====
     every module + sub-component has { vis, edit } controlled by HR admin.
     vis=false -> hidden for non-admin; edit=false -> edit/add/update controls hidden for non-admin.
     Admin always sees & edits everything. */
  perms:{
    // employee modules
    "kpi":{vis:true,edit:true},
    "career":{vis:true,edit:true},
    "career.path":{vis:true,edit:true},        // path selection
    "career.milestone":{vis:true,edit:true},
    "career.readiness":{vis:true,edit:true},
    "learning":{vis:true,edit:true},
    "learning.actions":{vis:true,edit:true},   // 70:20:10 dev actions
    "learning.status":{vis:true,edit:true},    // status updates
    "hipot":{vis:true,edit:true},
    "hipot.targets":{vis:true,edit:true},
    "succ":{vis:true,edit:true},
    "succ.mine":{vis:true,edit:true},          // successors for my role
    "succ.iam":{vis:true,edit:true},           // roles I'm a successor for
    "analysis":{vis:true,edit:true},
    "analysis.ninebox":{vis:true,edit:true},
    "analysis.f360":{vis:true,edit:true},
    "analysis.certs":{vis:true,edit:true},
    "analysis.projects":{vis:true,edit:true},
    "analysis.swot":{vis:true,edit:true},
    // mentor modules
    "queue":{vis:true,edit:true},
    "mentees":{vis:true,edit:true},
    "interactions":{vis:true,edit:true},
    // leader modules
    "overview":{vis:true,edit:true},
    "hipots":{vis:true,edit:true},
    "succmap":{vis:true,edit:true},
    "nextroles":{vis:true,edit:true}
  },

  /* mentor-context permissions: what a MENTOR sees/edits on a mentee's learning page.
     Kept separate so HR can grant mentors different rights than the employee has on their own view. */
  permsMentor:{
    "kpi":{vis:true,edit:true},
    "career":{vis:true,edit:true},
    "career.path":{vis:true,edit:true},
    "career.milestone":{vis:true,edit:true},
    "career.readiness":{vis:true,edit:true},
    "learning":{vis:true,edit:true},
    "learning.actions":{vis:true,edit:true},
    "learning.status":{vis:true,edit:true},
    "hipot":{vis:true,edit:true},
    "hipot.targets":{vis:true,edit:true},
    "succ":{vis:true,edit:true},
    "succ.mine":{vis:true,edit:true},
    "succ.iam":{vis:true,edit:true},
    "analysis":{vis:true,edit:true},
    "analysis.ninebox":{vis:true,edit:true},
    "analysis.f360":{vis:true,edit:true},
    "analysis.certs":{vis:true,edit:true},
    "analysis.projects":{vis:true,edit:true},
    "analysis.swot":{vis:true,edit:true},
    "queue":{vis:true,edit:true},
    "mentees":{vis:true,edit:true},
    "interactions":{vis:true,edit:true}
  },

  /* learning plan actions — 70:20:10, per employee.
     edits route to the tagged mentor for approval; changelog holds the trail. */
  learningPlans:{
    "E-5101":{mentor:null,actions:[],changelog:[]},
    "E-5102":{mentor:"E-5101",actions:[],changelog:[]},
    "E-5103":{mentor:"E-5101",actions:[],changelog:[]},
    "E-5104":{mentor:null,actions:[],changelog:[]},
    "E-5105":{mentor:"E-5104",actions:[],changelog:[]}
  }
};

/* ============ helpers ============ */
const E = id => DB.employees[id];
const nm = id => (E(id)?E(id).name:id);
const initials = s => s.split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase();
const READINESS_OPTIONS = ["Ready now","6 to 12 Months","1 to 2 Year","2 to 3 Year","3+ Years"];
const RD_PC = {
  "Ready now":95,"6 to 12 Months":60,"1 to 2 Year":42,"2 to 3 Year":30,"3+ Years":15,
  // legacy labels kept for existing seed data
  "Ready Now":95,"Ready in 6-12 months":60,"Ready in 1-2 years":42,"Not ready but high potential":25,"Ready in 3+ years":15
};
const rdColor = r => {
  if(!r) return "amber";
  const s=String(r).toLowerCase();
  if(s.includes("ready now")) return "jade";
  if(s.includes("6")&&s.includes("12")) return "amber";
  if(s.includes("high potential")) return "rust";
  if(s.includes("3+")||s.includes("3 +")) return "rust";
  return "amber";
};
function menteesOf(mid){return DB.pairings.filter(p=>p.mentor===mid&&p.status==="Active");}
function pairingsOfMentee(eid){return DB.pairings.filter(p=>p.mentee===eid);}
function targetsOf(eid){return DB.targets.filter(t=>t.emp===eid);}
function reviewQueueFor(mid){
  const mm=new Set(menteesOf(mid).map(p=>p.mentee));
  return DB.targets.filter(t=>t.status==="Submitted for review"&&t.approver===mid&&mm.has(t.emp));
}
function subtree(rootId){
  const out=[];const stack=[rootId];
  while(stack.length){const cur=stack.pop();
    Object.values(DB.employees).forEach(e=>{if(e.mgr===cur){out.push(e.id);stack.push(e.id);}});}
  return out;
}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1900);}
function bar(pc,c){return `<div class="rail"><i class="f-${c}" style="width:${Math.round(pc)}%"></i></div>`;}
/* permission helpers — role-aware. Employee uses DB.perms; mentor context uses DB.permsMentor.
   "Mentor context" = a mentor editing a mentee's learning page (ROLE==='mentor' with a mentee's learning plan open). */
function permReg(){
  // when a mentor is viewing/editing a mentee's page, ACTOR is the mentee and ROLE is 'mentor'
  return (typeof ROLE!=="undefined" && ROLE==="mentor") ? DB.permsMentor : DB.perms;
}
function isVisible(key){ if(typeof IS_ADMIN!=="undefined"&&IS_ADMIN) return true; const p=permReg()[key]; return !p||p.vis!==false; }
function isEditable(key){ if(typeof IS_ADMIN!=="undefined"&&IS_ADMIN) return true; const p=permReg()[key]; return !!p&&p.edit!==false; }
/* active career path for a given employee (multi-path aware) */
function curPath(eid){
  const c=DB.career[eid]; if(!c||!c.paths||!c.paths.length) return null;
  const i=Math.min(c.selectedPath||0,c.paths.length-1);
  return c.paths[i];
}

<script>
/* ============ APP STATE ============ */
let ROLE="employee";
let ACTOR="E-5102";     // employee/mentor identity
let TAB="kpi";

const ROLE_ACTORS={
  employee:["E-5101","E-5102","E-5103","E-5104","E-5105"],
  mentor:["E-5101","E-5104"],
  leader:["E-5101"],
  hr:["E-0001"]
};
const NAVS={
  employee:[
    ["kpi","My KPI","ti-target-arrow"],
    ["career","My Career path","ti-stairs-up"],
    ["learning","My Learning Plan","ti-book"],
    ["hipot","HiPot targets","ti-rocket"],
    ["succ","Succession Planning","ti-users-group"],
    ["analysis","My Analysis","ti-chart-dots"]
  ],
  mentor:[
    ["mentees","My mentees","ti-users"],
    ["interactions","Interactions","ti-messages"]
  ],
  leader:[
    ["overview","Org overview","ti-layout-dashboard"],
    ["hipots","HiPots","ti-rocket"],
    ["succmap","Succession map","ti-sitemap"],
    ["nextroles","Next roles","ti-stairs-up"]
  ],
  hr:[
    ["master","Employee master","ti-database"],
    ["sections","Section visibility","ti-eye-cog"],
    ["config","Policy & config","ti-adjustments"],
    ["access","Access grants","ti-key"],
    ["integrity","Data integrity","ti-checkup"]
  ]
};
const TITLES={
  kpi:["My KPI","Where you stand against this year's targets."],
  career:["My Career path","Your ladder, next role and the actions required."],
  learning:["My Learning Plan","Your development milestone, readiness and the learning to get there."],
  hipot:["HiPot targets","Your accelerated development track. Update progress and submit for review."],
  succ:["Succession Planning","Who succeeds your role — and whose successor you are."],
  analysis:["My Analysis","Nine-box, 360, certifications, projects and SWOT."],
  queue:["Review queue","Progress updates from your mentees awaiting your approval."],
  mentees:["My mentees","Everyone you mentor, across all pairing types."],
  interactions:["Interactions","Session notes and the logged history per mentee."],
  overview:["Org overview","Top-down health of the talent you can see."],
  hipots:["HiPots","Every high-potential in scope and their live targets."],
  succmap:["Succession map","Critical roles, coverage and successor readiness."],
  nextroles:["Next roles","Where each person in your scope is heading."],
  master:["Employee master","The core employee record — the join key for every module. Edit or add people here."],
  sections:["Section visibility","Show or hide left-nav sections for each role. Admin always sees all."],
  config:["Policy & config","Org-wide talent decisions."],
  access:["Access grants","Who logs in as what, and what they can see."],
  integrity:["Data integrity","Referential checks across the sample data."]
};

/* ============ ROLE / NAV WIRING ============ */
function setRole(r){
  ROLE=r;
  document.querySelectorAll(".rolebtn").forEach(b=>b.classList.toggle("on",b.dataset.role===r));
  // Admin impersonates via ROLE_ACTORS; a real logged-in person keeps their own identity across hats.
  if(IS_ADMIN){ ACTOR=ROLE_ACTORS[r][0]; }
  else if(typeof CURRENT_EMP!=="undefined" && CURRENT_EMP){ ACTOR=CURRENT_EMP; }
  else { ACTOR=ROLE_ACTORS[r][0]; }
  TAB=NAVS[r][0][0];
  const wrap=document.getElementById("asWhoWrap");
  wrap.style.display = (r==="hr") ? "none" : "block";
  const sel=document.getElementById("asWho");
  const card=document.getElementById("asWhoCard");
  if(IS_ADMIN){
    // admin: real identity switcher via dropdown
    sel.style.display="block"; card.style.display="none";
    sel.innerHTML="";
    ROLE_ACTORS[r].forEach(id=>{const o=document.createElement("option");o.value=id;o.textContent=nm(id)+" — "+E(id).desig;sel.appendChild(o);});
    if(ACTOR && !ROLE_ACTORS[r].includes(ACTOR) && E(ACTOR)){const o=document.createElement("option");o.value=ACTOR;o.textContent=nm(ACTOR)+" — "+E(ACTOR).desig;sel.appendChild(o);}
    sel.value=ACTOR; sel.disabled=false;
    document.getElementById("asWhoLabel").textContent =
      r==="employee"?"Inspect employee":r==="mentor"?"Inspect mentor":"Inspect leader";
  }else{
    // real person: clean identity card, no dropdown
    sel.style.display="none"; card.style.display="block";
    document.getElementById("asWhoLabel").textContent="Your record";
  }
  buildNav();updateMeta();render();
}
function setActor(id){ACTOR=id;TAB=NAVS[ROLE][0][0];buildNav();updateMeta();render();}
function buildNav(){
  const nav=document.getElementById("nav");
  let h=`<div class="navlab">${ROLE==="hr"?"Administration":ROLE==="leader"?"Leadership view":ROLE==="mentor"?"Mentoring":"Your record"}</div>`;
  // Admin always sees all tabs; other roles only see sections HR left visible.
  const visTabs=NAVS[ROLE].filter(([id])=>ROLE==="hr"||isVisible(id));
  // if current TAB was hidden, fall back to first visible
  if(!visTabs.some(([id])=>id===TAB)) TAB=(visTabs[0]||NAVS[ROLE][0])[0];
  visTabs.forEach(([id,label,ic])=>{
    let dis=false,badge="";
    if(ROLE==="employee"&&id==="hipot"&&!E(ACTOR).hipot) dis=true;
    if(ROLE==="mentor"&&id==="queue"){const n=reviewQueueFor(ACTOR).length;if(n)badge=`<span class="badge-n">${n}</span>`;}
    h+=`<button class="tab ${id===TAB?"on":""}" ${dis?"disabled":""} onclick="go('${id}')">
      <span class="ic ti ${ic}"></span>${label}${badge}${dis?'<span class="lk">n/a</span>':""}</button>`;
  });
  nav.innerHTML=h;
}
function updateMeta(){
  if(ROLE==="hr"){return;}
  const e=E(ACTOR); if(!e) return;
  if(IS_ADMIN){
    // admin uses the dropdown; nothing extra to render
    return;
  }
  const card=document.getElementById("asWhoCard"); if(!card) return;
  let sub2="";
  if(ROLE==="mentor") sub2=`${menteesOf(ACTOR).length} mentees`;
  else if(ROLE==="leader"){const g=DB.grants[ACTOR];sub2=g?`scope: ${g.fnScope}, L${g.minLvl}+`:"";}
  else sub2=`${e.fn}${e.sub&&e.sub!==e.fn?" · "+e.sub:""}`;
  card.innerHTML=`<div class="idcard">
    <div class="idav">${initials(e.name)}</div>
    <div class="idmeta">
      <div class="idname">${e.name}</div>
      <div class="idrole">${e.desig}</div>
      <div class="idsub">${sub2}</div>
    </div>
  </div>`;
}
function go(t){TAB=t;buildNav();render();}

/* ============ MAIN RENDER DISPATCH ============ */
function render(){
  const[t,s]=TITLES[TAB]||["—","—"];
  document.getElementById("pgTitle").textContent=t;
  document.getElementById("pgSub").textContent=s;
  const host=document.getElementById("viewHost");
  const fn={
    kpi:vKPI,career:vCareer,learning:vLearning,hipot:vHipot,succ:vSucc,analysis:vAnalysis,
    queue:vQueue,mentees:vMentees,interactions:vInteractions,
    overview:vOverview,hipots:vHipots,succmap:vSuccMap,nextroles:vNextRoles,
    config:vConfig,access:vAccess,integrity:vIntegrity,sections:vSections,master:vMaster
  }[TAB];
  host.innerHTML=`<div class="view on">${fn?fn():"—"}</div>`;
}

/* ============ EMPLOYEE VIEWS ============ */
function vKPI(){
  const k=DB.kpi[ACTOR]||[];
  const cards=k.map(x=>`<div class="kpi"><div class="l">${x.n}</div><div class="v mono">${x.v}</div>${bar(x.pc,x.c)}</div>`).join("");
  const t=targetsOf(ACTOR).filter(x=>x.type==="Performance"||x.type==="HiPot");
  const lines=t.map(x=>`<div class="kline"><div class="nm">${x.title}<small>${x.desc}</small></div><div class="bar">${bar(x.progress,x.progress>=80?"jade":x.progress>=40?"amber":"rust")}</div><div class="pc mono">${x.progress}%</div></div>`).join("");
  return `${k.length?`<div class="kpis">${cards}</div>`:""}
    <div class="card"><h2>Objectives this cycle</h2><p class="hint">Tracked against your FY27 goal sheet.</p>${lines||'<div class="note">No objectives on record.</div>'}</div>`;
}
function vLearning(){
  const c=curPath(ACTOR);
  const eMile=canEditCareer()&&isEditable("career.milestone");
  const eRead=canEditCareer()&&isEditable("career.readiness");
  // Milestone + readiness — a live mirror of My Career path (same data, same editors)
  const echo = c ? `<div class="grid2">
      <div class="card"><h2 style="display:flex;align-items:center;justify-content:space-between">Next milestone
        ${eMile?`<button class="btn sm" onclick="editMilestone()"><span class="ti ti-pencil" style="font-size:13px"></span>Edit</button>`:""}
      </h2><p class="hint">Mirrors My Career path.</p>
        <div class="serif" style="font-size:20px;font-weight:600">${c.next}</div></div>
      <div class="card"><h2 style="display:flex;align-items:center;justify-content:space-between">Readiness
        ${eRead?`<button class="btn sm" onclick="editReadiness()"><span class="ti ti-pencil" style="font-size:13px"></span>Edit</button>`:""}
      </h2><p class="hint">Mirrors My Career path.</p>
        <div style="margin-top:8px"><span class="pill p-${rdColor(c.readiness)}" style="font-size:13px;padding:5px 14px">${c.readiness}</span></div></div>
    </div>`
    : `<div class="note" style="margin-bottom:15px">No career milestone on record yet — set one in My Career path and it will echo here.</div>`;

  return `${echo}
    ${learningPlanTable()}`;
}

/* 70:20:10 band metadata */
const BANDS={
  "70":{label:"Learning by Doing (70%)",short:"70% · On the job",cls:"p-jade",owner:"Mentee (reviewed by Mentor)",
    desc:"70% on the Job Experience: directly applying skills and knowledge in day-to-day work. This hands-on experience is crucial for deepening understanding and building competence. Maintained & tracked by the Mentee, reviewed by the Mentor."},
  "20":{label:"Mentorship / Coaching (20%)",short:"20% · Coaching",cls:"p-violet",owner:"Mentor",
    desc:"20% on Coaching and Mentoring: regular feedback, coaching and mentoring to enhance identified competencies. Maintained & tracked by the Mentor."},
  "10":{label:"L&D Trainings (10%)",short:"10% · Self-learning",cls:"p-amber",owner:"Mentee (with L&D team)",
    desc:"10% on Learning & Development: formal learning — courses, webinars, workshops, seminars — to keep expanding knowledge and staying relevant. Maintained & tracked by the Mentee in assistance with the L&D team."}
};
const IDEOLOGY_HTML=`<b>Altudo's 70:20:10 learning ideology</b><br><br>
A balanced blend of hands-on experience, mentorship and self-directed learning:<br>
• <b>70%</b> — doing the new role (hands-on application)<br>
• <b>20%</b> — mentorship and coaching<br>
• <b>10%</b> — self-directed L&amp;D (courses, webinars, workshops)<br><br>
Most learning happens through practical application while actively performing the new role; mentorship accelerates growth through feedback and guidance; and self-directed learning builds autonomy and accountability. Together they ensure holistic development driving individual and organizational success.`;

function fmtLADate(d){
  if(!d) return "";
  const p=String(d).split("-"); if(p.length!==3) return d;
  const M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const mi=parseInt(p[1],10)-1;
  return `${p[0].slice(2)}:${M[mi]||p[1]}:${p[2]}`;
}
function learningPlanTable(){
  const lp=DB.learningPlans[ACTOR];
  const menteesMentor = lp && (lp.mentor===ACTOR || (typeof CURRENT_EMP!=="undefined" && lp.mentor===CURRENT_EMP));

function vCareer(){

  // STEP 1 — path selector (hidden entirely if career.path not visible)

    ${lockNote}
    <div style="display:flex;gap:12px;flex-wrap:wrap">${pathCards}</div></div>` : "";

  const rungs=c.ladder.map((r,i)=>({r,i})).reverse().map(({r,i})=>{
    const cls=i<c.atIdx?"past":i===c.atIdx?"now":i===c.atIdx+1?"next":"";
    const bg=cls==="now"?"var(--ink)":cls==="next"?"#fff":"#F1F2EE";
    const col=cls==="now"?"#fff":cls==="next"?"#0A5648":"var(--t3)";
    const bd=cls==="next"?"1.5px dashed var(--jade)":"1px solid var(--line)";
    const you=cls==="now"?'<span style="font-size:9px;letter-spacing:.06em;text-transform:uppercase;background:#2FBFA5;color:#06281F;padding:2px 6px;border-radius:3px;font-weight:600;margin-left:auto">you</span>':'';
    const nextTag=cls==="next"?'<span style="font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--jade);margin-left:auto">next</span>':'';
    return `<div style="display:flex;align-items:center;gap:10px;padding:11px 13px;background:${bg};border:${bd};color:${col};border-radius:9px;margin-bottom:7px">
      <span class="mono" style="font-size:10px;opacity:.7;flex:0 0 26px">L${i+1}</span>
      <span style="font-size:12.5px;font-weight:${cls?"600":"400"};line-height:1.3">${r}</span>${you}${nextTag}</div>`;
  }).join("");

  const step2=`<div style="margin-top:5px"><h2 style="font-size:14px;margin:0 0 12px"><span class="mono" style="color:var(--jade);margin-right:8px">2</span>Next milestone &amp; readiness</h2>
    <div style="display:flex;gap:15px;align-items:flex-start;flex-wrap:wrap">
      <div class="card" style="flex:0 0 260px;margin-bottom:0;min-width:230px">
        <h2>Your ladder</h2><p class="hint">${c.name} · cohort ${cc.cohort}</p>${rungs}</div>
      <div style="flex:1;min-width:280px">
        <div class="card"><h2 style="display:flex;align-items:center;justify-content:space-between">Next milestone
          ${canEditMile?`<button class="btn sm" onclick="editMilestone()"><span class="ti ti-pencil" style="font-size:13px"></span>Edit</button>`:""}
        </h2><p class="hint">Agreed with your manager.</p>
          <div class="serif" style="font-size:21px;font-weight:600">${c.next}</div></div>
        <div class="card" style="margin-bottom:0"><h2 style="display:flex;align-items:center;justify-content:space-between">Readiness

  return step1+step2;

function canEditCareer(){
  if(IS_ADMIN) return true;
  if(ROLE==="employee") return DB.config.careerPathSelectable!==false;
  if(ROLE==="mentor"){
    const lp=DB.learningPlans[ACTOR];

function editMilestone(){
  const c=curPath(ACTOR); if(!c) return;
  const eligible=[];
  if(c.ladder[c.atIdx+1]) eligible.push({role:c.ladder[c.atIdx+1],kind:"Immediate next"});
  if(c.ladder[c.atIdx+2]) eligible.push({role:c.ladder[c.atIdx+2],kind:"Skip level"});
  const opts = eligible.length
    ? eligible.map(e=>`<option value="${e.role.replace(/"/g,'&quot;')}" ${c.next===e.role?"selected":""}>${e.role} — ${e.kind}</option>`).join("")
    : `<option>${c.next||"No higher rung available"}</option>`;
  const noMatch = c.next && !eligible.some(e=>e.role===c.next);
  document.getElementById("modalBody").innerHTML=`
    <h3>Edit next milestone</h3><div class="sub">${c.name} · only the immediate next or a skip-level rung.</div>
    <label>Next role</label>
    <select id="cmNext" style="width:100%;font-family:inherit;font-size:13px;padding:9px 11px;border:1px solid var(--line2);border-radius:8px">
      ${noMatch?`<option value="${(c.next||"").replace(/"/g,'&quot;')}" selected>${c.next} — current selection</option>`:""}
      ${opts}
    </select>
    <div class="note" style="margin-top:10px;font-size:12px">Targets are limited to one or two rungs above your current level (${c.ladder[c.atIdx]||"—"}).</div>
    <div class="foot"><button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn pri" onclick="saveMilestone()">Save</button></div>`;
  document.getElementById("modalBg").classList.add("on");
}
function saveMilestone(){

function nineBox(nb){
  const L=[["Under-performer","#F5F6F3"],["Effective","#F5F6F3"],["Trusted pro","var(--jadebg)"],
           ["Inconsistent","#F5F6F3"],["Core contributor","var(--jadebg)"],["High potential","var(--violetbg)"],
           ["Rising star","var(--amberbg)"],["Growth candidate","var(--violetbg)"],["Executive potential","var(--violetbg)"]];
  let g=`<div class="axl">Potential</div>`;
  for(let r=0;r<3;r++){for(let c=0;c<3;c++){
    const idx=(2-r)*3+c,cell=L[idx],hit=(nb.pot===3-r&&nb.perf===c+1);
    g+=`<div class="b9 ${hit?"hit":""}" style="background:${cell[1]}"><div class="t">${cell[0]}</div><div class="c">${hit?"you":""}</div></div>`;
  }}
  g+=`<div class="axb">Performance</div>`;
  return `<div class="box9">${g}</div>`;
}

function saveLA(id){
  const lp=DB.learningPlans[ACTOR];
  const title=document.getElementById("laTitle").value.trim();
  const band=document.getElementById("laBand").value;
  const start=document.getElementById("laStart").value;
  const end=document.getElementById("laEnd").value;
  const statusUpd=document.getElementById("laStatus").value.trim();
  const comment=(document.getElementById("laComment")?document.getElementById("laComment").value.trim():"");
  // all fields mandatory
  const missing=[];
  if(!title) missing.push("Action");
  if(!band) missing.push("70:20:10 band");
  if(!start) missing.push("Start date");
  if(!end) missing.push("End date");
  if(!statusUpd) missing.push("Status");
  if(start&&end&&end<start) missing.push("End date must be after start date");
  if(missing.length){
    const el=document.getElementById("laErr");
    if(el) el.textContent="Please complete: "+missing.join(", ");
    return;
  }
  const editorIsMentor = ROLE==="mentor";
  if(id){
    const a=lp.actions.find(x=>x.id===id);
    // did the approval-relevant fields change?
    const changed = a.title!==title || a.band!==band || (a.timeline.start||"")!==start || (a.timeline.end||"")!==end;
    const statusChanged = (a.update||"")!==statusUpd;
    const commentChanged = (a.comment||"")!==comment;
    a.title=title;a.band=band;a.timeline={start,end};a.comment=comment;
    if(statusChanged){ a.update=statusUpd; laLog(ACTOR, ACTOR, "status update", id, statusUpd?`Status: "${statusUpd}"`:"Cleared status update"); }
    if(commentChanged){ laLog(ACTOR, ACTOR, "comment", id, comment?`Comment: "${comment}"`:"Cleared comment"); }
    if(changed){
      if(approvalsPaused() && !editorIsMentor){
        // approvals frozen: keep prior status, don't route to Pending
        laLog(ACTOR, ACTOR, "edited", id, `Updated action while approvals paused; not routed. band ${band}; ${start||"?"}→${end||"?"}`);
        closeModal();render();buildNav();
        toast("Saved — approvals are paused, so this wasn't sent for review");
        return;
      }
      // approval-relevant edit -> re-route for approval (status alone does NOT)
      a.status = editorIsMentor ? "Approved" : "Pending";
      laLog(ACTOR, ACTOR, editorIsMentor?"edited+approved":"edited", id, `Updated action; band ${band}; ${start||"?"}→${end||"?"}`);
    }
    closeModal();render();buildNav();
    toast(changed ? (editorIsMentor?"Saved & approved":"Saved — sent to mentor for approval") : (statusChanged?"Status updated & logged":"No changes"));
  }else{
    if(approvalsPaused() && !editorIsMentor){
      lp.actions.push({id:"LA-"+(lp.actions.length+1+Math.floor(Math.random()*90)),title,band,timeline:{start,end},update:statusUpd,comment,status:"Draft"});
      laLog(ACTOR, ACTOR, "created", lp.actions[lp.actions.length-1].id, `Added action while approvals paused; kept as draft`);
      closeModal();render();buildNav();
      toast("Saved as draft — approvals are paused");
      return;
    }
    const newId="LA-"+(lp.actions.length+1+Math.floor(Math.random()*90));
    lp.actions.push({id:newId,title,band,timeline:{start,end},update:statusUpd,comment,status:editorIsMentor?"Approved":"Pending"});
    laLog(ACTOR, ACTOR, "created", newId, `Added action; band ${band}`);
    if(statusUpd) laLog(ACTOR, ACTOR, "status update", newId, `Status: "${statusUpd}"`);
    if(comment) laLog(ACTOR, ACTOR, "comment", newId, `Comment: "${comment}"`);
    closeModal();render();buildNav();
    toast(editorIsMentor?"Saved & approved":"Saved — sent to mentor for approval");
  }
}
function approveLA(eid,id,ok){
  if(approvalsPaused()){toast("Approvals are paused by HR");return;}
  const lp=DB.learningPlans[eid];const a=lp.actions.find(x=>x.id===id);
  a.status=ok?"Approved":"Draft";
  laLog(eid, ACTOR, ok?"approved":"returned", id, ok?"Approved":"Returned for revision");

let _bulkParsed=[];
function downloadEmpTemplate(){
  // build the template in-browser via SheetJS so it always matches the importer
  if(typeof XLSX==="undefined"){toast("Spreadsheet library still loading — try again");return;}
  const headers=["Full Name*","Designation*","Level*","Function","Sub-Function","Manager Employee ID","Location","HiPot (Y/N)"];
  const sample=[
    ["Priya Nair","Senior Associate",3,"Enabling","Human Resources","E-5101","Gurugram","N"],
    ["Arjun Rao","Associate Lead",4,"Enabling","Finance","E-5104","Gurugram","Y"]
  ];
  const ws=XLSX.utils.aoa_to_sheet([headers,...sample]);
  ws["!cols"]=headers.map(h=>({wch:Math.max(12,h.length+2)}));
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Employees");
  XLSX.writeFile(wb,"Employee_Bulk_Upload_Template.xlsx");
}
function parseBulkFile(ev){
  const file=ev.target.files&&ev.target.files[0]; if(!file) return;
  const err=document.getElementById("bulkErr"); err.textContent="";
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:"array"});
      const sheet=wb.Sheets["Employees"]||wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(sheet,{header:1,blankrows:false});
      if(!rows.length){err.textContent="The sheet looks empty.";return;}
      // find header row (first row containing 'Name')
      let hi=rows.findIndex(r=>r.some(c=>String(c||"").toLowerCase().includes("name")));
      if(hi<0)hi=0;
      const dataRows=rows.slice(hi+1);
      const parsed=[], errs=[];
      dataRows.forEach((r,i)=>{
        const name=String(r[0]||"").trim();
        const desig=String(r[1]||"").trim();
        const lvlRaw=r[2];
        if(!name&&!desig&&(lvlRaw===undefined||lvlRaw==="")) return; // skip blank line
        const lineNo=hi+2+i;
        if(!name||!desig||lvlRaw===undefined||lvlRaw===""){errs.push(`Row ${lineNo}: need Name, Designation, Level`);return;}
        const lvl=parseInt(lvlRaw,10);
        if(isNaN(lvl)){errs.push(`Row ${lineNo}: level "${lvlRaw}" isn't a number`);return;}
        const fn=String(r[3]||"Delivery").trim()||"Delivery";
        const sub=String(r[4]||"").trim()||fn;
        const mgr=String(r[5]||"").trim();
        if(mgr && !DB.employees[mgr]){errs.push(`Row ${lineNo}: manager ID "${mgr}" not found`);return;}
        const loc=String(r[6]||"").trim();
        const hipot=/^y/i.test(String(r[7]||"").trim());
        parsed.push({name,desig,lvl,fn,sub,mgr:mgr||null,loc,hipot});
      });
      _bulkParsed=parsed;
      const prev=document.getElementById("bulkPreview");
      if(errs.length){
        err.innerHTML=errs.slice(0,8).join("<br>");
        prev.innerHTML=`<div class="note" style="margin-top:8px">${parsed.length} valid row(s) found; fix the errors above (or import only the valid ones).</div>`;
      }else{
        prev.innerHTML=`<div class="note" style="margin-top:8px"><span class="ti ti-check" style="color:var(--jade)"></span> ${parsed.length} employee row(s) ready to import.</div>`;
      }
      document.getElementById("bulkCommitBtn").disabled = parsed.length===0;
    }catch(x){err.textContent="Couldn't read that file — is it a valid .xlsx?";}
  };
  reader.readAsArrayBuffer(file);
}
function commitBulk(){
  if(!_bulkParsed.length){document.getElementById("bulkErr").textContent="Nothing to import — choose a file first.";return;}
  let added=0,n=5100;
  _bulkParsed.forEach(p=>{
    while(DB.employees["E-"+n]) n++;
    const id="E-"+n; n++;
    DB.employees[id]={id,name:p.name,fn:p.fn,sub:p.sub,desig:p.desig,lvl:p.lvl,mgr:p.mgr,hipot:p.hipot,hcat:p.hipot?"—":"",loc:p.loc};
    added++;
  });
  _bulkParsed=[];
  closeModal();render();toast(added+" employee"+(added>1?"s":"")+" imported");
}

   LIVE SYNC — Excel (SharePoint) through ONE Power Automate flow
   ----------------------------------------------------------------------------
   Paste the single flow URL below and the portal goes live. Leave it blank and
   everything here is inert — the portal keeps running on its built-in demo data.

   The flow is one "When an HTTP request is received" (POST) trigger with a
   Switch on the "table" value in the body:
       {"table":"READ"}                                    -> returns every table
       {"table":"Career","key":"CR-001","fields":{...}}     -> writes one row
   Build steps: TalentPortal_PowerAutomate_Setup.md
   ========================================================================== */
const FLOW_URL = "https://defaultb9d69197ce1f49079545b307af2335.e9.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/05/workflows/56303ed863f74d35b2bbf8dc9f33d8cb/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=6AdJiQi_lY8oIZv6l_vpbh4ko62Z41HBl_efUr5q2IY";   // <-- paste the HTTP POST URL of your one flow

const SYNC_ON   = () => !!FLOW_URL;
const truthy    = v => String(v).trim().toUpperCase() === "TRUE";
let   LAST_SYNC = null;
let   SYNC_STATE = "off";   // off | loading | live | error

/* every call to Power Automate goes through here — one URL, one method */
function callFlow(payload){
  return fetch(FLOW_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain" },   // keeps it a CORS-simple request
    body: JSON.stringify(Object.assign({
      actor: (typeof CURRENT_EMP !== "undefined" && CURRENT_EMP) ? CURRENT_EMP : ACTOR,
      source: "Dashboard"
    }, payload))
  }).then(r=>{
    if(!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  });
}

/* ---------- status pill (bottom-left) ---------- */
function syncPill(){
  let el = document.getElementById("syncPill");
  if(!el){
    el = document.createElement("div");
    el.id = "syncPill";
    el.style.cssText = "position:fixed;left:14px;bottom:14px;z-index:60;font:500 11.5px/1 Inter,system-ui,sans-serif;"
      + "padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--t2);"
      + "box-shadow:0 2px 10px rgba(0,0,0,.07);cursor:pointer;display:flex;align-items:center;gap:7px";
    el.onclick = () => { if(SYNC_ON()) loadFromExcel(true); };
    document.body.appendChild(el);
  }
  const dot = c => '<span style="width:7px;height:7px;border-radius:50%;background:'+c+';display:inline-block"></span>';
  if(SYNC_STATE==="off")          el.innerHTML = dot("#B9BDB4") + "Demo data — not connected to Excel";
  else if(SYNC_STATE==="loading") el.innerHTML = dot("#E8A33D") + "Syncing with Excel\u2026";
  else if(SYNC_STATE==="error")   el.innerHTML = dot("#C8553D") + "Sync failed — click to retry";
  else el.innerHTML = dot("#2FBFA5") + "Live \u00b7 synced " + LAST_SYNC + " \u00b7 click to refresh";
}

/* ---------- READ: one POST with table:"READ" pulls every table ---------- */
async function loadFromExcel(manual){
  if(!SYNC_ON()){ SYNC_STATE="off"; syncPill(); return; }
  SYNC_STATE="loading"; syncPill();
  try{
    const d = await callFlow({ table:"READ" });

    /* -- 2. employees -------------------------------------------------- */
    if(Array.isArray(d.employees) && d.employees.length){
      DB.employees = {};
      d.employees.filter(e=>e.EmployeeID && String(e.RecordStatus||"Active")!=="Inactive").forEach(e=>{
        DB.employees[e.EmployeeID] = {
          id:e.EmployeeID, name:e.FullName, email:e.WorkEmail||"",
          fn:e.Function, sub:e.SubFunction, desig:e.Designation,
          lvl:Number(e.Level)||0, mgr:e.ManagerID||null,
          hipot:truthy(e.HiPot), hcat:e.HiPotCategory||"", loc:e.Location||"\u2014",
          mentorId:e.MentorID||"", role:e.PortalRole||"Employee"
        };
      });
    }

    /* -- pairings (drives mentor access) -------------------------------- */
    if(Array.isArray(d.pairings)){
      DB.pairings = d.pairings.filter(p=>p.PairingID).map(p=>({
        id:p.PairingID, mentee:p.MenteeID, mentor:p.MentorID,
        type:p.PairingType||"Career", status:p.Status||"Active"
      }));
    }

    /* -- 4. next role + readiness tenure -------------------------------- */
    if(Array.isArray(d.career)){
      DB.career = {};
      d.career.filter(c=>c.EmployeeID).forEach(c=>{
        const ladder = String(c.CareerLadder||"").split("|").map(s=>s.trim()).filter(Boolean);
        const at = Number(c.CurrentRungIndex);
        DB.career[c.EmployeeID] = { selectedPath:0, paths:[{
          name: c.PathName || "Career path",
          ladder: ladder,
          atIdx: isNaN(at) ? Math.max(0, ladder.indexOf(c.CurrentRole)) : at,
          next: c.NextRole || "",
          readiness: c.Readiness || "",
          _rowId: c.CareerID,
          _setBy: c.ReadinessSetBy || "",
          _review: c.ReadinessReviewDate || "",
          _approval: c.ApprovalStatus || "Pending" 
        }]};
      });
    }

    /* -- 3. tasks + comments -------------------------------------------- */
    DB.learningPlans = {};
    Object.keys(DB.employees).forEach(id=>{
      const p = DB.pairings.find(x=>x.mentee===id && x.status==="Active");
      DB.learningPlans[id] = { mentor: p ? p.mentor : null, actions:[], changelog:[] };
    });
    (d.actions||[]).filter(a=>a.ActionID).forEach(a=>{
      const lp = DB.learningPlans[a.EmployeeID]; if(!lp) return;
      if(!truthy(a.VisibleToMentee) && !IS_ADMIN && ROLE==="employee") return;   // row-level visibility
      lp.actions.push({
        id:a.ActionID, title:a.ActionTitle, band:String(a.Band),
        timeline:{start:a.StartDate||"", end:a.EndDate||""},
        status:a.ApprovalStatus||"Draft", update:a.StatusUpdate||"",
        comment:a.LatestComment||"",
        _visMentee: truthy(a.VisibleToMentee) ? "TRUE" : "FALSE",
        _visLead:   truthy(a.VisibleToLeadership) ? "TRUE" : "FALSE",
        _createdBy: a.CreatedBy||"", _createdOn: a.CreatedOn||""
      });
      if(a.MentorID && !lp.mentor) lp.mentor = a.MentorID;
    });
    (d.comments||[]).filter(c=>c.CommentID).forEach(c=>{
      const lp = DB.learningPlans[c.EmployeeID]; if(!lp) return;
      if(!truthy(c.VisibleToMentee) && !IS_ADMIN && ROLE==="employee") return;
      lp.changelog.push({ d:c.CreatedOn||"", by:c.AuthorID,
        tt:(c.AuthorRole||"Comment")+" \u00b7 "+(c.ActionID||""), tx:c.CommentText||"" });
    });

    /* -- 1. visibility + editor toggles --------------------------------- */
    (d.permissions||[]).filter(p=>p.PermissionKey).forEach(p=>{
      DB.perms[p.PermissionKey] = { vis:truthy(p.MenteeVisible), edit:truthy(p.MenteeEdit) };
      if(String(p.MentorVisible).toLowerCase() !== "n/a")
        DB.permsMentor[p.PermissionKey] = { vis:truthy(p.MentorVisible), edit:truthy(p.MentorEdit) };
    });
    (d.config||[]).filter(c=>c.SettingKey).forEach(c=>{
      const v = String(c.Value).trim().toUpperCase();
      DB.config[c.SettingKey] = v==="TRUE" ? true : v==="FALSE" ? false : c.Value;
    });

    LAST_SYNC = new Date().toTimeString().slice(0,5);
    SYNC_STATE = "live"; syncPill();
    if(CURRENT_EMP){ buildNav(); updateMeta(); render(); }
    if(manual) toast("Refreshed from Excel");
  }catch(err){
    console.error("[sync] read failed", err);
    SYNC_STATE = "error"; syncPill();
    if(manual) toast("Couldn't reach Excel \u2014 showing last loaded data");
  }
}

/* ---------- WRITE: same URL, the table name picks the Switch case ---------- */
function saveToExcel(table, key, fields, meta){
  if(!SYNC_ON()) return Promise.resolve();
  return callFlow(Object.assign({
    table: table, key: key || "", fields: fields || {}
  }, meta || {})).then(()=>{
    LAST_SYNC = new Date().toTimeString().slice(0,5);
    SYNC_STATE = "live"; syncPill();
  }).catch(err=>{
    console.error("[sync] write failed", table, key, err);
    SYNC_STATE = "error"; syncPill();
    toast("Saved on screen, but Excel didn't confirm \u2014 refresh to check");
  });
}

function newActionId(){
  const used = new Set();
  Object.values(DB.learningPlans).forEach(p => (p.actions||[]).forEach(x => used.add(x.id)));
  let id;
  do {
    id = "LA-" + Date.now().toString(36).slice(-5)
       + Math.floor(Math.random()*46656).toString(36).padStart(3, "0");

    VisibleToMentee:a._visMentee||"TRUE", VisibleToLeadership:a._visLead||"TRUE",
    MentorID:mentorId||"",
    CreatedBy:a._createdBy||(CURRENT_EMP||ACTOR), CreatedOn:a._createdOn||today(),
    LastUpdatedBy:CURRENT_EMP||ACTOR, LastUpdatedOn:today()
  };

const _saveLA = saveLA;
saveLA = function(id){
  const lp = DB.learningPlans[ACTOR];
  const snap = {};
  if(lp) lp.actions.forEach(a => snap[a.id] = JSON.stringify(a));
  _saveLA(id);
  if(!lp) return;
  lp.actions.forEach(a=>{
    const was = snap[a.id];
    if(was === JSON.stringify(a)) return;          // untouched
    const isNew = was === undefined;
    if(isNew){
      // the prototype's id is "LA-" + a number under ~95, which collides across
      // employees. ActionID is the key column, so give it a table-wide unique one.
      const oldId = a.id;
      a.id = newActionId();
      lp.changelog.forEach(l => { if(l.target === oldId) l.target = a.id; });
      a._createdBy = CURRENT_EMP||ACTOR; a._createdOn = today();
    }
    saveToExcel(isNew ? "ActionsNew" : "Actions", a.id,
      actionRow(a, ACTOR, lp.mentor), {changeType: isNew ? "Created" : "Updated"});

    // a changed comment is also filed as its own threaded comment row
    const prev = was ? (JSON.parse(was).comment||"") : "";
    if((a.comment||"") && (a.comment||"") !== prev){
      saveToExcel("Comments", "", {
        ActionID:a.id, EmployeeID:ACTOR, AuthorID:CURRENT_EMP||ACTOR,
        AuthorRole: ROLE==="mentor" ? "Mentor" : IS_ADMIN ? "HR Admin" : "Employee",
        CommentText:a.comment, VisibleToMentee:"TRUE", VisibleToLeadership:"FALSE",
        CreatedOn:today()
      }, {changeType:"Comment"});
    }
  });
};

const _approveLA = approveLA;
approveLA = function(eid, id, ok){
  _approveLA(eid, id, ok);
  const lp = DB.learningPlans[eid]; if(!lp) return;
  const a = lp.actions.find(x=>x.id===id); if(!a) return;
  saveToExcel("Actions", id, actionRow(a, eid, lp.mentor),
    {changeType: ok ? "Approved" : "Returned", field:"ApprovalStatus", newValue:a.status});
};

/* 4. next role + readiness tenure -------------------------------------------- */
function _careerRowId(){
  const c = curPath(ACTOR);
  return (c && c._rowId) ? c._rowId : ("CR-" + String(ACTOR).replace(/^E-/, ""));
}
/* no row on the sheet yet -> route to the CareerNew case, then remember the id */
function _careerTable(){
  const c = curPath(ACTOR);
  if(c && c._rowId) return "Career";
  if(c) c._rowId = "CR-" + String(ACTOR).replace(/^E-/, "");
  return "CareerNew";
}
function careerRow(){
  const c = curPath(ACTOR); if(!c) return {};
  return {
    CareerID:_careerRowId(), EmployeeID:ACTOR, PathName:c.name||"",
    CareerLadder:(c.ladder||[]).join("|"), CurrentRole:c.ladder[c.atIdx]||"",
    CurrentRungIndex:c.atIdx, NextRole:c.next||"",
    MilestoneType: c.next===c.ladder[c.atIdx+2] ? "Skip level" : "Immediate next",
    Readiness:c.readiness||"", ReadinessSetBy:c._setBy||"",
    ReadinessReviewDate:c._review||"", PathSelected:"TRUE",
    ApprovalStatus:c._approval||"Pending",
    LastUpdatedBy:CURRENT_EMP||ACTOR, LastUpdatedOn:today()
  };
}
const _saveReadiness = saveReadiness;
saveReadiness = function(){
  const c0 = curPath(ACTOR); const old = c0 ? c0.readiness : "";
  _saveReadiness();
  const c = curPath(ACTOR); if(!c) return;
  c._setBy = CURRENT_EMP||ACTOR;
  saveToExcel(_careerTable(), _careerRowId(), careerRow(),
    {changeType:"Updated", field:"Readiness", oldValue:old, newValue:c.readiness});
};

const _saveMilestone = saveMilestone;
saveMilestone = function(){
  const c0 = curPath(ACTOR); const old = c0 ? c0.next : "";
  _saveMilestone();
  const c = curPath(ACTOR); if(!c) return;
  saveToExcel(_careerTable(), _careerRowId(), careerRow(),
    {changeType:"Updated", field:"NextRole", oldValue:old, newValue:c.next});
};

const _selectPath = selectPath;
selectPath = function(i){
  _selectPath(i);
  const c = curPath(ACTOR); if(!c) return;
  saveToExcel(_careerTable(), _careerRowId(), careerRow(),
    {changeType:"Updated", field:"PathName", newValue:c.name});
};

/* pull fresh data the moment someone signs in ------------------------------- */
const _doLogin = doLogin;
doLogin = function(){
  _doLogin();
  if(CURRENT_EMP) loadFromExcel(false);
};

syncPill();

</script>
