}

/* Reports stored inside the file rather than linked. Browsers block navigating
   straight to a data: URL, so hand the bytes over as a Blob instead. */
function openEmbedded(b64, label, mime, filename){
  try{
    const bin = atob(b64);
    const arr = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([arr], {type: mime || "application/pdf"}));
    if(filename){
      /* Word files can't render in a tab, so hand them over as a download */
      const a = document.createElement("a");
      a.href = url; a.download = filename; a.click();
      toast("Downloading " + filename);
    }else{
      const win = window.open(url, "_blank", "noopener");
      if(!win) toast("Allow pop-ups to open " + label);
    }
    setTimeout(()=>URL.revokeObjectURL(url), 120000);
  }catch(err){
    console.error("[docs] couldn't open", label, err);
    toast("Couldn't open that document.");
  }
}
/* the archive is keyed on the person's name as it appears on the file */
function docKey(name){ return String(name||"").toLowerCase().replace(/[^a-z]/g,""); }
function hasEmbedded(name){ return !!((DB.docs||{})[docKey(name)]||{}).f360; }

/* "Aug \u2013 Dec 26" inside one year, "Aug 26 \u2013 Mar 27" across two.
   Drops the repeated year in the common case. */
function fmtRange(s,e){
  if(!s) return "\u2014";
  const ys=String(s).slice(0,4), ye=String(e||"").slice(0,4);
  const ms=fmtLAMonth(s), me=e?fmtLAMonth(e):"";
  if(!e) return `${ms} ${ys.slice(2)}`;
  return ys===ye ? `${ms} <span class="ar">\u2013</span> ${me} ${ye.slice(2)}`
                 : `${ms} ${ys.slice(2)} <span class="ar">\u2013</span> ${me} ${ye.slice(2)}`;
}
function fmtLAMonth(d){
  const p=String(d).split("-"); if(p.length!==3) return d;
  const M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return M[parseInt(p[1],10)-1]||p[1];
}
function fmtLADate(d){
  if(!d) return "";
  const p=String(d).split("-"); if(p.length!==3) return d;
  const M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const mi=parseInt(p[1],10)-1;
  return `${M[mi]||p[1]} ${p[0].slice(2)}`;
}
function sweepArchived(lp){
  /* the active plan must never hold an action whose status is "Archived" —
     wherever the row came from (Excel reload, import, direct edit), move it
     into the archive before rendering */
  if(!lp) return;
  lp.archive = lp.archive || [];
  for(let i=lp.actions.length-1;i>=0;i--){
    const a=lp.actions[i];
    const st=String(a.update||"").trim().toLowerCase();
    if(st==="deleted" || st==="archived"){
      lp.actions.splice(i,1);
      a.update="Deleted";
      if(!a._archivedOn) a._archivedOn = new Date().toISOString().slice(0,16).replace("T"," ");
      lp.archive.push(a);
    }
  }
}

async function downloadTemplate(){
  const notes = [
    ["Column","Required","Allowed values / format"],
    ["Action title","Yes","Any text"],
    ["Band","Yes","70, 20 or 10"],
    ["Start date","Yes","yyyy-mm-dd, e.g. 2026-08-01"],
    ["End date","Yes","yyyy-mm-dd, must not be before the start date"],
    ["Status update","No","Not started, Ongoing, Achieved, On Hold. Blank means Not started"],
    ["Comment","No","Any text"],
    ["",""],
    ["70","Learning by Doing","Stretch work, ownership, real delivery"],
    ["20","Mentorship / Coaching","Shadowing, coaching, feedback loops"],
    ["10","L&D Trainings","Courses, certifications, structured learning"]
  ];
  if(!await ensureXLSX()){                  // offline fallback
    const csv = [IMPORT_COLS.join(",")].concat(IMPORT_SAMPLE.map(r=>r.map(c=>`"${c}"`).join(","))).join("\n");
    dl(new Blob([csv],{type:"text/csv"}), "development-actions-template.csv");
    toast("Excel library unavailable \u2014 downloaded a CSV template instead.");
    return;
  }
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet([IMPORT_COLS].concat(IMPORT_SAMPLE));
  ws["!cols"] = [{wch:46},{wch:8},{wch:14},{wch:14},{wch:16},{wch:38}];
  XLSX.utils.book_append_sheet(wb, ws, "Actions");
  const wn = XLSX.utils.aoa_to_sheet(notes);
  wn["!cols"] = [{wch:18},{wch:10},{wch:64}];
  XLSX.utils.book_append_sheet(wb, wn, "How to fill this in");
  XLSX.writeFile(wb, "development-actions-template.xlsx");
}
function dl(blob, name){
  const u = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = u; a.download = name; a.click(); URL.revokeObjectURL(u);
}

const IMP_STATUS = ["Not started","Ongoing","Achieved","On Hold"];
/* older files / rows may still say "Not relevant" — treat it as On Hold */
const normLAStatus = v => { v = String(v||"").trim(); const l=v.toLowerCase();
  if(l==="not relevant") return "On Hold";
  if(l==="completed")    return "Achieved";
  if(l==="archived")     return "Deleted";
  return v; };
const isDate = v => /^\d{4}-\d{2}-\d{2}$/.test(v) && !isNaN(Date.parse(v));

/* Excel hands dates back as serial numbers unless they were typed as text,
   so normalise both shapes before validating. */
function cellDate(v){
  if(v === undefined || v === null || v === "") return "";
  if(typeof v === "number"){
    const d = new Date(Math.round((v - 25569) * 86400 * 1000));
    return isNaN(d) ? String(v) : d.toISOString().slice(0,10);
  }
  if(v instanceof Date) return v.toISOString().slice(0,10);
  return String(v).trim();
}

async function validateImport(inp){
  const f = inp.files && inp.files[0];
  const box = document.getElementById("impResult");
  IMPORT_ROWS = null; impReady(false);
  if(!f) { box.innerHTML = ""; return; }
  if(!await ensureXLSX()){
    box.innerHTML = impMsg("rust","The Excel library didn't load. Check your connection and reopen this dialogue.");
    return;
  }
  const fr = new FileReader();
  fr.onload = e => {
    let aoa;
    try{
      const wb = XLSX.read(new Uint8Array(e.target.result), {type:"array"});
      const ws = wb.Sheets[wb.SheetNames[0]];
      aoa = XLSX.utils.sheet_to_json(ws, {header:1, defval:""});
    }catch(err){
      box.innerHTML = impMsg("rust","Couldn't read that file. Use the template, saved as .xlsx or .csv.");
      return;
    }
    const errs = [], rows = [];
    if(!aoa.length){ box.innerHTML = impMsg("rust","The file is empty."); return; }

    const head = (aoa[0]||[]).map(x=>String(x).trim());
    const missing = IMPORT_COLS.filter(c => !head.includes(c));
    if(missing.length){
      box.innerHTML = impMsg("rust","These columns are missing or renamed: <b>"+missing.join(", ")+"</b>. Download the template again.");
      return;
    }
    const ix = c => head.indexOf(c);

    for(let r=1; r<aoa.length; r++){
      const row = aoa[r]; if(!row || row.every(c=>String(c).trim()==="")) continue;
      const ln = r+1;
      const title = String(row[ix("Action title")]||"").trim();
      const band  = String(row[ix("Band")]||"").trim().replace(/[^0-9]/g,"");
      const start = cellDate(row[ix("Start date")]);
      const end   = cellDate(row[ix("End date")]);
      let   upd   = String(row[ix("Status update")]||"").trim();
      const note  = String(row[ix("Comment")]||"").trim();

      if(!title)                    errs.push(`Row ${ln}: Action title is empty.`);
      if(!["70","20","10"].includes(band)) errs.push(`Row ${ln}: Band is "${row[ix("Band")]}" — must be 70, 20 or 10.`);
      if(!isDate(start))            errs.push(`Row ${ln}: Start date "${start||"(blank)"}" isn't yyyy-mm-dd.`);
      if(!isDate(end))              errs.push(`Row ${ln}: End date "${end||"(blank)"}" isn't yyyy-mm-dd.`);
      if(isDate(start)&&isDate(end)&&end<start) errs.push(`Row ${ln}: End date is before the start date.`);
      if(!upd) upd = "Not started";
      else{
        upd = normLAStatus(upd);
        const m = IMP_STATUS.find(s=>s.toLowerCase()===upd.toLowerCase());
        if(!m) errs.push(`Row ${ln}: Status update "${upd}" isn't one of ${IMP_STATUS.join(", ")}.`);
        else upd = m;
      }
      rows.push({title, band, start, end, update:upd, comment:note});
    }

    if(!rows.length && !errs.length){
      box.innerHTML = impMsg("amber","No data rows found — did you delete the examples without adding your own?");
      return;
    }
    if(errs.length){
      box.innerHTML = impMsg("rust",
        `<b>File rejected — ${errs.length} problem${errs.length>1?"s":""} found.</b> Nothing has been imported.`) +
        `<ul class="imperr">${errs.slice(0,12).map(x=>`<li>${x}</li>`).join("")}
         ${errs.length>12?`<li>\u2026and ${errs.length-12} more.</li>`:""}</ul>`;
      return;
    }
    IMPORT_ROWS = rows;
    box.innerHTML = impMsg("jade",`<b>${rows.length} action${rows.length>1?"s":""} ready to import.</b> Nothing is saved until you press Import.`) +
      `<ul class="impok">${rows.slice(0,6).map(r=>`<li><b>${r.title}</b> \u00b7 band ${r.band} \u00b7 ${r.start} \u2192 ${r.end}</li>`).join("")}
       ${rows.length>6?`<li>\u2026and ${rows.length-6} more.</li>`:""}</ul>`;
    impReady(true);
  };
  fr.readAsArrayBuffer(f);
}
function impMsg(c,html){ return `<div class="impmsg m-${c}">${html}</div>`; }
function impReady(on){
  const b = document.getElementById("impGo");
  if(!b) return;
  b.disabled = !on; b.style.opacity = on ? "1" : ".5";
}

function commitImport(){
  if(!IMPORT_ROWS || !IMPORT_ROWS.length) return;
  const lp = DB.learningPlans[ACTOR];
  if(!lp){ toast("No learning plan for this person."); return; }
  IMPORT_ROWS.forEach(r=>{
    const a = { id:newActionId(), title:r.title, band:r.band,
                timeline:{start:r.start, end:r.end},
                status:"Approved", update:r.update, comment:r.comment,
                _visMentee:"TRUE", _visLead:"TRUE",
                _createdBy:CURRENT_EMP||ACTOR, _createdOn:today() };
    lp.actions.push(a);
    laLog(ACTOR, ACTOR, "created", a.id, "Imported from Excel; band "+a.band);
    saveToExcel("ActionsNew", a.id, actionRow(a, ACTOR, lp.mentor), {changeType:"Imported"});
  });
  const c = IMPORT_ROWS.length;
  IMPORT_ROWS = null;
  closeModal(); render();
  toast(c+" action"+(c>1?"s":"")+" imported");
}

/* Quarters of the Indian financial year. Add to this list as the plan rolls on. */
const HP_QUARTERS = ["JAS 26","OND 26","JFM 27"];
const HP_STATUS   = ["Not Started","Ongoing","Achieved"];
const HP_STCOL    = {"Not Started":"grey","Ongoing":"amber","Achieved":"jade"};

function normTarget(t){
  return { id:t.id||"", emp:t.emp||"", okr:t.okr||"", okrIdx:t.okrIdx,
           initiative:t.initiative||"", focus:t.focus||"",
           target:t.target||"", timeline:t.timeline||"", comments:t.comments||"",
           status:t.status||"Not Started", selfFb:t.selfFb||"", mentorFb:t.mentorFb||"" };
}
/* HiPot plans are authored centrally in the FY27 Hi-Pot Plan projects and
   mirrored here, so neither the mentee nor the mentor edits the plan itself.
   The one thing they move is Status. HR Admin keeps full edit so a record can
   still be corrected in the portal. */
/* Admin edit follows the hat, not the account. An HR Admin who has switched
   "View as" to Mentor is checking what a mentor sees, so showing them Add
   initiative and per-column editing there is misleading - and it contradicted
   the "viewing as mentor" line at the top of the page. */
function canEditOwnTarget(eid){
  return isEditable("hipot.targets") && IS_ADMIN && ROLE === "hr";
}
/* The plan stays locked, but the two assessment fields are the pair's own work:
   the mentee writes Self feedback, the mentor writes Mentor feedback, and HR
   Admin can correct either. Kept because the learning-plan side still calls it. */
function canEditMentorFb(eid){
  if(!isEditable("hipot.targets")) return false;
  if(IS_ADMIN) return true;
  return ROLE === "mentor" || (typeof _mentorReturn !== "undefined" && !!_mentorReturn);

/* Asana plan titles and the employee master don't always spell a name the same
   way - "Tamizehndi V" on the plan is "Tamizhendhi V" on the record. Fall back
   to closest spelling, but only when the match is close AND clearly better than
   any runner-up, and flag it so a human confirms rather than trusting it. */
function _lev(a,b){
  const m=b.length, n=a.length;
  let prev=Array.from({length:n+1},(_,j)=>j), cur=new Array(n+1);
  for(let i=1;i<=m;i++){
    cur[0]=i;
    for(let j=1;j<=n;j++)
      cur[j] = b[i-1]===a[j-1] ? prev[j-1] : 1+Math.min(prev[j-1],prev[j],cur[j-1]);
    const t=prev; prev=cur; cur=t;
  }
  return prev[n];
}
const PLAN_MIN_SIM = 0.72, PLAN_MARGIN = 0.10;
/* First names must match EXACTLY, unless both are long. "Ajit" and "Amit"
   differ by one letter out of four and are plainly different people; so are
   "Krati" and "Ravi". A long name like "Tamizhendhi" vs "Tamizehndi" can lose
   a letter to a typo and still be the same person, because there's enough of
   it left to be sure. Short names carry no such redundancy. */
const PLAN_FIRST_FUZZY_MIN_LEN = 8, PLAN_FIRST_FUZZY_SIM = 0.72;

function firstNameMatches(a, b){
  if(!a || !b) return false;
  if(a === b) return true;
  if(Math.min(a.length, b.length) < PLAN_FIRST_FUZZY_MIN_LEN) return false;
  return (1 - _lev(a,b)/Math.max(a.length,b.length)) >= PLAN_FIRST_FUZZY_SIM;
}

/* The whole-name score alone isn't safe: "Krati Shrivastava" and
   "Ravi Srivastava" score 0.81 because the surnames are nearly identical, and
   the surname is the long part so it dominates. The first name is what
   actually tells two people apart, so it has to clear the bar on its own. */
function _firstName(s){ return String(s||"").trim().split(/\s+/)[0] || ""; }

/* HR can pin a plan to a person when the names are too far apart for the
   matcher to link safely - "Mandip Sinh" on the plan, "Mandipsinh Chavda" on
   the record. Stored on the Config sheet as planlink:<plankey> = EmployeeID so
   it survives a re-sync and doesn't need the spellings to be fixed upstream. */
function planLinkFor(eid){
  const pre = "planlink:";
  const cfg = DB.config || {};
  for(const k in cfg){
    if(k.indexOf(pre)===0 && String(cfg[k])===String(eid)) return k.slice(pre.length);
  }
  return null;
}
function setPlanLink(planKey, eid){
  DB.config = DB.config || {};
  const k = "planlink:" + planKey;
  // one plan to one person: drop any previous holder of this plan
  if(!eid) delete DB.config[k]; else DB.config[k] = eid;
  saveToExcel("Config", k, { SettingKey:k, Value: eid || "" }, {changeType:"Updated", field:k, newValue:eid||"(cleared)"});
  seedPlanTargets();
  toast(eid ? "Linked to " + nm(eid) : "Link removed");
  render();
}

function matchPlanKey(name, eid){
  /* a manual link wins over anything the matcher would work out */
  if(eid){
    const pinned = planLinkFor(eid);
    if(pinned && (DB.hipotPlans||{})[pinned]) return { key:pinned, exact:true, pinned:true };
  }
  const key = docKey(name||"");
  if(!key || !DB.hipotPlans) return null;
  /* a plan pinned to someone else is off the table */
  const takenBy = {};
  Object.keys(DB.config||{}).forEach(k=>{
    if(k.indexOf("planlink:")===0) takenBy[k.slice(9)] = String(DB.config[k]);
  });
  if(takenBy[key] && (!eid || takenBy[key]!==String(eid))) return null;
  if(DB.hipotPlans[key]) return { key:key, exact:true };
  const first = docKey(_firstName(name));
  const scored = Object.keys(DB.hipotPlans).map(k=>{
    const pn = (DB.hipotPlans[k]||{}).n || k;
    const pf = docKey(_firstName(pn));
    return { k:k, sim: 1 - _lev(key,k)/Math.max(key.length,k.length), ok:firstNameMatches(first,pf) };
  }).filter(x=>x.ok && !takenBy[x.k])   // different first name, or already pinned elsewhere
    .sort((a,b)=>b.sim-a.sim);
  const best = scored[0], second = scored[1];
  if(!best || best.sim < PLAN_MIN_SIM) return null;
  if(second && (best.sim - second.sim) < PLAN_MARGIN) return null;
  return { key:best.k, exact:false, sim:best.sim };
}
function hipotPlanFor(eid){
  const m = matchPlanKey((DB.employees[eid]||{}).name, eid);
  if(!m) return null;
  const p = DB.hipotPlans[m.key];
  return p ? Object.assign({}, p, {_exact:m.exact, _sim:m.sim}) : null;
}
function planMatches(){
  const out = {};
  Object.values(DB.employees||{}).forEach(e=>{
    const m = matchPlanKey(e.name, e.id);
    if(m && !out[m.key]) out[m.key] = { emp:e.name, exact:m.exact, sim:m.sim };
  });
  return out;
}
function unmatchedPlans(){
  const hit = planMatches();
  return Object.keys(DB.hipotPlans||{}).filter(k=>!hit[k])
    .map(k=>({key:k, name:(DB.hipotPlans[k]||{}).n || k}));
}
/* Only the notes - career values sit in the milestone card above, initiatives

function hipotPlanCard(eid){

      Plans are matched by name against the Hi-Pot Plan projects \u2014 if they should have one,
      the name on their record and the name on the plan don't match.</div>`;
  return p._exact===false ? `<div class="note" style="border-color:var(--amber);margin-bottom:13px">
      <b>Matched on a close name, not an exact one.</b> This plan is filed under
      <b>${escH(p.n)}</b> and the record says <b>${escH(nm(eid))}</b>. Worth confirming it's the same person
      before acting on it.</div>` : "";
}

/* Keyed on the EMPLOYEE, not the plan. Plan-keyed ids collided whenever two
   employee records matched one plan - the second person got no rows at all,
   because the ids were already taken. EmployeeIDs contain slashes
   (ALT/IND/5697) so they're flattened. */
function planTargetId(eid, n, k){
  return "HP-" + String(eid).replace(/[^a-z0-9]+/gi,"").slice(0,20) + "-" + (n+1) + "-" + (k+1);
}
/* One target row per initiative - the subtask is the unit of work, so it carries
   the status. An OKR with no initiatives still gets one row so nothing vanishes. */
function seedPlanTargets(){
  if(!DB.hipotPlans) return;
  DB.targets = DB.targets || [];
  const byId = {};
  DB.targets.forEach(t=>{ byId[t.id] = true; });
  Object.keys(DB.employees||{}).forEach(eid=>{
    const m = matchPlanKey((DB.employees[eid]||{}).name, eid);
    if(!m) return;
    const key = m.key, p = DB.hipotPlans[key];
    (p.t||[]).forEach((okr,n)=>{
      const inits = (okr.m && okr.m.length) ? okr.m : [[okr.q||"", ""]];
      inits.forEach((ini,k)=>{
        const id = planTargetId(eid, n, k);
        if(byId[id]) return;
        DB.targets.push({
          id:id, emp:eid, okr:okr.i, okrIdx:n, focus:okr.f||"",
          initiative: ini[1] || okr.i, timeline: ini[0] || okr.q || "",
          status:"Not Started", _fromPlan:true
        });
      });
    });
  });
}

/* An OKR has no status of its own - it's whatever its initiatives add up to. */
function rollUpStatus(rows){
  if(!rows.length) return "Not Started";
  if(rows.every(r=>r.status==="Achieved")) return "Achieved";
  if(rows.some(r=>r.status && r.status!=="Not Started")) return "Ongoing";
  return "Not Started";
}

/* Comment thread per OKR. Filed on the Comments sheet against the first

/* Threads hang off an anchor string: an initiative's target id, or

function postComment(eid, anchor, label){

/* Quarter filter for the targets list. Kept in a variable rather than the URL

let HP_QFILTER = "";

function hipotBody(eid){

      ${count?`<b>${count}</b>`:""}</button>`;

function saveTarget(eid, tid){
  const mine = canEditOwnTarget(eid), mfb = canEditMentorFb(eid);
  const prev = tid ? targetsOf(eid).map(normTarget).find(x=>x.id===tid) : normTarget({});
  const g = id => (document.getElementById(id).value||"").trim();
  const rec = {
    id: tid || ("HT-" + Date.now().toString(36).slice(-5) + Math.floor(Math.random()*1296).toString(36).padStart(2,"0")),
    emp: eid,
    initiative: mine ? g("tgInit")   : prev.initiative,
    focus:      mine ? g("tgFocus")  : prev.focus,
    target:     mine ? g("tgTarget") : prev.target,
    timeline:   mine ? g("tgTime")   : prev.timeline,
    comments:   mine ? g("tgComm")   : prev.comments,
    status:     mine ? g("tgStat")   : prev.status,
    selfFb:     mine ? g("tgSelf")   : prev.selfFb,
    mentorFb:   mfb  ? g("tgMfb")    : prev.mentorFb
  };
  if(!rec.initiative){
    const e=document.getElementById("tgErr");
    if(e) e.textContent="Give the initiative a name.";
    else toast("Give the initiative a name.");
    return;
  }

  const at = DB.targets.findIndex(x=>x.id===rec.id);
  if(at>=0) DB.targets[at] = rec; else DB.targets.push(rec);

  saveToExcel(tid ? "HipotTargets" : "HipotTargetsNew", rec.id, {
    TargetID:rec.id, EmployeeID:eid, Initiative:rec.initiative, FocusArea:rec.focus,
    Target:rec.target, Timeline:rec.timeline, Comments:rec.comments, Status:rec.status,
    SelfFeedback:rec.selfFb, MentorFeedback:rec.mentorFb,
    UpdatedBy:CURRENT_EMP||ACTOR, UpdatedOn:today()
  }, {changeType: tid?"Updated":"Created"});

  closeModal();
  if(typeof _mentorReturn!=="undefined" && _mentorReturn) openMenteeHipot(eid); else render();
  toast("Saved");
}

function laLog(eid,by,act,target,note){
  const lp=DB.learningPlans[eid];if(!lp)return;
  const ts=new Date().toISOString().slice(0,16).replace("T"," ");
  // record who actually made the change: the logged-in person (mentor when editing a mentee), else the passed id
  const actor=(typeof CURRENT_EMP!=="undefined"&&CURRENT_EMP&&!IS_ADMIN)?CURRENT_EMP:by;
  lp.changelog.push({ts,by:actor,act,target,note});
  if(lp.changelog.length>100) lp.changelog=lp.changelog.slice(-100); // keep last 100
  /* persist the log entry to the Comments sheet (AuthorRole "log:<act>") so the
     change log survives refreshes. Plain comments are filed separately by the
     save hook, so skip those here to avoid duplicates. */
  if(act!=="comment" && typeof saveToExcel==="function"){
    saveToExcel("Comments","",{ActionID:target||"", EmployeeID:eid, AuthorID:actor,
      AuthorRole:"log:"+act, CommentText:note||"", VisibleToMentee:"TRUE",
      VisibleToLeadership:"TRUE", CreatedOn:ts}, {changeType:"Comment"});
  }
}

function saveLA(id){
  const lp=DB.learningPlans[ACTOR];
  const title=document.getElementById("laTitle").value.trim();
  const band=document.getElementById("laBand").value;
  const start=document.getElementById("laStart").value;
  const end=document.getElementById("laEnd").value;
  const statusUpd=document.getElementById("laStatus").value.trim();
  const comment=(document.getElementById("laComment")?document.getElementById("laComment").value.trim():"");
  const priority=(document.getElementById("laPriority")?document.getElementById("laPriority").value:"");
  const outcome=(document.getElementById("laOutcome")?document.getElementById("laOutcome").value.trim():"");
  // all fields mandatory
  const missing=[];
  if(!title) missing.push("Action");
  if(!band) missing.push("70:20:10 band");
  if(!start) missing.push("Start date");
  if(!end) missing.push("End date");
  if(!statusUpd) missing.push("Status");
  if(start&&end&&end<start) missing.push("End date must be after start date");
  if(missing.length){
    const el=document.getElementById("laErr");
    if(el) el.textContent="Please complete: "+missing.join(", ");
    return;
  }
  const editorIsMentor = ROLE==="mentor";
  if(id){
    const a=lp.actions.find(x=>x.id===id);
    // did the approval-relevant fields change?
    const changed = a.title!==title || a.band!==band || (a.timeline.start||"")!==start || (a.timeline.end||"")!==end;
    const statusChanged = (a.update||"")!==statusUpd;
    const commentChanged = (a.comment||"")!==comment;
    const priorityChanged = (a.priority||"")!==priority;
    const outcomeChanged  = (a.outcome||"")!==outcome;
    a.title=title;a.band=band;a.timeline={start,end};a.comment=comment;
    a.priority=priority;a.outcome=outcome;
    if(priorityChanged){ laLog(ACTOR, ACTOR, "edited", id, priority?`Priority set to P${priority}`:"Priority cleared"); }
    if(outcomeChanged){ laLog(ACTOR, ACTOR, "edited", id, outcome?`Expected outcome: "${outcome.slice(0,120)}"`:"Expected outcome cleared"); }
    if(statusChanged){ a.update=statusUpd; laLog(ACTOR, ACTOR, "status update", id, statusUpd?`Status: "${statusUpd}"`:"Cleared status update"); }
    if(commentChanged){ laLog(ACTOR, ACTOR, "comment", id, comment?`Comment: "${comment}"`:"Cleared comment"); }
    if(changed){
      if(approvalsPaused() && !editorIsMentor){
        // approvals frozen: keep prior status, don't route to Pending
        laLog(ACTOR, ACTOR, "edited", id, `Updated action while approvals paused; not routed. band ${band}; ${start||"?"}→${end||"?"}`);
        closeModal();render();buildNav();
        toast("Saved — approvals are paused, so this wasn't sent for review");
        return;
      }
      a.status = "Approved";   // direct change, no review step
      laLog(ACTOR, ACTOR, "edited", id, `Updated action; band ${band}; ${start||"?"}→${end||"?"}`);
    }
    closeModal();render();buildNav();
    toast(changed ? "Saved" : ((statusChanged||commentChanged||priorityChanged||outcomeChanged)?"Saved & logged":"No changes"));
  }else{
    if(approvalsPaused() && !editorIsMentor){
      lp.actions.push({id:"LA-"+(lp.actions.length+1+Math.floor(Math.random()*90)),title,band,timeline:{start,end},update:statusUpd,comment,priority,outcome,status:"Draft",origin:_pendingOrigin||"General"});
      laLog(ACTOR, ACTOR, "created", lp.actions[lp.actions.length-1].id, `Added action while approvals paused; kept as draft`);
      closeModal();render();buildNav();
      toast("Saved as draft — approvals are paused");
      return;
    }
    const newId="LA-"+(lp.actions.length+1+Math.floor(Math.random()*90));
    lp.actions.push({id:newId,title,band,timeline:{start,end},update:statusUpd,comment,priority,outcome,status:"Approved",origin:_pendingOrigin||"General"});
    laLog(ACTOR, ACTOR, "created", newId, `Added action; band ${band}`);
    if(statusUpd) laLog(ACTOR, ACTOR, "status update", newId, `Status: "${statusUpd}"`);
    if(comment) laLog(ACTOR, ACTOR, "comment", newId, `Comment: "${comment}"`);
    closeModal();render();buildNav();
    toast("Saved");
  }
}

     pulled in from tblComments. Normalise before rendering either. */
  const norm = x => ({
    act:   x.act  || "comment",

    ts:    x.ts   || x.d  || "",
    by:    x.by   || "",
    note:  x.note || x.tx || ""
  });
  const log=(lp?lp.changelog:[]).map(norm).slice().reverse();
  const icon={created:"ti-plus",edited:"ti-pencil","edited+approved":"ti-check",
              approved:"ti-check",returned:"ti-arrow-back-up",comment:"ti-message",
              deleted:"ti-trash",archived:"ti-archive",restored:"ti-restore"};
  document.getElementById("modalBody").innerHTML=`
    <h3>Change &amp; approval log</h3>
    <div class="sub">Every edit, comment and approval on this learning plan \u2014 newest first.</div>
    ${log.length?`<ul class="timeline" style="margin-top:10px">${log.map(x=>`
      <li><div class="tt"><span class="ti ${icon[x.act]||"ti-point"}" style="font-size:13px;vertical-align:-1px"></span>
        ${x.act} \u00b7 ${x.target}
        <span style="color:var(--t3);font-weight:400">${x.ts?"\u00b7 "+x.ts+" ":""}${x.by?"\u00b7 "+nm(x.by):""}</span></div>
        <div class="tx">${String(x.note||"").replace(/</g,"&lt;")}</div></li>`).join("")}</ul>`
      :'<div class="note">No changes logged yet.</div>'}
    <div class="foot"><button class="btn" onclick="closeModal()">Close</button></div>`;
  openModal();
}
/* ---- delete → archive → restore. Every step is written to the change log. ---- */
function deleteLA(id){ doDeleteLA(id); }
/* re-render the plan without losing context: a mentor inside a mentee's plan
   stays on the mentee's page instead of being dumped back onto their own */
function refreshPlanView(){
  if(typeof _mentorReturn!=="undefined" && _mentorReturn && typeof openMenteeLearning==="function"){
    openMenteeLearning(ACTOR);
  } else {
    render(); buildNav();
  }
}
function doDeleteLA(id){
  const lp=DB.learningPlans[ACTOR]; if(!lp) return;
  const i=lp.actions.findIndex(x=>x.id===id); if(i<0) return;
  const a=lp.actions.splice(i,1)[0];
  lp.archive=lp.archive||[];
  a._archivedOn=new Date().toISOString().slice(0,16).replace("T"," ");
  a._archivedBy=(typeof CURRENT_EMP!=="undefined"&&CURRENT_EMP&&!IS_ADMIN)?CURRENT_EMP:ACTOR;
  /* archiving also changes the status: remember the old one so restore can bring it back */
  a._prevUpdate = a.update || "";
  a.update = "Deleted";
  lp.archive.push(a);
  laLog(ACTOR, ACTOR, "deleted", id, `Deleted "${a.title}" \u2014 status set to Deleted${a._prevUpdate?` (was "${a._prevUpdate}")`:""}`);
  /* goes to Power Automate as a plain status update ("Updated"), so the
     existing flow writes StatusUpdate = "Archived" with no flow changes */
  if(typeof saveToExcel==="function"&&typeof actionRow==="function")
    saveToExcel("Actions", id, actionRow(a, ACTOR, lp.mentor),
      {changeType:"Updated", field:"StatusUpdate", oldValue:a._prevUpdate, newValue:"Deleted"});
  closeModal();refreshPlanView();
  toast(`"${a.title}" deleted \u2014 moved to the archive & logged`);
}
function restoreLA(id){
  const lp=DB.learningPlans[ACTOR]; if(!lp||!lp.archive) return;
  const i=lp.archive.findIndex(x=>x.id===id); if(i<0) return;
  const a=lp.archive.splice(i,1)[0];
  delete a._archivedOn; delete a._archivedBy; delete a._deletedOn; delete a._deletedBy;
  const prev = a._prevUpdate || ""; delete a._prevUpdate;
  a.update = prev;
  lp.actions.push(a);
  laLog(ACTOR, ACTOR, "restored", id, `Restored "${a.title}" from the archive${prev?` \u2014 status back to "${prev}"`:""}`);
  if(typeof saveToExcel==="function"&&typeof actionRow==="function")
    saveToExcel("Actions", id, actionRow(a, ACTOR, lp.mentor),
      {changeType:"Updated", field:"StatusUpdate", oldValue:"Deleted", newValue:prev});
  refreshPlanView();showArchiveLA();
  toast("Action restored to the plan \u2014 logged");
}
function showArchiveLA(){
  const lp=DB.learningPlans[ACTOR];
  sweepArchived(lp);
  const menteesMentor = lp && (lp.mentor===ACTOR || (typeof CURRENT_EMP!=="undefined" && lp.mentor===CURRENT_EMP));
  const canEdit = (ROLE==="employee" || (ROLE==="mentor" && menteesMentor) || IS_ADMIN) && isEditable("learning.actions");
  const arch=(lp&&lp.archive)?lp.archive.slice().reverse():[];
  const rows=arch.length?arch.map(a=>{
    const b=BANDS[a.band]||{};
    const tl=a.timeline&&a.timeline.start?fmtRange(a.timeline.start,a.timeline.end):"\u2014";
    return `<tr>
      <td><div style="font-weight:500">${a.title}</div>
        <div style="font-size:12px;color:var(--t2);margin-top:4px"><span class="pill ${b.cls||'p-grey'}" style="margin-right:6px">${b.short||a.band}</span><span class="tlrange">${tl}</span> \u00b7 <span class="pill p-grey">Deleted</span>${a._prevUpdate?` <span style="color:var(--t3)">was ${a._prevUpdate}</span>`:""}</div>
        <div style="font-size:11px;color:var(--t3);margin-top:4px">Deleted ${a._archivedOn||a._deletedOn||"\u2014"}${(a._archivedBy||a._deletedBy)?" \u00b7 by "+nm(a._archivedBy||a._deletedBy):""}</div></td>
      <td style="text-align:right;vertical-align:middle;white-space:nowrap;width:90px">${canEdit?`<button class="btn sm" onclick="restoreLA('${a.id}')">Restore</button>`:""}</td></tr>`;
  }).join(""):`<tr><td colspan="2"><div class="note">Nothing in the archive. Deleted actions land here and can be restored to the plan.</div></td></tr>`;
  document.getElementById("modalBody").innerHTML=`
    <h3>Deleted actions</h3>
    <div class="sub">${nm(ACTOR)} \u00b7 deleted development actions \u2014 every delete and restore is in the change log.</div>
    <table class="tbl" style="margin-top:10px"><thead><tr><th>Action</th><th style="width:90px"></th></tr></thead><tbody>${rows}</tbody></table>
    <div class="foot"><button class="btn" onclick="closeModal()">Close</button></div>`;
  openModal();
}
document.getElementById("modalBg").addEventListener("click",e=>{if(e.target.id==="modalBg")closeModal();});

<script>
/* ============ MENTOR VIEWS ============ */
function vQueue(){
  const paused=DB.config.approvalsPaused===true;
  const q=reviewQueueFor(ACTOR);
  if(!q.length) return `<div class="empty"><div class="ei ti ti-inbox"></div><h3>Nothing awaiting review</h3><p>When a mentee submits a progress update, it lands here for your approval.</p></div>`;

    <td><div class="who"><span class="av">${initials(nm(t.emp))}</span><div><div style="font-weight:500">${nm(t.emp)}</div><div style="font-size:11.5px;color:var(--t3)">${E(t.emp).desig}</div></div></div></td>
    <td><div style="font-weight:500">${t.title}</div><div style="font-size:11.5px;color:var(--t3)">${t.type} · approver: ${t.approverRole}</div></td>
    <td>${bar(t.progress,t.progress>=80?"jade":t.progress>=40?"amber":"rust")}<div class="mono" style="font-size:11px;color:var(--t3);margin-top:3px">${t.progress}%</div></td>
    <td style="text-align:right"><button class="btn sm pri" ${paused?"disabled":""} onclick="openReview('${t.id}')">Review</button></td></tr>`).join("");
  return `${banner}<div class="card"><h2>Pending approvals <span class="badge-n">${q.length}</span></h2><p class="hint">Approve to lock a submission, or return it with comments.</p>
    <table class="tbl"><thead><tr><th>Mentee</th><th>Target</th><th>Proposed</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function vMentees(){
  const ms=menteesOf(ACTOR);
  if(!ms.length) return `<div class="empty"><div class="ei ti ti-users"></div><h3>No mentees</h3><p>You aren't currently paired with anyone.</p></div>`;
  const seen={};const uniq=ms.map(p=>p.mentee).filter(id=>!seen[id]&&(seen[id]=1));
  const rdOpts=(cur)=>READINESS_OPTIONS.map(o=>`<option ${cur===o?"selected":""}>${o}</option>`).join("");
  const rows=uniq.map(eid=>{
    const cp=curPath(eid);
    const readSel=cp?`<select onchange="mentorSetReadiness('${eid}',this.value)" style="font-family:inherit;font-size:12.5px;padding:5px 8px;border:1px solid var(--line2);border-radius:7px">${rdOpts(cp.readiness)}</select>`:'<span style="color:var(--t3)">—</span>';
    return `<tr>
      <td><div class="who"><span class="av">${initials(nm(eid))}</span><div><div style="font-weight:500">${nm(eid)}</div><div style="font-size:11.5px;color:var(--t3)">${E(eid).fn}</div></div></div></td>
      <td style="font-size:13px">${E(eid).desig}</td>
      <td style="font-size:13px">${cp?cp.next:'<span style="color:var(--t3)">—</span>'}</td>
      <td style="text-align:right"><button class="btn sm pri" onclick="openMenteeLearning('${eid}')"><span class="ti ti-edit" style="font-size:13px"></span>Development plan</button></td></tr>`;
  }).join("");
  return `<div class="card"><h2>My mentees</h2><p class="hint">One plan per person \u2014 career milestone, HiPot targets and development actions are all on it. Changes are logged and visible to the mentee.</p>
    <table class="tbl"><thead><tr><th>Mentee</th><th>Current role</th><th>Next milestone</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
/* mentor edits mentee readiness inline -> reflected to mentee + logged */
function mentorSetReadiness(eid,val){
  const cp=curPath(eid); if(!cp) return;
  cp.readiness=val;

/* open the mentee's full My Learning page in-place, as the mentor (editable) */
let _mentorReturn=null;
/* While a mentor is inside a mentee's record the left ribbon lists that
   person's pages instead of the mentor's own, so they can move between the
   learning plan and the HiPot plan without going back to the list. */
function buildMenteeNav(eid, active){
  const nav = document.getElementById("nav");
  const fn = id => `openMenteeLearning('${eid}')`;
  const item = (id,label,ic,on) =>
    `<button class="tab ${on?"on":""}" onclick="${fn(id)}">
       <span class="ic ti ${ic}"></span>${label}</button>`;
  let s = `<div class="navlab">Viewing ${nm(eid)}</div>`;
  s += item("learning","Development plan","ti-book",active==="learning");

        <button class="tab" onclick="closeMenteeLearning()"><span class="ic ti ti-arrow-left"></span>My mentees</button>`;
  nav.innerHTML = s;
}

function openMenteeEvp(eid){
  // opened from inside the mentee's record -> Back belongs to their plan,
  // not all the way out to My mentees
  const fromMentee = (typeof _mentorReturn !== "undefined" && _mentorReturn) ? eid : null;
  _mentorReturn = _mentorReturn || {role:ROLE, actor:ACTOR, tab:TAB};
  _subPage = fromMentee ? { from:"learning", mentee:fromMentee } : null;

      ${evpBody(eid)}</div>`;

}

/* Kept so existing links still work - the HiPot page is part of the learning
   plan now, so send them there rather than to a tab that no longer exists. */
function openMenteeHipot(eid){ return openMenteeLearning(eid); }
function _openMenteeHipot_unused(eid){
  if(typeof _subPage !== "undefined") _subPage = null;

      ${hipotBody(eid)}</div>`;

function openMenteeLearning(eid){
  if(typeof _subPage !== "undefined") _subPage = null;

  // overwrite it with the mentee's own context
  _mentorReturn = _mentorReturn || {role:ROLE,actor:ACTOR,tab:TAB};
  updateBackBtn();
  ACTOR=eid; TAB="learning";

    <div class="note" style="margin-bottom:14px"><span class="ti ti-user-edit" style="font-size:14px"></span> Editing <b>${nm(eid)}</b>'s learning plan as their mentor. Changes are logged and visible to them.</div>
    ${vLearning()}</div>`;

  buildMenteeNav(eid, "learning");

}
function closeMenteeLearning(){

function vInteractions(){

function addNote(pid){

/* ============ LEADERSHIP VIEWS (scoped) ============ */
/* leaders without an explicit access-grant row get a safe org-wide default
   instead of an empty/crashing page */
function leaderGrant(id){
  return DB.grants[id] || {login:"Leadership",fnScope:"All",minLvl:0,tree:false,seeRisk:false};
}
function scopedPeople(){
  const g=leaderGrant(ACTOR);
  let ids=g.tree?subtree(ACTOR):Object.keys(DB.employees);
  return ids.map(E).filter(e=>e&&e.id!==ACTOR&&e.lvl>0)
    .filter(e=>g.fnScope==="All"||e.fn===g.fnScope)
    .filter(e=>e.lvl>=(g.minLvl||0));

function vHipots(){

function vSuccMap(){
  const p=scopedPeople().filter(e=>e.lvl>=6);
  const rows=p.map(e=>{
    const bench=DB.succession.filter(s=>s.incumbent===e.id);

/* Export the master as CSV. Columns match the bulk-upload template exactly, so
   the file can be edited and fed straight back in through Bulk add. Career
   fields come from the person's selected path. */
function exportMaster(){
  const rows = Object.values(DB.employees).filter(e=>e.id!=="E-0001")
    .sort((a,b)=>String(a.name).localeCompare(String(b.name)));
  const head = ["EmployeeID","FullName","WorkEmail","Function","SubFunction","Designation",
                "Level","ManagerID","MentorID","HiPot","HiPotCategory","Location","PortalRole",
                "Next role","Focus Brief","Readiness"];
  const csv = [head.join(",")].concat(rows.map(e=>{
    const cp = (typeof curPath==="function" ? curPath(e.id) : null) || {};
    return [e.id, e.name, e.email||"", e.fn||"", e.sub||"", e.desig||"", e.lvl==null?"":e.lvl,
            e.mgr||"", mentorOfEmp(e.id)||"", e.hipot?"Y":"N", e.hcat||"", e.loc||"",
            e.role||"Employee", cp.next||"", cp.brief||"", cp.readiness||""]
      .map(v=>`"${String(v==null?"":v).replace(/"/g,'""')}"`).join(",");
  })).join("\n");
  dl(new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"}),
     "employee-master-"+today()+".csv");
  toast("Exported "+rows.length+" people");
}

function saveEmp(id){
  const name=document.getElementById("emName").value.trim();
  const desig=document.getElementById("emDesig").value.trim();
  const lvl=+document.getElementById("emLvl").value;
  if(!name||!desig){document.getElementById("emErr").textContent="Name and designation are required.";return;}
  const fn=document.getElementById("emFn").value;
  const sub=document.getElementById("emSub").value.trim()||fn;
  const mentorId=document.getElementById("emMentor").value||"";
  const ladder=(document.getElementById("emLadder").value||"").split("|").map(x=>x.trim()).filter(Boolean);
  const atIdx=Math.max(0,+document.getElementById("emAtIdx").value||0);
  const nextRole=(document.getElementById("emNext").value||"").trim();
  const brief=(document.getElementById("emBrief").value||"").trim();
  const loc=document.getElementById("emLoc").value.trim();
  const hipot=document.getElementById("emHipot").checked;
  if(id){
    const e=DB.employees[id];
    Object.assign(e,{name,desig,lvl,fn,sub,loc,hipot,hcat:hipot?(e.hcat||"—"):"",mentorId});
    applyEmpExtras(id, mentorId, ladder, atIdx, nextRole, brief);
  }else{
    // generate a new Employee ID
    let n=5100; while(DB.employees["E-"+n]) n++;
    const newId="E-"+n;
    DB.employees[newId]={id:newId,name,fn,sub,desig,lvl,hipot,hcat:hipot?"—":"",loc,mentorId};
    applyEmpExtras(newId, mentorId, ladder, atIdx, nextRole, brief);
  }
  closeModal();render();toast(id?"Employee updated":"Employee added");
}
/* Pairing IDs are used as the row key when the flow patches the Pairings table.
   EmployeeIDs here can contain slashes (ALT/IND/5697), and a slash inside a key
   breaks the Excel connector's row lookup — so flatten to letters and digits.
   ALT/IND/5697 -> P-ALT-IND-5697-1 */
function pairId(eid){
  return "P-" + String(eid).replace(/^E-/,"").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,"") + "-1";
}
/* mentor pairing + career path/brief written from the employee editor */
function applyEmpExtras(eid, mentorId, ladder, atIdx, nextRole, brief){
  // --- mentor: keep Pairings as the single source of truth ---
  DB.pairings = DB.pairings || [];
  const existing = DB.pairings.find(p=>p.mentee===eid && p.status==="Active");
  if(mentorId){
    if(existing && existing.mentor!==mentorId){
      existing.mentor = mentorId;
      saveToExcel("Pairings", existing.id||"", pairingRowOf(existing), {changeType:"Updated"});
    } else if(!existing){
      const pid = pairId(eid);
      const p = {id:pid, mentee:eid, mentor:mentorId, type:"Career", status:"Active", since:today()};
      DB.pairings.push(p);
      saveToExcel("PairingsNew", pid, pairingRowOf(p), {changeType:"Created"});
    }
    const lp = DB.learningPlans[eid]; if(lp) lp.mentor = mentorId;
  } else if(existing){
    existing.status = "Ended";
    saveToExcel("Pairings", existing.id||"", pairingRowOf(existing), {changeType:"Updated"});
  }
  // --- career path / next role / focus brief ---
  if(ladder.length || nextRole || brief){
    const cur = (DB.career[eid] && DB.career[eid].paths && DB.career[eid].paths[0]) || {};
    const path = Object.assign({}, cur, {
      name: cur.name || "Career path",
      ladder: ladder.length ? ladder : (cur.ladder||[]),
      atIdx: Math.min(atIdx, Math.max(0,(ladder.length?ladder:(cur.ladder||[])).length-1)),
      next: nextRole || cur.next || "",
      brief: brief || cur.brief || ""
    });
    if(!path._rowId) path._rowId = "CR-"+String(eid).replace(/^E-/,"");
    const isNew = !(cur && cur._rowId);
    DB.career[eid] = { selectedPath:0, paths:[path] };
    const keep = ACTOR; ACTOR = eid;
    saveToExcel(isNew?"CareerNew":"Career", path._rowId, careerRow(), {changeType:isNew?"Created":"Updated"});
    ACTOR = keep;
  }
}
function pairingRowOf(p){
  return { PairingID:p.id||"", MenteeID:p.mentee, MentorID:p.mentor,
           PairingType:p.type||"Career", Status:p.status||"Active",
           StartDate:p.since||today(), LastUpdatedBy:CURRENT_EMP||ACTOR, LastUpdatedOn:today() };
}
function deleteEmp(id){
  // guard: don't delete someone still referenced as a manager/mentor/etc.
  const refs=[];
  Object.values(DB.employees).forEach(e=>{if(e.mgr===id)refs.push(e.name+" (reports to them)");});
  DB.pairings.forEach(p=>{if(p.mentor===id||p.mentee===id)refs.push("a mentoring pairing");});
  if(refs.length){toast("Can't delete — still referenced by "+refs.length+" record(s)");return;}
  delete DB.employees[id];
  closeModal();render();toast("Employee removed");
}
function quickDeleteEmp(id){
  const refs=[];
  Object.values(DB.employees).forEach(e=>{if(e.mgr===id)refs.push(e.name);});

  delete DB.employees[id];render();toast("Employee removed");
}

  ["Career","EmployeeID","Yes","Must exist, or be created on the Employees sheet in this same file"],
  ["Career","CareerLadder","No","Rungs separated by | , lowest first"],
  ["Career","CurrentRungIndex","No","0-based position of CurrentRole inside the ladder"],
  ["Career","Readiness","No","Ready now, 6 to 12 Months, 1 to 2 Year, 2 to 3 Year, 3+ Years"],
  ["LearningActions","Band","Yes","70, 20 or 10"],
  ["LearningActions","StartDate / EndDate","Yes","yyyy-mm-dd. End must not precede start"],
  ["LearningActions","StatusUpdate","No","Not started, Ongoing, Achieved, On Hold"],
  ["HipotTargets","Timeline","No","JAS 26, OND 26, JFM 27"],
  ["HipotTargets","Status","No","Not Started, Ongoing, Achieved"],
  ["Certifications","EntryType","No","Certification, Course, Seminar, Workshop, Conference, Webinar"],
  ["Certifications","CompletedOn / ExpiresOn","No","yyyy-mm-dd"],
  ["","",""],
  ["Pairings are worked out from MentorID on the People sheet \u2014 you never fill them in by hand.","",""],
  ["Any sheet you don't need can be left with just its header row \u2014 empty sheets are skipped.","",""],
  ["If one row anywhere fails validation, nothing at all is imported.","",""]
];

let _bulkParsed = null;

async function downloadEmpTemplate(){
  if(!await ensureXLSX()){ toast("Spreadsheet library unavailable \u2014 check your connection and try again"); return; }
  const wb = XLSX.utils.book_new();
  BULK_SHEETS.filter(s=>!s.hidden).forEach(s=>{
    const ws = XLSX.utils.aoa_to_sheet([s.cols].concat(s.sample));
    ws["!cols"] = s.cols.map(c=>({wch:Math.max(13, Math.min(46, c.length+4))}));
    XLSX.utils.book_append_sheet(wb, ws, s.key);
  });
  const wn = XLSX.utils.aoa_to_sheet(BULK_NOTES);
  wn["!cols"]=[{wch:18},{wch:30},{wch:10},{wch:72}];
  XLSX.utils.book_append_sheet(wb, wn, "How to fill this in");
  XLSX.writeFile(wb, "Talent_Portal_Bulk_Upload_Template.xlsx");
}

const BULK_READY = ["Ready now","6 to 12 Months","1 to 2 Year","2 to 3 Year","3+ Years"];
const BULK_ROLES = ["Employee","Mentor","Leadership","HR Admin"];

async function parseBulkFile(ev){
  const file = ev.target.files && ev.target.files[0];
  const box  = document.getElementById("bulkErr");
  _bulkParsed = null; bulkReady(false);
  if(!file){ box.innerHTML=""; return; }
  if(!await ensureXLSX()){ box.innerHTML = impMsg("rust","The spreadsheet library didn't load. Reopen this dialogue once you're online."); return; }

  const fr = new FileReader();
  fr.onload = e => {
    let wb;
    try{ wb = XLSX.read(new Uint8Array(e.target.result), {type:"array"}); }
    catch(err){ box.innerHTML = impMsg("rust","Couldn't read that file. Use the template, saved as .xlsx."); return; }

    const errs = [], out = {}, newIds = new Set();

    BULK_SHEETS.forEach(s=>{
      out[s.key] = [];
      const ws = wb.Sheets[s.key];
      if(!ws) return;                                   // sheet simply absent
      const aoa = XLSX.utils.sheet_to_json(ws, {header:1, defval:""});
      if(!aoa.length) return;
      /* the header isn't always row 1 — people put a title or a note above it.
         Scan the first 15 rows for the one carrying the required columns. */
      const allCols = s.cols.concat(s.opt||[]);
      const need = s.req || s.cols;
      const rowHas = row => {
        const h = (row||[]).map(x=>String(x).trim());
        const has = c => h.some(x=>x.toLowerCase()===c.toLowerCase()
                                || x.toLowerCase().split(" (")[0]===c.toLowerCase().split(" (")[0]);
        return need.every(has);
      };
      let headIdx = -1;
      for(let i=0; i<Math.min(aoa.length, 15); i++){ if(rowHas(aoa[i])){ headIdx = i; break; } }

      const head = (aoa[headIdx<0?0:headIdx]||[]).map(x=>String(x).trim());
      const ix = c => head.findIndex(x=>x.toLowerCase()===c.toLowerCase()
                                     || x.toLowerCase().split(" (")[0]===c.toLowerCase().split(" (")[0]);
      if(headIdx < 0){
        errs.push(`${s.key}: couldn't find a header row \u2014 these columns are missing or renamed: ${need.filter(c=>ix(c)<0).join(", ")}`);
        return;
      }
      const get = (row,c) => { const i=ix(c); return i<0 ? "" : String(row[i]==null?"":row[i]).trim(); };

      for(let r=headIdx+1;r<aoa.length;r++){
        const row = aoa[r];
        if(!row || row.every(c=>String(c).trim()==="")) continue;
        const ln = r+1, at = `${s.key} row ${ln}`;
        const o = {};
        allCols.forEach(c=>o[c]=get(row,c));

        if(s.key==="Employees"){
          if(!o.FullName)    errs.push(`${at}: FullName is empty.`);
          if(!o.Designation) errs.push(`${at}: Designation is empty.`);
          if(o.Level==="" || isNaN(Number(o.Level))) errs.push(`${at}: Level must be a number.`);
          if(o["HiPot (Y/N)"] && !/^[yn]$/i.test(o["HiPot (Y/N)"])) errs.push(`${at}: HiPot must be Y or N.`);
          if(o.PortalRole && !BULK_ROLES.includes(o.PortalRole)) errs.push(`${at}: PortalRole "${o.PortalRole}" isn't one of ${BULK_ROLES.join(", ")}.`);
          if(o.RecordStatus && !["Active","Inactive"].includes(o.RecordStatus)) errs.push(`${at}: RecordStatus must be Active or Inactive.`);
          if(!o.EmployeeID) o.EmployeeID = nextEmpId(newIds);
          o._new = !DB.employees[o.EmployeeID];
          newIds.add(o.EmployeeID);
        } else {
          const idCol = s.key==="Pairings" ? "MenteeID" : "EmployeeID";
          if(!o[idCol]) errs.push(`${at}: ${idCol} is empty.`);
          else if(!DB.employees[o[idCol]] && !newIds.has(o[idCol]))
            errs.push(`${at}: ${idCol} "${o[idCol]}" isn't a known employee.`);
        }

        if(s.key==="Career"){
          if(o.Readiness && !BULK_READY.includes(o.Readiness))
            errs.push(`${at}: Readiness "${o.Readiness}" isn't one of ${BULK_READY.join(", ")}.`);
          if(o["CurrentRungIndex"]!=="" && isNaN(Number(o["CurrentRungIndex"])))
            errs.push(`${at}: CurrentRungIndex must be a number.`);
        }
        if(s.key==="LearningActions"){
          const band = o["Band (70/20/10)"].replace(/[^0-9]/g,"");
          if(!["70","20","10"].includes(band)) errs.push(`${at}: Band must be 70, 20 or 10.`);
          o._band = band;
          if(!o.ActionTitle) errs.push(`${at}: ActionTitle is empty.`);
          const sd = cellDate(row[ix("StartDate")]), ed = cellDate(row[ix("EndDate")]);
          if(!isDate(sd)) errs.push(`${at}: StartDate "${sd||"(blank)"}" isn't yyyy-mm-dd.`);
          if(!isDate(ed)) errs.push(`${at}: EndDate "${ed||"(blank)"}" isn't yyyy-mm-dd.`);
          if(isDate(sd)&&isDate(ed)&&ed<sd) errs.push(`${at}: EndDate is before StartDate.`);
          o._start=sd; o._end=ed;
          if(o.StatusUpdate){
            o.StatusUpdate = normLAStatus(o.StatusUpdate);
            const m = IMP_STATUS.find(x=>x.toLowerCase()===o.StatusUpdate.toLowerCase());
            if(!m) errs.push(`${at}: StatusUpdate "${o.StatusUpdate}" isn't one of ${IMP_STATUS.join(", ")}.`);
            else o.StatusUpdate = m;
          } else o.StatusUpdate = "Not started";
        }
        if(s.key==="HipotTargets"){
          if(!o.Initiative) errs.push(`${at}: Initiative is empty.`);
          if(o.Timeline && !HP_QUARTERS.includes(o.Timeline))
            errs.push(`${at}: Timeline "${o.Timeline}" isn't one of ${HP_QUARTERS.join(", ")}.`);
          if(o.Status && !HP_STATUS.includes(o.Status))
            errs.push(`${at}: Status "${o.Status}" isn't one of ${HP_STATUS.join(", ")}.`);
        }
        if(s.key==="Certifications"){
          if(!o.Name) errs.push(`${at}: Name is empty.`);
          if(o.EntryType && !CRED_TYPES.includes(o.EntryType))
            errs.push(`${at}: EntryType "${o.EntryType}" isn't one of ${CRED_TYPES.join(", ")}.`);
          ["CompletedOn","ExpiresOn"].forEach(c=>{
            const v = cellDate(row[ix(c)]);
            if(v && !isDate(v)) errs.push(`${at}: ${c} "${v}" isn't yyyy-mm-dd.`);
            o["_"+c] = v;
          });
        }
        if(s.key==="Pairings"){
          if(!o.MentorID) errs.push(`${at}: MentorID is empty.`);
          else if(!DB.employees[o.MentorID] && !newIds.has(o.MentorID))
            errs.push(`${at}: MentorID "${o.MentorID}" isn't a known employee.`);
        }
        if(s.key==="Employees"){ o._at = at; }   // mentor/manager resolved after every row is read
        out[s.key].push(o);
      }
    });

    /* ---- link mentors and managers ------------------------------------
       Runs once every row has been read, so a mentor can appear anywhere in
       the file — above or below the person they mentor. MentorID/ManagerID
       accept an EmployeeID, a work email, or the person's full name; whatever
       HR happened to type gets resolved back to an ID. */
    (function linkPeople(){
      const rows = out.Employees || [];
      const byId = {}, byEmail = {}, byName = {};
      const add = (id, name, email) => {
        if(!id) return;
        byId[String(id).toUpperCase()] = id;
        const n = String(name||"").trim().toLowerCase().replace(/\s+/g," ");
        const e = String(email||"").trim().toLowerCase();
        if(n) byName[n] = (n in byName && byName[n]!==id) ? "__DUPE__" : id;
        if(e) byEmail[e] = id;
      };
      Object.values(DB.employees).forEach(p=>add(p.id, p.name, p.email));
      rows.forEach(r=>add(r.EmployeeID, r.FullName, r.WorkEmail));

      const resolve = v => {
        const s0 = String(v||"").trim();
        if(!s0) return "";
        const hit = byId[s0.toUpperCase()]
                 || byEmail[s0.toLowerCase()]
                 || byName[s0.toLowerCase().replace(/\s+/g," ")];
        return hit || null;                       // null = present but unknown
      };

      rows.forEach(r=>{
        [["MentorID","MentorID"],["ManagerID","ManagerID"]].forEach(([col,lab])=>{
          const raw = r[col];
          if(!raw) return;
          const id = resolve(raw);
          if(id === "__DUPE__"){
            errs.push(`${r._at}: ${lab} "${raw}" matches more than one person — use their EmployeeID.`);
          }else if(id === null){
            errs.push(`${r._at}: ${lab} "${raw}" isn't a known employee — use an EmployeeID, work email or full name that appears on this sheet or already exists.`);
          }else if(id === r.EmployeeID){
            errs.push(`${r._at}: ${lab} is the same person — someone can't ${lab==="MentorID"?"mentor":"manage"} themselves.`);
          }else{
            r[col] = id;                          // normalise to the ID
          }
        });
      });

      /* a mentoring loop would make the mentee list recurse forever */
      const mentorOf = {};
      rows.forEach(r=>{ if(r.EmployeeID && r.MentorID) mentorOf[r.EmployeeID] = r.MentorID; });
      Object.values(DB.employees).forEach(p=>{
        if(p.id && !(p.id in mentorOf) && p.mentorId) mentorOf[p.id] = p.mentorId;
      });
      rows.forEach(r=>{
        if(mentorOf[r.EmployeeID] === r.EmployeeID) return;   // already reported above
        let cur = mentorOf[r.EmployeeID], hops = 0;
        while(cur && hops++ < 60){
          if(cur === r.EmployeeID){
            errs.push(`${r._at}: mentoring loop — ${nm(r.EmployeeID)||r.EmployeeID} ends up mentoring themselves through the chain.`);
            break;
          }
          cur = mentorOf[cur];
        }
      });
    })();

    const total = BULK_SHEETS.reduce((a,s)=>a+out[s.key].length,0);
    if(!total && !errs.length){ box.innerHTML = impMsg("amber","No data rows found on any sheet."); return; }
    if(errs.length){
      box.innerHTML = impMsg("rust",`<b>File rejected \u2014 ${errs.length} problem${errs.length>1?"s":""} found.</b> Nothing has been imported.`)
        + `<ul class="imperr">${errs.slice(0,14).map(x=>`<li>${x}</li>`).join("")}
           ${errs.length>14?`<li>\u2026and ${errs.length-14} more.</li>`:""}</ul>`;
      return;
    }
    _bulkParsed = out;
    const lines = BULK_SHEETS.filter(s=>out[s.key].length)
      .map(s=>`<li><b>${out[s.key].length}</b> \u00b7 ${s.label}</li>`).join("");
    box.innerHTML = impMsg("jade",`<b>${total} row${total>1?"s":""} ready.</b> Nothing is saved until you press Import.`)
      + `<ul class="impok">${lines}</ul>`;
    bulkReady(true);
  };
  fr.readAsArrayBuffer(file);
}

function bulkReady(on){
  const b = document.getElementById("bulkCommitBtn");
  if(!b) return;
  b.disabled = !on; b.style.opacity = on ? "1" : ".5";
}
function nextEmpId(taken){
  let n = 5100;
  while(DB.employees["E-"+n] || taken.has("E-"+n)) n++;
  return "E-"+n;
}
function ensurePlan(eid){
  if(!DB.learningPlans[eid]){
    const p = (DB.pairings||[]).find(x=>x.mentee===eid && x.status==="Active");
    DB.learningPlans[eid] = { mentor: p?p.mentor:null, actions:[], changelog:[], archive:[] };
  }
  return DB.learningPlans[eid];
}

async function commitBulk(){
  if(!_bulkParsed) return;
  const btn = document.getElementById("bulkCommitBtn");
  const box = document.getElementById("bulkErr");
  if(btn){ btn.disabled = true; btn.textContent = "Importing\u2026"; }

  /* Fire one row at a time. Sent together, Power Automate throttles the
     later ones and the failures are easy to miss. */
  const queue = [], failed = [];
  const push = (table, key, fields, meta, label) => queue.push({table,key,fields,meta,label});
  const d = _bulkParsed, who = CURRENT_EMP||ACTOR, on = today();
  let count = 0;

  (d.Employees||[]).forEach(o=>{
    const id = o.EmployeeID;
    const prev = DB.employees[id] || {};
    /* a column that wasn't on the sheet must not wipe what's already on record —
       blank means "leave it alone", not "clear it" */
    const keep = (v, was, dflt) => { const s=String(v==null?"":v).trim();
                                     return s !== "" ? v : (was!==undefined && was!=="" ? was : dflt); };
    const hipotCell = String(o["HiPot (Y/N)"]||"").trim();
    const rec = Object.assign({}, prev, {
      id, name:o.FullName, email:keep(o.WorkEmail, prev.email, ""),
      fn:keep(o.Function, prev.fn, ""), sub:keep(o.SubFunction, prev.sub, ""),
      desig:o.Designation, lvl:Number(o.Level)||0,
      mgr:keep(o.ManagerID, prev.mgr, null),
      mentorId:keep(o.MentorID, prev.mentorId, ""),
      hipot: hipotCell ? /^y$/i.test(hipotCell) : !!prev.hipot,
      hcat:keep(o.HiPotCategory, prev.hcat, ""), loc:keep(o.Location, prev.loc, ""),
      role:keep(o.PortalRole, prev.role, "Employee"),
      f360Url:keep(o.Feedback360URL, prev.f360Url, ""),
      insightUrl:keep(o.ExpertInsightsURL, prev.insightUrl, ""),
      evpUrl:keep(o.EVPURL, prev.evpUrl, ""),
      projUrl:keep(o.ProjectFeedbackURL, prev.projUrl, "")
    });
    DB.employees[id] = rec;
    push(o._new ? "EmployeesNew" : "Employees", id,
      empRow(rec, id, o.RecordStatus||"Active"), {changeType:o._new?"Created":"Updated"},
      "Employee " + rec.name);

    /* MentorID on the People sheet is enough — the pairing is created/updated
       automatically, so nobody has to fill the Pairings sheet by hand. */
    if(rec.mentorId && rec.mentorId!==id){
      const ex = DB.pairings.find(x=>x.mentee===id);
      if(ex){
        if(ex.mentor!==rec.mentorId || ex.status!=="Active"){
          ex.mentor = rec.mentorId; ex.status = "Active";
          push("Pairings", ex.id, {PairingID:ex.id, MenteeID:id, MentorID:ex.mentor,
            PairingType:ex.type||"Career", Status:"Active", LastUpdatedBy:who, LastUpdatedOn:on},
            {changeType:"Imported"}, "Pairing " + rec.name);
        }
      }else{
        const pid = pairId(id);
        DB.pairings.push({id:pid, mentee:id, mentor:rec.mentorId, type:"Career", status:"Active"});
        push("PairingsNew", pid, {PairingID:pid, MenteeID:id, MentorID:rec.mentorId,
          PairingType:"Career", Status:"Active", LastUpdatedBy:who, LastUpdatedOn:on},
          {changeType:"Imported"}, "Pairing " + rec.name);
      }
      if(DB.learningPlans[id]) DB.learningPlans[id].mentor = rec.mentorId;
    }

    /* Next role / Focus Brief live on the People sheet now — write them straight
       into the person's career record so the Career page and Focus Brief card fill in. */
    const nextRole = String(o["Next role"]||"").trim();
    const briefTxt = String(o["Focus Brief"]||"").trim();
    if(nextRole || briefTxt){
      const cur0 = DB.career[id] && DB.career[id].paths && DB.career[id].paths[0];
      const path0 = Object.assign({}, cur0||{}, {
        name:(cur0&&cur0.name)||"Career path",
        ladder:(cur0&&cur0.ladder)||[],
        atIdx:(cur0&&cur0.atIdx)||0,
        next: nextRole || (cur0?cur0.next:"") || "",
        brief: briefTxt || (cur0?cur0.brief:"") || ""
      });
      if(!path0._rowId) path0._rowId = "CR-"+String(id).replace(/^E-/,"");
      DB.career[id] = { selectedPath:0, paths:[path0] };
      const keep0 = ACTOR; ACTOR = id;
      push(cur0 && cur0._rowId ? "Career" : "CareerNew", path0._rowId, careerRow(),
        {changeType:"Imported"}, "Career " + rec.name);
      ACTOR = keep0;
    }
  });

  (d.Career||[]).forEach(o=>{
    const eid = o.EmployeeID;
    const ladder = String(o["CareerLadder (a|b|c)"]||"").split("|").map(x=>x.trim()).filter(Boolean);
    const cur = DB.career[eid] && DB.career[eid].paths && DB.career[eid].paths[0];
    const path = Object.assign(cur||{}, {
      name:o.PathName||"Career path", ladder: ladder.length?ladder:(cur?cur.ladder:[]),
      atIdx:Number(o.CurrentRungIndex)||0, next:o.NextRole||"",
      readiness:o.Readiness||(cur?cur.readiness:""), brief:o.FocusBrief||(cur?cur.brief:"")
    });
    if(!path._rowId) path._rowId = "CR-"+String(eid).replace(/^E-/,"");
    DB.career[eid] = { selectedPath:0, paths:[path] };
    const keep = ACTOR; ACTOR = eid;
    push(cur && cur._rowId ? "Career" : "CareerNew", path._rowId, careerRow(), {changeType:"Imported"},
      "Career " + nm(eid));
    ACTOR = keep;
  });

  (d.LearningActions||[]).forEach(o=>{
    const eid = o.EmployeeID, lp = ensurePlan(eid);
    const a = { id:newActionId(), title:o.ActionTitle, band:o._band,
                timeline:{start:o._start, end:o._end}, status:"Approved",
                update:o.StatusUpdate, comment:o.Comment||"",
                _visMentee:"TRUE", _visLead:"TRUE", _createdBy:who, _createdOn:on };
    lp.actions.push(a);
    laLog(eid, eid, "created", a.id, "Bulk uploaded by HR");
    push("ActionsNew", a.id, actionRow(a, eid, lp.mentor), {changeType:"Imported"},
      "Action \u201c" + a.title + "\u201d");
  });

  (d.HipotTargets||[]).forEach(o=>{
    const rec = { id:"HT-"+Date.now().toString(36).slice(-5)+Math.floor(Math.random()*1296).toString(36).padStart(2,"0"),
      emp:o.EmployeeID, initiative:o.Initiative, focus:o.FocusArea||"", target:o.Target||"",
      timeline:o.Timeline||"", comments:o.Comments||"", status:o.Status||"Not Started",
      selfFb:o.SelfFeedback||"", mentorFb:o.MentorFeedback||"" };
    DB.targets.push(rec);
    push("HipotTargetsNew", rec.id, {
      TargetID:rec.id, EmployeeID:rec.emp, Initiative:rec.initiative, FocusArea:rec.focus,
      Target:rec.target, Timeline:rec.timeline, Comments:rec.comments, Status:rec.status,
      SelfFeedback:rec.selfFb, MentorFeedback:rec.mentorFb, UpdatedBy:who, UpdatedOn:on
    }, {changeType:"Imported"}, "HiPot \u201c" + rec.initiative + "\u201d");
  });

  (d.Certifications||[]).forEach(o=>{
    const eid = o.EmployeeID;
    const rec = { id:"CT-"+Date.now().toString(36).slice(-5)+Math.floor(Math.random()*1296).toString(36).padStart(2,"0"),
      type:o.EntryType||"Certification", name:o.Name, issuer:o.Issuer||"",
      date:o._CompletedOn||"", expires:o._ExpiresOn||"", cred:o.CredentialID||"",
      hours:o.DurationHours||"", mode:o.Mode||"", fileUrl:o.FileURL||"", fileName:"" };
    (DB.certs[eid] = DB.certs[eid]||[]).push(rec);
    push("CertificationsNew", rec.id, {
      CertID:rec.id, EmployeeID:eid, EntryType:rec.type, CertName:rec.name, Issuer:rec.issuer,
      CompletedOn:rec.date, ExpiresOn:rec.expires, CredentialID:rec.cred,
      DurationHours:rec.hours, Mode:rec.mode, FileURL:rec.fileUrl, FileName:"",
      AddedBy:who, AddedOn:on }, {changeType:"Imported"}, "Credential \u201c" + rec.name + "\u201d");
  });

  (d.Pairings||[]).forEach(o=>{
    const existing = DB.pairings.find(x=>x.mentee===o.MenteeID);
    const rec = { id: existing?existing.id:("P-"+Date.now().toString(36).slice(-5)),
      mentee:o.MenteeID, mentor:o.MentorID,
      type:o.PairingType||"Career", status:o.Status||"Active" };
    if(existing) Object.assign(existing, rec); else DB.pairings.push(rec);
    if(DB.learningPlans[o.MenteeID]) DB.learningPlans[o.MenteeID].mentor = o.MentorID;
    push(existing ? "Pairings" : "PairingsNew", rec.id, {
      PairingID:rec.id, MenteeID:rec.mentee, MentorID:rec.mentor,
      PairingType:rec.type, Status:rec.status, LastUpdatedBy:who, LastUpdatedOn:on
    }, {changeType:"Imported"}, "Pairing " + nm(rec.mentee));
  });

  let done = 0;
  for(const q of queue){
    if(btn) btn.textContent = "Importing " + (done+1) + " of " + queue.length + "\u2026";
    const ok = await saveToExcel(q.table, q.key, q.fields, q.meta);
    if(ok === false) failed.push(q.label); else done++;
    await new Promise(r=>setTimeout(r, 120));      // don't out-run the flow
  }

  _bulkParsed = null;
  if(btn){ btn.disabled = false; btn.textContent = "Import"; }

  if(failed.length){
    box.innerHTML = impMsg("rust",
      `<b>${done} of ${queue.length} written.</b> ${failed.length} didn't reach Excel \u2014 they're on screen but not saved.`)
      + `<ul class="imperr">${failed.slice(0,10).map(x=>`<li>${x}</li>`).join("")}
         ${failed.length>10?`<li>\u2026and ${failed.length-10} more.</li>`:""}</ul>`;
    render();
    return;                                        // leave the dialogue open
  }
  if(!SYNC_ON()){
    box.innerHTML = impMsg("amber",
      "<b>Loaded on screen only.</b> No flow is connected, so nothing was written to Excel.");
    render();
    return;
  }
  closeModal(); render();
  toast(done + " record" + (done>1?"s":"") + " imported");
}
